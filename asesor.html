<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centro de Atención</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #202124;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    /* LOGIN */

    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #172033, #263a5b);
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 18px;
      padding: 35px;
      box-shadow: 0 15px 50px rgba(0,0,0,.25);
    }

    .login-card h1 {
      margin: 0 0 8px;
      text-align: center;
      color: #172033;
    }

    .login-card p {
      text-align: center;
      color: #777;
      margin-bottom: 28px;
    }

    .login-card label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
      font-size: 14px;
    }

    .login-card input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d5d9df;
      border-radius: 9px;
      outline: none;
    }

    .login-card input:focus {
      border-color: #315efb;
    }

    #loginBtn {
      width: 100%;
      margin-top: 22px;
      border: 0;
      border-radius: 9px;
      padding: 13px;
      background: #315efb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #loginBtn:hover {
      background: #244bd0;
    }

    #loginError {
      margin-top: 15px;
      padding: 10px;
      border-radius: 8px;
      background: #ffecec;
      color: #b42318;
      display: none;
      font-size: 14px;
    }

    /* APP */

    #app {
      display: none;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar {
      width: 245px;
      background: #172033;
      color: white;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .brand {
      padding: 22px 18px;
      font-size: 20px;
      font-weight: bold;
      border-bottom: 1px solid rgba(255,255,255,.1);
    }

    .user-box {
      padding: 18px;
      border-bottom: 1px solid rgba(255,255,255,.1);
    }

    .user-name {
      font-weight: bold;
    }

    .user-role {
      font-size: 12px;
      color: #aeb8ca;
      margin-top: 4px;
    }

    .menu {
      padding: 15px 10px;
      flex: 1;
    }

    .menu button {
      width: 100%;
      text-align: left;
      background: transparent;
      color: white;
      border: 0;
      padding: 12px 13px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 4px;
    }

    .menu button:hover,
    .menu button.active {
      background: #2b3d5e;
    }

    .logout {
      margin: 12px;
      padding: 11px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      background: #c62828;
      color: white;
    }

    .main {
      flex: 1;
      display: flex;
      min-width: 0;
    }

    .list-panel {
      width: 360px;
      background: white;
      border-right: 1px solid #ddd;
      display: flex;
      flex-direction: column;
      min-width: 300px;
    }

    .panel-header {
      padding: 18px;
      border-bottom: 1px solid #ddd;
    }

    .panel-header h2 {
      margin: 0 0 12px;
      font-size: 20px;
    }

    .search {
      width: 100%;
      padding: 10px;
      border: 1px solid #d5d9df;
      border-radius: 8px;
    }

    .conversation-list {
      flex: 1;
      overflow-y: auto;
    }

    .conversation-item {
      padding: 15px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .conversation-item:hover {
      background: #f4f7fb;
    }

    .conversation-item.active {
      background: #eaf0ff;
    }

    .conversation-client {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .conversation-meta {
      font-size: 12px;
      color: #777;
      line-height: 1.5;
    }

    .badge {
      display: inline-block;
      padding: 3px 7px;
      border-radius: 20px;
      background: #e8edf5;
      font-size: 11px;
      margin-top: 5px;
    }

    .chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .chat-empty {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888;
      text-align: center;
      padding: 30px;
    }

    .chat-header {
      padding: 17px 20px;
      background: white;
      border-bottom: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
    }

    .chat-client {
      font-weight: bold;
      font-size: 18px;
    }

    .chat-client-info {
      color: #777;
      font-size: 12px;
      margin-top: 4px;
    }

    .chat-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* FICHA DEL CLIENTE */

    .client-details {
      background: white;
      border-bottom: 1px solid #ddd;
      padding: 14px 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 10px 18px;
    }

    .client-detail {
      min-width: 0;
    }

    .client-detail-label {
      font-size: 10px;
      text-transform: uppercase;
      color: #888;
      font-weight: bold;
      margin-bottom: 3px;
    }

    .client-detail-value {
      font-size: 13px;
      color: #202124;
      word-break: break-word;
    }

    .client-details-title {
      grid-column: 1 / -1;
      font-size: 13px;
      font-weight: bold;
      color: #315efb;
      border-bottom: 1px solid #eee;
      padding-bottom: 7px;
      margin-bottom: 2px;
    }

    .btn {
      border: 0;
      padding: 9px 12px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-primary {
      background: #315efb;
      color: white;
    }

    .btn-success {
      background: #16803c;
      color: white;
    }

    .btn-danger {
      background: #c62828;
      color: white;
    }

    .btn-secondary {
      background: #e9edf2;
      color: #333;
    }

    .messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background: #f5f7fa;
    }

    .message {
      max-width: 70%;
      padding: 10px 13px;
      border-radius: 12px;
      margin-bottom: 10px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.client {
      background: white;
      border: 1px solid #e4e6e9;
      margin-right: auto;
    }

    .message.agent {
      background: #dce7ff;
      margin-left: auto;
    }

    .message-author {
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 4px;
      opacity: .7;
    }

    .message-time {
      font-size: 10px;
      opacity: .6;
      margin-top: 5px;
    }

    .composer {
      background: white;
      border-top: 1px solid #ddd;
      padding: 12px;
      display: flex;
      gap: 8px;
    }

    .composer textarea {
      flex: 1;
      resize: none;
      min-height: 45px;
      max-height: 130px;
      border: 1px solid #d5d9df;
      border-radius: 8px;
      padding: 10px;
      outline: none;
    }

    .composer button {
      min-width: 90px;
    }

    .read-only {
      padding: 12px;
      text-align: center;
      background: #fff4d6;
      color: #755b00;
      font-size: 13px;
    }

    /* AGENTES */

    .agent-list {
      padding: 15px;
      overflow-y: auto;
    }

    .agent-card {
      background: white;
      border: 1px solid #e0e3e8;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .agent-card:hover {
      background: #f6f8fb;
    }

    .agent-name {
      font-weight: bold;
    }

    .agent-team {
      font-size: 12px;
      color: #777;
      margin-top: 4px;
    }

    .agent-count {
      margin-top: 7px;
      font-size: 12px;
      color: #315efb;
      font-weight: bold;
    }

    /* MODAL */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.open {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 480px;
      background: white;
      border-radius: 12px;
      padding: 22px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-card h3 {
      margin-top: 0;
    }

    .modal-card label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin: 15px 0 6px;
    }

    .modal-card select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 7px;
    }

    .modal-actions {
      margin-top: 20px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .empty {
      padding: 30px 20px;
      text-align: center;
      color: #888;
    }

    @media (max-width: 800px) {
      .sidebar {
        width: 190px;
      }

      .list-panel {
        width: 300px;
      }

      .message {
        max-width: 85%;
      }

      .client-details {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->

  <section id="loginScreen">
    <div class="login-card">
      <h1>Centro de Atención</h1>
      <p>Ingresá con tu cuenta de trabajo</p>

      <label for="email">Correo electrónico</label>
      <input
        id="email"
        type="email"
        autocomplete="username"
        placeholder="tu correo"
      >

      <label for="password">Contraseña</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="Contraseña"
      >

      <button id="loginBtn">Ingresar</button>

      <div id="loginError"></div>
    </div>
  </section>


  <!-- APLICACIÓN -->

  <section id="app">

    <aside class="sidebar">

      <div class="brand">

      </div>

      </button>

    </aside>


    <main class="main">

      <section class="list-panel">

        <div class="panel-header">

          <h2 id="listTitle">
            Conversaciones
          </h2>

          <input
            id="searchInput"
            class="search"
            type="text"
            placeholder="Buscar..."
          >

        </div>

        <div
          id="conversationList"
          class="conversation-list"
        ></div>

        <div
          id="agentList"
          class="agent-list"
          style="display:none"
        ></div>

      </section>


      <section class="chat">

        <div id="chatEmpty" class="chat-empty">
          <div>
            <h2>Centro de Atención</h2>
            <p>Seleccioná una conversación para comenzar.</p>
          </div>
        </div>


        <div
          id="chatContent"
          style="display:none; height:100%; flex-direction:column;"
        >

          <div class="chat-header">

            <div>
              <div id="chatClient" class="chat-client"></div>
              <div id="chatClientInfo" class="chat-client-info"></div>
            </div>

            <div
              id="chatActions"
              class="chat-actions"
            ></div>

          </div>


          <!-- INFORMACIÓN COMPLETA DEL CLIENTE -->

          <div
            id="clientDetails"
            class="client-details"
            style="display:none"
          ></div>


          <div
            id="messages"
            class="messages"
          ></div>


          <div
            id="readOnlyNotice"
            class="read-only"
            style="display:none"
          >
            Esta gestión está finalizada y es de solo lectura.
          </div>


          <div
            id="composer"
            class="composer"
          >

            <textarea
              id="messageInput"
              placeholder="Escribí un mensaje..."
            ></textarea>

            <button
              id="sendBtn"
              class="btn btn-primary"
            >
              Enviar
            </button>

          </div>

        </div>

      </section>

    </main>

  </section>

      <label for="transferTeam">

      </label>

      <select id="transferTeam"></select>


      <label for="transferAgent">
        Gestor
      </label>

      <select id="transferAgent"></select>


      <div class="modal-actions">

        <button

          class="btn btn-secondary"

          Cancelar
        </button>

        <button
          id="confirmTransfer"
          class="btn btn-primary"

          Confirmar
        </button>

      </div>

    </div>

    /* ============================================================
       FUNCIONES DE USUARIO
       ============================================================ */

    function obtenerNombreUsuarioPorEmail(email) {

      if (!email) {
        return "";
      }

      const normalizado =
        String(email).trim().toLowerCase();

      return emailsPorNombre[normalizado] || "";

    }


    function obtenerNombreUsuario() {

      if (!usuarioActual) {
        return "";
      }

      const nombre =
        obtenerNombreUsuarioPorEmail(
          usuarioActual.email
        );

      if (nombre) {
        return nombre;
      }

      return usuarioActual.displayName || "";

    }


    function obtenerRolUsuario() {

      return perfiles[nombreUsuario] || "asesor";

    }


    function esSupervisor() {
      return rolUsuario === "supervisor";
    }


    function esSenior() {
      return rolUsuario === "senior";
    }


    function esAsesor() {
      return rolUsuario === "asesor";
    }


    /* ============================================================
       COMPROBAR SI LA CUENTA ES DEL USUARIO ACTUAL
       ============================================================ */

    function esCuentaPropia(c) {

      if (!c || !usuarioActual) {
        return false;
      }

      const asignado =
        String(c.asesorAsignado || "")
          .trim()
          .toLowerCase();

      const asignadoEmail =
        String(c.asesorEmail || "")
          .trim()
          .toLowerCase();

      const nombre =
        String(nombreUsuario || "")
          .trim()
          .toLowerCase();

      const email =
        String(usuarioActual.email || "")
          .trim()
          .toLowerCase();

      return (
        (nombre && asignado === nombre) ||
        (email && asignado === email) ||
        (email && asignadoEmail === email)
      );

    }


    /* ============================================================
       EQUIPOS
       ============================================================ */

    function obtenerEquipoParaGestor(nombre) {

      if (!nombre) {
        return null;
      }

      for (const equipo in equipos) {

        if (
          equipos[equipo].gestores.includes(nombre)
        ) {
          return equipo;
        }

      }

      return null;

    }


    function obtenerEquiposParaUsuario() {

      const resultado = [];

      for (const equipo in equipos) {

        if (
          equipos[equipo].seniors.includes(nombreUsuario)
        ) {
          resultado.push(equipo);
        }

        if (
          equipos[equipo].gestores.includes(nombreUsuario)
        ) {
          resultado.push(equipo);
        }

      }

      return [...new Set(resultado)];

    }


    function usuarioTieneEquipo(equipo) {

      if (!equipo) {
        return false;
      }

      if (esSupervisor()) {
        return true;
      }

      return obtenerEquiposParaUsuario()
        .includes(equipo);

    }


    function obtenerEquipoConversacion(c) {

      if (!c) {
        return null;
      }

      if (c.equipo) {
        return c.equipo;
      }

      if (c.asesorAsignado) {

        return obtenerEquipoParaGestor(
          c.asesorAsignado
        );

      }

      return null;

    }


    /* ============================================================
       PERMISOS
       ============================================================ */

    function puedeVerEnPrincipal(c) {

      if (!c) {
        return false;
      }

      if (c.estado === "finalizada") {
        return false;
      }

      /* SUPERVISOR NO VE CLIENTES EN PRINCIPAL */

      if (esSupervisor()) {
        return false;
      }

      /*
       * SENIOR Y ASESOR:
       * pueden ver sus propias cuentas.
       */

      if (esCuentaPropia(c)) {
        return true;
      }

      /*
       * Si está asignada a otra persona,
       * no aparece en Principal.
       */

      if (
        c.asesorAsignado ||
        c.asesorEmail
      ) {
        return false;
      }

      /*
       * Las cuentas sin asignar pueden ser vistas
       * por seniors.
       */

      if (esSenior()) {
        return true;
      }

      return false;

    }


    function puedeVerPorEquipo(c) {

      if (!c) {
        return false;
      }

      if (c.estado === "finalizada") {
        return false;
      }

      if (esSupervisor()) {
        return true;
      }

      /*
       * Si la conversación es del propio senior,
       * siempre puede verla.
       */

      if (esCuentaPropia(c)) {
        return true;
      }

      const gestor =
        String(c.asesorAsignado || "").trim();

      if (gestor) {

        const equipoGestor =
          obtenerEquipoParaGestor(gestor);

        if (equipoGestor) {

          return usuarioTieneEquipo(
            equipoGestor
          );

        }

      }

      const equipo =
        obtenerEquipoConversacion(c);

      if (!equipo) {
        return false;
      }

      return usuarioTieneEquipo(equipo);

    }


    function puedeGestionarConversacion(
      c,
      modo = "principal"
    ) {

      if (!c) {
        return false;
      }

      if (c.estado === "finalizada") {
        return false;
      }

      if (esSupervisor()) {
        return true;
      }

      /*
       * PROPIAS CUENTAS:
       * el usuario puede gestionarlas desde Principal.
       */

      if (esCuentaPropia(c)) {
        return true;
      }

      if (
        (modo === "equipo" ||
         modo === "agente") &&
        esSenior()
      ) {

        if (
          !c.asesorAsignado &&
          !c.asesorEmail
        ) {
          return true;
        }

        return puedeVerPorEquipo(c);

      }

      if (
        modo === "equipo" ||
        modo === "agente"
      ) {

        return puedeVerPorEquipo(c);

      }

      return puedeVerEnPrincipal(c);

    }


    function puedeAsignar() {

      return esSupervisor() || esSenior();

    }


    function puedeTransferir() {

      return esSupervisor() || esSenior();

    }


    /* ============================================================
       LOGIN
       ============================================================ */

    async function iniciarSesion() {

      loginError.style.display = "none";
      loginError.textContent = "";

      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;

      if (!email || !password) {

        mostrarLoginError(
          "Ingresá tu correo y contraseña."
        );

        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = "Ingresando...";

      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

      } catch (error) {

        console.error(
          "ERROR FIREBASE LOGIN:",
          error
        );

        mostrarLoginError(
          traducirErrorFirebase(error)
        );

      } finally {

        loginBtn.disabled = false;
        loginBtn.textContent = "Ingresar";

      }

    }


    function traducirErrorFirebase(error) {

      if (!error) {
        return "No se pudo iniciar sesión.";
      }

      const code =
        error.code || "";

      if (
        code.includes("invalid-credential") ||
        code.includes("wrong-password")
      ) {
        return "El correo o la contraseña son incorrectos.";
      }

      if (
        code.includes("user-not-found")
      ) {
        return "No existe una cuenta con ese correo.";
      }

      if (
        code.includes("invalid-email")
      ) {
        return "El correo electrónico no es válido.";
      }

      if (
        code.includes("too-many-requests")
      ) {
        return "Hubo demasiados intentos. Esperá unos minutos.";
      }

      if (
        code.includes("api-key-not-valid")
      ) {
        return "Firebase está rechazando la API Key utilizada por esta página.";
      }

      if (
        code.includes("network-request-failed")
      ) {
        return "No hay conexión con Firebase.";
      }

      return (
        "No se pudo iniciar sesión. " +
        code
      );

    }


    function mostrarLoginError(texto) {

      loginError.textContent = texto;
      loginError.style.display = "block";

    }


    /* ============================================================
       ESTADO DE AUTENTICACIÓN
       ============================================================ */

    onAuthStateChanged(
      auth,
      (user) => {

        if (!user) {

          usuarioActual = null;

          loginScreen.style.display = "flex";
          app.style.display = "none";

          return;
        }

        usuarioActual = user;

        nombreUsuario =
          obtenerNombreUsuario();

        rolUsuario =
          obtenerRolUsuario();

        currentUserName.textContent =
          nombreUsuario ||
          user.email;

        currentUserRole.textContent =
          rolUsuario.toUpperCase();

        loginScreen.style.display = "none";
        app.style.display = "flex";

        iniciarAplicacion();

      }
    );


    /* ============================================================
       INICIO
       ============================================================ */

    function iniciarAplicacion() {

      configurarMenu();

      cargarConversaciones();

      mostrarPrincipal();

    }


    /* ============================================================
       CONVERSACIONES
       ============================================================ */

    function cargarConversaciones() {

      const conversacionesRef =
        ref(db, "conversaciones");

      if (unsubscribeConversaciones) {
        unsubscribeConversaciones();
      }

      unsubscribeConversaciones =
        onValue(
          conversacionesRef,
          (snapshot) => {

            conversaciones =
              snapshot.val() || {};

            conversacionesArray =
              Object.entries(conversaciones)
                .map(
                  ([id, data]) => ({
                    id,
                    ...data
                  })
                );

            renderizarVistaActual();

            if (
              conversacionActualId &&
              conversaciones[
                conversacionActualId
              ]
            ) {

              if (
                modoActual === "historial"
              ) {

                mostrarConversacionHistorial(
                  conversacionActualId
                );

              } else {

                mostrarConversacion(
                  conversacionActualId,
                  modoActual
                );

              }

            }

          },
          (error) => {

            console.error(
              "Error leyendo conversaciones:",
              error
            );

          }
        );

    }


    function conversacionesActivas() {

      return conversacionesArray
        .filter(
          c =>
            c.estado !== "finalizada"
        );

    }


    /* ============================================================
       PRINCIPAL
       ============================================================ */

    function mostrarPrincipal() {

      modoActual = "principal";
      agenteSeleccionado = null;

      listTitle.textContent =
        esSupervisor()
          ? "Gestores"
          : "Mis conversaciones";

      searchInput.value = "";

      if (esSupervisor()) {

        conversationList.style.display = "none";
        agentList.style.display = "block";

        renderizarAgentes();

      } else {

        conversationList.style.display = "block";
        agentList.style.display = "none";

        renderizarConversacionesPrincipal();

      }

      cerrarChat();

      activarMenu("menuPrincipal");

    }


    function renderizarConversacionesPrincipal() {

      const texto =
        searchInput.value
          .trim()
          .toLowerCase();

      let lista =
        conversacionesActivas()
          .filter(
            c =>
              puedeVerEnPrincipal(c)
          );

      if (texto) {

        lista =
          lista.filter(
            c =>
              obtenerNombreCliente(c)
                .toLowerCase()
                .includes(texto) ||

              obtenerDniCliente(c)
                .toLowerCase()
                .includes(texto)
          );

      }

      lista.sort(
        (a,b) =>
          obtenerTimestamp(b) -
          obtenerTimestamp(a)
      );

      renderizarListaConversaciones(lista);

    }


    /* ============================================================
       AGENTES
       ============================================================ */

    function mostrarAgentes() {

      modoActual = "agentes";
      agenteSeleccionado = null;

      listTitle.textContent =
        "Agentes";

      searchInput.value = "";

      conversationList.style.display = "none";
      agentList.style.display = "block";

      renderizarAgentes();

      cerrarChat();

      activarMenu("menuAgentes");

    }


    function renderizarAgentes() {

      agentList.innerHTML = "";

      const gestores = [];

      for (const equipo in equipos) {

        for (
          const gestor of equipos[equipo].gestores
        ) {

          if (!gestores.some(
            x => x.nombre === gestor
          )) {

            gestores.push({
              nombre: gestor,
              equipo
            });

          }

        }

      }


      const visibles =
        gestores.filter(
          g =>
            esSupervisor() ||
            usuarioTieneEquipo(g.equipo)
        );


      if (!visibles.length) {

        agentList.innerHTML =
          '<div class="empty">No hay gestores para mostrar.</div>';

        return;

      }


      visibles.forEach(
        gestor => {

          const cantidad =
            conversacionesActivas()
              .filter(
                c =>
                  c.asesorAsignado ===
                  gestor.nombre
              )
              .length;

          const div =
            document.createElement("div");

          div.className =
            "agent-card";

          div.innerHTML = `
            <div class="agent-name">
              ${escapeHtml(gestor.nombre)}
            </div>

            <div class="agent-team">
              Equipo ${escapeHtml(gestor.equipo)}
            </div>

            <div class="agent-count">
              ${cantidad} conversación${cantidad === 1 ? "" : "es"} activa${cantidad === 1 ? "" : "s"}
            </div>
          `;

          div.addEventListener(
            "click",
            () =>
              mostrarConversacionesDeAgente(
                gestor.nombre,
                gestor.equipo
              )
          );

          agentList.appendChild(div);

        }
      );

    }


    function mostrarConversacionesDeAgente(
      gestor,
      equipo
    ) {

      modoActual = "agente";
      agenteSeleccionado = gestor;

      listTitle.textContent =
        gestor;

      searchInput.value = "";

      conversationList.style.display = "block";
      agentList.style.display = "none";

      const lista =
        conversacionesActivas()
          .filter(
            c =>
              (
                c.asesorAsignado === gestor ||
                String(c.asesorEmail || "").toLowerCase() ===
                  String(obtenerEmailPorNombre(gestor) || "").toLowerCase()
              ) &&
              (
                esSupervisor() ||
                usuarioTieneEquipo(equipo)
              )
          )
          .sort(
            (a,b) =>
              obtenerTimestamp(b) -
              obtenerTimestamp(a)
          );

      renderizarListaConversaciones(lista);

      cerrarChat();

    }


    /* ============================================================
       LISTADO
       ============================================================ */

    function renderizarListaConversaciones(
      lista
    ) {

      conversationList.innerHTML = "";

      if (!lista.length) {

        conversationList.innerHTML =
          '<div class="empty">No hay conversaciones.</div>';

        return;

      }


      lista.forEach(
        c => {

          const div =
            document.createElement("div");

          div.className =
            "conversation-item";

          if (
            c.id === conversacionActualId
          ) {

            div.classList.add("active");

          }


          const gestor =
            c.asesorAsignado ||
            "Sin gestor";

          const equipo =
            obtenerEquipoConversacion(c) ||
            "Sin equipo";

          div.innerHTML = `

            <div class="conversation-client">
              ${escapeHtml(
                obtenerNombreCliente(c) ||
                "Cliente sin nombre"
              )}
            </div>

            <div class="conversation-meta">
              DNI:
              ${escapeHtml(
                obtenerDniCliente(c) || "-"
              )}
              <br>

              Gestor:
              ${escapeHtml(gestor)}
              <br>

              Equipo:
              ${escapeHtml(equipo)}
            </div>

            <span class="badge">
              ${escapeHtml(
                c.estado || "activa"
              )}
            </span>

          `;


          div.addEventListener(
            "click",
            () =>
              mostrarConversacion(
                c.id,
                modoActual
              )
          );


          conversationList.appendChild(div);

        }
      );

    }


    /* ============================================================
       DATOS DEL CLIENTE
       ============================================================ */

    function obtenerObjetoCliente(c) {

      if (!c || !c.cliente) {
        return null;
      }

      if (
        typeof c.cliente === "object" &&
        !Array.isArray(c.cliente)
      ) {
        return c.cliente;
      }

      return null;

    }


    function obtenerNombreCliente(c) {

      if (!c) {
        return "";
      }

      const cliente =
        obtenerObjetoCliente(c);

      return String(
        c.clienteNombre ||
        c.nombreCliente ||
        c.nombre ||
        (cliente && (
          cliente.nombre ||
          cliente.nombreCompleto ||
          cliente.clienteNombre
        )) ||
        (
          typeof c.cliente === "string"
            ? c.cliente
            : ""
        ) ||
        ""
      ).trim();

    }


    function obtenerDniCliente(c) {

      if (!c) {
        return "";
      }

      const cliente =
        obtenerObjetoCliente(c);

      return String(
        c.dni ||
        c.DNI ||
        c.documento ||
        c.document ||
        (cliente && (
          cliente.dni ||
          cliente.DNI ||
          cliente.documento ||
          cliente.document
        )) ||
        ""
      ).trim();

    }


    function obtenerDatoCliente(
      c,
      nombres
    ) {

      if (!c) {
        return "";
      }

      const cliente =
        obtenerObjetoCliente(c);

      for (const nombre of nombres) {

        if (
          c[nombre] !== undefined &&
          c[nombre] !== null &&
          c[nombre] !== ""
        ) {

          return c[nombre];

        }

        if (
          cliente &&
          cliente[nombre] !== undefined &&
          cliente[nombre] !== null &&
          cliente[nombre] !== ""
        ) {

          return cliente[nombre];

        }

      }

      return "";

    }


    function mostrarFichaCliente(c) {

      if (!c) {
        clientDetails.style.display = "none";
        clientDetails.innerHTML = "";
        return;
      }

      const telefono =
        obtenerDatoCliente(
          c,
          [
            "telefono",
            "teléfono",
            "celular",
            "phone",
            "telefonoCliente",
            "celularCliente"
          ]
        );

      const email =
        obtenerDatoCliente(
          c,
          [
            "email",
            "correo",
            "correoElectronico",
            "emailCliente"
          ]
        );

      const domicilio =
        obtenerDatoCliente(
          c,
          [
            "domicilio",
            "direccion",
            "dirección",
            "domicilioCliente"
          ]
        );

      const expediente =
        obtenerDatoCliente(
          c,
          [
            "expediente",
            "numeroExpediente",
            "nroExpediente"
          ]
        );

      const monto =
        obtenerDatoCliente(
          c,
          [
            "monto",
            "deuda",
            "importe",
            "saldo",
            "montoDeuda"
          ]
        );

      const localidad =
        obtenerDatoCliente(
          c,
          [
            "localidad",
            "ciudad"
          ]
        );

      const provincia =
        obtenerDatoCliente(
          c,
          [
            "provincia"
          ]
        );

      const observaciones =
        obtenerDatoCliente(
          c,
          [
            "observaciones",
            "observacion",
            "comentarios",
            "comentario"
          ]
        );


      const datos = [

        {
          etiqueta: "Nombre",
          valor: obtenerNombreCliente(c)
        },

        {
          etiqueta: "DNI",
          valor: obtenerDniCliente(c)
        },

        {
          etiqueta: "Teléfono",
          valor: telefono
        },

        {
          etiqueta: "Email",
          valor: email
        },

        {
          etiqueta: "Domicilio",
          valor: domicilio
        },

        {
          etiqueta: "Localidad",
          valor: localidad
        },

        {
          etiqueta: "Provincia",
          valor: provincia
        },

        {
          etiqueta: "Expediente",
          valor: expediente
        },

        {
          etiqueta: "Monto / deuda",
          valor: monto
        },

        {
          etiqueta: "Observaciones",
          valor: observaciones
        }

      ];


      const visibles =
        datos.filter(
          d =>
            d.valor !== undefined &&
            d.valor !== null &&
            String(d.valor).trim() !== ""
        );


      /*
       * Si no encontramos ningún dato adicional,
       * mostramos igualmente nombre y DNI.
       */

      if (!visibles.length) {

        clientDetails.style.display =
          "grid";

        clientDetails.innerHTML = `
          <div class="client-details-title">
            Información del cliente
          </div>

          <div class="client-detail">
            <div class="client-detail-label">
              Nombre
            </div>
            <div class="client-detail-value">
              ${escapeHtml(
                obtenerNombreCliente(c) || "-"
              )}
            </div>
          </div>

          <div class="client-detail">
            <div class="client-detail-label">
              DNI
            </div>
            <div class="client-detail-value">
              ${escapeHtml(
                obtenerDniCliente(c) || "-"
              )}
            </div>
          </div>
        `;

        return;

      }


      clientDetails.innerHTML = `
        <div class="client-details-title">
          Información del cliente
        </div>

        ${visibles.map(
          dato => `
            <div class="client-detail">
              <div class="client-detail-label">
                ${escapeHtml(dato.etiqueta)}
              </div>

              <div class="client-detail-value">
                ${escapeHtml(dato.valor)}
              </div>
            </div>
          `
        ).join("")}
      `;


      clientDetails.style.display =
        "grid";

    }


    /* ============================================================
       MOSTRAR CONVERSACIÓN
       ============================================================ */

    function mostrarConversacion(
      id,
      modo = "principal"
    ) {

      const c =
        conversaciones[id];

      if (!c) {
        return;
      }

      if (
        !puedeGestionarConversacion(
          c,
          modo
        ) &&
        c.estado !== "finalizada"
      ) {

        alert(
          "No tenés permiso para gestionar esta conversación."
        );

        return;

      }


      conversacionActualId = id;

      chatEmpty.style.display =
        "none";

      chatContent.style.display =
        "flex";


      chatClient.textContent =
        obtenerNombreCliente(c) ||
        "Cliente";


      chatClientInfo.textContent =
        `DNI: ${obtenerDniCliente(c) || "-"} · ` +
        `Gestor: ${c.asesorAsignado || "Sin gestor"} · ` +
        `Equipo: ${obtenerEquipoConversacion(c) || "Sin equipo"}`;


      mostrarFichaCliente(c);


      renderizarAccionesChat(c);


      if (
        c.estado === "finalizada"
      ) {

        readOnlyNotice.style.display =
          "block";

        composer.style.display =
          "none";

      } else {

        readOnlyNotice.style.display =
          "none";

        composer.style.display =
          "flex";

      }


      cargarMensajes(id);

      renderizarListaSegunModo();

    }


    /* ============================================================
       ACCIONES DEL CHAT
       ============================================================ */

    function renderizarAccionesChat(c) {

      chatActions.innerHTML = "";

      if (
        c.estado === "finalizada"
      ) {
        return;
      }


      if (
        puedeAsignar()
      ) {

        const btnTransfer =
          document.createElement("button");

        btnTransfer.className =
          "btn btn-secondary";

        btnTransfer.textContent =
          c.asesorAsignado
            ? "Transferir"
            : "Asignar";

        btnTransfer.addEventListener(
          "click",
          () =>
            abrirTransferencia(c)
        );

        chatActions.appendChild(
          btnTransfer
        );

      }


      if (
        puedeGestionarConversacion(
          c,
          modoActual
        )
      ) {

        const btnFinalizar =
          document.createElement("button");

        btnFinalizar.className =
          "btn btn-danger";

        btnFinalizar.textContent =
          "Finalizar";

        btnFinalizar.addEventListener(
          "click",
          () =>
            finalizarConversacion(c.id)
        );

        chatActions.appendChild(
          btnFinalizar
        );

      }

    }


    /* ============================================================
       MENSAJES
       ============================================================ */

    function cargarMensajes(id) {

      const mensajesRef =
        ref(
          db,
          `conversaciones/${id}/mensajes`
        );

      if (unsubscribeMensajes) {
        unsubscribeMensajes();
      }

      unsubscribeMensajes =
        onValue(
          mensajesRef,
          snapshot => {

            const data =
              snapshot.val() || {};

            const lista =
              Object.entries(data)
                .map(
                  ([id, m]) => ({
                    id,
                    ...m
                  })
                )
                .sort(
                  (a,b) =>
                    obtenerTimestamp(a) -
                    obtenerTimestamp(b)
                );

            renderizarMensajes(lista);

          },
          error => {

            console.error(
              "Error leyendo mensajes:",
              error
            );

          }
        );

    }


    function renderizarMensajes(lista) {

      messages.innerHTML = "";

      if (!lista.length) {

        messages.innerHTML =
          '<div class="empty">Todavía no hay mensajes.</div>';

        return;

      }


      lista.forEach(
        m => {

          const div =
            document.createElement("div");

          const esAgente =
            m.tipo === "agente" ||
            m.tipo === "asesor" ||
            m.sender === "agent";


          div.className =
            "message " +
            (
              esAgente
                ? "agent"
                : "client"
            );


          div.innerHTML = `

            <div class="message-author">
              ${escapeHtml(
                m.nombre ||
                m.autor ||
                (
                  esAgente
                    ? "Gestor"
                    : "Cliente"
                )
              )}
            </div>

            <div>
              ${escapeHtml(
                m.texto ||
                m.mensaje ||
                m.text ||
                ""
              )}
            </div>

            <div class="message-time">
              ${formatearFecha(
                obtenerTimestamp(m)
              )}
            </div>

          `;


          messages.appendChild(div);

        }
      );


      messages.scrollTop =
        messages.scrollHeight;

    }


    async function enviarMensaje() {

      if (!conversacionActualId) {
        return;
      }

      const texto =
        messageInput.value.trim();

      if (!texto) {
        return;
      }


      const c =
        conversaciones[
          conversacionActualId
        ];

      if (!c) {
        return;
      }


      if (
        c.estado === "finalizada"
      ) {
        return;
      }


      if (
        !puedeGestionarConversacion(
          c,
          modoActual
        )
      ) {

        alert(
          "No tenés permiso para enviar mensajes en esta conversación."
        );

        return;

      }


      sendBtn.disabled = true;

      try {

        const mensajesRef =
          ref(
            db,
            `conversaciones/${conversacionActualId}/mensajes`
          );

        const nuevoMensaje =
          push(mensajesRef);


        await set(
          nuevoMensaje,
          {
            texto,
            mensaje: texto,
            tipo: "agente",
            sender: "agent",
            nombre: nombreUsuario,
            email: usuarioActual.email,
            timestamp: Date.now()
          }
        );


        await update(
          ref(
            db,
            `conversaciones/${conversacionActualId}`
          ),
          {
            ultimaActividad: Date.now()
          }
        );


        messageInput.value = "";

      } catch (error) {

        console.error(
          "Error enviando mensaje:",
          error
        );

        alert(
          "No se pudo enviar el mensaje.\n\n" +
          (
            error.message ||
            "Error desconocido."
          )
        );

      } finally {

        sendBtn.disabled = false;

      }

    }


    /* ============================================================
       FINALIZAR
       ============================================================ */

    async function finalizarConversacion(id) {

      const c =
        conversaciones[id];

      if (!c) {
        return;
      }


      if (
        !puedeGestionarConversacion(
          c,
          modoActual
        )
      ) {

        alert(
          "No tenés permiso para finalizar esta conversación."
        );

        return;

      }


      const confirmar =
        confirm(
          "¿Querés finalizar esta gestión?"
        );

      if (!confirmar) {
        return;
      }


      try {

        await update(
          ref(
            db,
            `conversaciones/${id}`
          ),
          {
            estado: "finalizada",
            finalizadaPor: nombreUsuario,
            finalizadaEmail: usuarioActual.email,
            fechaFinalizacion: Date.now(),
            ultimaActividad: Date.now()
          }
        );


        cerrarChat();

      } catch (error) {

        console.error(
          error
        );

        alert(
          "No se pudo finalizar la conversación."
        );

      }

    }


    /* ============================================================
       TRANSFERENCIA
       ============================================================ */

    function abrirTransferencia(c) {

      if (!puedeTransferir()) {

        alert(
          "No tenés permiso para asignar o transferir."
        );

        return;
      }


      transferTeam.innerHTML =
        '<option value="">Seleccionar equipo</option>';


      Object.keys(equipos)
        .forEach(
          equipo => {

            const option =
              document.createElement("option");

            option.value =
              equipo;

            option.textContent =
              equipo;

            transferTeam.appendChild(
              option
            );

          }
        );


      transferAgent.innerHTML =
        '<option value="">Seleccionar gestor</option>';


      if (c.equipo) {

        transferTeam.value =
          c.equipo;

        cargarGestoresTransferencia(
          c.equipo
        );

        if (c.asesorAsignado) {

          transferAgent.value =
            c.asesorAsignado;

        }

      }


      transferModal.dataset.id =
        c.id;

      transferModal.classList.add(
        "open"
      );

    }


    function cargarGestoresTransferencia(
      equipo
    ) {

      transferAgent.innerHTML =
        '<option value="">Seleccionar gestor</option>';


      if (!equipo || !equipos[equipo]) {
        return;
      }


      equipos[equipo].gestores
        .forEach(
          gestor => {

            const option =
              document.createElement("option");

            option.value =
              gestor;

            option.textContent =
              gestor;

            transferAgent.appendChild(
              option
            );

          }
        );

    }


    async function confirmarTransferencia() {

      const id =
        transferModal.dataset.id;

      const equipo =
        transferTeam.value;

      const gestor =
        transferAgent.value;


      if (!equipo) {

        alert(
          "Seleccioná un equipo."
        );

        return;
      }


      if (!gestor) {

        alert(
          "Seleccioná un gestor."
        );

        return;
      }


      if (!puedeTransferir()) {

        alert(
          "No tenés permiso para transferir."
        );

        return;
      }


      try {

        await update(
          ref(
            db,
            `conversaciones/${id}`
          ),
          {
            equipo,
            asesorAsignado: gestor,
            asesorEmail: obtenerEmailPorNombre(gestor),
            asignadoPor: nombreUsuario,
            asignadoEn: Date.now(),
            ultimaActividad: Date.now()
          }
        );


        cerrarModalTransferencia();

        mostrarConversacion(
          id,
          modoActual
        );

      } catch (error) {

        console.error(
          error
        );

        alert(
          "No se pudo asignar/transferir la conversación.\n\n" +
          error.message
        );

      }

    }


    function obtenerEmailPorNombre(
      nombre
    ) {

      for (
        const email in emailsPorNombre
      ) {

        if (
          emailsPorNombre[email] ===
          nombre
        ) {

          return email;

        }

      }

      return "";

    }


    function cerrarModalTransferencia() {

      transferModal.classList.remove(
        "open"
      );

      transferModal.dataset.id =
        "";

    }


    /* ============================================================
       HISTORIAL
       ============================================================ */

    function mostrarHistorial() {

      modoActual = "historial";
      agenteSeleccionado = null;

      listTitle.textContent =
        "Historial";

      searchInput.value = "";

      conversationList.style.display =
        "block";

      agentList.style.display =
        "none";

      renderizarHistorial();

      cerrarChat();

      activarMenu("menuHistorial");

    }


    function renderizarHistorial() {

      const texto =
        searchInput.value
          .trim()
          .toLowerCase();


      let lista =
        conversacionesArray
          .filter(
            c =>
              c.estado === "finalizada"
          );


      if (texto) {

        lista =
          lista.filter(
            c =>
              obtenerNombreCliente(c)
                .toLowerCase()
                .includes(texto) ||

              obtenerDniCliente(c)
                .toLowerCase()
                .includes(texto)
          );

      }


      lista.sort(
        (a,b) =>
          obtenerTimestamp(b) -
          obtenerTimestamp(a)
      );


      renderizarListaHistorial(
        lista
      );

    }


    function renderizarListaHistorial(
      lista
    ) {

      conversationList.innerHTML = "";

      if (!lista.length) {

        conversationList.innerHTML =
          '<div class="empty">No hay gestiones finalizadas.</div>';

        return;

      }


      lista.forEach(
        c => {

          const div =
            document.createElement("div");

          div.className =
            "conversation-item";


          div.innerHTML = `

            <div class="conversation-client">
              ${escapeHtml(
                obtenerNombreCliente(c) ||
                "Cliente"
              )}
            </div>

            <div class="conversation-meta">

              DNI:
              ${escapeHtml(
                obtenerDniCliente(c) || "-"
              )}
              <br>

              Teléfono:
              ${escapeHtml(
                obtenerDatoCliente(
                  c,
                  [
                    "telefono",
                    "teléfono",
                    "celular",
                    "phone"
                  ]
                ) || "-"
              )}
              <br>

              Gestor:
              ${escapeHtml(
                c.asesorAsignado ||
                "-"
              )}
              <br>

              Finalizada:
              ${formatearFecha(
                c.fechaFinalizacion ||
                c.timestamp ||
                0
              )}

            </div>

            <span class="badge">
              Finalizada
            </span>

          `;


          div.addEventListener(
            "click",
            () =>
              mostrarConversacionHistorial(
                c.id
              )
          );


          conversationList.appendChild(
            div
          );

        }
      );

    }


    function mostrarConversacionHistorial(
      id
    ) {

      const c =
        conversaciones[id];

      if (!c) {
        return;
      }


      conversacionActualId =
        id;

      chatEmpty.style.display =
        "none";

      chatContent.style.display =
        "flex";


      chatClient.textContent =
        obtenerNombreCliente(c) ||
        "Cliente";


      chatClientInfo.textContent =
        `DNI: ${obtenerDniCliente(c) || "-"} · ` +
        `Gestor: ${c.asesorAsignado || "-"} · ` +
        `Equipo: ${obtenerEquipoConversacion(c) || "-"} · ` +
        `Estado: Finalizada`;


      /*
       * AHORA MOSTRAMOS TODA LA FICHA
       * DEL CLIENTE TAMBIÉN EN HISTORIAL.
       */

      mostrarFichaCliente(c);


      chatActions.innerHTML = "";

      readOnlyNotice.style.display =
        "block";

      composer.style.display =
        "none";


      cargarMensajes(id);

    }


    /* ============================================================
       MENU
       ============================================================ */

    function configurarMenu() {

      document
        .getElementById("menuPrincipal")
        .onclick =
          mostrarPrincipal;

      document
        .getElementById("menuAgentes")
        .onclick =
          mostrarAgentes;

      document
        .getElementById("menuHistorial")
        .onclick =
          mostrarHistorial;


      document
        .getElementById("logoutBtn")
        .onclick =
          cerrarSesion;

    }


    function activarMenu(id) {

      document
        .querySelectorAll(".menu button")
        .forEach(
          b =>
            b.classList.remove(
              "active"
            )
        );


      const boton =
        document.getElementById(id);

      if (boton) {
        boton.classList.add("active");
      }

    }


    function renderizarVistaActual() {

      if (
        modoActual === "historial"
      ) {

        renderizarHistorial();
        return;

      }


      if (
        modoActual === "agentes" ||
        modoActual === "agente"
      ) {

        if (agenteSeleccionado) {

          const equipo =
            obtenerEquipoParaGestor(
              agenteSeleccionado
            );

          mostrarConversacionesDeAgente(
            agenteSeleccionado,
            equipo
          );

        } else {

          renderizarAgentes();

        }

        return;

      }


      if (
        modoActual === "principal"
      ) {

        if (esSupervisor()) {
          renderizarAgentes();
        } else {
          renderizarConversacionesPrincipal();
        }

      }

    }


    function renderizarListaSegunModo() {

      if (
        modoActual === "historial"
      ) {

        renderizarHistorial();
        return;

      }

      if (
        modoActual === "agente" &&
        agenteSeleccionado
      ) {

        const equipo =
          obtenerEquipoParaGestor(
            agenteSeleccionado
          );

        mostrarConversacionesDeAgente(
          agenteSeleccionado,
          equipo
        );

        return;

      }

      if (
        modoActual === "principal" &&
        !esSupervisor()
      ) {

        renderizarConversacionesPrincipal();

      }

    }


    /* ============================================================
       BUSCADOR
       ============================================================ */

    searchInput.addEventListener(
      "input",
      () => {

        if (
          modoActual === "historial"
        ) {

          renderizarHistorial();

          return;

        }


        if (
          modoActual === "agente" &&
          agenteSeleccionado
        ) {

          const texto =
            searchInput.value
              .trim()
              .toLowerCase();


          let lista =
            conversacionesActivas()
              .filter(
                c =>
                  c.asesorAsignado ===
                  agenteSeleccionado
              );


          if (texto) {

            lista =
              lista.filter(
                c =>
                  obtenerNombreCliente(c)
                    .toLowerCase()
                    .includes(texto) ||

                  obtenerDniCliente(c)
                    .toLowerCase()
                    .includes(texto)
              );

          }


          renderizarListaConversaciones(
            lista
          );

          return;

        }


        if (
          modoActual === "principal" &&
          !esSupervisor()
        ) {

          renderizarConversacionesPrincipal();

        }

      }
    );


    /* ============================================================
       CERRAR CHAT
       ============================================================ */

    function cerrarChat() {

      conversacionActualId =
        null;

      chatEmpty.style.display =
        "flex";

      chatContent.style.display =
        "none";

      messages.innerHTML = "";

      clientDetails.innerHTML = "";
      clientDetails.style.display = "none";

      chatActions.innerHTML = "";

      if (unsubscribeMensajes) {

        unsubscribeMensajes();
        unsubscribeMensajes = null;

      }

    }


    /* ============================================================
       LOGOUT
       ============================================================ */

    async function cerrarSesion() {

      try {

        await signOut(auth);

      } catch (error) {

        console.error(
          error
        );

      }

    }


    /* ============================================================
       UTILIDADES
       ============================================================ */

    function obtenerTimestamp(obj) {

      if (!obj) {
        return 0;
      }

      return Number(
        obj.timestamp ||
        obj.createdAt ||
        obj.fecha ||
        obj.ultimaActividad ||
        obj.fechaFinalizacion ||
        0
      );

    }


    function formatearFecha(timestamp) {

      if (!timestamp) {
        return "";
      }

      const fecha =
        new Date(
          Number(timestamp)
        );

      if (
        Number.isNaN(
          fecha.getTime()
        )
      ) {

        return "";

      }


      return fecha.toLocaleString(
        "es-AR",
        {
          day: "2-digit",
          month: "2-digit",
          hour: "2-digit",
          minute: "2-digit"
        }
      );

    }


    function escapeHtml(valor) {

      return String(
        valor ?? ""
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* ============================================================
       EVENTOS
       ============================================================ */

    loginBtn.addEventListener(
      "click",
      iniciarSesion
    );


    passwordInput.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter"
        ) {

          iniciarSesion();

        }

      }
    );


    emailInput.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter"
        ) {

          passwordInput.focus();

        }

      }
    );


    sendBtn.addEventListener(
      "click",
      enviarMensaje
    );


    messageInput.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          enviarMensaje();

        }

      }
    );


    document
      .getElementById("cancelTransfer")
      .addEventListener(
        "click",
        cerrarModalTransferencia
      );


    document
      .getElementById("confirmTransfer")
      .addEventListener(
        "click",
        confirmarTransferencia
      );


    transferTeam.addEventListener(
      "change",
      () =>
        cargarGestoresTransferencia(
          transferTeam.value
        )
    );


  </script>

</body>
</html>
