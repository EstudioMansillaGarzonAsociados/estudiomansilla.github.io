  /* =========================
     ESTADO
  ========================= */

  let usuarioActual = null;
  let nombreUsuarioActual = "";
  let rolUsuarioActual = "";
  let conversacionesArray = [];

  let conversacionActualId = null;

  let vistaActual = "conversations";

  // principal = cuentas propias
  // agente = cuentas de un gestor
  let vistaConversacionesModo = "principal";
  let gestorConsultado = "";

  /* =========================
     HELPERS
  ========================= */

  function esc(valor) {
    return String(valor ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function esSupervisor() {
    return rolUsuarioActual === "supervisor";
  }

  function esSenior() {
    return rolUsuarioActual === "senior";
  }

  function esAdministrador() {
    return esSupervisor() || esSenior();
  }

  function normalizarDni(valor) {
    return String(valor ?? "").replace(/\D/g, "");
  }

  function obtenerDniConversacion(c) {
    if (!c) return "";

    const candidatos = [
      c.dni,
      c.DNI,
      c.documento,
      c.document,
      c.documentNumber,
      c.numeroDocumento,
      c.nroDocumento,
      c.nroDni,
      c.dniCliente,
      c.clienteDni,
      c.clienteDNI,
      c.clienteDocumento,
      c.documentoCliente,
      c.clientDni,
      c.clientDNI,
      c.customerDni,
      c.customerDNI,

      c.cliente?.dni,
      c.cliente?.DNI,
      c.cliente?.documento,
      c.cliente?.documentNumber,
      c.cliente?.numeroDocumento,

      c.datosCliente?.dni,
      c.datosCliente?.DNI,
      c.datosCliente?.documento,
      c.datosCliente?.documentNumber,
      c.datosCliente?.numeroDocumento,

      c.usuario?.dni,
      c.usuario?.DNI,
      c.usuario?.documento,

      c.customer?.dni,
      c.customer?.DNI,
      c.customer?.documento,

      c.client?.dni,
      c.client?.DNI,
      c.client?.documento
    ];

    for (const valor of candidatos) {
      const dni = normalizarDni(valor);
      if (dni) return dni;
    }

    return "";
  }

  function obtenerNombreCliente(c) {
    if (!c) return "";

    const candidatos = [
      c.clienteNombre,
      c.nombreCliente,
      c.nombreCompletoCliente,
      c.clienteNombreCompleto,
      c.nombreCompleto,
      c.nombre,

      c.cliente?.nombreCompleto,
      c.cliente?.nombre,

      c.datosCliente?.nombreCompleto,
      c.datosCliente?.nombre,

      c.customer?.name,
      c.customer?.nombre,

      c.client?.name,
      c.client?.nombre
    ];

    for (const valor of candidatos) {
      if (typeof valor === "string" && valor.trim()) {
        return valor.trim();
      }
    }

    if (
      typeof c.cliente === "string" &&
      c.cliente.trim()
    ) {
      return c.cliente.trim();
    }

    return "";
  }

  function obtenerCliente(c) {
    const nombre = obtenerNombreCliente(c);

    if (nombre) return nombre;

    const dni = obtenerDniConversacion(c);

    if (dni) return "DNI " + dni;

    return "Sin identificar";
  }

  function obtenerEquipoDePersona(nombre) {
    for (const [equipo, datos] of Object.entries(equipos)) {
      if (
        datos.seniors.includes(nombre) ||
        datos.gestores.includes(nombre)
      ) {
        return equipo;
      }
    }

    return "";
  }

  function obtenerEquiposDelUsuario(nombre) {
    const resultado = [];

    for (const [equipo, datos] of Object.entries(equipos)) {
      if (
        datos.seniors.includes(nombre) ||
        datos.gestores.includes(nombre)
      ) {
        resultado.push(equipo);
      }
    }

    return resultado;
  }

  function usuarioTieneEquipo(equipo) {
    return obtenerEquiposDelUsuario(
      nombreUsuarioActual
    ).includes(equipo);
  }

  function obtenerEquipoConversacion(c) {
    if (!c) return "";

    if (c.equipo) return c.equipo;

    if (c.asesorAsignado) {
      return obtenerEquipoDePersona(c.asesorAsignado);
    }

    if (c.asesorEmail) {
      const nombre =
        emailsPorNombre[
          c.asesorEmail.toLowerCase()
        ];

      if (nombre) {
        return obtenerEquipoDePersona(nombre);
      }
    }

    return "";
  }

  function esCuentaAsignadaAlUsuario(c) {
    if (!c) return false;

    if (
      c.asesorAsignado ===
      nombreUsuarioActual
    ) {
      return true;
    }

    if (
      c.asesorEmail &&
      usuarioActual?.email &&
      c.asesorEmail.toLowerCase() ===
        usuarioActual.email.toLowerCase()
    ) {
      return true;
    }

    return false;
  }

  /* =========================
     PERMISOS
  ========================= */

  function puedeVerEnPrincipal(c) {
    if (!c) return false;

    if (c.estado === "finalizada") {
      return false;
    }

    // La supervisora no ve cuentas en la principal.
    // Ve gestores.
    if (esSupervisor()) {
      return false;
    }

    // Senior y asesor:
    // solamente sus propias cuentas.
    return esCuentaAsignadaAlUsuario(c);
  }

  function puedeVerPorEquipo(c) {
    if (!c) return false;

    if (c.estado === "finalizada") {
      return false;
    }

    if (esSupervisor()) {
      return true;
    }

    const equipo = obtenerEquipoConversacion(c);

    if (!equipo) return false;

    return usuarioTieneEquipo(equipo);
  }

  function puedeGestionarConversacion(
    c,
    origen = "principal"
  ) {
    if (!c) return false;

    if (c.estado === "finalizada") {
      return false;
    }

    if (esSupervisor()) {
      return true;
    }

    if (
      origen === "equipo" ||
      origen === "agente"
    ) {
      return puedeVerPorEquipo(c);
    }

    return puedeVerEnPrincipal(c);
  }

  function puedeTomarConversacion(c) {
    if (!c) return false;

    if (c.estado === "finalizada") {
      return false;
    }

    if (
      c.asesorAsignado ||
      c.asesorEmail
    ) {
      return false;
    }

    return esAdministrador();
  }

  function puedeTransferirConversacion(c) {
    if (!c) return false;

    if (c.estado === "finalizada") {
      return false;
    }

    // SOLAMENTE SENIOR Y SUPERVISOR
    return esAdministrador();
  }

  function puedeVerHistorial(c) {
    return !!c &&
      c.estado === "finalizada";
  }

  /* =========================
     LOGIN
  ========================= */

  const loginScreen =
    document.getElementById("loginScreen");

  const appScreen =
    document.getElementById("appScreen");

  const loginForm =
    document.getElementById("loginForm");

  const loginEmail =
    document.getElementById("loginEmail");

  const loginPassword =
    document.getElementById("loginPassword");

  const loginError =
    document.getElementById("loginError");

  if (loginForm) {
    loginForm.addEventListener(
      "submit",
      async e => {
        e.preventDefault();

        loginError.textContent = "";

        try {
          await signInWithEmailAndPassword(
            auth,
            loginEmail.value.trim(),
            loginPassword.value
          );
        } catch (error) {
          console.error(error);

          loginError.textContent =
            "No se pudo iniciar sesión: " +
            error.message;
        }
      }
    );
  }

  /* =========================
     AUTH
  ========================= */

  onAuthStateChanged(
    auth,
    async user => {

      if (!user) {
        usuarioActual = null;
        nombreUsuarioActual = "";
        rolUsuarioActual = "";

        if (loginScreen)
          loginScreen.style.display = "flex";

        if (appScreen)
          appScreen.style.display = "none";

        return;
      }

      usuarioActual = user;

      const email =
        user.email?.toLowerCase() || "";

      nombreUsuarioActual =
        emailsPorNombre[email] || "";

      rolUsuarioActual =
        perfiles[nombreUsuarioActual] || "";

      if (!nombreUsuarioActual) {
        alert(
          "Tu correo está autenticado en Firebase, pero todavía no está asociado a un usuario del sistema."
        );

        await signOut(auth);
        return;
      }

      if (!rolUsuarioActual) {
        alert(
          "Tu usuario no tiene un perfil configurado."
        );

        await signOut(auth);
        return;
      }

      if (loginScreen)
        loginScreen.style.display = "none";

      if (appScreen)
        appScreen.style.display = "flex";

      const nombreElement =
        document.getElementById("currentUserName");

      if (nombreElement) {
        nombreElement.textContent =
          nombreUsuarioActual;
      }

      const rolElement =
        document.getElementById("currentUserRole");

      if (rolElement) {
        rolElement.textContent =
          rolUsuarioActual;
      }

      escucharConversaciones();

      mostrarVista("conversations");
    }
  );

  /* =========================
     LOGOUT
  ========================= */

  window.cerrarSesion = async function () {
    try {
      await signOut(auth);
    } catch (error) {
      console.error(error);
    }
  };

  /* =========================
     CONVERSACIONES
  ========================= */

  function escucharConversaciones() {

    const conversacionesRef =
      ref(db, "conversaciones");

    onValue(
      conversacionesRef,
      snapshot => {

        const datos =
          snapshot.val() || {};

        conversacionesArray =
          Object.entries(datos)
            .map(([id, valor]) => ({
              id,
              ...valor
            }));

        renderizarVistaConversaciones();

        renderizarAgentes();

        renderizarHistorial();

        renderizarSinGestor();
      },
      error => {
        console.error(
          "Error leyendo conversaciones:",
          error
        );

        alert(
          "No se pudieron cargar las conversaciones: " +
          error.message
        );
      }
    );
  }

  /* =========================
     VISTA PRINCIPAL
  ========================= */

  function renderizarVistaConversaciones() {

    if (
      esSupervisor() &&
      vistaConversacionesModo === "principal"
    ) {
      renderizarGestoresPrincipal();
      return;
    }

    if (
      vistaConversacionesModo === "agente" &&
      gestorConsultado
    ) {
      renderizarConversacionesDeAgente(
        gestorConsultado
      );
      return;
    }

    renderizarConversaciones();
  }

  /* =========================
     PRINCIPAL ASESOR/SENIOR
  ========================= */

  function renderizarConversaciones() {

    const container =
      document.getElementById(
        "conversationItems"
      );

    if (!container) return;

    const search =
      document.getElementById(
        "conversationSearch"
      );

    if (search) {
      search.placeholder =
        "Buscar nombre o DNI...";
    }

    const back =
      document.getElementById(
        "backToAgentsButton"
      );

    if (back) {
      back.style.display = "none";
    }

    const title =
      document.getElementById(
        "conversationListTitle"
      );

    if (title) {
      title.textContent =
        "Mis conversaciones";
    }

    let lista =
      conversacionesArray
        .filter(c =>
          c.estado !== "finalizada"
        )
        .filter(c =>
          puedeVerEnPrincipal(c)
        );

    aplicarTextoBusqueda(
      lista,
      container
    );
  }

  /* =========================
     SUPERVISORA:
     GESTORES EN PRINCIPAL
  ========================= */

  function renderizarGestoresPrincipal() {

    const container =
      document.getElementById(
        "conversationItems"
      );

    if (!container) return;

    const title =
      document.getElementById(
        "conversationListTitle"
      );

    if (title) {
      title.textContent =
        "Gestores";
    }

    const search =
      document.getElementById(
        "conversationSearch"
      );

    if (search) {
      search.placeholder =
        "Buscar gestor...";
    }

    const back =
      document.getElementById(
        "backToAgentsButton"
      );

    if (back) {
      back.style.display = "none";
    }

    const texto =
      (
        search?.value || ""
      )
        .trim()
        .toLowerCase();

    const gestores =
      Object.values(equipos)
        .flatMap(e => e.gestores)
        .filter(
          (nombre, index, arr) =>
            arr.indexOf(nombre) === index
        )
        .filter(nombre =>
          !texto ||
          nombre
            .toLowerCase()
            .includes(texto)
        );

    if (!gestores.length) {
      container.innerHTML = `
        <div class="empty-state">
          No hay gestores para mostrar.
        </div>
      `;
      return;
    }

    container.innerHTML =
      gestores
        .map(nombre => {

          const equipo =
            obtenerEquipoDePersona(
              nombre
            );

          const activas =
            conversacionesArray.filter(
              c =>
                c.estado !== "finalizada" &&
                c.asesorAsignado === nombre
            ).length;

          return `
            <div
              class="conversation-item"
              onclick="verCuentasDelAgente('${esc(nombre)}')"
            >
              <div>
                <strong>👤 ${esc(nombre)}</strong>
              </div>

              <small>
                Equipo ${esc(equipo)}
                · ${activas} activas
              </small>
            </div>
          `;
        })
        .join("");
  }

  /* =========================
     CUENTAS DE UN GESTOR
  ========================= */

  function renderizarConversacionesDeAgente(
    nombreAgente
  ) {

    const container =
      document.getElementById(
        "conversationItems"
      );

    if (!container) return;

    const title =
      document.getElementById(
        "conversationListTitle"
      );

    if (title) {
      title.textContent =
        "Cuentas de " +
        nombreAgente;
    }

    const search =
      document.getElementById(
        "conversationSearch"
      );

    if (search) {
      search.placeholder =
        "Buscar nombre o DNI...";
    }

    const back =
      document.getElementById(
        "backToAgentsButton"
      );

    if (back) {
      back.style.display = "block";

      back.textContent =
        esSupervisor()
          ? "← Volver a gestores"
          : "← Volver a mis cuentas";
    }

    let lista =
      conversacionesArray
        .filter(c =>
          c.estado !== "finalizada"
        )
        .filter(c =>
          c.asesorAsignado ===
          nombreAgente
        )
        .filter(c =>
          puedeVerPorEquipo(c)
        );

    aplicarTextoBusqueda(
      lista,
      container
    );
  }

  /* =========================
     BÚSQUEDA
  ========================= */

  function aplicarTextoBusqueda(
    lista,
    container
  ) {

    const search =
      document.getElementById(
        "conversationSearch"
      );

    const texto =
      (
        search?.value || ""
      ).trim();

    if (!texto) {
      pintarListaConversaciones(
        lista,
        container
      );
      return;
    }

    const lower =
      texto.toLowerCase();

    const textoDni =
      normalizarDni(texto);

    const filtradas =
      lista.filter(c => {

        const cliente =
          obtenerCliente(c)
            .toLowerCase();

        const nombre =
          obtenerNombreCliente(c)
            .toLowerCase();

        const dni =
          obtenerDniConversacion(c);

        const gestor =
          String(
            c.asesorAsignado || ""
          ).toLowerCase();

        const equipo =
          obtenerEquipoConversacion(c)
            .toLowerCase();

        return (
          cliente.includes(lower) ||
          nombre.includes(lower) ||
          (
            textoDni &&
            dni.includes(textoDni)
          ) ||
          gestor.includes(lower) ||
          equipo.includes(lower)
        );
      });

    pintarListaConversaciones(
      filtradas,
      container
    );
  }

  window.aplicarBusquedaConversaciones =
    function () {

      if (
        esSupervisor() &&
        vistaConversacionesModo ===
          "principal"
      ) {
        renderizarGestoresPrincipal();
        return;
      }

      renderizarVistaConversaciones();
    };

  /* =========================
     PINTAR LISTA
  ========================= */

  function pintarListaConversaciones(
    lista,
    container
  ) {

    if (!lista.length) {

      container.innerHTML = `
        <div class="empty-state">
          No hay conversaciones para mostrar.
        </div>
      `;

      return;
    }

    container.innerHTML =
      lista
        .sort(
          (a, b) =>
            (b.ultimaActividad || 0) -
            (a.ultimaActividad || 0)
        )
        .map(c => {

          const cliente =
            obtenerCliente(c);

          const dni =
            obtenerDniConversacion(c);

          const gestor =
            c.asesorAsignado ||
            "Sin gestor";

          return `
            <div
              class="conversation-item"
              onclick="mostrarConversacion('${esc(c.id)}','${vistaConversacionesModo === "agente" ? "equipo" : "principal"}')"
            >

              <div>
                <strong>
                  ${esc(cliente)}
                </strong>
              </div>

              ${
                dni
                  ? `<small>DNI: ${esc(dni)}</small>`
                  : ""
              }

              <small>
                Gestor: ${esc(gestor)}
              </small>

              <small>
                Equipo:
                ${esc(
                  obtenerEquipoConversacion(c) ||
                  "Sin equipo"
                )}
              </small>

            </div>
          `;
        })
        .join("");
  }

  /* =========================
     ABRIR CONVERSACIÓN
  ========================= */

  window.mostrarConversacion =
    function (
      id,
      origen = "principal"
    ) {

      const conversation =
        conversacionesArray.find(
          c => c.id === id
        );

      if (!conversation) return;

      const finalizada =
        conversation.estado ===
        "finalizada";

      let puedeVer = false;

      if (finalizada) {

        puedeVer =
          origen === "historial";

      } else if (esSupervisor()) {

        puedeVer = true;

      } else if (
        origen === "equipo" ||
        origen === "agente"
      ) {

        puedeVer =
          puedeVerPorEquipo(
            conversation
          );

      } else {

        puedeVer =
          puedeVerEnPrincipal(
            conversation
          );
      }

      if (!puedeVer) {
        alert(
          "No tenés permisos para ver esta conversación."
        );
        return;
      }

      conversacionActualId = id;

      const title =
        document.getElementById(
          "chatClientName"
        );

      if (title) {
        title.textContent =
          obtenerCliente(conversation);
      }

      const dni =
        document.getElementById(
          "chatClientDni"
        );

      if (dni) {
        const valor =
          obtenerDniConversacion(
            conversation
          );

        dni.textContent =
          valor
            ? "DNI: " + valor
            : "";
      }

      const gestor =
        document.getElementById(
          "chatGestor"
        );

      if (gestor) {
        gestor.textContent =
          conversation.asesorAsignado ||
          "Sin gestor";
      }

      renderizarMensajes(
        conversation
      );

      renderizarAccionesChat(
        conversation,
        origen
      );

      actualizarFormularioMensaje(
        conversation,
        origen
      );
    };

  /* =========================
     MENSAJES
  ========================= */

  function renderizarMensajes(
    conversation
  ) {

    const container =
      document.getElementById(
        "chatMessages"
      );

    if (!container) return;

    const mensajes =
      conversation.mensajes ||
      conversation.messages ||
      {};

    const array =
      Object.entries(mensajes)
        .map(([id, valor]) => ({
          id,
          ...valor
        }))
        .sort(
          (a, b) =>
            (a.timestamp || 0) -
            (b.timestamp || 0)
        );

    if (!array.length) {

      container.innerHTML = `
        <div class="empty-state">
          No hay mensajes.
        </div>
      `;

      return;
    }

    container.innerHTML =
      array
        .map(m => {

          const esMio =
            m.autor ===
            nombreUsuarioActual ||
            m.remitente ===
            nombreUsuarioActual;

          return `
            <div
              class="message ${
                esMio
                  ? "message-own"
                  : "message-client"
              }"
            >
              <div class="message-author">
                ${esc(
                  m.autor ||
                  m.remitente ||
                  "Cliente"
                )}
              </div>

              <div>
                ${esc(
                  m.texto ||
                  m.mensaje ||
                  m.text ||
                  ""
                )}
              </div>

              <small>
                ${
                  m.timestamp
                    ? new Date(
                        m.timestamp
                      ).toLocaleString(
                        "es-AR"
                      )
                    : ""
                }
              </small>
            </div>
          `;
        })
        .join("");

    container.scrollTop =
      container.scrollHeight;
  }

  /* =========================
     ACCIONES DEL CHAT
  ========================= */

  function renderizarAccionesChat(
    conversation,
    origen
  ) {

    const container =
      document.getElementById(
        "chatActions"
      );

    if (!container) return;

    if (
      conversation.estado ===
      "finalizada"
    ) {

      container.innerHTML = `
        <div class="finalized-notice">
          🔒 Conversación finalizada.
          Solo lectura.
        </div>
      `;

      return;
    }

    const puedeGestionar =
      puedeGestionarConversacion(
        conversation,
        origen
      );

    let html = "";

    if (puedeGestionar) {

      html += `
        <button
          class="btn btn-success"
          onclick="finalizarConversacion()"
        >
          Finalizar
        </button>
      `;
    }

    if (
      puedeTransferirConversacion(
        conversation
      )
    ) {

      html += `
        <button
          class="btn btn-secondary"
          onclick="abrirTransferencia()"
        >
          Transferir
        </button>
      `;
    }

    container.innerHTML = html;
  }

  /* =========================
     FORMULARIO MENSAJE
  ========================= */

  function actualizarFormularioMensaje(
    conversation,
    origen
  ) {

    const form =
      document.getElementById(
        "messageForm"
      );

    const notice =
      document.getElementById(
        "messageDisabled"
      );

    if (!form) return;

    const puede =
      conversation.estado !==
        "finalizada" &&
      puedeGestionarConversacion(
        conversation,
        origen
      );

    if (puede) {

      form.style.display =
        "flex";

      if (notice)
        notice.style.display =
          "none";

    } else {

      form.style.display =
        "none";

      if (notice) {

        notice.style.display =
          "block";

        notice.textContent =
          conversation.estado ===
          "finalizada"
            ? "🔒 Conversación finalizada. Solo lectura."
            : "No tenés permisos para gestionar esta conversación.";
      }
    }
  }

  /* =========================
     ENVIAR MENSAJE
  ========================= */

  const messageForm =
    document.getElementById(
      "messageForm"
    );

  if (messageForm) {

    messageForm.addEventListener(
      "submit",
      async e => {

        e.preventDefault();

        if (!conversacionActualId)
          return;

        const conversation =
          conversacionesArray.find(
            c =>
              c.id ===
              conversacionActualId
          );

        if (!conversation)
          return;

        const origen =
          vistaConversacionesModo ===
          "agente"
            ? "equipo"
            : "principal";

        if (
          !puedeGestionarConversacion(
            conversation,
            origen
          )
        ) {
          alert(
            "No tenés permisos para gestionar esta conversación."
          );
          return;
        }

        const input =
          document.getElementById(
            "messageInput"
          );

        if (!input) return;

        const texto =
          input.value.trim();

        if (!texto) return;

        try {

          const mensajesRef =
            ref(
              db,
              `conversaciones/${conversacionActualId}/mensajes`
            );

          await push(
            mensajesRef,
            {
              autor:
                nombreUsuarioActual,
              autorEmail:
                usuarioActual.email,
              texto,
              timestamp:
                Date.now()
            }
          );

          await update(
            ref(
              db,
              `conversaciones/${conversacionActualId}`
            ),
            {
              ultimaActividad:
                Date.now()
            }
          );

          input.value = "";

        } catch (error) {

          console.error(error);

          alert(
            "No se pudo enviar el mensaje: " +
            error.message
          );
        }
      }
    );
  }

  /* =========================
     FINALIZAR
  ========================= */

  window.finalizarConversacion =
    async function () {

      if (!conversacionActualId)
        return;

      const conversation =
        conversacionesArray.find(
          c =>
            c.id ===
            conversacionActualId
        );

      if (!conversation)
        return;

      const origen =
        vistaConversacionesModo ===
        "agente"
          ? "equipo"
          : "principal";

      if (
        !puedeGestionarConversacion(
          conversation,
          origen
        )
      ) {

        alert(
          "No tenés permisos para finalizar esta conversación."
        );

        return;
      }

      if (
        !confirm(
          "¿Querés finalizar esta conversación?"
        )
      ) {
        return;
      }

      try {

        await update(
          ref(
            db,
            `conversaciones/${conversacionActualId}`
          ),
          {
            estado: "finalizada",
            fechaFinalizacion:
              Date.now(),
            finalizadaPor:
              nombreUsuarioActual
          }
        );

        alert(
          "Conversación finalizada."
        );

        conversacionActualId =
          null;

        const title =
          document.getElementById(
            "chatClientName"
          );

        if (title)
          title.textContent =
            "Seleccioná una conversación";

        renderizarVistaConversaciones();

        renderizarHistorial();

      } catch (error) {

        console.error(error);

        alert(
          "No se pudo finalizar: " +
          error.message
        );
      }
    };

  /* =========================
     AGENTES
  ========================= */

  function obtenerAgentesVisibles() {

    const todos =
      Object.values(equipos)
        .flatMap(e =>
          e.gestores
        )
        .filter(
          (nombre, index, arr) =>
            arr.indexOf(nombre) === index
        );

    if (esSupervisor()) {
      return todos;
    }

    const misEquipos =
      obtenerEquiposDelUsuario(
        nombreUsuarioActual
      );

    return todos.filter(
      nombre =>
        misEquipos.includes(
          obtenerEquipoDePersona(nombre)
        )
    );
  }

  function contarCuentasDeAgente(
    nombre
  ) {

    return conversacionesArray.filter(
      c =>
        c.estado !== "finalizada" &&
        c.asesorAsignado === nombre
    ).length;
  }

  function renderizarAgentes() {

    const grid =
      document.getElementById(
        "agentsGrid"
      );

    if (!grid) return;

    const search =
      document.getElementById(
        "agentSearch"
      );

    const filtroEquipo =
      document.getElementById(
        "agentTeamFilter"
      );

    const texto =
      (
        search?.value || ""
      )
        .trim()
        .toLowerCase();

    const equipoFiltro =
      filtroEquipo?.value || "";

    const agentes =
      obtenerAgentesVisibles()
        .filter(nombre => {

          const equipo =
            obtenerEquipoDePersona(
              nombre
            );

          const coincideTexto =
            !texto ||
            nombre
              .toLowerCase()
              .includes(texto);

          const coincideEquipo =
            !equipoFiltro ||
            equipo === equipoFiltro;

          return (
            coincideTexto &&
            coincideEquipo
          );
        });

    if (!agentes.length) {

      grid.innerHTML = `
        <div class="empty-state">
          No hay gestores para mostrar.
        </div>
      `;

      return;
    }

    grid.innerHTML =
      agentes
        .map(nombre => {

          const equipo =
            obtenerEquipoDePersona(
              nombre
            );

          const cuentas =
            contarCuentasDeAgente(
              nombre
            );

          return `
            <div class="agent-card">

              <div>
                <strong>
                  👤 ${esc(nombre)}
                </strong>
              </div>

              <small>
                Equipo ${esc(equipo)}
              </small>

              <div>
                ${cuentas} cuentas activas
              </div>

              <button
                class="btn btn-primary"
                onclick="verCuentasDelAgente('${esc(nombre)}')"
              >
                Ver cuentas
              </button>

            </div>
          `;
        })
        .join("");
  }

  window.verCuentasDelAgente =
    function (nombre) {

      if (
        !obtenerAgentesVisibles()
          .includes(nombre)
      ) {

        alert(
          "No tenés permisos para ver este gestor."
        );

        return;
      }

      vistaActual =
        "conversations";

      vistaConversacionesModo =
        "agente";

      gestorConsultado =
        nombre;

      mostrarVista(
        "conversations"
      );

      renderizarVistaConversaciones();
    };

  window.volverAListaPrincipal =
    function () {

      vistaConversacionesModo =
        "principal";

      gestorConsultado =
        "";

      const search =
        document.getElementById(
          "conversationSearch"
        );

      if (search)
        search.value = "";

      renderizarVistaConversaciones();
    };

  /* =========================
     SIN GESTOR
  ========================= */

  function renderizarSinGestor() {

    const container =
      document.getElementById(
        "unassignedItems"
      );

    if (!container) return;

    const lista =
      conversacionesArray.filter(
        c =>
          c.estado !== "finalizada" &&
          !c.asesorAsignado &&
          !c.asesorEmail
      );

    if (!lista.length) {

      container.innerHTML = `
        <div class="empty-state">
          No hay conversaciones sin gestor.
        </div>
      `;

      return;
    }

    container.innerHTML =
      lista
        .map(c => {

          const puede =
            puedeTomarConversacion(
              c
            );

          return `
            <div class="conversation-item">

              <strong>
                ${esc(
                  obtenerCliente(c)
                )}
              </strong>

              ${
                puede
                  ? `
                    <button
                      class="btn btn-primary"
                      onclick="tomarConversacion('${esc(c.id)}')"
                    >
                      Tomar
                    </button>
                  `
                  : ""
              }

            </div>
          `;
        })
        .join("");
  }

  /* =========================
     TOMAR CONVERSACIÓN
  ========================= */

  window.tomarConversacion =
    async function (id) {

      const conversation =
        conversacionesArray.find(
          c => c.id === id
        );

      if (!conversation)
        return;

      if (
        !puedeTomarConversacion(
          conversation
        )
      ) {

        alert(
          "No tenés permisos para tomar esta conversación."
        );

        return;
      }

      try {

        await update(
          ref(
            db,
            `conversaciones/${id}`
          ),
          {
            asesorAsignado:
              nombreUsuarioActual,
            asesorEmail:
              usuarioActual.email,
            equipo:
              obtenerEquipoDePersona(
                nombreUsuarioActual
              ),
            fechaAsignacion:
              Date.now()
          }
        );

      } catch (error) {

        console.error(error);

        alert(
          "No se pudo tomar la conversación: " +
          error.message
        );
      }
    };

  /* =========================
     TRANSFERENCIA
  ========================= */

  window.abrirTransferencia =
    function () {

      if (!conversacionActualId)
        return;

      const conversation =
        conversacionesArray.find(
          c =>
            c.id ===
            conversacionActualId
        );

      if (
        !puedeTransferirConversacion(
          conversation
        )
      ) {

        alert(
          "Solo los seniors y la supervisora pueden transferir conversaciones."
        );

        return;
      }

      const modal =
        document.getElementById(
          "transferModal"
        );

      const teamSelect =
        document.getElementById(
          "transferTeam"
        );

      const agentSelect =
        document.getElementById(
          "transferAgent"
        );

      if (!modal ||
          !teamSelect ||
          !agentSelect) {
        return;
      }

      teamSelect.innerHTML =
        `<option value="">Seleccionar equipo</option>` +
        Object.keys(equipos)
          .map(
            equipo =>
              `<option value="${esc(equipo)}">${esc(equipo)}</option>`
          )
          .join("");

      agentSelect.innerHTML =
        `<option value="">Seleccionar gestor</option>`;

      modal.style.display =
        "flex";
    };

  const transferTeam =
    document.getElementById(
      "transferTeam"
    );

  if (transferTeam) {

    transferTeam.addEventListener(
      "change",
      () => {

        const agentSelect =
          document.getElementById(
            "transferAgent"
          );

        if (!agentSelect) return;

        const equipo =
          transferTeam.value;

        if (!equipo) {

          agentSelect.innerHTML =
            `<option value="">Seleccionar gestor</option>`;

          return;
        }

        const gestores =
          equipos[equipo]?.gestores ||
          [];

        agentSelect.innerHTML =
          `<option value="">Seleccionar gestor</option>` +
          gestores
            .map(nombre => {

              const email =
                Object.entries(
                  emailsPorNombre
                )
                  .find(
                    ([, n]) =>
                      n === nombre
                  )?.[0];

              if (!email) {
                return "";
              }

              return `
                <option value="${esc(nombre)}">
                  ${esc(nombre)}
                </option>
              `;
            })
            .join("");
      }
    );
  }

  window.cerrarTransferencia =
    function () {

      const modal =
        document.getElementById(
          "transferModal"
        );

      if (modal)
        modal.style.display =
          "none";
    };

  window.confirmarTransferencia =
    async function () {

      if (!conversacionActualId)
        return;

      const conversation =
        conversacionesArray.find(
          c =>
            c.id ===
            conversacionActualId
        );

      if (
        !puedeTransferirConversacion(
          conversation
        )
      ) {

        alert(
          "No tenés permisos para transferir."
        );

        return;
      }

      const agentSelect =
        document.getElementById(
          "transferAgent"
        );

      const teamSelect =
        document.getElementById(
          "transferTeam"
        );

      const nuevoGestor =
        agentSelect?.value || "";

      const nuevoEquipo =
        teamSelect?.value || "";

      if (
        !nuevoGestor ||
        !nuevoEquipo
      ) {

        alert(
          "Seleccioná equipo y gestor."
        );

        return;
      }

      const email =
        Object.entries(
          emailsPorNombre
        )
          .find(
            ([, nombre]) =>
              nombre === nuevoGestor
          )?.[0];

      if (!email) {

        alert(
          "Ese gestor todavía no tiene un correo configurado para recibir transferencias."
        );

        return;
      }

      try {

        await update(
          ref(
            db,
            `conversaciones/${conversacionActualId}`
          ),
          {
            asesorAsignado:
              nuevoGestor,
            asesorEmail:
              email,
            equipo:
              nuevoEquipo,
            fechaTransferencia:
              Date.now(),
            transferidoPor:
              nombreUsuarioActual
          }
        );

        cerrarTransferencia();

        alert(
          "Conversación transferida correctamente."
        );

      } catch (error) {

        console.error(error);

        alert(
          "No se pudo transferir: " +
          error.message
        );
      }
    };

  /* =========================
     HISTORIAL
  ========================= */

  function obtenerConversacionesFinalizadas() {

    return conversacionesArray
      .filter(
        c =>
          c.estado ===
          "finalizada"
      )
      .sort(
        (a, b) =>
          (b.fechaFinalizacion || 0) -
          (a.fechaFinalizacion || 0)
      );
  }

  function renderizarHistorial() {

    const tbody =
      document.getElementById(
        "historyItems"
      );

    if (!tbody) return;

    const search =
      document.getElementById(
        "historySearch"
      );

    const texto =
      (
        search?.value || ""
      )
        .trim()
        .toLowerCase();

    const textoDni =
      normalizarDni(texto);

    let lista =
      obtenerConversacionesFinalizadas();

    if (texto) {

      lista =
        lista.filter(c => {

          const nombre =
            obtenerNombreCliente(c)
              .toLowerCase();

          const cliente =
            obtenerCliente(c)
              .toLowerCase();

          const dni =
            obtenerDniConversacion(c);

          return (
            nombre.includes(texto) ||
            cliente.includes(texto) ||
            (
              textoDni &&
              dni.includes(textoDni)
            )
          );
        });
    }

    const counter =
      document.getElementById(
        "historyCounter"
      );

    if (counter) {
      counter.textContent =
        `${lista.length} conversaciones`;
    }

    if (!lista.length) {

      tbody.innerHTML = `
        <tr>
          <td colspan="6">
            No hay conversaciones finalizadas.
          </td>
        </tr>
      `;

      return;
    }

    tbody.innerHTML =
      lista
        .map(c => {

          const fecha =
            c.fechaFinalizacion
              ? new Date(
                  c.fechaFinalizacion
                ).toLocaleString(
                  "es-AR"
                )
              : "-";

          return `
            <tr>

              <td>
                ${esc(
                  obtenerCliente(c)
                )}
              </td>

              <td>
                ${esc(
                  obtenerDniConversacion(c) ||
                  "-"
                )}
              </td>

              <td>
                ${esc(
                  c.asesorAsignado ||
                  "-"
                )}
              </td>

              <td>
                ${esc(
                  obtenerEquipoConversacion(c) ||
                  "-"
                )}
              </td>

              <td>
                ${esc(fecha)}
              </td>

              <td>
                <button
                  class="btn btn-secondary"
                  onclick="verGestionHistorial('${esc(c.id)}')"
                >
                  Ver gestión
                </button>
              </td>

            </tr>
          `;
        })
        .join("");
  }

  window.verGestionHistorial =
    function (id) {

      const conversation =
        conversacionesArray.find(
          c => c.id === id
        );

      if (
        !conversation ||
        !puedeVerHistorial(
          conversation
        )
      ) {
        alert(
          "No se puede abrir esta gestión."
        );
        return;
      }

      mostrarVista(
        "conversations"
      );

      mostrarConversacion(
        id,
        "historial"
      );
    };

  window.aplicarBusquedaHistorial =
    function () {
      renderizarHistorial();
    };

  /* =========================
     NAVEGACIÓN
  ========================= */

  window.mostrarVista =
    function (vista) {

      vistaActual = vista;

      document
        .querySelectorAll(
          ".view"
        )
        .forEach(el => {
          el.style.display =
            "none";
        });

      const target =
        document.getElementById(
          vista + "View"
        );

      if (target) {
        target.style.display =
          "block";
      }

      if (vista === "conversations") {

        if (
          !vistaConversacionesModo
        ) {
          vistaConversacionesModo =
            "principal";
        }

        renderizarVistaConversaciones();

      } else if (
        vista === "agents"
      ) {

        renderizarAgentes();

      } else if (
        vista === "history"
      ) {

        renderizarHistorial();

      } else if (
        vista === "unassigned"
      ) {

        renderizarSinGestor();
      }
    };

  /* =========================
     BÚSQUEDA AGENTES
  ========================= */

  const agentSearch =
    document.getElementById(
      "agentSearch"
    );

  if (agentSearch) {
    agentSearch.addEventListener(
      "input",
      renderizarAgentes
    );
  }

  const agentTeamFilter =
    document.getElementById(
      "agentTeamFilter"
    );

  if (agentTeamFilter) {

    agentTeamFilter.innerHTML =
      `<option value="">Todos los equipos</option>` +
      Object.keys(equipos)
        .map(
          equipo =>
            `<option value="${esc(equipo)}">${esc(equipo)}</option>`
        )
        .join("");

    agentTeamFilter.addEventListener(
      "change",
      renderizarAgentes
    );
  }

  /* =========================
     BÚSQUEDA PRINCIPAL
  ========================= */

  const conversationSearch =
    document.getElementById(
      "conversationSearch"
    );

  if (conversationSearch) {

    conversationSearch.addEventListener(
      "input",
      () => {

        if (
          esSupervisor() &&
          vistaConversacionesModo ===
            "principal"
        ) {
          renderizarGestoresPrincipal();
        } else {
          renderizarVistaConversaciones();
        }
      }
    );
  }

  /* =========================
     BÚSQUEDA HISTORIAL
  ========================= */

  const historySearch =
    document.getElementById(
      "historySearch"
    );

  if (historySearch) {

    historySearch.addEventListener(
      "input",
      renderizarHistorial
    );
  }

  /* =========================
     ESTADO INICIAL
  ========================= */

  vistaConversacionesModo =
    "principal";

});
</script>
