    const resultado = [];

    }


    /*
       SI NO TIENE GESTOR,
       USAMOS EL EQUIPO GUARDADO.
    */

    const equipo =
        obtenerEquipoConversacion(c);


    if(!equipo){
        return false;
    }


    return usuarioTieneEquipo(
        equipo
    );

}


/* =========================================================
   PERMISO VISTA PRINCIPAL
========================================================= */

function puedeVerEnPrincipal(c){

    if(!c){
        return false;
    }


    if(
        c.estado === "finalizada"
    ){
        return false;
    }


    if(esSupervisor()){
        return false;
    }


    return esCuentaAsignadaAlUsuario(c);

}


/* =========================================================
   DNI / CLIENTE
========================================================= */

function obtenerDniConversacion(c){

    if(!c){
        return "";
    }

    return (
        c.dni
        ||
        c.DNI
        ||
        c.documento
        ||
        c.document
        ||
        ""
    );

}


function obtenerNombreCliente(c){

    if(!c){
        return "Cliente";
    }

    return (
        c.nombreCliente
        ||
        c.clienteNombre
        ||
        c.nombre
        ||
        c.cliente
        ||
        "Cliente"
    );

}


function obtenerCliente(c){

    return obtenerNombreCliente(c);

}


/* =========================================================
   UTILIDADES
========================================================= */

function escapeHtml(text){

    if(text === null || text === undefined){
        return "";
    }

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function formatearFecha(valor){

    if(!valor){
        return "";
    }

    const fecha =
        new Date(valor);

    if(
        Number.isNaN(
            fecha.getTime()
        )
    ){

        return "";

    }

    return fecha.toLocaleString(
        "es-AR",
        {
            day:"2-digit",
            month:"2-digit",
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


function obtenerUltimoMensaje(c){

    if(!c){
        return "";
    }


    if(c.ultimoMensaje){
        return c.ultimoMensaje;
    }


    if(c.mensaje){
        return c.mensaje;
    }


    return "";

}

function escucharConversaciones(){

    const conversacionesRef =
        ref(
            db,
            "conversaciones"
        );


    onValue(
        conversacionesRef,
        snapshot => {

            const datos =
                snapshot.val()
                || {};


            conversacionesArray =
                Object.entries(
                    datos
                )
                .map(
                    ([id,data]) => ({
                        id,
                        ...data
                    })
                );


            if(
                vistaConversacionesModo
                ===
                "principal"
            ){

                renderizarConversaciones();

            }


            if(
                vistaConversacionesModo
                ===
                "agente"
            ){

                renderizarConversacionesDeAgente(
                    gestorConsultado
                );

            }


            if(
                conversacionSeleccionada
            ){

                const actualizada =
                    conversacionesArray.find(
                        c =>
                            c.id
                            ===
                            conversacionSeleccionada.id
                    );


                if(actualizada){

                    conversacionSeleccionada =
                        actualizada;

                    mostrarConversacion(
                        actualizada.id,
                        vistaConversacionesModo
                    );

                }

            }

        }
    );

}

function(){

        document.getElementById(

        );


    const subtitulo =
        document.getElementById(

        );

        `;

        "Mis conversaciones";

        nombreUsuarioActual;

        document
            .getElementById(
                "searchConversation"
            )
            .value
            .toLowerCase()
            .trim();

        obtenerConversacionesPrincipal();


    if(texto){

            listaConversaciones.filter(
                c => {

                    const nombre =
                        obtenerNombreCliente(c)
                            .toLowerCase();

                    const dni =
                        obtenerDniConversacion(c)
                            .toLowerCase();

                    return (
                        nombre.includes(texto)
                        ||
                        dni.includes(texto)
                    );

                }
            );

    listaConversaciones.sort(
        (a,b) =>
            Number(
                b.actualizadoEn || 0

            -
            Number(
                a.actualizadoEn || 0
            )
    );

        lista.innerHTML = `

            )

    if(!conversacion){
        return;
    }


    /*
       HISTORIAL:

        modo !== "historial"

function escucharMensajes(
    c,
    modo
){

    const mensajesRef =
        ref(
            db,
            `conversaciones/${c.id}/mensajes`
        );


    onValue(
        mensajesRef,
        snapshot => {

            const datos =
                snapshot.val()
                ||
                {};


            const mensajes =
                Object.entries(
                    datos
                )
                .map(
                    ([id,data]) => ({
                        id,
                        ...data
                    })
                )
                .sort(
                    (a,b) =>
                        Number(
                            a.fecha || 0
                        )
                        -
                        Number(
                            b.fecha || 0
                        )
                );


            const contenedor =
                document.getElementById(
                    "messages"
                );


            if(!mensajes.length){

                contenedor.innerHTML = `
                    <div class="empty">
                        Todavía no hay mensajes.
                    </div>
                `;

                return;

            }


            contenedor.innerHTML =
                mensajes.map(
                    m => {

                        const mio =
                            (
                                m.email
                                &&
                                usuarioActual
                                &&
                                m.email
                                ===
                                usuarioActual.email
                            )
                            ||
                            m.autor
                            ===
                            nombreUsuarioActual;


                        return `

                            <div
                                class="message ${
                                    mio
                                    ? "mine"
                                    : ""
                                }"
                            >

                                <div class="message-author">
                                    ${escapeHtml(
                                        m.autor
                                        ||
                                        m.nombre
                                        ||
                                        "Usuario"
                                    )}
                                </div>

                                <div>
                                    ${escapeHtml(
                                        m.texto
                                        ||
                                        m.mensaje
                                        ||
                                        ""
                                    )}
                                </div>

                                <div class="message-time">
                                    ${formatearFecha(
                                        m.fecha
                                    )}
                                </div>

                            </div>

                        `;

                    }
                )
                .join("");


            contenedor.scrollTop =
                contenedor.scrollHeight;

        }
    );

}

/* =========================================================
   ENVIAR MENSAJE
========================================================= */

window.enviarMensaje =
async function(){

    const c =
        conversacionSeleccionada;


    if(!c){
        return;
    }


    if(
        !puedeGestionarConversacion(
            c,
            vistaConversacionesModo
        )
    ){

        alert(
            "No tenés permiso para responder esta conversación."
        );

        return;

    }


    const input =
        document.getElementById(
            "mensajeInput"
        );


    if(!input){
        return;
    }


    const texto =
        input.value.trim();


    if(!texto){
        return;
    }


    try{

        const mensajesRef =
            ref(
                db,
                `conversaciones/${c.id}/mensajes`
            );


        await push(
            mensajesRef,
            {

                autor:
                    nombreUsuarioActual,

                email:
                    usuarioActual.email,

                texto:
                    texto,

                fecha:
                    Date.now()

            }
        );


        await update(
            ref(
                db,
                `conversaciones/${c.id}`
            ),
            {

                ultimoMensaje:
                    texto,

                actualizadoEn:
                    Date.now(),

                ultimoMensajePor:
                    nombreUsuarioActual,

                ultimoMensajePorEmail:
                    usuarioActual.email

            }
        );


        input.value = "";


    }catch(error){

        console.error(error);

        alert(
            "No se pudo enviar el mensaje. Revisá las reglas de Firebase."
        );

    }

};

/* =========================================================
   AGENTES
========================================================= */

function obtenerGestoresVisibles(){

    if(esSupervisor()){

        return Object.keys(
            perfiles
        ).filter(
            nombre =>
                perfiles[nombre]
                ===
                "asesor"
        );

    }


    if(esSenior()){

        const equiposUsuario =
            obtenerEquiposDelUsuario();


        const resultado = [];


        equiposUsuario.forEach(
            equipoNombre => {

                const datos =
                    equipos[equipoNombre];


                datos.gestores.forEach(
                    gestor => {

                        if(
                            !resultado.includes(
                                gestor
                            )
                        ){

                            resultado.push(
                                gestor
                            );

                        }

                    }
                );

            }
        );


        return resultado;

    }


    /*
       Los asesores no necesitan
       ver la sección de gestores
       de otros equipos.
    */

    return [];

}


function contarCuentasActivasDeGestor(
    gestor
){

    return conversacionesArray.filter(
        c => {

            if(
                c.estado === "finalizada"
            ){
                return false;
            }

            return (
                c.asesorAsignado
                ===
                gestor
            );

        }
    ).length;

}

    let cuentas =

                    ===

                if(

                    gestor
                ){
                    return false;
                }


                return puedeGestionarConversacion(
                    c,
                    "agente"
                );

            }
        );


    const texto =
        document
            .getElementById(
                "searchConversation"
            )
            .value
            .toLowerCase()
            .trim();


    if(texto){

        cuentas =
            cuentas.filter(
                c => {

                    const nombre =
                        obtenerNombreCliente(c)
                            .toLowerCase();

                    const dni =
                        obtenerDniConversacion(c)
                            .toLowerCase();

                    return (
                        nombre.includes(texto)
                        ||
                        dni.includes(texto)
                    );

                }
            );

    }


    if(!cuentas.length){

        lista.innerHTML = `
            <div class="empty">
                Este gestor no tiene cuentas activas.
            </div>
        `;

        return;

    }


    cuentas.sort(
        (a,b) =>
            Number(
                b.actualizadoEn || 0
            )
            -
            Number(
                a.actualizadoEn || 0
            )
    );


    lista.innerHTML =
        cuentas
            .map(
                c =>
                    crearItemConversacion(
                        c,
                        "agente"
                    )
            )
            .join("");

}

window.filtrarHistorial =
function(){

    const lista =
        document.getElementById(
            "historyList"
        );


    if(!lista){
        return;
    }


    const input =
        document.getElementById(
            "historySearch"
        );


    const texto =
        input
        ?
        input.value
            .toLowerCase()
            .trim()
        :
        "";


    let historial =
        conversacionesArray.filter(
            c =>
                c.estado
                ===
                "finalizada"
        );


    if(texto){

        historial =
            historial.filter(
                c => {

                    const nombre =
                        obtenerNombreCliente(c)
                            .toLowerCase();

                    const dni =
                        obtenerDniConversacion(c)
                            .toLowerCase();

                    return (
                        nombre.includes(texto)
                        ||
                        dni.includes(texto)
                    );

                }
            );

    }


    historial.sort(
        (a,b) =>
            Number(
                b.finalizadaEn
                ||
                b.actualizadoEn
                ||
                0
            )
            -
            Number(
                a.finalizadaEn
                ||
                a.actualizadoEn
                ||
                0
            )
    );


    if(!historial.length){

        lista.innerHTML = `
            <div class="empty">
                No hay conversaciones finalizadas.
            </div>
        `;

        return;

    }


    lista.innerHTML =
        historial
            .map(
                c => `

                    <div class="history-item">

                        <div>

                            <div class="history-client">
                                ${escapeHtml(
                                    obtenerNombreCliente(c)
                                )}
                            </div>

                            <div class="history-info">

                                DNI:
                                ${escapeHtml(
                                    obtenerDniConversacion(c)
                                )}

                                · Finalizada:
                                ${formatearFecha(
                                    c.finalizadaEn
                                    ||
                                    c.actualizadoEn
                                )}

                            </div>

                        </div>

                        <button
                            class="btn btn-secondary"
                            onclick="
                                verHistorialConversacion(
                                    '${c.id}'
                                )
                            "
                        >
                            Ver gestión
                        </button>

                    </div>

                `
            )
            .join("");

};


window.verHistorialConversacion =
function(id){

    const c =
        conversacionesArray.find(
            x =>
                x.id === id
        );


    if(!c){
        return;
    }


    conversacionSeleccionada =
        c;


    mostrarVista(
        "principal"
    );


    vistaConversacionesModo =
        "historial";


    /*
       Mostramos manualmente porque
       el historial es solamente lectura.
    */

    const chatEmpty =
        document.getElementById(
            "chatEmpty"
        );


    const chatContent =
        document.getElementById(
            "chatContent"
        );


    chatEmpty.classList.add(
        "hidden"
    );


    chatContent.classList.remove(
        "hidden"
    );


    renderizarHeaderChat(
        c,
        "historial"
    );


    escucharMensajes(
        c,
        "historial"
    );


    actualizarFormularioMensaje(
        c,
        false
    );

};

function prepararTransferencia(){

        );

function cargarGestoresTransferencia(){

        document.getElementById(

    const select =
        document.getElementById(
            "transferAgent"
        );

}


window.abrirTransferencia =
function(){

    if(
        !esSenior()
        &&
        !esSupervisor()
    ){

        );

};


window.confirmarTransferencia =
async function(){

    if(
        !conversacionTransferencia
    ){
        return;
    }


    const equipo =
        document.getElementById(
            "transferTeam"
        ).value;


    const gestor =
        document.getElementById(
            "transferAgent"
        ).value;


    if(!equipo){

        alert(
            "Seleccioná un equipo."
        );

        return;

    }


    if(!gestor){

        alert(
            "Seleccioná un gestor."
        );

        return;

    }


    try{

        await update(
            ref(
                db,
                `conversaciones/${conversacionTransferencia.id}`
            ),
            {

                asesorAsignado:
                    gestor,

                asesorEmail:
                    buscarEmailPorNombre(
                        gestor
                    ),

                equipo:
                    equipo,

                transferidoPor:
                    nombreUsuarioActual,

                transferidoPorEmail:
                    usuarioActual.email,

                transferidoEn:
                    Date.now(),

                actualizadoEn:
                    Date.now()

            }
        );


        cerrarTransferencia();


        alert(
            "Conversación transferida correctamente."
        );


    }catch(error){

        console.error(error);

        alert(
            "No se pudo transferir la conversación."
        );

    }

};


function buscarEmailPorNombre(nombre){

    for(
        const email of Object.keys(
            emailsPorNombre
        )
    ){

        if(
            emailsPorNombre[email]
            ===
            nombre
        ){

            return email;

        }

    }


    return "";

}

        );
