    color:#202124;

/* LOGIN */

#loginScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#111827,#374151);
}

.loginBox{
    width:360px;
    background:white;
    padding:35px;
    border-radius:18px;
    box-shadow:0 15px 50px rgba(0,0,0,.25);
}

.loginBox h1{
    margin:0 0 8px;
    text-align:center;
}

.loginBox p{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

.loginBox input{
    width:100%;
    padding:13px;
    margin-bottom:12px;
    border:1px solid #ddd;
    border-radius:9px;
    font-size:15px;
}

.loginBox button{
    width:100%;
    padding:13px;
    border:0;
    border-radius:9px;
    background:#111827;
    color:white;
    font-size:15px;
    cursor:pointer;
}

.loginBox button:hover{
    background:#1f2937;
}

#loginError{
    color:#d93025;
    font-size:14px;
    margin-top:12px;
    text-align:center;
}

/* APP */

#app{
    display:none;
    min-height:100vh;
}

header{
    height:65px;
    background:#111827;
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
}

.headerLeft{
    display:flex;
    align-items:center;
    gap:15px;
}

.headerTitle{
    font-size:20px;
    font-weight:bold;
}

.userInfo{
    font-size:14px;
    color:#d1d5db;
}

.logoutBtn{
    border:1px solid #6b7280;
    background:transparent;
    color:white;
    padding:8px 14px;
    border-radius:8px;
    cursor:pointer;
}

.logoutBtn:hover{
    background:#374151;
}

/* LAYOUT */

.layout{
    display:flex;
    min-height:calc(100vh - 65px);
}

.sidebar{
    width:230px;
    background:white;
    border-right:1px solid #ddd;
    padding:15px 10px;
}

.navBtn{
    width:100%;
    padding:13px;
    margin-bottom:7px;
    border:0;
    background:white;
    text-align:left;
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
}

.navBtn:hover{
    background:#f1f3f4;
}

.navBtn.active{
    background:#e8eefc;
    color:#174ea6;
    font-weight:bold;
}

.main{
    flex:1;
    padding:20px;
    overflow:auto;
}

/* TITULOS */

.pageTitle{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.pageTitle h2{
    margin:0;
}

.subtitle{
    color:#6b7280;
    font-size:14px;
    margin-top:5px;
}

/* LISTAS */

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:15px;
}

.card{
    background:white;
    border:1px solid #ddd;
    border-radius:13px;
    padding:17px;
    cursor:pointer;
    transition:.15s;
}

.card:hover{
    box-shadow:0 4px 15px rgba(0,0,0,.08);
    transform:translateY(-1px);
}

.cardTitle{
    font-weight:bold;
    font-size:17px;
    margin-bottom:8px;
}

.cardLine{
    font-size:13px;
    color:#666;
    margin:4px 0;
}

.badge{
    display:inline-block;
    padding:5px 8px;
    border-radius:20px;
    font-size:11px;
    background:#e5e7eb;
    color:#374151;
}

.badge.active{
    background:#dcfce7;
    color:#166534;
}

.badge.waiting{
    background:#fef3c7;
    color:#92400e;
}

.badge.finished{
    background:#e5e7eb;
    color:#4b5563;
}

/* CHAT */

.chatLayout{
    display:grid;
    grid-template-columns:330px 1fr;
    height:calc(100vh - 115px);
    background:white;
    border:1px solid #ddd;
    border-radius:12px;
    overflow:hidden;
}

.chatList{
    border-right:1px solid #ddd;
    overflow:auto;
}

.chatListHeader{
    padding:15px;
    border-bottom:1px solid #ddd;
    font-weight:bold;
}

.chatItem{
    padding:14px;
    border-bottom:1px solid #eee;
    cursor:pointer;
}

.chatItem:hover{
    background:#f7f7f7;
}

.chatItem.selected{
    background:#e8eefc;
}

.chatItemName{
    font-weight:bold;
    margin-bottom:5px;
}

.chatItemInfo{
    font-size:12px;
    color:#666;
}

.chatWindow{
    display:flex;
    flex-direction:column;
    min-width:0;
}

.chatHeader{
    padding:15px;
    border-bottom:1px solid #ddd;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.chatHeaderTitle{
    font-weight:bold;
}

.chatHeaderInfo{
    font-size:12px;
    color:#666;
    margin-top:4px;
}

.chatActions{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
}

.actionBtn{
    border:1px solid #d1d5db;
    background:white;
    padding:8px 11px;
    border-radius:7px;
    cursor:pointer;
    font-size:12px;
}

.actionBtn:hover{
    background:#f3f4f6;
}

.actionBtn.primary{
    background:#111827;
    color:white;
    border-color:#111827;
}

.actionBtn.danger{
    background:#dc2626;
    color:white;
    border-color:#dc2626;
}

.messages{
    flex:1;
    overflow:auto;
    padding:20px;
    background:#f8fafc;
}

.message{
    max-width:75%;
    padding:10px 13px;
    margin-bottom:10px;
    border-radius:12px;
    background:white;
    box-shadow:0 1px 2px rgba(0,0,0,.08);
}

.message.mine{
    margin-left:auto;
    background:#dbeafe;
}

.messageMeta{
    font-size:10px;
    color:#777;
    margin-bottom:4px;
}

.messageText{
    white-space:pre-wrap;
    word-break:break-word;
}

.chatInput{
    padding:12px;
    border-top:1px solid #ddd;
    display:flex;
    gap:8px;
    background:white;
}

.chatInput textarea{
    flex:1;
    resize:none;
    min-height:45px;
    max-height:120px;
    border:1px solid #ccc;
    border-radius:8px;
    padding:10px;
    font-family:inherit;
}

.sendBtn{
    width:90px;
    border:0;
    border-radius:8px;
    background:#111827;
    color:white;
    cursor:pointer;
}

.sendBtn:disabled{

    cursor:not-allowed;

/* AGENTES */

/* MODAL */

.modalOverlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:1000;

.modal{

    max-width:calc(100vw - 30px);
    background:white;
    border-radius:14px;
    padding:22px;
}

.modal h3{
    margin-top:0;
}

.modal select{

.modalActions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:15px;

/* VACIO */

.empty{
    background:white;
    border:1px dashed #ccc;
    border-radius:12px;
    padding:40px;
    text-align:center;
    color:#777;
}

/* LOADING */

.loading{
    padding:30px;
    text-align:center;
    color:#777;

/* RESPONSIVE */

@media(max-width:800px){

    .sidebar{
        width:70px;
    }

    .navBtn{
        font-size:0;
        text-align:center;
    }

    .navBtn::first-letter{
        font-size:18px;
    }

    .chatLayout{
        grid-template-columns:1fr;
    }

    .chatList{
        display:none;
    }

    .cards{
        grid-template-columns:1fr;
    }

}

function obtenerNombreUsuarioPorEmail(email){

    if(!email){
        return null;
    }

    const normalizado =
        email.trim().toLowerCase();

    return emailsPorNombre[normalizado] || null;

function obtenerRolUsuario(nombre){

function obtenerEquiposDeUsuario(nombre){

    const resultado = [];

    for(const nombreEquipo in equipos){

        if(
            equipo.seniors.includes(nombre) ||
            equipo.gestores.includes(nombre)

function obtenerEquipoParaGestor(gestor){

    if(!gestor){

    for(const nombreEquipo in equipos){

        if(
            equipos[nombreEquipo].gestores.includes(gestor)
        ){

        }

    }

    return null;

}

    const equiposUsuario =
        obtenerEquiposDeUsuario(

        );

    return equiposUsuario.includes(

}

    if(c.equipo){

    const gestor =
        obtenerGestorConversacion(c);

    if(gestor){

    }

    return puedeVerEnPrincipal(c);

/* =========================================================
   FORMATEO
========================================================= */

function textoSeguro(valor){

    if(
        valor === undefined ||
        valor === null
    ){

        return "";

    }

    return String(valor);

}


function escaparHTML(texto){

    return textoSeguro(texto)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


function fechaTexto(valor){

    if(!valor){
        return "";
    }

    try{

        const fecha =
            new Date(valor);

        if(
            isNaN(
                fecha.getTime()
            )
        ){

            return "";

        }

        return fecha.toLocaleString(
            "es-AR",
            {
                dateStyle:"short",
                timeStyle:"short"
            }
        );

    }catch{

        return "";

    }

}


/* =========================================================
   CONVERSACIONES
========================================================= */

function convertirConversaciones(data){

    const resultado = {};

    if(!data){
        return resultado;
    }

    Object.entries(data).forEach(
        ([id,valor])=>{

            if(!valor){
                return;
            }

            resultado[id] = {
                ...valor,
                id:id
            };

        }
    );

    return resultado;

}


function listaConversacionesActivas(){

    return Object.values(

        c =>

}


function listaConversacionesFinalizadas(){

    return Object.values(
        conversaciones
    ).filter(
        c =>
            c.estado === "finalizada"
    );

}

    unsubscribeConversaciones =
        onValue(
            conversacionesRef,
            snapshot => {

                conversaciones =
                    convertirConversaciones(
                        snapshot.val()
                    );

                renderizarVista();

                if(
                    conversacionSeleccionada &&
                    conversaciones[
                        conversacionSeleccionada
                    ]
                ){

                    mostrarConversacion(
                        conversacionSeleccionada,
                        modoActual
                    );

                }

            },
            error => {

                console.error(
                    "Error leyendo conversaciones:",
                    error
                );

                main.innerHTML = `
                    <div class="empty">
                        <h3>No se pudieron cargar las conversaciones</h3>
                        <p>
                            Firebase devolvió un error:
                        </p>
                        <p>
                            ${escaparHTML(error.message)}
                        </p>
                    </div>
                `;

            }
        );

}

    if(modoActual === "principal"){

        renderPrincipal();

        return;

    if(modoActual === "agentes"){

        renderAgentes();

        return;

    }

    if(modoActual === "historial"){

    }

}

/* =========================================================
   AGENTES
========================================================= */

function obtenerGestoresVisibles(){

    if(esSupervisor()){

        const todos = [];

        Object.values(equipos)
            .forEach(
                equipo => {

                    equipo.gestores
                        .forEach(
                            gestor => {

                                if(
                                    !todos.includes(
                                        gestor
                                    )
                                ){

                                    todos.push(
                                        gestor
                                    );

                                }

                            }
                        );

                }
            );

        return todos;

    }


    if(esSenior()){

        const equiposUsuario =
            obtenerEquiposDeUsuario(
                nombreUsuarioActual
            );

        const gestores = [];

        equiposUsuario.forEach(
            nombreEquipo => {

                const equipo =
                    equipos[
                        nombreEquipo
                    ];

                if(!equipo){
                    return;
                }

                equipo.gestores
                    .forEach(
                        gestor => {

                            if(
                                !gestores.includes(
                                    gestor
                                )
                            ){

                                gestores.push(
                                    gestor
                                );

                            }

                        }
                    );

            }
        );

        return gestores;

    }


    return [];

}


function renderAgentes(){

    const gestores =
        obtenerGestoresVisibles();

/* =========================================================
   MENSAJES
========================================================= */

function escucharMensajes(id){

    if(unsubscribeMensajes){

        unsubscribeMensajes();

        unsubscribeMensajes = null;

    }


    const mensajesRef =
        ref(
            db,
            `conversaciones/${id}/mensajes`
        );


    unsubscribeMensajes =
        onValue(
            mensajesRef,
            snapshot => {

                pintarMensajes(
                    snapshot.val()
                );

            },
            error => {

                console.error(
                    error
                );

                const container =
                    document.getElementById(
                        "messages"
                    );

                if(container){

                    container.innerHTML = `
                        <div class="empty">
                            No se pudieron cargar los mensajes.
                            <br><br>
                            ${escaparHTML(
                                error.message
                            )}
                        </div>
                    `;

                }

            }
        );

}


function pintarMensajes(data){

    const container =
        document.getElementById(
            "messages"
        );


    if(!container){
        return;
    }


    if(!data){

        container.innerHTML = `
            <div class="empty">
                No hay mensajes todavía.
            </div>
        `;

        return;

    }


    const lista =
        Object.entries(data)
            .map(
                ([id,mensaje]) => ({
                    id,
                    ...mensaje
                })
            )
            .sort(
                (a,b) => {

                    const fa =
                        Number(
                            a.timestamp ||
                            a.createdAt ||
                            0
                        );

                    const fb =
                        Number(
                            b.timestamp ||
                            b.createdAt ||
                            0
                        );

                    return fa - fb;

                }
            );


    container.innerHTML =
        lista.map(
            mensaje => {

                const autor =
                    mensaje.autorNombre ||
                    mensaje.nombre ||
                    mensaje.usuario ||
                    mensaje.autor ||
                    "";


                const texto =
                    mensaje.texto ||
                    mensaje.mensaje ||
                    mensaje.text ||
                    "";


                const timestamp =
                    mensaje.timestamp ||
                    mensaje.createdAt ||
                    "";


                const emailAutor =
                    mensaje.autorEmail ||
                    mensaje.email ||
                    "";


                const esMio =
                    (
                        emailAutor &&
                        usuarioActual &&
                        emailAutor ===
                        usuarioActual.email
                    )
                    ||
                    autor ===
                    nombreUsuarioActual;


                return `

                    <div
                        class="message ${
                            esMio
                            ? "mine"
                            : ""
                        }"
                    >

                        <div class="messageMeta">

                            ${
                                escaparHTML(
                                    autor || "Usuario"
                                )
                            }

                            ${
                                timestamp
                                ?
                                " · " +
                                escaparHTML(
                                    fechaTexto(
                                        timestamp
                                    )
                                )
                                :
                                ""
                            }

                        </div>

                        <div class="messageText">
                            ${escaparHTML(texto)}
                        </div>

                    </div>

                `;

            }
        ).join("");


    container.scrollTop =
        container.scrollHeight;

}


/* =========================================================
   ENVIAR MENSAJE
========================================================= */

async function enviarMensaje(id){

    const c =
        conversaciones[id];

    if(!c){
        return;
    }


    if(
        !puedeGestionarConversacion(
            c,
            modoActual
        )
    ){

        alert(
            "No tenés permiso para gestionar esta conversación."
        );

        return;

    }


    const input =
        document.getElementById(
            "messageInput"
        );


    const boton =
        document.getElementById(
            "sendMessageBtn"
        );


    if(!input){
        return;
    }


    const texto =
        input.value.trim();


    if(!texto){
        return;
    }


    if(boton){

        boton.disabled = true;

    }


    try{

        const mensajesRef =
            ref(
                db,
                `conversaciones/${id}/mensajes`
            );


        const nuevoMensaje =
            push(
                mensajesRef
            );


        await set(
            nuevoMensaje,
            {

                texto:texto,

                autor:nombreUsuarioActual,

                autorNombre:nombreUsuarioActual,

                autorEmail:
                    usuarioActual?.email || "",

                timestamp:
                    Date.now(),

                tipo:"mensaje"

            }
        );


        await update(
            ref(
                db,
                `conversaciones/${id}`
            ),
            {

                fechaUltimoMensaje:
                    Date.now(),

                updatedAt:
                    Date.now(),

                ultimoMensaje:
                    texto,

                ultimoMensajeAutor:
                    nombreUsuarioActual

            }
        );


        input.value = "";


    }catch(error){

        console.error(
            "Error enviando mensaje:",
            error
        );


        alert(
            "No se pudo enviar el mensaje.\n\n" +
            error.message
        );

    }finally{

        if(boton){

            boton.disabled = false;

        }

    }

}


/* =========================================================
   FINALIZAR
========================================================= */

async function finalizarConversacion(id){

    const c =
        conversaciones[id];

    if(!c){
        return;
    }


    if(
        !puedeGestionarConversacion(
            c,
            modoActual
        )
    ){

        alert(
            "No tenés permiso para finalizar esta conversación."
        );

        return;

    }


    const confirmar =
        confirm(
            "¿Querés finalizar esta conversación?"
        );


    if(!confirmar){
        return;
    }


    try{

        await update(
            ref(
                db,
                `conversaciones/${id}`
            ),
            {

                estado:"finalizada",

                finalizadaPor:
                    nombreUsuarioActual,

                finalizadaPorEmail:
                    usuarioActual?.email || "",

                fechaFinalizacion:
                    Date.now(),

                updatedAt:
                    Date.now()

            }
        );


        conversacionSeleccionada =
            null;


        alert(
            "Conversación finalizada."
        );


        modoActual =
            "principal";


        renderizarVista();


    }catch(error){

        console.error(
            error
        );

        alert(
            "No se pudo finalizar la conversación.\n\n" +
            error.message
        );

    }

}


/* =========================================================
   TRANSFERENCIA
========================================================= */

let conversacionParaTransferir =
    null;


function abrirTransferencia(id){

    if(
        !esSenior() &&
        !esSupervisor()
    ){

        alert(
            "No tenés permiso para transferir conversaciones."
        );

        return;

    }


    conversacionParaTransferir =
        id;


    const modal =
        document.getElementById(
            "transferModal"
        );


    const teamSelect =
        document.getElementById(
            "transferTeam"
        );


    teamSelect.innerHTML = `

        <option value="">
            Seleccionar equipo
        </option>

        ${
            Object.keys(equipos)
                .map(
                    equipo =>
                        `
                        <option value="${escaparHTML(equipo)}">
                            ${escaparHTML(equipo)}
                        </option>
                        `
                )
                .join("")
        }

    `;


    document.getElementById(
        "transferAgent"
    ).innerHTML = `

        <option value="">
            Seleccionar gestor
        </option>

    `;


    modal.style.display =
        "flex";

}


function cerrarTransferencia(){

    document.getElementById(
        "transferModal"
    ).style.display =
        "none";

    conversacionParaTransferir =
        null;

}


function cargarGestoresTransferencia(){

    const team =
        document.getElementById(
            "transferTeam"
        ).value;


    const agentSelect =
        document.getElementById(
            "transferAgent"
        );


    agentSelect.innerHTML = `

        <option value="">
            Seleccionar gestor
        </option>

    `;


    if(!team){
        return;
    }


    const equipo =
        equipos[team];


    if(!equipo){
        return;
    }


    equipo.gestores.forEach(
        gestor => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                gestor;

            option.textContent =
                gestor;

            agentSelect.appendChild(
                option
            );

        }
    );

}


async function confirmarTransferencia(){

    if(!conversacionParaTransferir){
        return;
    }


    const equipo =
        document.getElementById(
            "transferTeam"
        ).value;


    const gestor =
        document.getElementById(
            "transferAgent"
        ).value;


    if(!equipo){

        alert(
            "Seleccioná un equipo."
        );

        return;

    }


    if(!gestor){

        alert(
            "Seleccioná un gestor."
        );

        return;

    }


    try{

        await update(
            ref(
                db,
                `conversaciones/${conversacionParaTransferir}`
            ),
            {

                equipo:equipo,

                asesorAsignado:gestor,

                asesorEmail:
                    obtenerEmailPorNombre(
                        gestor
                    ),

                transferidoPor:
                    nombreUsuarioActual,

                transferidoPorEmail:
                    usuarioActual?.email || "",

                fechaTransferencia:
                    Date.now(),

                updatedAt:
                    Date.now()

            }
        );


        cerrarTransferencia();


        alert(
            "Conversación transferida correctamente."
        );


    }catch(error){

        console.error(
            error
        );

        alert(
            "No se pudo transferir la conversación.\n\n" +
            error.message
        );

    }

}


/* =========================================================
   EMAIL POR NOMBRE
========================================================= */

function obtenerEmailPorNombre(nombre){

    if(!nombre){
        return "";
    }


    for(
        const email in emailsPorNombre
    ){

        if(
            emailsPorNombre[email]
            === nombre
        ){

            return email;

        }

    }


    return "";

}

){

    document

            b =>

    boton.classList.add(

    );

}

/* =========================================================
   LOGIN
========================================================= */

async function iniciarSesion(){

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;


    loginError.textContent =
        "";


    if(!email){

        loginError.textContent =
            "Ingresá tu correo.";

        return;

    }


    if(!password){

        loginError.textContent =
            "Ingresá tu contraseña.";

        return;

    }


    loginBtn.disabled =
        true;

    loginBtn.textContent =
        "Ingresando...";


    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

    }catch(error){

        console.error(
            "Error de login:",
            error
        );


        let mensaje =
            error.message;


        if(
            error.code ===
            "auth/api-key-not-valid"
        ){

            mensaje =
                "Firebase está rechazando la API Key.";

        }
        else if(
            error.code ===
            "auth/invalid-credential"
        ){

            mensaje =
                "El correo o la contraseña son incorrectos.";

        }
        else if(
            error.code ===
            "auth/user-not-found"
        ){

            mensaje =
                "No existe un usuario con ese correo.";

        }
        else if(
            error.code ===
            "auth/wrong-password"
        ){

            mensaje =
                "La contraseña es incorrecta.";

        }
        else if(
            error.code ===
            "auth/invalid-email"
        ){

            mensaje =
                "El correo electrónico no es válido.";

        }


        loginError.textContent =
            mensaje;

    }finally{

        loginBtn.disabled =
            false;

        loginBtn.textContent =
            "Ingresar";

    }

}


/* =========================================================
   LOGOUT
========================================================= */

async function cerrarSesion(){

    try{

        await signOut(
            auth
        );

    }catch(error){

        console.error(
            error
        );

    }

}


/* =========================================================
   AUTH STATE
========================================================= */

onAuthStateChanged(
    auth,
    user => {

        if(!user){

            usuarioActual =
                null;

            nombreUsuarioActual =
                null;

            rolUsuarioActual =
                null;

            appElement.style.display =
                "none";

            loginScreen.style.display =
                "flex";

            return;

        }


        const nombre =
            obtenerNombreUsuarioPorEmail(
                user.email
            );


        if(!nombre){

            console.error(
                "Usuario autenticado pero no configurado:",
                user.email
            );


            alert(
                "Este usuario todavía no está configurado en el sistema.\n\n" +
                user.email
            );


            signOut(
                auth
            );

            return;

        }


        const rol =
            obtenerRolUsuario(
                nombre
            );


        if(!rol){

            alert(
                "El usuario no tiene un perfil configurado."
            );


            signOut(
                auth
            );

            return;

        }


        usuarioActual =
            user;

        nombreUsuarioActual =
            nombre;

        rolUsuarioActual =
            rol;


        loginScreen.style.display =
            "none";

        appElement.style.display =
            "block";


        userInfo.textContent =
            `${nombre} · ${rol}`;


        modoActual =
            "principal";


        activarNav(
            navPrincipal
        );


        escucharConversaciones();


        renderPrincipal();

    }
);


/* =========================================================
   EVENTOS
========================================================= */

loginBtn.addEventListener(
    "click",
    iniciarSesion
);


logoutBtn.addEventListener(
    "click",
    cerrarSesion
);


passwordInput.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter"
        ){

            iniciarSesion();

        }

    }
);


emailInput.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter"
        ){

            iniciarSesion();

        }

    }
);


document
    .getElementById(
        "cancelTransfer"
    )
    .addEventListener(
        "click",
        cerrarTransferencia
    );


document
    .getElementById(
        "confirmTransfer"
    )
    .addEventListener(
        "click",
        confirmarTransferencia
    );


document
    .getElementById(
        "transferTeam"
    )
    .addEventListener(
        "change",
        cargarGestoresTransferencia
    );


document
    .getElementById(
        "transferModal"
    )
    .addEventListener(
        "click",
        event => {

            if(
                event.target.id ===
                "transferModal"
            ){

                cerrarTransferencia();

            }

        }
    );

</script>
