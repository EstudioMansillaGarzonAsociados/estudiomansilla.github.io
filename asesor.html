      }

      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

      } catch (e) {

        console.error(e);

        error.textContent =
          "No se pudo iniciar sesión: "
          +
          e.message;

      }

    }


    /* =========================================================
       AUTH
    ========================================================= */

    onAuthStateChanged(
      auth,
      function(user) {

        if (user) {

          usuarioActual = user;

          nombreActual =
            obtenerNombrePorEmail(
              user.email
            );

          if (!nombreActual) {

            document
              .getElementById("loginError")
              .textContent =
              "Tu correo todavía no está asociado a un usuario del sistema.";

            signOut(auth);

            return;
          }

          rolActual =
            perfiles[nombreActual];

          document
            .getElementById("currentUserName")
            .textContent =
            nombreActual;

          document
            .getElementById("currentUserRole")
            .textContent =
            rolActual;

          document
            .getElementById("loginScreen")
            .classList.add("hidden");

          document
            .getElementById("app")
            .classList.remove("hidden");

          configurarPantalla();

          cargarConversaciones();

        } else {

          usuarioActual = null;
          nombreActual = null;
          rolActual = null;

          document
            .getElementById("loginScreen")
            .classList.remove("hidden");

          document
            .getElementById("app")
            .classList.add("hidden");

        }

      }
    );


    /* =========================================================
       CONFIGURAR PANTALLA
    ========================================================= */

    function configurarPantalla() {

      const principalTitle =
        document.getElementById(
          "principalTitle"
        );

      const principalSubtitle =
        document.getElementById(
          "principalSubtitle"
        );

      if (esSupervisor()) {

        principalTitle.textContent =
          "Gestores";

        principalSubtitle.textContent =
          "Seleccioná un gestor para ver sus conversaciones.";

      } else {

        principalTitle.textContent =
          "Mis conversaciones";

        principalSubtitle.textContent =
          "Conversaciones activas asignadas a vos.";

      }


      const navAgentes =
        document.getElementById(
          "navAgentes"
        );

      if (
        esSupervisor()
        ||
        esSenior()
        ||
        esAsesor()
      ) {

        navAgentes.classList.remove(
          "hidden"
        );

      }

    }


    /* =========================================================
       CARGAR CONVERSACIONES
    ========================================================= */

    function cargarConversaciones() {

      const conversacionesRef =
        ref(db, "conversaciones");

      conversacionesListener =
        onValue(
          conversacionesRef,
          function(snapshot) {

            conversaciones =
              snapshot.val() || {};

            renderPrincipal();

            renderAgents();

            renderHistory();

            if (conversacionActualId) {

              const c =
                conversaciones[
                  conversacionActualId
                ];

              if (c) {

                renderChatMessages(
                  conversacionActualId
                );

              }

            }

          },
          function(error) {

            console.error(
              "Error leyendo conversaciones:",
              error
            );

          }
        );

    }


    /* =========================================================
       PRINCIPAL
    ========================================================= */

    function renderPrincipal() {

      const container =
        document.getElementById(
          "principalList"
        );

      container.innerHTML = "";

      if (esSupervisor()) {

        renderSupervisorPrincipal(
          container
        );

        return;

      }


      const lista = Object.entries(
        conversaciones
      )
      .filter(
        ([id, c]) =>
          puedeVerEnPrincipal(c)
      )
      .sort(
        ordenarConversaciones
      );


      if (!lista.length) {

        container.innerHTML =
          `<div class="empty">
             No tenés conversaciones activas.
           </div>`;

        return;
      }


      lista.forEach(
        ([id, c]) => {

          container.appendChild(
            crearConversationElement(
              id,
              c,
              "principal"
            )
          );

        }
      );

    }


    function renderSupervisorPrincipal(
      container
    ) {

      const gestores = [];

      for (const equipo in equipos) {

        for (
          const gestor
          of equipos[equipo].gestores
        ) {

          if (
            !gestores.includes(gestor)
          ) {
            gestores.push(gestor);
          }

        }

      }


      gestores.sort();


      if (!gestores.length) {

        container.innerHTML =
          `<div class="empty">
             No hay gestores.
           </div>`;

        return;

      }


      gestores.forEach(
        function(gestor) {

          const cuentas =
            Object.entries(
              conversaciones
            )
            .filter(
              ([id, c]) =>
                c.estado !== "finalizada"
                &&
                c.asesorAsignado === gestor
            );


          const equipo =
            obtenerEquipoParaGestor(
              gestor
            );


          const div =
            document.createElement("div");

          div.className =
            "agent-card";

          div.innerHTML = `
            <h3>${escapeHtml(gestor)}</h3>
            <p>Equipo: ${escapeHtml(equipo || "Sin equipo")}</p>
            <p>Conversaciones activas: ${cuentas.length}</p>
          `;


          div.addEventListener(
            "click",
            function() {

              mostrarConversacionesDeGestor(
                gestor,
                "principal"
              );

            }
          );


          container.appendChild(div);

        }
      );

    }


    /* =========================================================
       AGENTES
    ========================================================= */

    function renderAgents() {

      const container =
        document.getElementById(
          "agentsList"
        );

      if (!container) return;

      container.innerHTML = "";


      let gestores = [];


      if (esSupervisor()) {

        for (const equipo in equipos) {

          equipos[equipo].gestores
            .forEach(
              function(gestor) {

                if (
                  !gestores.includes(gestor)
                ) {
                  gestores.push(gestor);
                }

              }
            );

        }

      } else {

        const misEquipos =
          obtenerEquiposParaSenior(
            nombreActual
          );

        if (esSenior()) {

          misEquipos.forEach(
            function(equipo) {

              equipos[equipo].gestores
                .forEach(
                  function(gestor) {

                    if (
                      !gestores.includes(gestor)
                    ) {
                      gestores.push(
                        gestor
                      );
                    }

                  }
                );

            }
          );

        } else if (esAsesor()) {

          const equipo =
            obtenerEquipoParaGestor(
              nombreActual
            );

          if (equipo) {

            gestores =
              equipos[equipo].gestores
                .slice();

          }

        }

      }


      gestores.sort();


      if (!gestores.length) {

        container.innerHTML =
          `<div class="empty">
             No hay gestores para mostrar.
           </div>`;

        return;

      }


      gestores.forEach(
        function(gestor) {

          const equipo =
            obtenerEquipoParaGestor(
              gestor
            );

          const cantidad =
            Object.values(
              conversaciones
            )
            .filter(
              c =>
                c.estado !== "finalizada"
                &&
                c.asesorAsignado === gestor
            )
            .length;


          const div =
            document.createElement("div");

          div.className =
            "agent-card";

          div.innerHTML = `
            <h3>${escapeHtml(gestor)}</h3>
            <p>Equipo: ${escapeHtml(equipo || "Sin equipo")}</p>
            <p>Activas: ${cantidad}</p>
          `;


          div.addEventListener(
            "click",
            function() {

              mostrarConversacionesDeGestor(
                gestor,
                "agente"
              );

            }
          );


          container.appendChild(div);

        }
      );

    }


    function mostrarConversacionesDeGestor(
      gestor,
      modo
    ) {

      const container =
        document.getElementById(
          "agentConversations"
        );

      const cards =
        Object.entries(
          conversaciones
        )
        .filter(
          ([id, c]) =>
            c.estado !== "finalizada"
            &&
            c.asesorAsignado === gestor
        )
        .sort(
          ordenarConversaciones
        );


      document
        .getElementById(
          "agentsList"
        )
        .classList.add(
          "hidden"
        );

      container.classList.remove(
        "hidden"
      );


      container.innerHTML = `
        <div class="page-header">
          <div>
            <h3>
              Conversaciones de ${escapeHtml(gestor)}
            </h3>
          </div>

          <button
            class="secondary-button"
            id="backAgentsButton"
          >
            ← Volver
          </button>
        </div>
      `;


      document
        .getElementById(
          "backAgentsButton"
        )
        .addEventListener(
          "click",
          function() {

            container.classList.add(
              "hidden"
            );

            document
              .getElementById(
                "agentsList"
              )
              .classList.remove(
                "hidden"
              );

          }
        );


      const list =
        document.createElement("div");

      list.className =
        "conversation-list";


      if (!cards.length) {

        list.innerHTML =
          `<div class="empty">
             Este gestor no tiene conversaciones activas.
           </div>`;

      } else {

        cards.forEach(
          ([id, c]) => {

            list.appendChild(
              crearConversationElement(
                id,
                c,
                modo
              )
            );

          }
        );

      }


      container.appendChild(list);

    }


    /* =========================================================
       CREAR CARD CONVERSACIÓN
    ========================================================= */

    function crearConversationElement(
      id,
      c,
      modo
    ) {

      const div =
        document.createElement("div");

      div.className =
        "conversation-item";


      const nombre =
        c.clienteNombre
        ||
        c.nombreCliente
        ||
        c.cliente
        ||
        "Cliente sin nombre";


      const dni =
        c.dni
        ||
        c.clienteDni
        ||
        c.documento
        ||
        "";


      const gestor =
        c.asesorAsignado
        ||
        "Sin gestor";


      const equipo =
        obtenerEquipoConversacion(c)
        ||
        "Sin equipo";


      div.innerHTML = `
        <div class="conversation-top">
          <div class="client-name">
            ${escapeHtml(nombre)}
          </div>

          <span class="badge">
            ${escapeHtml(c.estado || "activa")}
          </span>
        </div>

        <div class="conversation-meta">
          DNI: ${escapeHtml(String(dni || "-"))}
        </div>

        <div class="conversation-meta">
          Gestor: ${escapeHtml(gestor)}
        </div>

        <div class="conversation-meta">
          Equipo: ${escapeHtml(equipo)}
        </div>
      `;


      div.addEventListener(
        "click",
        function() {

          mostrarConversacion(
            id,
            modo
          );

        }
      );


      return div;

    }


    /* =========================================================
       CHAT
    ========================================================= */

    function mostrarConversacion(
      id,
      modo = "principal"
    ) {

      const c =
        conversaciones[id];

      if (!c) return;


      if (
        !puedeGestionarConversacion(
          c,
          modo
        )
      ) {

        alert(
          "No tenés permiso para gestionar esta conversación."
        );

        return;

      }


      conversacionActualId = id;
      modoChatActual = modo;


      const nombre =
        c.clienteNombre
        ||
        c.nombreCliente
        ||
        c.cliente
        ||
        "Cliente";


      document
        .getElementById(
          "chatClientName"
        )
        .textContent =
        nombre;


      const gestor =
        c.asesorAsignado
        ||
        "Sin gestor";


      const equipo =
        obtenerEquipoConversacion(c)
        ||
        "Sin equipo";


      document
        .getElementById(
          "chatInfo"
        )
        .innerHTML = `
          <strong>Gestor:</strong>
          ${escapeHtml(gestor)}
          &nbsp;&nbsp;
          <strong>Equipo:</strong>
          ${escapeHtml(equipo)}
        `;


      document
        .getElementById(
          "chatPanel"
        )
        .classList.remove(
          "hidden"
        );


      renderChatMessages(id);


      const finalizada =
        c.estado === "finalizada";


      const composer =
        document.getElementById(
          "messageComposer"
        );

      const footer =
        document.getElementById(
          "chatFooterButtons"
        );


      if (finalizada) {

        composer.classList.add(
          "hidden"
        );

        footer.classList.add(
          "hidden"
        );

      } else {

        composer.classList.remove(
          "hidden"
        );

        footer.classList.remove(
          "hidden"
        );

      }

    }


    function renderChatMessages(id) {

      const container =
        document.getElementById(
          "messagesContainer"
        );

      container.innerHTML = "";


      const mensajes =
        conversaciones[id]?.mensajes
        ||
        {};


      const lista =
        Object.entries(mensajes)
          .sort(
            ([a, ma], [b, mb]) =>
              Number(
                ma.timestamp || 0
              )
              -
              Number(
                mb.timestamp || 0
              )
          );


      if (!lista.length) {

        container.innerHTML =
          `<div class="empty">
             No hay mensajes todavía.
           </div>`;

        return;

      }


      lista.forEach(
        ([idMensaje, mensaje]) => {

          const div =
            document.createElement("div");

          const esPropio =
            mensaje.autorEmail ===
            usuarioActual?.email
            ||
            mensaje.autor ===
            nombreActual;


          div.className =
            "message "
            +
            (
              esPropio
              ? "outgoing"
              : "incoming"
            );


          div.innerHTML = `
            ${escapeHtml(
              mensaje.texto
              ||
              mensaje.mensaje
              ||
              ""
            )}

            <small>
              ${escapeHtml(
                mensaje.autor
                ||
                mensaje.autorNombre
                ||
                ""
              )}
            </small>
          `;


          container.appendChild(div);

        }
      );


      container.scrollTop =
        container.scrollHeight;

    }


    /* =========================================================
       ENVIAR MENSAJE
    ========================================================= */

    document
      .getElementById(
        "sendMessageButton"
      )
      .addEventListener(
        "click",
        enviarMensaje
      );


    async function enviarMensaje() {

      if (!conversacionActualId) {
        return;
      }


      const c =
        conversaciones[
          conversacionActualId
        ];


      if (!c) return;


      if (
        !puedeGestionarConversacion(
          c,
          modoChatActual
        )
      ) {

        alert(
          "No tenés permiso para responder esta conversación."
        );

        return;

      }


      const input =
        document.getElementById(
          "messageInput"
        );


      const texto =
        input.value.trim();


      if (!texto) return;


      const mensajesRef =
        ref(
          db,
          `conversaciones/${conversacionActualId}/mensajes`
        );


      const nuevoMensaje =
        push(mensajesRef);


      try {

        await set(
          nuevoMensaje,
          {
            texto: texto,
            autor: nombreActual,
            autorEmail:
              usuarioActual.email,
            timestamp:
              Date.now(),
            tipo: "saliente"
          }
        );


        input.value = "";

      } catch (e) {

        console.error(e);

        alert(
          "No se pudo enviar el mensaje: "
          +
          e.message
        );

      }

    }


    /* =========================================================
       FINALIZAR
    ========================================================= */

    document
      .getElementById(
        "finishButton"
      )
      .addEventListener(
        "click",
        finalizarConversacion
      );


    async function finalizarConversacion() {

      if (!conversacionActualId) {
        return;
      }


      const c =
        conversaciones[
          conversacionActualId
        ];


      if (!c) return;


      if (
        !puedeGestionarConversacion(
          c,
          modoChatActual
        )
      ) {

        alert(
          "No tenés permiso para finalizar esta conversación."
        );

        return;

      }


      const confirmar =
        confirm(
          "¿Querés finalizar esta conversación?"
        );


      if (!confirmar) {
        return;
      }


      try {

        await update(
          ref(
            db,
            `conversaciones/${conversacionActualId}`
          ),
          {
            estado: "finalizada",
            finalizadaPor:
              nombreActual,
            finalizadaPorEmail:
              usuarioActual.email,
            fechaFinalizacion:
              Date.now()
          }
        );


        cerrarChat();

      } catch (e) {

        console.error(e);

        alert(
          "No se pudo finalizar: "
          +
          e.message
        );

      }

    }

    function llenarEquiposTransferencia() {

      const select =
        document.getElementById(

        );

                select.appendChild(
                  option
                );

      .getElementById(

            .classList.add(

            );

    async function transferirConversacion() {

      const equipo =
        document
          .getElementById(
            "transferTeamSelect"
          )
          .value;


      const gestor =
        document
          .getElementById(
            "transferAgentSelect"
          )
          .value;

        alert(

      ) {

            `conversaciones/${conversacionActualId}`

          }

        );

       HISTORIAL
    ========================================================= */

    document
      .getElementById(
        "historySearchButton"
      )
      .addEventListener(
        "click",
        renderHistory
      );


    document
      .getElementById(
        "historySearch"
      )
      .addEventListener(
        "keydown",
        function(event) {

          if (event.key === "Enter") {
            renderHistory();
          }

        }
      );


    function renderHistory() {

      const container =
        document.getElementById(
          "historyList"
        );


      if (!container) return;


      const busqueda =
        document
          .getElementById(
            "historySearch"
          )
          .value
          .trim()
          .toLowerCase();


      container.innerHTML = "";


      const lista =
        Object.entries(
          conversaciones
        )
        .filter(
          ([id, c]) =>
            c.estado === "finalizada"
        )
        .filter(
          ([id, c]) => {

            if (!busqueda) {
              return true;
            }


            const nombre =
              String(
                c.clienteNombre
                ||
                c.nombreCliente
                ||
                c.cliente
                ||
                ""
              ).toLowerCase();


            const dni =
              String(
                c.dni
                ||
                c.clienteDni
                ||
                c.documento
                ||
                ""
              ).toLowerCase();


            return (
              nombre.includes(busqueda)
              ||
              dni.includes(busqueda)
            );

          }
        )
        .sort(
          ordenarConversaciones
        );


      if (!lista.length) {

        container.innerHTML =
          `<div class="empty">
             No se encontraron conversaciones finalizadas.
           </div>`;

        return;

      }


      lista.forEach(
        ([id, c]) => {

          const div =
            crearConversationElement(
              id,
              c,
              "historial"
            );


          div.querySelector(
            ".badge"
          ).className =
            "badge badge-finalizada";


          container.appendChild(div);

        }
      );

    }


    /* =========================================================
       ORDEN
    ========================================================= */

    function ordenarConversaciones(
      a,
      b
    ) {

      const ca = a[1];
      const cb = b[1];


      const ta =
        Number(
          ca.ultimaActividad
          ||
          ca.updatedAt
          ||
          ca.timestamp
          ||
          0
        );


      const tb =
        Number(
          cb.ultimaActividad
          ||
          cb.updatedAt
          ||
          cb.timestamp
          ||
          0
        );


      return tb - ta;

    }

      document
        .getElementById(
