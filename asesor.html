<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Centro de Atención - Asesor</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    button,
    input,
    textarea,
    select {
      font-family: inherit;
    }

    /* =========================
       LOGIN
    ========================= */

    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #111827, #1f2937);
    }

    .login-box {
      width: 390px;
      max-width: calc(100% - 30px);
      background: white;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 50px rgba(0,0,0,.25);
    }

    .login-box h1 {
      margin: 0 0 8px;
      font-size: 25px;
    }

    .login-box p {
      margin: 0 0 25px;
      color: #6b7280;
    }

    .login-box label {
      display: block;
      margin: 15px 0 7px;
      font-size: 13px;
      font-weight: bold;
    }

    .login-box input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      outline: none;
    }

    .login-box input:focus {
      border-color: #2563eb;
    }

    .login-btn {
      width: 100%;
      margin-top: 22px;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #loginError {
      display: none;
      margin-top: 15px;
      padding: 10px;
      border-radius: 8px;
      background: #fee2e2;
      color: #b91c1c;
      font-size: 13px;
    }

    /* =========================
       APP
    ========================= */

    #app {
      display: none;
      height: 100vh;
      overflow: hidden;
    }

    .topbar {
      height: 60px;
      padding: 0 18px;
      background: #111827;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .topbar-title {
      font-size: 19px;
      font-weight: bold;
    }

    .topbar-user {
      display: flex;
      align-items: center;
      gap: 15px;
      font-size: 13px;
    }

    .logout-btn {
      border: 1px solid rgba(255,255,255,.25);
      background: transparent;
      color: white;
      padding: 8px 12px;
      border-radius: 7px;
      cursor: pointer;
    }

    /* =========================
       LAYOUT
    ========================= */

    .main-layout {
      height: calc(100vh - 60px);
      display: grid;
      grid-template-columns: 330px minmax(450px, 1fr) 290px;
    }

    /* =========================
       SIDEBAR
    ========================= */

    .sidebar {
      background: white;
      border-right: 1px solid #ddd;
      overflow-y: auto;
    }

    .sidebar-header {
      padding: 14px;
      border-bottom: 1px solid #eee;
    }

    .search-box {
      width: 100%;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      outline: none;
    }

    .filters {
      display: flex;
      gap: 5px;
      margin-top: 10px;
    }

    .filter-btn {
      flex: 1;
      padding: 8px 4px;
      border: 1px solid #ddd;
      background: white;
      border-radius: 7px;
      cursor: pointer;
      font-size: 12px;
    }

    .filter-btn.active {
      background: #2563eb;
      color: white;
      border-color: #2563eb;
    }

    #conversationList {
      padding: 4px;
    }

    .conversation-card {
      padding: 13px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .conversation-card:hover {
      background: #f5f7fa;
    }

    .conversation-card.selected {
      background: #e8f0fe;
    }

    .conversation-top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .conversation-name {
      font-size: 14px;
      font-weight: bold;
    }

    .conversation-time {
      color: #6b7280;
      font-size: 10px;
    }

    .conversation-preview {
      margin-top: 5px;
      color: #6b7280;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .conversation-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }

    .badge {
      display: inline-block;
      padding: 3px 7px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: bold;
      margin-right: 4px;
    }

    .badge-active {
      background: #dcfce7;
      color: #166534;
    }

    .badge-pending {
      background: #fef3c7;
      color: #92400e;
    }

    .badge-finished {
      background: #e5e7eb;
      color: #374151;
    }

    .badge-team {
      background: #e0e7ff;
      color: #3730a3;
    }

    .waiting-timer {
      color: #dc2626;
      font-size: 11px;
      font-weight: bold;
      font-variant-numeric: tabular-nums;
    }

    /* =========================
       CHAT
    ========================= */

    .chat {
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: #eef1f5;
    }

    .chat-header {
      min-height: 70px;
      padding: 12px 18px;
      background: white;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .client-name {
      font-size: 18px;
      font-weight: bold;
    }

    .client-sub {
      margin-top: 4px;
      color: #6b7280;
      font-size: 12px;
    }

    .chat-actions {
      display: flex;
      gap: 7px;
    }

    .action-btn {
      padding: 8px 11px;
      border: 0;
      border-radius: 7px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
    }

    .btn-warning {
      background: #f59e0b;
      color: white;
    }

    .btn-danger {
      background: #dc2626;
      color: white;
    }

    .timer-bar {
      padding: 8px 18px;
      background: white;
      border-bottom: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
    }

    .timer-label {
      color: #6b7280;
      font-size: 12px;
    }

    #mainTimer {
      color: #dc2626;
      font-weight: bold;
      font-variant-numeric: tabular-nums;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .empty-chat,
    .loading,
    .no-selection {
      color: #9ca3af;
      text-align: center;
      padding: 30px;
    }

    .message {
      display: flex;
      margin-bottom: 10px;
    }

    .message.client {
      justify-content: flex-start;
    }

    .message.team {
      justify-content: flex-end;
    }

    .message-bubble {
      max-width: 70%;
      padding: 10px 13px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.4;
      box-shadow: 0 1px 2px rgba(0,0,0,.08);
    }

    .message.client .message-bubble {
      background: white;
      border-bottom-left-radius: 3px;
    }

    .message.team .message-bubble {
      background: #dbeafe;
      border-bottom-right-radius: 3px;
    }

    .message-author {
      margin-bottom: 4px;
      color: #6b7280;
      font-size: 10px;
      font-weight: bold;
    }

    .message-time {
      margin-top: 4px;
      color: #9ca3af;
      font-size: 9px;
      text-align: right;
    }

    .composer {
      padding: 12px;
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      gap: 8px;
    }

    #messageInput {
      flex: 1;
      min-height: 42px;
      max-height: 130px;
      resize: vertical;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      outline: none;
    }

    #sendBtn {
      width: 90px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #sendBtn:disabled {
      background: #9ca3af;
    }

    /* =========================
       DETAILS
    ========================= */

    .details {
      background: white;
      border-left: 1px solid #ddd;
      overflow-y: auto;
    }

    .details-header {
      padding: 18px;
      border-bottom: 1px solid #eee;
      font-size: 17px;
      font-weight: bold;
    }

    .detail-section {
      padding: 16px;
      border-bottom: 1px solid #eee;
    }

    .detail-title {
      margin-bottom: 7px;
      color: #6b7280;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .detail-value {
      font-size: 14px;
      word-break: break-word;
    }

    .detail-timer {
      color: #dc2626;
      font-size: 23px;
      font-weight: bold;
      font-variant-numeric: tabular-nums;
    }

    .assignment-select {
      width: 100%;
      margin-top: 8px;
      padding: 9px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
    }

    @media (max-width: 1050px) {

      .main-layout {
        grid-template-columns: 290px minmax(350px, 1fr);
      }

      .details {
        display: none;
      }

    }

  </style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<div id="loginScreen">

  <div class="login-box">

    <h1>Centro de Atención</h1>

    <p>Ingreso para asesores</p>

    <form id="loginForm">

      <label for="email">
        Correo electrónico
      </label>

      <input
        type="email"
        id="email"
        placeholder="correo@mansillayasoc.com.ar"
        autocomplete="username"
        required
      >

      <label for="password">
        Contraseña
      </label>

      <input
        type="password"
        id="password"
        placeholder="Contraseña"
        autocomplete="current-password"
        required
      >

      <button
        type="submit"
        class="login-btn"
      >
        Iniciar sesión
      </button>

    </form>

    <div id="loginError"></div>

  </div>

</div>


<!-- =========================
     APP
========================= -->

<div id="app">

  <div class="topbar">

    <div class="topbar-title">
      Centro de Atención
    </div>

    <div class="topbar-user">

      <span id="currentUserName">
        Cargando...
      </span>

      <button
        id="logoutBtn"
        class="logout-btn"
      >
        Cerrar sesión
      </button>

    </div>

  </div>


  <div class="main-layout">

    <!-- =====================
         CONVERSACIONES
    ====================== -->

    <aside class="sidebar">

      <div class="sidebar-header">

        <input
          type="text"
          id="searchInput"
          class="search-box"
          placeholder="Buscar conversación..."
        >

        <div class="filters">

          <button
            class="filter-btn active"
            data-filter="activas"
          >
            Activas
          </button>

          <button
            class="filter-btn"
            data-filter="pendientes"
          >
            Pendientes
          </button>

          <button
            class="filter-btn"
            data-filter="finalizadas"
          >
            Finalizadas
          </button>

        </div>

      </div>

      <div id="conversationList">
        <div class="loading">
          Cargando conversaciones...
        </div>
      </div>

    </aside>


    <!-- =====================
         CHAT
    ====================== -->

    <main class="chat">

      <div class="chat-header">

        <div>

          <div
            id="clientName"
            class="client-name"
          >
            Seleccioná una conversación
          </div>

          <div
            id="clientSub"
            class="client-sub"
          >
            —
          </div>

        </div>


        <div class="chat-actions">

          <button
            id="takeBtn"
            class="action-btn btn-primary"
            style="display:none"
          >
            Tomar chat
          </button>

          <button
            id="transferBtn"
            class="action-btn btn-warning"
            style="display:none"
          >
            Transferir
          </button>

          <button
            id="finishBtn"
            class="action-btn btn-danger"
            style="display:none"
          >
            Finalizar
          </button>

        </div>

      </div>


      <div class="timer-bar">

        <span class="timer-label">
          Tiempo esperando respuesta:
        </span>

        <span id="mainTimer">
          00:00:00
        </span>

      </div>


      <div id="messages">

        <div class="empty-chat">
          Seleccioná una conversación para comenzar.
        </div>

      </div>


      <div class="composer">

        <textarea
          id="messageInput"
          placeholder="Escribí un mensaje..."
          disabled
        ></textarea>

        <button
          id="sendBtn"
          disabled
        >
          Enviar
        </button>

      </div>

    </main>


    <!-- =====================
         DETALLES
    ====================== -->

    <aside class="details">

      <div class="details-header">
        Detalles
      </div>

      <div id="detailsContent">

        <div class="no-selection">
          Seleccioná una conversación.
        </div>

      </div>

    </aside>

  </div>

</div>


<!-- =========================
     FIREBASE
========================= -->

<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

  import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

  import {
    getDatabase,
    ref,
    onValue,
    get,
    push,
    set,
    update
  } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";


  /* =====================================================
     FIREBASE CONFIG
     
     ÚNICO CAMBIO:
     Se colocan los datos reales que me pasaste.
  ===================================================== */

  const firebaseConfig = {

    apiKey:
      "AIzaSyC1sOc1O1aBwkzz5DXT3GD_OEcFFrkOua8",

    authDomain:
      "estudiomansilla.firebaseapp.com",

    databaseURL:
      "https://estudiomansilla-default-rtdb.firebaseio.com",

    projectId:
      "estudiomansilla",

    storageBucket:
      "estudiomansilla.firebasestorage.app",

    messagingSenderId:
      "482010073100",

    appId:
      "1:482010073100:web:d5cb61259de293b1420629",

    measurementId:
      "G-8710S26Z8L"

  };


  const app =
    initializeApp(firebaseConfig);

  const auth =
    getAuth(app);

  const db =
    getDatabase(app);


  /* =====================================================
     VARIABLES
  ===================================================== */

  let currentUser = null;

  let currentProfile = null;

  let conversations = {};

  let selectedConversationId = null;

  let currentFilter = "activas";

  let searchText = "";

  let timerInterval = null;


  /* =====================================================
     ELEMENTOS
  ===================================================== */

  const loginScreen =
    document.getElementById("loginScreen");

  const appScreen =
    document.getElementById("app");

  const loginForm =
    document.getElementById("loginForm");

  const loginError =
    document.getElementById("loginError");

  const logoutBtn =
    document.getElementById("logoutBtn");

  const currentUserName =
    document.getElementById("currentUserName");

  const conversationList =
    document.getElementById("conversationList");

  const searchInput =
    document.getElementById("searchInput");

  const messagesContainer =
    document.getElementById("messages");

  const messageInput =
    document.getElementById("messageInput");

  const sendBtn =
    document.getElementById("sendBtn");

  const clientName =
    document.getElementById("clientName");

  const clientSub =
    document.getElementById("clientSub");

  const mainTimer =
    document.getElementById("mainTimer");

  const detailsContent =
    document.getElementById("detailsContent");

  const takeBtn =
    document.getElementById("takeBtn");

  const transferBtn =
    document.getElementById("transferBtn");

  const finishBtn =
    document.getElementById("finishBtn");


  /* =====================================================
     UTILIDADES
  ===================================================== */

  function normalize(value) {

    return String(value || "")
      .trim()
      .toLowerCase();

  }


  function escapeHtml(value) {

    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  function formatTime(seconds) {

    seconds =
      Math.max(
        0,
        Math.floor(seconds)
      );

    const h =
      Math.floor(
        seconds / 3600
      );

    const m =
      Math.floor(
        (seconds % 3600) / 60
      );

    const s =
      seconds % 60;

    return (
      String(h).padStart(2, "0") +
      ":" +
      String(m).padStart(2, "0") +
      ":" +
      String(s).padStart(2, "0")
    );

  }


  function getCurrentTeam() {

    if (!currentProfile) {
      return "";
    }

    return normalize(
      currentProfile.equipo ||
      currentProfile.team ||
      currentProfile.grupo ||
      ""
    );

  }


  function isSenior() {

    if (!currentProfile) {
      return false;
    }

    const role =
      normalize(
        currentProfile.rol ||
        currentProfile.role ||
        currentProfile.perfil ||
        ""
      );

    return (
      role.includes("senior") ||
      role.includes("supervisor") ||
      role.includes("admin")
    );

  }


  function getConversationTeam(
    conversation
  ) {

    return normalize(
      conversation?.equipo ||
      conversation?.team ||
      conversation?.grupo ||
      ""
    );

  }


  function getConversationAssignee(
    conversation
  ) {

    return normalize(
      conversation?.asignadoA ||
      conversation?.assignedTo ||
      conversation?.gestor ||
      conversation?.asesor ||
      ""
    );

  }


  function isUnassigned(
    conversation
  ) {

    return !getConversationAssignee(
      conversation
    );

  }


  function getStatus(
    conversation
  ) {

    return normalize(
      conversation?.estado ||
      conversation?.status ||
      "activa"
    );

  }


  /* =====================================================
     PERMISOS
  ===================================================== */

  function canSeeConversation(
    conversation
  ) {

    if (!conversation) {
      return false;
    }


    if (isSenior()) {

      const currentTeam =
        getCurrentTeam();

      const conversationTeam =
        getConversationTeam(
          conversation
        );

      if (!currentTeam) {
        return true;
      }

      return (
        !conversationTeam ||
        conversationTeam === currentTeam
      );

    }


    // Los gestores NO ven chats sin asignar.

    if (
      isUnassigned(
        conversation
      )
    ) {

      return false;

    }


    const currentTeam =
      getCurrentTeam();

    const conversationTeam =
      getConversationTeam(
        conversation
      );


    // Solo su equipo.

    if (
      currentTeam &&
      conversationTeam &&
      currentTeam !== conversationTeam
    ) {

      return false;

    }


    // Pueden entrar a chats de compañeros
    // del mismo equipo.

    return true;

  }


  /* =====================================================
     LOGIN
  ===================================================== */

  loginForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      loginError.style.display =
        "none";

      const email =
        document
          .getElementById("email")
          .value
          .trim();

      const password =
        document
          .getElementById("password")
          .value;


      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

      } catch (error) {

        console.error(
          "Error de login:",
          error
        );

        loginError.textContent =
          obtenerMensajeError(
            error
          );

        loginError.style.display =
          "block";

      }

    }
  );


  function obtenerMensajeError(
    error
  ) {

    switch (error.code) {

      case "auth/invalid-credential":
        return "Correo o contraseña incorrectos.";

      case "auth/user-not-found":
        return "No existe un usuario con ese correo.";

      case "auth/wrong-password":
        return "La contraseña es incorrecta.";

      case "auth/too-many-requests":
        return "Demasiados intentos. Esperá unos minutos.";

      case "auth/api-key-not-valid":
        return "La configuración de Firebase no es válida.";

      default:
        return "No se pudo iniciar sesión.";

    }

  }


  /* =====================================================
     AUTH
  ===================================================== */

  onAuthStateChanged(
    auth,
    async function(user) {

      if (!user) {

        currentUser = null;

        currentProfile = null;

        loginScreen.style.display =
          "flex";

        appScreen.style.display =
          "none";

        return;

      }


      currentUser =
        user;


      try {

        await loadCurrentProfile();


        loginScreen.style.display =
          "none";

        appScreen.style.display =
          "block";


        currentUserName.textContent =
          currentProfile?.nombre ||
          currentProfile?.name ||
          user.email;


        startConversations();

      } catch (error) {

        console.error(
          error
        );

      }

    }
  );


  /* =====================================================
     PERFIL
  ===================================================== */

  async function loadCurrentProfile() {

    currentProfile =
      null;


    const directRef =
      ref(
        db,
        `usuarios/${currentUser.uid}`
      );


    const directSnapshot =
      await get(
        directRef
      );


    if (
      directSnapshot.exists()
    ) {

      currentProfile =
        directSnapshot.val();

      return;

    }


    const usersRef =
      ref(
        db,
        "usuarios"
      );


    const usersSnapshot =
      await get(
        usersRef
      );


    if (
      usersSnapshot.exists()
    ) {

      const users =
        usersSnapshot.val();


      for (
        const [uid, data]
        of Object.entries(users)
      ) {

        const email =
          normalize(
            data.email ||
            data.correo
          );


        if (
          email ===
          normalize(
            currentUser.email
          )
        ) {

          currentProfile = {
            ...data,
            uid
          };

          return;

        }

      }

    }


    currentProfile = {

      uid:
        currentUser.uid,

      email:
        currentUser.email,

      nombre:
        currentUser.email,

      rol:
        "gestor",

      equipo:
        ""

    };

  }


  /* =====================================================
     CONVERSACIONES
  ===================================================== */

  function startConversations() {

    const conversationsRef =
      ref(
        db,
        "conversaciones"
      );


    onValue(
      conversationsRef,
      function(snapshot) {

        conversations =

  /* =====================================================
     LISTA
  ===================================================== */

  function renderConversationList() {

    let list =
      Object.entries(
        conversations
      );


    list =
      list.filter(
        function([id, conversation]) {

          return canSeeConversation(
            conversation
          );

        }
      );


    list =
      list.filter(
        function([id, conversation]) {

          const status =
            getStatus(
              conversation
            );


          if (
            currentFilter ===
            "finalizadas"
          ) {

            return (
              status === "finalizada" ||
              status === "finalizado" ||
              status === "cerrada" ||
              status === "cerrado"
            );

          }


          if (
            currentFilter ===
            "pendientes"
          ) {

            return (
              status === "pendiente" ||
              status === "pending"
            );

          }


          return !(
            status === "finalizada" ||
            status === "finalizado" ||
            status === "cerrada" ||
            status === "cerrado"
          );

        }
      );


    if (searchText) {

      list =
        list.filter(
          function([id, conversation]) {

            const text =
              normalize(
                [
                  conversation.nombreCliente,
                  conversation.cliente,
                  conversation.telefono,
                  conversation.email,
                  conversation.asunto,
                  conversation.ultimoMensaje
                ].join(" ")
              );


            return text.includes(
              searchText
            );

          }
        );

    }


    list.sort(
      function([idA, a], [idB, b]) {

        const aTime =
          Number(
            a.ultimoMensajeAt ||
            a.updatedAt ||
            a.createdAt ||
            0
          );


        const bTime =
          Number(
            b.ultimoMensajeAt ||
            b.updatedAt ||
            b.createdAt ||
            0
          );


        return bTime - aTime;

      }
    );


    if (!list.length) {

      conversationList.innerHTML =
        `
          <div class="loading">
            No hay conversaciones para mostrar.
          </div>
        `;

      return;

    }


    conversationList.innerHTML =
      list
        .map(
          function([id, conversation]) {

            return renderConversationCard(
              id,
              conversation
            );

          }
        )
        .join("");

  }


  function renderConversationCard(
    id,
    conversation
  ) {

    const name =
      conversation.nombreCliente ||
      conversation.cliente ||
      conversation.nombre ||
      conversation.telefono ||
      "Cliente";


    const preview =
      conversation.ultimoMensaje ||
      "Sin mensajes";


    const status =
      getStatus(
        conversation
      );


    let badgeClass =
      "badge-active";

    let badgeText =
      "Activa";


    if (
      status === "pendiente" ||
      status === "pending"
    ) {

      badgeClass =
        "badge-pending";

      badgeText =
        "Pendiente";

    }


    if (
      status === "finalizada" ||
      status === "finalizado" ||
      status === "cerrada" ||
      status === "cerrado"
    ) {

      badgeClass =
        "badge-finished";

      badgeText =
        "Finalizada";

    }


    const team =
      conversation.equipo ||
      conversation.team ||
      "";


    const selected =
      id === selectedConversationId
        ? "selected"
        : "";


    return `

      <div
        class="conversation-card ${selected}"
        data-id="${escapeHtml(id)}"
      >

        <div class="conversation-top">

          <div class="conversation-name">
            ${escapeHtml(name)}
          </div>

          <div class="conversation-time">
            ${formatConversationTime(
              conversation
            )}
          </div>

        </div>


        <div class="conversation-preview">
          ${escapeHtml(preview)}
        </div>


        <div class="conversation-meta">

          <div>

            <span class="badge ${badgeClass}">
              ${badgeText}
            </span>

            ${
              team
                ? `
                  <span class="badge badge-team">
                    ${escapeHtml(team)}
                  </span>
                `
                : ""
            }

          </div>


          <span
            class="waiting-timer"
            data-timer-id="${escapeHtml(id)}"
          >
            ${formatTime(
              getWaitingSeconds(
                conversation

          </span>

  }

  function formatConversationTime(
    conversation
  ) {

    const timestamp =
      Number(
        conversation.ultimoMensajeAt ||
        conversation.updatedAt ||
        conversation.createdAt ||
        0
      );


    if (!timestamp) {
      return "";
    }


    return new Date(
      timestamp
    ).toLocaleTimeString(
      "es-AR",
      {
        hour: "2-digit",
        minute: "2-digit"
      }
    );

  }

  async function openConversation(

  /* =====================================================
     MENSAJES
  ===================================================== */

  function loadMessages(
    conversationId
  ) {

    messagesContainer.innerHTML =
      `
        <div class="loading">
          Cargando mensajes...
        </div>
      `;


    const messagesRef =
      ref(
        db,
        `historial/${conversationId}`
      );


    onValue(
      messagesRef,
      function(snapshot) {

        const messages =
          snapshot.exists()
            ? snapshot.val()
            : {};


        renderMessages(
          messages
        );


        updateConversationMetadataFromMessages(
          conversationId,
          messages
        );

      },
      function(error) {

        console.error(
          "Error en historial:",
          error
        );

        messagesContainer.innerHTML =
          `
            <div class="empty-chat">
              No se pudieron cargar los mensajes.
            </div>
          `;

      }
    );

  }


  function renderMessages(
    messages
  ) {

    const entries =
      Object.entries(
        messages || {}
      ).sort(
        function([, a], [, b]) {

          return (
            getMessageTimestamp(a) -
            getMessageTimestamp(b)
          );

        }
      );


    if (!entries.length) {

      messagesContainer.innerHTML =
        `
          <div class="empty-chat">
            No hay mensajes todavía.
          </div>
        `;

      return;

    }


    messagesContainer.innerHTML =
      entries
        .map(
          function([id, message]) {

            return renderMessage(
              message
            );

          }
        )
        .join("");


    messagesContainer.scrollTop =
      messagesContainer.scrollHeight;

  }


  function getMessageTimestamp(
    message
  ) {

    return Number(
      message.timestamp ||
      message.createdAt ||
      message.fecha ||
      message.hora ||
      0
    );

  }


  function renderMessage(
    message
  ) {

    const sender =
      normalize(
        message.remitente ||
        message.sender ||
        message.autor ||
        message.tipo ||
        ""
      );


    const isClient =
      sender.includes("cliente") ||
      sender.includes("client") ||
      sender.includes("usuario") ||
      sender === "inbound" ||
      sender === "customer";


    const type =
      isClient
        ? "client"
        : "team";


    const text =
      message.texto ||
      message.mensaje ||
      message.text ||
      message.contenido ||
      "";


    const author =
      message.nombre ||
      message.autorNombre ||
      message.senderName ||
      (
        isClient
          ? "Cliente"
          : "Equipo"
      );


    const timestamp =
      getMessageTimestamp(
        message
      );


    const time =
      timestamp
        ? new Date(
            timestamp
          ).toLocaleTimeString(
            "es-AR",
            {
              hour: "2-digit",
              minute: "2-digit"
            }
          )
        : "";


    return `

      <div class="message ${type}">

        <div class="message-bubble">

          <div class="message-author">
            ${escapeHtml(author)}
          </div>

          <div>
            ${escapeHtml(text)}
          </div>

          <div class="message-time">
            ${time}
          </div>

        </div>

      </div>

    `;

  }


  /* =====================================================
     TIMER
  ===================================================== */

  function getWaitingStart(
    conversation
  ) {

    if (!conversation) {
      return 0;
    }


    const clientAt =
      Number(
        conversation.ultimoMensajeClienteAt ||
        0
      );


    const responseAt =
      Number(
        conversation.ultimaRespuestaAt ||
        0
      );


    if (!clientAt) {
      return 0;
    }


    if (
      responseAt &&
      responseAt >= clientAt
    ) {

      return 0;

    }


    return clientAt;

  }


  function getWaitingSeconds(
    conversation
  ) {

    const start =
      getWaitingStart(
        conversation
      );


    if (!start) {
      return 0;
    }


    return Math.floor(
      (
        Date.now() -
        start
      ) / 1000
    );

  }


  function updateMainTimer() {

    if (!selectedConversationId) {

      mainTimer.textContent =
        "00:00:00";

      return;

    }


    const conversation =
      conversations[
        selectedConversationId
      ];


    if (!conversation) {

      mainTimer.textContent =
        "00:00:00";

      return;

    }


    mainTimer.textContent =
      formatTime(
        getWaitingSeconds(
          conversation
        )
      );


    const detailTimer =
      document.getElementById(
        "detailTimer"
      );


    if (detailTimer) {

      detailTimer.textContent =
        formatTime(
          getWaitingSeconds(
            conversation
          )
        );

    }

  }


  function updateTimers() {

    updateMainTimer();


    document
      .querySelectorAll(
        "[data-timer-id]"
      )
      .forEach(
        function(element) {

          const id =
            element.dataset.timerId;


          const conversation =

  /* =====================================================
     METADATA DEL TIMER
     
     ESTA PARTE MANTIENE EL TIMER ACTUALIZADO:
     cada nuevo mensaje del cliente cambia
     ultimoMensajeClienteAt.
  ===================================================== */

  async function updateConversationMetadataFromMessages(
    conversationId,
    messages
  ) {

    const conversation =
      conversations[
        conversationId
      ];


    if (!conversation) {
      return;
    }


    let latestClient =
      0;

    let latestTeam =
      0;


    Object.values(
      messages || {}
    ).forEach(
      function(message) {

        const timestamp =
          getMessageTimestamp(
            message
          );


        if (!timestamp) {
          return;
        }


        const sender =
          normalize(
            message.remitente ||
            message.sender ||
            message.autor ||
            message.tipo ||
            ""
          );


        const isClient =
          sender.includes("cliente") ||
          sender.includes("client") ||
          sender.includes("usuario") ||
          sender === "inbound" ||
          sender === "customer";


        if (isClient) {

          if (
            timestamp >
            latestClient
          ) {

            latestClient =
              timestamp;

          }

        } else {

          if (
            timestamp >
            latestTeam
          ) {

            latestTeam =
              timestamp;

          }

        }

      }
    );


    const updates = {};


    if (
      latestClient &&
      Number(
        conversation.ultimoMensajeClienteAt ||
        0
      ) !== latestClient
    ) {

      updates.ultimoMensajeClienteAt =
        latestClient;

    }


    if (
      latestTeam &&
      Number(
        conversation.ultimaRespuestaAt ||
        0
      ) !== latestTeam
    ) {

      updates.ultimaRespuestaAt =
        latestTeam;

    }


    if (
      Object.keys(updates).length
    ) {

      try {

        await update(
          ref(
            db,
            `conversaciones/${conversationId}`
          ),
          updates
        );

      } catch (error) {

        console.error(
          "Error actualizando metadata:",
          error
        );

      }

    }

  }

  async function sendMessage() {

    if (!selectedConversationId) {
      return;
    }


    const text =
      messageInput.value.trim();


    if (!text) {
      return;
    }


    const now =
      Date.now();


    try {

      const messageRef =
        push(
          ref(
            db,
            `historial/${selectedConversationId}`
          )
        );


      await set(
        messageRef,
        {

          texto:
            text,

          mensaje:
            text,

          remitente:
            "equipo",

          sender:
            "team",

          autor:
            currentUser.email,

          autorNombre:
            currentProfile?.nombre ||
            currentUser.email,

          timestamp:
            now,

          createdAt:
            now

        }
      );


      await update(
        ref(
          db,
          `conversaciones/${selectedConversationId}`
        ),
        {

          ultimoMensaje:
            text,

          ultimoMensajeAt:
            now,

          ultimaRespuestaAt:
            now,

          ultimoMensajeEquipoAt:
            now,

          actualizadoEn:
            now

        }
      );


      messageInput.value =
        "";


    } catch (error) {

      console.error(
        "Error enviando mensaje:",

      );

      alert(

      );

    }

  }

  /* =====================================================
     TRANSFERIR
  ===================================================== */

  transferBtn.addEventListener(
    "click",
    async function() {

      if (!selectedConversationId) {
        return;
      }


      const team =
        getCurrentTeam();


      if (!team) {

        alert(
          "Tu usuario no tiene un equipo configurado."
        );

        return;

      }


      const usersSnapshot =
        await get(
          ref(
            db,
            "usuarios"
          )
        );


      if (
        !usersSnapshot.exists()
      ) {

        alert(
          "No se encontraron usuarios."
        );

        return;

      }


      const users =
        usersSnapshot.val();


      const available = [];


      Object.values(
        users
      ).forEach(
        function(user) {

          const userTeam =
            normalize(
              user.equipo ||
              user.team ||
              user.grupo ||
              ""
            );


          const role =
            normalize(
              user.rol ||
              user.role ||
              ""
            );


          const email =
            user.email ||
            user.correo ||
            "";


          if (
            userTeam === team &&
            email &&
            !role.includes(
              "senior"
            ) &&
            !role.includes(
              "supervisor"
            )
          ) {

            available.push({
              email,
              nombre:
                user.nombre ||
                email
            });

          }

        }
      );


      if (!available.length) {

        alert(
          "No hay gestores disponibles en tu equipo."
        );

        return;

      }


      const options =
        available
          .map(
            function(user, index) {

              return (
                `${index + 1}. ` +
                `${user.nombre} - ` +
                `${user.email}`
              );

            }
          )
          .join("\n");


      const answer =
        prompt(
          "Elegí el gestor:\n\n" +
          options
        );


      if (!answer) {
        return;
      }


      const index =
        Number(answer) - 1;


      if (
        !Number.isInteger(index) ||
        !available[index]
      ) {

        alert(
          "Selección inválida."
        );

        return;

      }


      const selected =
        available[index];


      try {

        await update(
          ref(
            db,
            `conversaciones/${selectedConversationId}`
          ),
          {

            asignadoA:
              selected.email,

            assignedTo:
              selected.email,

            gestor:
              selected.email,

            asignadoNombre:
              selected.nombre,

            actualizadoEn:
              Date.now()

          }
        );


        alert(
          "Chat transferido correctamente."
        );


      } catch (error) {

        console.error(
          error
        );

        alert(
          "No se pudo transferir el chat."
        );

      }

    }
  );
