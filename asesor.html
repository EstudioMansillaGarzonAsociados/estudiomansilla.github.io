<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centro de Atención - Estudio Mansilla</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #222;
    }

    #login {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f3f4f6;
    }

    .login-box {
      width: 380px;
      max-width: 90%;
      background: white;
      padding: 35px;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,.12);
    }

    .login-box h1 {
      margin-top: 0;
      text-align: center;
    }

    .login-box p {
      text-align: center;
      color: #666;
    }

    input,
    textarea,
    select,
    button {
      font-family: inherit;
    }

    .login-box input {
      width: 100%;
      padding: 13px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-primary {
      width: 100%;
      background: #222;
      color: white;
    }

    #loginError {
      color: #c62828;
      margin-top: 12px;
      text-align: center;
      font-size: 14px;
      word-break: break-word;
    }

    #app {
      display: none;
      height: 100vh;
    }

    .sidebar {
      width: 360px;
      background: white;
      border-right: 1px solid #ddd;
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 18px;
      border-bottom: 1px solid #ddd;
    }

    .sidebar-header h2 {
      margin: 0 0 5px;
    }

    #usuarioActual {
      color: #666;
      font-size: 13px;
    }

    .search {
      padding: 12px;
      border-bottom: 1px solid #ddd;
    }

    .search input {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    #listaConversaciones {
      overflow-y: auto;
      flex: 1;
    }

    .conversation {
      padding: 15px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .conversation:hover {
      background: #f7f7f7;
    }

    .conversation.active {
      background: #eeeeee;
    }

    .conversation-name {
      font-weight: bold;
    }

    .conversation-last {
      color: #666;
      font-size: 13px;
      margin-top: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .conversation-time {
      font-size: 12px;
      margin-top: 5px;
      color: #777;
    }

    .status {
      display: inline-block;
      font-size: 11px;
      padding: 4px 7px;
      border-radius: 10px;
      margin-top: 7px;
    }

    .status-pendiente {
      background: #fff3cd;
      color: #856404;
    }

    .status-atencion {
      background: #dbeafe;
      color: #1e40af;
    }

    .status-finalizada {
      background: #dcfce7;
      color: #166534;
    }

    .waiting {
      color: #c62828;
      font-weight: bold;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .chat-header {
      background: white;
      border-bottom: 1px solid #ddd;
      padding: 18px;
    }

    .chat-header h2 {
      margin: 0;
    }

    .client-data {
      margin-top: 10px;
      font-size: 14px;
      color: #555;
    }

    .actions {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-take {
      background: #2563eb;
      color: white;
    }

    .btn-finish {
      background: #15803d;
      color: white;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .message {
      max-width: 70%;
      margin-bottom: 12px;
      padding: 12px;
      border-radius: 12px;
      word-wrap: break-word;
    }

    .message.client {
      background: white;
      margin-right: auto;
    }

    .message.advisor {
      background: #dbeafe;
      margin-left: auto;
    }

    .message-meta {
      font-size: 11px;
      color: #777;
      margin-top: 5px;
    }

    .reply {
      background: white;
      border-top: 1px solid #ddd;
      padding: 15px;
    }

    .reply textarea {
      width: 100%;
      height: 80px;
      resize: none;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .reply button {
      margin-top: 8px;
      background: #222;
      color: white;
    }

    .empty {
      padding: 30px;
      text-align: center;
      color: #777;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      align-items: center;
      justify-content: center;
      z-index: 20;
    }

    .modal-box {
      background: white;
      width: 400px;
      max-width: 90%;
      padding: 25px;
      border-radius: 12px;
    }

    .modal-box h3 {
      margin-top: 0;
    }

    .modal-box select {
      width: 100%;
      padding: 11px;
      margin: 15px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .btn-cancel {
      background: #ddd;
    }

    @media(max-width: 800px) {
      .sidebar {
        width: 280px;
      }

      .message {
        max-width: 85%;
      }
    }
  </style>
</head>

<body>

<div id="login">

  <div class="login-box">

    <h1>Estudio Mansilla</h1>

    <p>Centro de Atención</p>

    <input
      type="email"
      id="email"
      placeholder="Correo electrónico"
    >

    <input
      type="password"
      id="password"
      placeholder="Contraseña"
    >

    <button
      class="btn btn-primary"
      onclick="iniciarSesion()"
    >
      Ingresar
    </button>

    <div id="loginError"></div>

  </div>

</div>


<div id="app">

  <div class="sidebar">

    <div class="sidebar-header">

      <h2>Chats</h2>

      <div id="usuarioActual"></div>

      <button
        class="btn"
        onclick="cerrarSesion()"
        style="margin-top:10px;"
      >
        Cerrar sesión
      </button>

    </div>

    <div class="search">

      <input
        type="text"
        id="busqueda"
        placeholder="Buscar por DNI, nombre o teléfono..."
        oninput="filtrarConversaciones()"
      >

    </div>

    <div id="listaConversaciones"></div>

  </div>


  <div class="main">

    <div id="chatHeader" class="chat-header">

      <div class="empty">
        Seleccioná una conversación
      </div>

    </div>

    <div id="mensajes" class="messages"></div>

    <div
      id="respuesta"
      class="reply"
      style="display:none;"
    >

      <textarea
        id="textoRespuesta"
        placeholder="Escribí una respuesta..."
      ></textarea>

      <button
        class="btn"
        onclick="enviarMensaje()"
      >
        Enviar
      </button>

    </div>

  </div>

</div>


<div id="modalFinalizar" class="modal">

  <div class="modal-box">

    <h3>Finalizar conversación</h3>

    <p>Seleccioná el motivo de finalización:</p>

    <select id="motivoFinalizacion">

      <option value="Alta de acuerdo">Alta de acuerdo</option>

      <option value="Carga de comprobante">
        Carga de comprobante
      </option>

      <option value="Servicio al cliente">
        Servicio al cliente
      </option>

      <option value="Consulta resuelta">
        Consulta resuelta
      </option>

      <option value="Sin acuerdo">
        Sin acuerdo
      </option>

      <option value="Cliente no responde">
        Cliente no responde
      </option>

      <option value="Derivado">
        Derivado
      </option>

      <option value="Otro">
        Otro
      </option>

    </select>

    <div class="modal-buttons">

      <button
        class="btn btn-cancel"
        onclick="cerrarModal()"
      >
        Cancelar
      </button>

      <button
        class="btn btn-finish"
        onclick="confirmarFinalizacion()"
      >
        Finalizar
      </button>

    </div>

  </div>

</div>


<script type="module">

  push,

  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const firebaseConfig = {

  apiKey: "AIzaSyC1sOc1OaBwkzz5DXT3GD_OEcFFrkOua8",

  authDomain: "estudiomansilla.firebaseapp.com",

  databaseURL: "https://estudiomansilla-default-rtdb.firebaseio.com",

  projectId: "estudiomansilla",

  messagingSenderId: "482010073100",

  appId: "1:482010073100:web:d5cb61259de293b1420629",

  measurementId: "G-8710S26Z8L"

};


const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const auth = getAuth(app);


let conversaciones = {};

let conversacionSeleccionada = null;

let usuarioActual = null;


const perfiles = {

  "mavillegas@mansillayasoc.com.ar": {

  },

  },

  "delfina.sesto@mansillayasoc.com.ar": {

  },

  "julieta.araoz@mansillayasoc.com.ar": {

  },

  },

window.iniciarSesion = async function() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const error =
    document.getElementById("loginError");

  error.textContent = "";

  if (!email || !password) {

    error.textContent =
      "Completá correo y contraseña.";

    return;

  }

  try {

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  } catch (e) {

    console.error("ERROR FIREBASE:", e);

    error.textContent =
      "Error: " + e.code + " — " + e.message;

  }

};


onAuthStateChanged(auth, user => {

  if (!user) {

    document.getElementById("login").style.display =
      "flex";

    document.getElementById("app").style.display =
      "none";

    return;

  }

  const email =
    (user.email || "").toLowerCase();

  usuarioActual =
    perfiles[email] || {

      nombre: email,

      rol: "asesor"

    };

  document.getElementById("login").style.display =
    "none";

  document.getElementById("app").style.display =
    "flex";

  document.getElementById("usuarioActual").textContent =
    usuarioActual.nombre +
    " · " +
    usuarioActual.rol;

  cargarConversaciones();

});


window.cerrarSesion = async function() {

  await signOut(auth);

};


function cargarConversaciones() {

  const conversacionesRef =
    ref(db, "conversaciones");

  onValue(conversacionesRef, snapshot => {

    conversaciones =
      snapshot.val() || {};

    renderizarLista();

    if (conversacionSeleccionada) {

      mostrarConversacion(
        conversacionSeleccionada
      );

    }

  });

}


window.filtrarConversaciones = function() {

  renderizarLista();

};


function renderizarLista() {

  const lista =
    document.getElementById("listaConversaciones");

  const busqueda =
    document
      .getElementById("busqueda")
      .value
      .toLowerCase()
      .trim();

  lista.innerHTML = "";

  const elementos =
    Object.entries(conversaciones);

  elementos.sort((a,b) => {

    return (
      (b[1].fechaCreacion || 0) -
      (a[1].fechaCreacion || 0)
    );

  });

  let encontrados = 0;

  elementos.forEach(([id, conv]) => {

    const datos =
      conv.datosCliente || {};

    const nombre =
      datos.nombre || "Sin nombre";

    const dni =
      datos.dni || "";

    const telefono =
      datos.telefono || "";

    const motivo =
      datos.motivo || "";

    const ultimo =
      obtenerUltimoMensaje(conv);

    const textoUltimo =
      ultimo
        ? ultimo.texto || ""
        : "";

    const buscable =
      (
        nombre + " " +
        dni + " " +
        telefono + " " +
        motivo
      ).toLowerCase();

    if (
      busqueda &&
      !buscable.includes(busqueda)
    ) {

      return;

    }

    encontrados++;

    const div =
      document.createElement("div");

    div.className = "conversation";

    if (
      id === conversacionSeleccionada
    ) {

      div.classList.add("active");

    }

    const estado =
      conv.estado || "pendiente";

    const estadoTexto =
      estado === "finalizada"
        ? "Finalizada"
        : estado === "en_atencion"
        ? "En atención"
        : "Pendiente";

    const tiempo =
      ultimo
        ? calcularTiempoUltimoMensaje(
            ultimo
          )
        : "";

    const esperando =
      ultimo &&
      ultimo.remitente === "cliente" &&
      estado !== "finalizada";

    div.innerHTML = `

      <div class="conversation-name">
        ${escaparHTML(nombre)}
      </div>

      <div>
        DNI: ${escaparHTML(dni)}
      </div>

      <div class="conversation-last">
        ${escaparHTML(textoUltimo)}
      </div>

      <div class="conversation-time">
        ${tiempo}
      </div>

      <span class="status status-${estado.replace(
        "en_atencion",
        "atencion"
      )}">
        ${estadoTexto}
      </span>

      ${
        esperando
          ? `<div class="waiting">
              ⚠ Esperando respuesta
             </div>`
          : ""
      }

    `;

    div.onclick = () => {

      mostrarConversacion(id);

    };

    lista.appendChild(div);

  });

  if (!encontrados) {

    lista.innerHTML =
      `<div class="empty">
        No se encontraron conversaciones.
       </div>`;

  }

}


function mostrarConversacion(id) {

  conversacionSeleccionada = id;

  const conv =
    conversaciones[id];

  if (!conv) return;

  const datos =
    conv.datosCliente || {};

  const header =
    document.getElementById("chatHeader");

  const estado =
    conv.estado || "pendiente";

  header.innerHTML = `

    <h2>
      ${escaparHTML(
        datos.nombre || "Cliente"
      )}
    </h2>

    <div class="client-data">

      <strong>DNI:</strong>
      ${escaparHTML(datos.dni || "-")}

      &nbsp; | &nbsp;

      <strong>Teléfono:</strong>
      ${escaparHTML(datos.telefono || "-")}

      <br>

      <strong>Motivo:</strong>
      ${escaparHTML(datos.motivo || "-")}

      <br>

      <strong>Estado:</strong>
      ${escaparHTML(estado)}

      ${
        conv.asesorAsignado
          ? `<br><strong>Asesor:</strong>
             ${escaparHTML(conv.asesorAsignado)}`
          : ""
      }

      ${
        conv.motivoFinalizacion
          ? `<br><strong>Motivo de finalización:</strong>
             ${escaparHTML(conv.motivoFinalizacion)}`
          : ""
      }

    </div>

    <div class="actions">

      ${
        estado !== "finalizada"
          ? `
            <button
              class="btn btn-take"
              onclick="tomarConversacion()"
            >
              Tomar conversación
            </button>

            <button
              class="btn btn-finish"
              onclick="abrirModalFinalizar()"
            >
              Finalizar conversación
            </button>
          `
          : `
            <span>
              Esta conversación está finalizada.
            </span>
          `
      }

    </div>

  `;

  mostrarMensajes(conv);

  document.getElementById("respuesta").style.display =
    estado === "finalizada"
      ? "none"
      : "block";

  renderizarLista();

}


function mostrarMensajes(conv) {

  const contenedor =
    document.getElementById("mensajes");

  contenedor.innerHTML = "";

  const mensajes =
    conv.mensajes || {};

  Object.entries(mensajes).forEach(
    ([id, mensaje]) => {

      const div =
        document.createElement("div");

      div.className =
        "message " +
        (
          mensaje.remitente === "cliente"
            ? "client"
            : "advisor"
        );

      const fecha =
        mensaje.fecha
          ? new Date(
              mensaje.fecha
            ).toLocaleString("es-AR")
          : "";

      div.innerHTML = `

        <div>
          ${escaparHTML(
            mensaje.texto || ""
          )}
        </div>

        <div class="message-meta">

          ${
            mensaje.remitente === "cliente"
              ? "Cliente"
              : escaparHTML(
                  mensaje.asesorNombre ||
                  "Asesor"
                )
          }

          ${fecha ? " · " + fecha : ""}

        </div>

      `;

      contenedor.appendChild(div);

    }
  );

  contenedor.scrollTop =
    contenedor.scrollHeight;

}


window.enviarMensaje = async function() {

  if (!conversacionSeleccionada) return;

  const texto =
    document
      .getElementById("textoRespuesta")
      .value
      .trim();

  if (!texto) return;

  const mensajesRef =
    ref(
      db,
      "conversaciones/" +
      conversacionSeleccionada +
      "/mensajes"
    );

  const nuevoMensaje =
    push(mensajesRef);

  await set(
    nuevoMensaje,
    {

      texto: texto,

      remitente: "asesor",

      asesorNombre:
        usuarioActual.nombre,

      asesorEmail:
        auth.currentUser.email,

      fecha: Date.now()

    }
  );

  await update(
    ref(
      db,
      "conversaciones/" +
      conversacionSeleccionada
    ),
    {

      estado: "en_atencion",

      asesorAsignado:
        usuarioActual.nombre,

      asesorEmail:
        auth.currentUser.email

    }
  );

  document
    .getElementById("textoRespuesta")
    .value = "";

};


window.tomarConversacion = async function() {

  if (!conversacionSeleccionada) return;

  await update(
    ref(
      db,
      "conversaciones/" +
      conversacionSeleccionada
    ),
    {

      estado: "en_atencion",

      asesorAsignado:
        usuarioActual.nombre,

      asesorEmail:
        auth.currentUser.email

    }
  );

};


window.abrirModalFinalizar = function() {

  document
    .getElementById("modalFinalizar")
    .style.display = "flex";

};


window.cerrarModal = function() {

  document
    .getElementById("modalFinalizar")
    .style.display = "none";

};


window.confirmarFinalizacion = async function() {

  if (!conversacionSeleccionada) return;

  const motivo =
    document
      .getElementById("motivoFinalizacion")
      .value;

  await update(
    ref(
      db,
      "conversaciones/" +
      conversacionSeleccionada
    ),
    {

      estado: "finalizada",

      motivoFinalizacion:
        motivo,

      fechaFinalizacion:
        Date.now(),

      finalizadoPor:
        usuarioActual.nombre,

      finalizadoPorEmail:
        auth.currentUser.email

    }
  );

  cerrarModal();

};


function obtenerUltimoMensaje(conv) {

  const mensajes =
    conv.mensajes || {};

  const lista =
    Object.values(mensajes);

  if (!lista.length) return null;

  return lista.sort(
    (a,b) =>
      (b.fecha || 0) -
      (a.fecha || 0)
  )[0];

}


function calcularTiempoUltimoMensaje(mensaje) {

  if (!mensaje.fecha) return "";

  const diferencia =
    Date.now() - mensaje.fecha;

  const minutos =
    Math.floor(
      diferencia / 60000
    );

  if (minutos < 1) {

    return "Hace menos de 1 min";

  }

  if (minutos < 60) {

    return "Hace " +
      minutos +
      " min";

  }

  const horas =
    Math.floor(minutos / 60);

  if (horas < 24) {

    return "Hace " +
      horas +
      " h " +
      (minutos % 60) +
      " min";

  }

  const dias =
    Math.floor(horas / 24);

  return "Hace " +
    dias +
    " día(s)";

}


function escaparHTML(texto) {

  return String(texto)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}
