<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Panel de Asesores - Estudio Mansilla</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      height: 100vh;
    }

    .panel {
      display: flex;
      height: 100vh;
    }

    .lista {
      width: 320px;
      background: white;
      border-right: 1px solid #ddd;
    }

    .titulo {
      background: #222;
      color: white;
      padding: 20px;
      font-size: 20px;
      font-weight: bold;
    }

    .conversacion {
      padding: 18px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .conversacion:hover {
      background: #f5f5f5;
    }

    .conversacion.activa {
      background: #eee;
    }

    .cliente {
      font-weight: bold;
    }

    .ultimo {
      color: #777;
      font-size: 13px;
      margin-top: 5px;
    }

    .chat {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      background: white;
      padding: 18px;
      border-bottom: 1px solid #ddd;
      font-weight: bold;
    }

    .mensajes {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background: #f7f7f7;
    }

    .mensaje {
      max-width: 70%;
      padding: 10px 14px;
      margin-bottom: 10px;
      border-radius: 12px;
      line-height: 1.4;
    }

    .cliente-mensaje {
      background: white;
      border: 1px solid #ddd;
      margin-right: auto;
    }

    .asesor-mensaje {
      background: #222;
      color: white;
      margin-left: auto;
    }

    .entrada {
      display: flex;
      gap: 10px;
      padding: 12px;
      background: white;
      border-top: 1px solid #ddd;
    }

    .entrada input {
      flex: 1;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 14px;
    }

    .entrada button {
      width: 55px;
      border: none;
      border-radius: 10px;
      background: #222;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    .sin-chat {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #777;
      font-size: 18px;
    }

    @media (max-width: 700px) {
      .lista {
        width: 220px;
      }
    }
  </style>
</head>

<body>

<div class="panel">

  <div class="lista">

    <div class="titulo">
      💬 Asesores
    </div>

    <div
      class="conversacion activa"
      onclick="seleccionarConversacion()"
    >
      <div class="cliente">
        Cliente de prueba
      </div>

      <div class="ultimo">
        Conversación activa
      </div>
    </div>

  </div>


  <div class="chat">

    <div class="chat-header">
      Cliente de prueba
    </div>


    <div
      class="mensajes"
      id="mensajes"
    >
    </div>


    <div class="entrada">

      <input
        type="text"
        id="mensajeInput"
        placeholder="Escribí una respuesta..."
        onkeydown="presionarEnter(event)"
      >

      <button onclick="enviarMensaje()">
        ➤
      </button>

    </div>

  </div>

</div>


<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

  import {
    getDatabase,
    ref,
    push,
    onChildAdded
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


  const firebaseConfig = {

    apiKey: "AIzaSyC1sOc1O1aBwkzz5DXT3GD_OEcFFrkOua8",

    authDomain: "estudiomansilla.firebaseapp.com",

    databaseURL: "https://estudiomansilla-default-rtdb.firebaseio.com",

    projectId: "estudiomansilla",

    storageBucket: "estudiomansilla.firebasestorage.app",

    messagingSenderId: "482010073100",

    appId: "1:482010073100:web:d5cb61259de293b1420629",

    measurementId: "G-8710S26Z8L"

  };


  const app = initializeApp(firebaseConfig);

  const db = getDatabase(app);


  const conversacionId = "conversacion_prueba";


  const mensajesRef = ref(
    db,
    "conversaciones/" +
    conversacionId +
    "/mensajes"
  );


  onChildAdded(
    mensajesRef,
    (snapshot) => {

      const mensaje = snapshot.val();

      mostrarMensaje(
        mensaje.texto,
        mensaje.remitente
      );

    }
  );


  window.enviarMensaje = function() {

    const input =
      document.getElementById(
        "mensajeInput"
      );

    const texto =
      input.value.trim();


    if (texto === "") {
      return;
    }


    push(
      mensajesRef,
      {

        texto: texto,

        remitente: "asesor",

        fecha: Date.now()

      }
    );


    input.value = "";

    input.focus();

  };


  window.presionarEnter = function(event) {

    if (event.key === "Enter") {

      enviarMensaje();

    }

  };


  function mostrarMensaje(
    texto,
    remitente
  ) {

    const contenedor =
      document.getElementById(
        "mensajes"
      );


    const div =
      document.createElement(
        "div"
      );


    div.classList.add(
      "mensaje"
    );


    if (
      remitente === "asesor"
    ) {

      div.classList.add(
        "asesor-mensaje"
      );

    } else {

      div.classList.add(
        "cliente-mensaje"
      );

    }


    div.textContent =
      texto;


    contenedor.appendChild(
      div
    );


    contenedor.scrollTop =
      contenedor.scrollHeight;

  }


  window.seleccionarConversacion =
    function() {

      console.log(
        "Conversación seleccionada"
      );

    };

</script>

</body>
</html>
