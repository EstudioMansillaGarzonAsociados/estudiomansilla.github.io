<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Centro de Atención - Asesor</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #202124;
    }

    button,
    input,
    select,
    textarea {
      font-family: inherit;
    }

    /* =========================
       LOGIN
    ========================= */

    #loginScreen {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #111827, #273449);
    }

    .login-box {
      width: 390px;
      max-width: calc(100% - 30px);
      background: white;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }

    .login-box h1 {
      margin: 0 0 8px;
      font-size: 25px;
    }

    .login-box p {
      margin: 0 0 25px;
      color: #6b7280;
    }

    .login-box label {
      display: block;
      margin: 15px 0 7px;
      font-size: 14px;
      font-weight: bold;
    }

    .login-box input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      outline: none;
    }

    .login-box input:focus {
      border-color: #2563eb;
    }

    .login-btn {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-btn:hover {
      background: #1d4ed8;
    }

    #loginError {
      margin-top: 15px;
      padding: 10px;
      border-radius: 7px;
      background: #fee2e2;
      color: #b91c1c;
      font-size: 14px;
      display: none;
    }

    /* =========================
       APP
    ========================= */

    #app {
      display: none;
      height: 100vh;
      overflow: hidden;
    }

    .topbar {
      height: 60px;
      background: #111827;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }

    .topbar-title {
      font-size: 19px;
      font-weight: bold;
    }

    .topbar-user {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logout-btn {
      border: 1px solid rgba(255,255,255,.25);
      background: transparent;
      color: white;
      padding: 8px 13px;
      border-radius: 7px;
      cursor: pointer;
    }

    .logout-btn:hover {
      background: rgba(255,255,255,.1);
    }

    /* =========================
       LAYOUT
    ========================= */

    .main-layout {
      height: calc(100vh - 60px);
      display: grid;
      grid-template-columns: 330px minmax(400px, 1fr) 290px;
    }

    /* =========================
       SIDEBAR
    ========================= */

    .sidebar {
      background: white;
      border-right: 1px solid #ddd;
      overflow-y: auto;
    }

    .sidebar-header {
      padding: 15px;
      border-bottom: 1px solid #eee;
    }

    .search-box {
      width: 100%;
      padding: 11px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      outline: none;
    }

    .filters {
      display: flex;
      gap: 6px;
      margin-top: 12px;
    }

    .filter-btn {
      flex: 1;
      border: 1px solid #ddd;
      background: #fff;
      padding: 8px 4px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 12px;
    }

    .filter-btn.active {
      background: #2563eb;
      color: white;
      border-color: #2563eb;
    }

    #conversationList {
      padding: 5px;
    }

    .conversation-card {
      position: relative;
      padding: 13px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
      transition: background .15s;
    }

    .conversation-card:hover {
      background: #f5f7fa;
    }

    .conversation-card.selected {
      background: #e8f0fe;
    }

    .conversation-top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .conversation-name {
      font-weight: bold;
      font-size: 14px;
    }

    .conversation-time {
      font-size: 11px;
      color: #6b7280;
      white-space: nowrap;
    }

    .conversation-preview {
      margin-top: 5px;
      color: #6b7280;
      font-size: 12px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .conversation-meta {
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 5px;
    }

    .badge {
      display: inline-block;
      padding: 3px 7px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: bold;
    }

    .badge-active {
      background: #dcfce7;
      color: #166534;
    }

    .badge-pending {
      background: #fef3c7;
      color: #92400e;
    }

    .badge-finished {
      background: #e5e7eb;
      color: #374151;
    }

    .badge-team {
      background: #e0e7ff;
      color: #3730a3;
    }

    .waiting-timer {
      color: #dc2626;
      font-size: 11px;
      font-weight: bold;
      font-variant-numeric: tabular-nums;
    }

    /* =========================
       CHAT
    ========================= */

    .chat {
      display: flex;
      flex-direction: column;
      background: #eef1f5;
      min-width: 0;
    }

    .chat-header {
      min-height: 70px;
      padding: 12px 18px;
      background: white;
      border-bottom: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .client-info {
      min-width: 0;
    }

    .client-name {
      font-size: 18px;
      font-weight: bold;
    }

    .client-sub {
      margin-top: 4px;
      font-size: 12px;
      color: #6b7280;
    }

    .chat-actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .action-btn {
      border: none;
      padding: 8px 11px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
    }

    .btn-warning {
      background: #f59e0b;
      color: white;
    }

    .btn-danger {
      background: #dc2626;
      color: white;
    }

    .btn-gray {
      background: #e5e7eb;
      color: #111827;
    }

    .timer-bar {
      background: #fff;
      border-bottom: 1px solid #ddd;
      padding: 8px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .timer-label {
      font-size: 12px;
      color: #6b7280;
    }

    #mainTimer {
      font-weight: bold;
      color: #dc2626;
      font-variant-numeric: tabular-nums;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .empty-chat {
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #9ca3af;
      text-align: center;
    }

    .message {
      display: flex;
      margin-bottom: 10px;
    }

    .message.client {
      justify-content: flex-start;
    }

    .message.team {
      justify-content: flex-end;
    }

    .message-bubble {
      max-width: 70%;
      padding: 10px 13px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.4;
      box-shadow: 0 1px 2px rgba(0,0,0,.08);
    }

    .message.client .message-bubble {
      background: white;
      border-bottom-left-radius: 3px;
    }

    .message.team .message-bubble {
      background: #dbeafe;
      border-bottom-right-radius: 3px;
    }

    .message-author {
      font-size: 10px;
      font-weight: bold;
      color: #6b7280;
      margin-bottom: 4px;
    }

    .message-time {
      font-size: 9px;
      color: #9ca3af;
      margin-top: 4px;
      text-align: right;
    }

    .composer {
      padding: 12px;
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      gap: 8px;
    }

    #messageInput {
      flex: 1;
      min-height: 42px;
      max-height: 130px;
      resize: vertical;
      padding: 11px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      outline: none;
    }

    #sendBtn {
      width: 90px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #sendBtn:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    /* =========================
       DETAILS
    ========================= */

    .details {
      background: white;
      border-left: 1px solid #ddd;
      overflow-y: auto;
    }

    .details-header {
      padding: 18px;
      font-size: 17px;
      font-weight: bold;
      border-bottom: 1px solid #eee;
    }

    .detail-section {
      padding: 16px;
      border-bottom: 1px solid #eee;
    }

    .detail-title {
      font-size: 11px;
      color: #6b7280;
      text-transform: uppercase;
      margin-bottom: 7px;
      font-weight: bold;
    }

    .detail-value {
      font-size: 14px;
      word-break: break-word;
    }

    .detail-timer {
      font-size: 23px;
      font-weight: bold;
      color: #dc2626;
      font-variant-numeric: tabular-nums;
    }

    .assignment-select {
      width: 100%;
      padding: 9px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      margin-top: 8px;
    }

    .no-selection {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      text-align: center;
      color: #9ca3af;
    }

    .loading {
      padding: 30px;
      text-align: center;
      color: #6b7280;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 1050px) {
      .main-layout {
        grid-template-columns: 290px minmax(350px, 1fr);
      }

      .details {
        display: none;
      }
    }

    @media (max-width: 700px) {
      #app {
        height: auto;
        min-height: 100vh;
        overflow: visible;
      }

      .main-layout {
        height: auto;
        min-height: calc(100vh - 60px);
        grid-template-columns: 1fr;
      }

      .sidebar {
        height: 350px;
      }

      .chat {
        height: calc(100vh - 410px);
        min-height: 500px;
      }
    }
  </style>
</head>

<body>

<!-- =====================================================
     LOGIN
===================================================== -->

<div id="loginScreen">

  <div class="login-box">

    <h1>Centro de Atención</h1>

    <p>Ingreso para asesores</p>

    <form id="loginForm">

      <label for="email">Correo electrónico</label>

      <input
        type="email"
        id="email"
        placeholder="correo@mansillayasoc.com.ar"
        autocomplete="username"
        required
      >

      <label for="password">Contraseña</label>

      <input
        type="password"
        id="password"
        placeholder="Contraseña"
        autocomplete="current-password"
        required
      >

      <button class="login-btn" type="submit">
        Iniciar sesión
      </button>

    </form>

    <div id="loginError"></div>

  </div>

</div>


<!-- =====================================================
     APP
===================================================== -->

<div id="app">

  <!-- TOPBAR -->

  <div class="topbar">

    <div class="topbar-title">
      Centro de Atención
    </div>

    <div class="topbar-user">

      <span id="currentUserName">
        Cargando...
      </span>

      <button id="logoutBtn" class="logout-btn">
        Cerrar sesión
      </button>

    </div>

  </div>


  <!-- MAIN -->

  <div class="main-layout">

    <!-- =================================================
         SIDEBAR
    ================================================== -->

    <aside class="sidebar">

      <div class="sidebar-header">

        <input
          type="text"
          id="searchInput"
          class="search-box"
          placeholder="Buscar conversación..."
        >

        <div class="filters">

          <button
            class="filter-btn active"
            data-filter="activas"
          >
            Activas
          </button>

          <button
            class="filter-btn"
            data-filter="pendientes"
          >
            Pendientes
          </button>

          <button
            class="filter-btn"
            data-filter="finalizadas"
          >
            Finalizadas
          </button>

        </div>

      </div>

      <div id="conversationList">
        <div class="loading">
          Cargando conversaciones...
        </div>
      </div>

    </aside>


    <!-- =================================================
         CHAT
    ================================================== -->

    <main class="chat">

      <div id="chatHeader" class="chat-header">

        <div class="client-info">

          <div id="clientName" class="client-name">
            Seleccioná una conversación
          </div>

          <div id="clientSub" class="client-sub">
            —
          </div>

        </div>

        <div class="chat-actions">

          <button
            id="takeBtn"
            class="action-btn btn-primary"
            style="display:none;"
          >
            Tomar chat
          </button>

          <button
            id="transferBtn"
            class="action-btn btn-warning"
            style="display:none;"
          >
            Transferir
          </button>

          <button
            id="finishBtn"
            class="action-btn btn-danger"
            style="display:none;"
          >
            Finalizar
          </button>

        </div>

      </div>


      <div class="timer-bar">

        <span class="timer-label">
          Tiempo esperando respuesta:
        </span>

        <span id="mainTimer">
          00:00:00
        </span>

      </div>


      <div id="messages">

        <div class="empty-chat">
          Seleccioná una conversación para comenzar.
        </div>

      </div>


      <div class="composer">

        <textarea
          id="messageInput"
          placeholder="Escribí un mensaje..."
          disabled
        ></textarea>

        <button
          id="sendBtn"
          disabled
        >
          Enviar
        </button>

      </div>

    </main>


    <!-- =================================================
         DETAILS
    ================================================== -->

    <aside class="details">

      <div class="details-header">
        Detalles
      </div>

      <div id="detailsContent">

        <div class="no-selection">
          Seleccioná una conversación.
        </div>

      </div>

    </aside>

  </div>

</div>


<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

  import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

  import {
    getDatabase,
    ref,
    onValue,
    get,
    push,
    set,
    update
  } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";


  /* =====================================================
     FIREBASE CONFIG
  ===================================================== */

  const firebaseConfig = {

    apiKey: "AIzaSyC1sOc1O1aBwkzz5DXT3GD_OEcFFrkOua8",

    authDomain: "estudiomansilla.firebaseapp.com",

    databaseURL:
      "https://estudiomansilla-default-rtdb.firebaseio.com",

    projectId:
      "estudiomansilla",

    storageBucket:
      "estudiomansilla.firebasestorage.app",

    messagingSenderId:
      "482010073100",

    appId:
      "1:482010073100:web:d5cb61259de293b1420629",

    measurementId:
      "G-8710S26Z8L"

  };


  /* =====================================================
     INIT
  ===================================================== */

  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getDatabase(app);


  /* =====================================================
     VARIABLES
  ===================================================== */

  let currentUser = null;

  let currentProfile = null;

  let conversations = {};

  let messagesByConversation = {};

  let selectedConversationId = null;

  let currentFilter = "activas";

  let searchText = "";

  let timerInterval = null;


  /* =====================================================
     ELEMENTOS
  ===================================================== */

  const loginScreen =
    document.getElementById("loginScreen");

  const appScreen =
    document.getElementById("app");

  const loginForm =
    document.getElementById("loginForm");

  const loginError =
    document.getElementById("loginError");

  const emailInput =
    document.getElementById("email");

  const passwordInput =
    document.getElementById("password");

  const logoutBtn =
    document.getElementById("logoutBtn");

  const currentUserName =
    document.getElementById("currentUserName");

  const conversationList =
    document.getElementById("conversationList");

  const searchInput =
    document.getElementById("searchInput");

  const messagesContainer =
    document.getElementById("messages");

  const messageInput =
    document.getElementById("messageInput");

  const sendBtn =
    document.getElementById("sendBtn");

  const clientName =
    document.getElementById("clientName");

  const clientSub =
    document.getElementById("clientSub");

  const mainTimer =
    document.getElementById("mainTimer");

  const detailsContent =
    document.getElementById("detailsContent");

  const takeBtn =
    document.getElementById("takeBtn");

  const transferBtn =
    document.getElementById("transferBtn");

  const finishBtn =
    document.getElementById("finishBtn");


  /* =====================================================
     UTILS
  ===================================================== */

  function normalize(value) {

    return String(value || "")
      .trim()
      .toLowerCase();

  }


  function escapeHtml(value) {

    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  function formatTime(seconds) {

    seconds = Math.max(0, Math.floor(seconds));

    const h =
      Math.floor(seconds / 3600);

    const m =
      Math.floor((seconds % 3600) / 60);

    const s =
      seconds % 60;

    return [
      String(h).padStart(2, "0"),
      String(m).padStart(2, "0"),
      String(s).padStart(2, "0")
    ].join(":");

  }


  function timestampFromMessage(message) {

    if (!message) return 0;

    return Number(
      message.timestamp ||
      message.createdAt ||
      message.fecha ||
      message.hora ||
      0
    );

  }


  function isSenior() {

    if (!currentProfile) {
      return false;
    }

    const role = normalize(
      currentProfile.rol ||
      currentProfile.role ||
      currentProfile.perfil ||
      ""
    );

    return (
      role.includes("senior") ||
      role.includes("supervisor") ||
      role.includes("supervisor/a") ||
      role.includes("admin")
    );

  }


  function getCurrentTeam() {

    if (!currentProfile) {
      return "";
    }

    return normalize(
      currentProfile.equipo ||
      currentProfile.team ||
      currentProfile.grupo ||
      ""
    );

  }


  function getConversationTeam(conversation) {

    return normalize(
      conversation?.equipo ||
      conversation?.team ||
      conversation?.grupo ||
      ""
    );

  }


  function getConversationAssignee(conversation) {

    return normalize(
      conversation?.asignadoA ||
      conversation?.assignedTo ||
      conversation?.gestor ||
      conversation?.asesor ||
      ""
    );

  }


  function getConversationStatus(conversation) {

    return normalize(
      conversation?.estado ||
      conversation?.status ||
      "activa"
    );

  }


  function isUnassigned(conversation) {

    return !getConversationAssignee(conversation);

  }


  /* =====================================================
     PERMISOS
  ===================================================== */

  function canSeeConversation(conversation) {

    if (!conversation) {
      return false;
    }

    if (isSenior()) {

      const currentTeam =
        getCurrentTeam();

      const conversationTeam =
        getConversationTeam(conversation);

      if (!currentTeam) {
        return true;
      }

      return (
        !conversationTeam ||
        conversationTeam === currentTeam
      );

    }


    // LOS GESTORES NO PUEDEN VER SIN ASIGNAR

    if (isUnassigned(conversation)) {
      return false;
    }


    const currentTeam =
      getCurrentTeam();

    const conversationTeam =
      getConversationTeam(conversation);


    // No pueden ver otro equipo

    if (
      currentTeam &&
      conversationTeam &&
      currentTeam !== conversationTeam
    ) {
      return false;
    }


    // Pueden gestionar conversaciones
    // de compañeros del mismo equipo

    return true;

  }


  /* =====================================================
     LOGIN
  ===================================================== */

  loginForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      loginError.style.display = "none";

      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;

      if (!email || !password) {
        showLoginError(
          "Ingresá tu correo y contraseña."
        );
        return;
      }

      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

      } catch (error) {

        console.error(error);

        let message =
          "No se pudo iniciar sesión.";

        if (
          error.code ===
          "auth/invalid-credential"
        ) {

          message =
            "El correo o la contraseña son incorrectos.";

        } else if (
          error.code ===
          "auth/user-not-found"
        ) {

          message =
            "No existe un usuario con ese correo.";

        } else if (
          error.code ===
          "auth/wrong-password"
        ) {

          message =
            "La contraseña es incorrecta.";

        } else if (
          error.code ===
          "auth/too-many-requests"
        ) {

          message =
            "Demasiados intentos. Esperá unos minutos.";

        } else if (
          error.code ===
          "auth/api-key-not-valid"
        ) {

          message =
            "La configuración de Firebase no es válida.";

        }

        showLoginError(message);

      }

    }
  );


  function showLoginError(message) {

    loginError.textContent =
      message;

    loginError.style.display =
      "block";

  }


  /* =====================================================
     LOGOUT
  ===================================================== */

  logoutBtn.addEventListener(
    "click",
    async function() {

      await signOut(auth);

    }
  );


  /* =====================================================
     AUTH STATE
  ===================================================== */

  onAuthStateChanged(
    auth,
    async function(user) {

      if (!user) {

        currentUser = null;

        currentProfile = null;

        loginScreen.style.display =
          "flex";

        appScreen.style.display =
          "none";

        stopTimer();

        return;

      }


      currentUser = user;


      try {

        await loadCurrentProfile();

        loginScreen.style.display =
          "none";

        appScreen.style.display =
          "block";

  ===================================================== */

  async function loadCurrentProfile() {

    currentProfile = null;


    // Primero intentamos por UID

    const directRef =
      ref(
        db,
        `usuarios/${currentUser.uid}`
      );

    const directSnap =
      await get(directRef);


    if (directSnap.exists()) {

      currentProfile =
        directSnap.val();

      return;

    }


    // Si no existe por UID,
    // buscamos por correo

    const usersRef =
      ref(db, "usuarios");

    const usersSnap =
      await get(usersRef);

    if (usersSnap.exists()) {

      const users =
        usersSnap.val();

      for (
        const [uid, userData]
        of Object.entries(users)
      ) {

        const userEmail =
          normalize(
            userData.email ||
            userData.correo
          );

        if (
          userEmail ===
          normalize(currentUser.email)
        ) {

          currentProfile =
            {
              ...userData,
              uid: uid
            };

          return;

        }

      }

    }


    // Si no hay perfil,
    // creamos uno básico

    currentProfile = {

      uid: currentUser.uid,

      email: currentUser.email,

      nombre:
        currentUser.email,

      rol: "gestor",

      equipo: ""

    };

  }

  /* =====================================================
     FILTRAR CONVERSACIONES
  ===================================================== */

  function getFilteredConversations() {

    return Object.entries(conversations)

      .filter(
        ([id, conversation]) =>
          canSeeConversation(conversation)
      )

      .filter(
        ([id, conversation]) => {

          const status =
            getConversationStatus(
              conversation
            );


          if (
            currentFilter ===
            "finalizadas"
          ) {

            return (
              status === "finalizada" ||
              status === "finalizado" ||
              status === "cerrada" ||
              status === "cerrado"
            );

          }


          if (
            currentFilter ===
            "pendientes"
          ) {

            return (
              status === "pendiente" ||
              status === "pending"
            );

          }


          return !(
            status === "finalizada" ||
            status === "finalizado" ||
            status === "cerrada" ||
            status === "cerrado"
          );

        }
      )

      .filter(
        ([id, conversation]) => {

          if (!searchText) {
            return true;
          }

          const text = normalize(
            [
              conversation.nombreCliente,
              conversation.cliente,
              conversation.telefono,
              conversation.email,
              conversation.asunto,
              conversation.ultimoMensaje
            ].join(" ")
          );

          return text.includes(searchText);

        }
      )

      .sort(
        ([idA, a], [idB, b]) => {

          const aTime =
            Number(
              a.ultimoMensajeAt ||
              a.updatedAt ||
              a.createdAt ||
              0
            );

          const bTime =
            Number(
              b.ultimoMensajeAt ||
              b.updatedAt ||
              b.createdAt ||
              0
            );

          return bTime - aTime;

        }
      );

  }

    const status =
      getConversationStatus(
        conversation
      );

    let badgeText =

      status === "pendiente" ||
      status === "pending"
    ) {

      badgeText =
        "Pendiente";

    }


    if (
      status === "finalizada" ||
      status === "finalizado" ||
      status === "cerrada" ||
      status === "cerrado"
    ) {

        "badge-finished";

      badgeText =

        </div>

  function formatConversationTime(
    conversation
  ) {

    const timestamp =
      Number(
        conversation.ultimoMensajeAt ||
        conversation.updatedAt ||
        conversation.createdAt ||
        0
      );

    if (!timestamp) {
      return "";
    }

    const date =
      new Date(timestamp);

    return date.toLocaleTimeString(
      "es-AR",
      {
        hour: "2-digit",
        minute: "2-digit"
      }
    );

  }

  async function loadMessages(

    messagesContainer.innerHTML = `

    const messagesRef =
      ref(

  function renderMessages(
    conversationId,
    messages
  ) {

    const entries =
      Object.entries(messages || {})
        .sort(
          ([aKey, a], [bKey, b]) =>
            timestampFromMessage(a) -
            timestampFromMessage(b)
        );


    if (!entries.length) {

      messagesContainer.innerHTML = `
        <div class="empty-chat">
          No hay mensajes todavía.
        </div>
      `;

      return;

    }


    messagesContainer.innerHTML =
      entries
        .map(
          ([messageId, message]) =>
            renderMessage(message)
        )
        .join("");


    messagesContainer.scrollTop =
      messagesContainer.scrollHeight;

  }


  function renderMessage(message) {

    const sender =
      normalize(
        message.remitente ||
        message.sender ||
        message.autor ||
        message.tipo ||
        ""
      );


    const isClient =
      sender.includes("cliente") ||
      sender.includes("client") ||
      sender.includes("usuario") ||
      sender === "inbound" ||
      sender === "customer";


    const className =
      isClient
        ? "client"
        : "team";


    const text =
      message.texto ||
      message.mensaje ||
      message.text ||
      message.contenido ||
      "";


    const author =
      message.nombre ||
      message.autorNombre ||
      message.senderName ||
      (isClient
        ? "Cliente"
        : "Equipo");


    const timestamp =
      timestampFromMessage(
        message
      );


    const time =
      timestamp
        ? new Date(
            timestamp
          ).toLocaleTimeString(
            "es-AR",
            {
              hour: "2-digit",
              minute: "2-digit"
            }
          )
        : "";


    return `

      <div class="message ${className}">

        <div class="message-bubble">

          <div class="message-author">
            ${escapeHtml(author)}
          </div>

          <div>
            ${escapeHtml(text)}
          </div>

          <div class="message-time">
            ${time}
          </div>

        </div>

      </div>

    `;

  }


  /* =====================================================
     TIMER
  ===================================================== */

  function getWaitingStart(
    conversation
  ) {

    if (!conversation) {
      return 0;
    }


    const clientAt =
      Number(
        conversation.ultimoMensajeClienteAt ||
        0
      );


    const responseAt =
      Number(
        conversation.ultimaRespuestaAt ||
        0
      );


    if (!clientAt) {
      return 0;
    }


    if (
      responseAt &&
      responseAt >= clientAt
    ) {

      return 0;

    }


    return clientAt;

  }


  function getWaitingSeconds(
    conversation
  ) {

    const start =
      getWaitingStart(
        conversation
      );


    if (!start) {
      return 0;
    }


    return Math.floor(
      (
        Date.now() -
        start
      ) / 1000
    );

  }


  function updateMainTimer() {

    if (!selectedConversationId) {

      mainTimer.textContent =
        "00:00:00";

      return;

    }


    const conversation =
      conversations[
        selectedConversationId
      ];


    if (!conversation) {

      mainTimer.textContent =
        "00:00:00";

      return;

    }


    mainTimer.textContent =
      formatTime(
        getWaitingSeconds(
          conversation
        )
      );

  }


  function updateTimers() {

    updateMainTimer();


    document
      .querySelectorAll(
        "[data-list-timer]"
      )
      .forEach(
        function(element) {

          const id =
            element.dataset.listTimer;

          const conversation =
            conversations[id];

          if (!conversation) {
            return;
          }

          element.textContent =
            formatTime(
              getWaitingSeconds(
                conversation
              )
            );

        }
      );

  }


  function startTimer() {

    stopTimer();

    timerInterval =
      setInterval(
        updateTimers,
        1000
      );

    updateTimers();

  }


  function stopTimer() {

    if (timerInterval) {

      clearInterval(
        timerInterval
      );

      timerInterval = null;

    }

  }


  startTimer();


  /* =====================================================
     ACTUALIZAR METADATA DEL TIMER
  ===================================================== */

  async function updateConversationWaitingMetadata(
    conversationId,
    messages
  ) {

    const conversation =
      conversations[
        conversationId
      ];


    if (!conversation) {
      return;
    }


    let lastClientMessage =
      0;

    let lastTeamMessage =
      0;


    Object.values(
      messages || {}
    ).forEach(
      function(message) {

        const timestamp =
          timestampFromMessage(
            message
          );


        if (!timestamp) {
          return;
        }


        const sender =
          normalize(
            message.remitente ||
            message.sender ||
            message.autor ||
            message.tipo ||
            ""
          );


        const isClient =
          sender.includes("cliente") ||
          sender.includes("client") ||
          sender.includes("usuario") ||
          sender === "inbound" ||
          sender === "customer";


        if (isClient) {

          if (
            timestamp >
            lastClientMessage
          ) {

            lastClientMessage =
              timestamp;

          }

        } else {

          if (
            timestamp >
            lastTeamMessage
          ) {

            lastTeamMessage =
              timestamp;

          }

        }

      }
    );


    const updates = {};


    if (
      lastClientMessage &&
      Number(
        conversation.ultimoMensajeClienteAt ||
        0
      ) !== lastClientMessage
    ) {

      updates.ultimoMensajeClienteAt =
        lastClientMessage;

    }


    if (
      lastTeamMessage &&
      Number(
        conversation.ultimaRespuestaAt ||
        0
      ) !== lastTeamMessage
    ) {

      updates.ultimaRespuestaAt =
        lastTeamMessage;

    }


    if (
      Object.keys(updates).length
    ) {

      try {

        await update(
          ref(
            db,
            `conversaciones/${conversationId}`
          ),
          updates
        );

      } catch (error) {

        console.error(
          "No se pudo actualizar el timer:",
          error
        );

      }

    }

  }

  transferBtn.addEventListener(
    "click",
    async function() {

      if (!selectedConversationId) {
        return;
      }


      const currentTeam =
        getCurrentTeam();


      if (!currentTeam) {

        alert(
          "Tu usuario no tiene un equipo configurado."
        );

        return;

      }


      const usersRef =
        ref(db, "usuarios");


      const usersSnap =
        await get(usersRef);


      if (!usersSnap.exists()) {

        alert(
          "No se encontraron usuarios."
        );

        return;

      }


      const users =
        usersSnap.val();


      const available = [];


      Object.entries(users)
        .forEach(
          ([uid, user]) => {

            const team =
              normalize(
                user.equipo ||
                user.team ||
                user.grupo ||
                ""
              );


            const role =
              normalize(
                user.rol ||
                user.role ||
                ""
              );


            const email =
              user.email ||
              user.correo ||
              "";


            if (
              team === currentTeam &&
              email &&
              !role.includes("supervisor") &&
              !role.includes("senior")
            ) {

              available.push({
                email,
                nombre:
                  user.nombre ||
                  email
              });

            }

          }
        );


      if (!available.length) {

        alert(
          "No hay gestores disponibles en tu equipo."
        );

        return;

      }


      const options =
        available
          .map(
            (user, index) =>
              `${index + 1}. ${user.nombre} - ${user.email}`
          )
          .join("\n");


      const answer =
        prompt(
          "Elegí el gestor escribiendo el número:\n\n" +
          options
        );


      if (!answer) {
        return;
      }


      const index =
        Number(answer) - 1;


      if (
        !Number.isInteger(index) ||
        !available[index]
      ) {

        alert(
          "Selección inválida."
        );

        return;

      }


      const selected =
        available[index];


      try {

        await update(
          ref(
            db,
            `conversaciones/${selectedConversationId}`
          ),
          {

            asignadoA:
              selected.email,

            assignedTo:
              selected.email,

            gestor:
              selected.email,

            asignadoNombre:
              selected.nombre,

            actualizadoEn:
              Date.now()

          }
        );


        alert(
          "Chat transferido correctamente."
        );


      } catch (error) {

        console.error(error);

        alert(
          "No se pudo transferir el chat."
        );

      }

    }
  );

  ===================================================== */

  const originalUpdateTimers =
    updateTimers;


  function updateDetailsTimer() {

    if (!selectedConversationId) {
      return;
    }


    const conversation =
      conversations[
        selectedConversationId
      ];


    if (!conversation) {
      return;
    }


    const timer =
      document.getElementById(
        "detailsTimer"
      );


    if (timer) {

      timer.textContent =
        formatTime(
          getWaitingSeconds(
            conversation
          )
        );

    }

  }


  setInterval(
    updateDetailsTimer,
    1000
