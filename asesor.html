<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centro de Atención - Asesores</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #222;
    }

    button, input, textarea, select {
      font: inherit;
    }

    /* =========================
       LOGIN
       ========================= */

    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #f3f4f6;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,.12);
    }

    .login-box h1 {
      margin-top: 0;
      text-align: center;
      font-size: 25px;
    }

    .login-box p {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .login-box input {
      width: 100%;
      padding: 13px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .login-box button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #222;
      color: white;
      cursor: pointer;
    }

    #loginError {
      margin-top: 15px;
      color: #c62828;
      font-size: 14px;
      text-align: center;
    }

    /* =========================
       APP
       ========================= */

    #app {
      display: none;
      height: 100vh;
      overflow: hidden;
    }

    .topbar {
      height: 65px;
      background: #202124;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }

    .topbar h2 {
      margin: 0;
      font-size: 20px;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 15px;
      font-size: 14px;
    }

    .logout-btn {
      border: 1px solid #aaa;
      background: transparent;
      color: white;
      padding: 7px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    .main {
      display: flex;
      height: calc(100vh - 65px);
    }

    /* =========================
       SIDEBAR
       ========================= */

    .sidebar {
      width: 390px;
      background: white;
      border-right: 1px solid #ddd;
      display: flex;
      flex-direction: column;
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid #ddd;
    }

    .tab-btn {
      flex: 1;
      padding: 13px 8px;
      border: 0;
      background: white;
      cursor: pointer;
      font-weight: bold;
      color: #666;
    }

    .tab-btn.active {
      color: #222;
      border-bottom: 3px solid #222;
    }

    .search-box {
      padding: 15px;
      border-bottom: 1px solid #ddd;
    }

    .search-box input {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    #conversationList {
      flex: 1;
      overflow-y: auto;
    }

    .team-title {
      padding: 10px 15px;
      background: #f1f1f1;
      border-bottom: 1px solid #ddd;
      font-weight: bold;
      font-size: 13px;
      color: #555;
    }

    .conversation-item {
      padding: 15px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .conversation-item:hover {
      background: #f7f7f7;
    }

    .conversation-item.active {
      background: #ececec;
    }

    .conversation-name {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .conversation-preview {
      color: #666;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .conversation-meta {
      margin-top: 7px;
      font-size: 12px;
      color: #888;
      line-height: 1.5;
    }

    .waiting {
      color: #c62828;
      font-weight: bold;
    }

    .available {
      color: #1565c0;
      font-weight: bold;
    }

    .assigned {
      color: #6a1b9a;
      font-weight: bold;
    }

    .finished {
      color: #2e7d32;
      font-weight: bold;
    }

    .team-badge {
      display: inline-block;
      padding: 3px 7px;
      border-radius: 5px;
      background: #eee;
      color: #555;
      font-size: 11px;
      font-weight: bold;
      margin-top: 4px;
    }

    /* =========================
       CHAT
       ========================= */

    .chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    #emptyChat {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777;
      text-align: center;
    }

    #chatContent {
      display: none;
      height: 100%;
      flex-direction: column;
    }

    .chat-header {
      background: white;
      border-bottom: 1px solid #ddd;
      padding: 15px 20px;
    }

    .chat-header h3 {
      margin: 0 0 8px;
    }

    .client-data {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      font-size: 13px;
      color: #555;
    }

    .chat-actions {
      margin-top: 12px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .action-btn {
      padding: 8px 13px;
      border: 0;
      border-radius: 7px;
      cursor: pointer;
      background: #222;
      color: white;
    }

    .action-btn:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .action-btn.green {
      background: #2e7d32;
    }

    .action-btn.blue {
      background: #1565c0;
    }

    .action-btn.red {
      background: #c62828;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: #f5f5f5;
    }

    .message {
      max-width: 70%;
      margin-bottom: 12px;
      padding: 10px 13px;
      border-radius: 12px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .message.client {
      background: white;
      margin-right: auto;
      border: 1px solid #ddd;
    }

    .message.advisor {
      background: #d9ead3;
      margin-left: auto;
    }

    .message-system {
      background: #e8e8e8;
      color: #666;
      max-width: 80%;
      margin: 15px auto;
      text-align: center;
      font-size: 13px;
    }

    .message-info {
      margin-top: 5px;
      font-size: 10px;
      color: #777;
    }

    .hidden-messages {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #777;
      padding: 30px;
      background: #f5f5f5;
    }

    .hidden-messages-box {
      max-width: 450px;
      background: white;
      padding: 25px;
      border-radius: 12px;
      border: 1px solid #ddd;
    }

    .hidden-messages-box strong {
      display: block;
      margin-bottom: 8px;
      color: #222;
    }

    .composer {
      background: white;
      border-top: 1px solid #ddd;
      padding: 12px;
      display: flex;
      gap: 10px;
    }

    .composer textarea {
      flex: 1;
      resize: none;
      height: 45px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .send-btn {
      width: 90px;
      border: 0;
      border-radius: 8px;
      background: #222;
      color: white;
      cursor: pointer;
    }

    .send-btn:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    /* =========================
       MODALES
       ========================= */

    #finalizeModal,
    #transferModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal {
      width: 90%;
      max-width: 450px;
      background: white;
      border-radius: 12px;
      padding: 25px;
    }

    .modal h3 {
      margin-top: 0;
    }

    .modal select {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 7px;
      margin: 15px 0;
    }

    .modal-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .modal-buttons button {
      padding: 9px 14px;
      border: 0;
      border-radius: 7px;
      cursor: pointer;
    }

    .cancel-btn {
      background: #ddd;
    }

    .confirm-btn {
      background: #2e7d32;
      color: white;
    }

    @media (max-width: 800px) {
      .sidebar {
        width: 300px;
      }

      .message {
        max-width: 85%;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->

  <div id="loginScreen">

    <div class="login-box">

      <h1>Centro de Atención</h1>

      <p>
        Ingreso para asesores
      </p>

      <input
        type="email"
        id="email"
        placeholder="Correo electrónico"
        autocomplete="username"
      >

      <input
        type="password"
        id="password"
        placeholder="Contraseña"
        autocomplete="current-password"
      >

      <button id="loginBtn">
        Ingresar
      </button>

      <div id="loginError"></div>

    </div>

  </div>


  <!-- APP -->

  <div id="app">

    <div class="topbar">

      <h2>
        Centro de Atención
      </h2>

      <div class="user-info">

        <span id="loggedUser"></span>

        <button
          class="logout-btn"
          id="logoutBtn"
        >
          Cerrar sesión
        </button>

      </div>

    </div>


    <div class="main">

      <aside class="sidebar">

        <div class="tabs">

          <button
            class="tab-btn active"
            id="activeTab"
          >
            Activos
          </button>

          <button
            class="tab-btn"
            id="historyTab"
          >
            Historial
          </button>

        </div>


        <div class="search-box">

          <input
            type="text"
            id="searchInput"
            placeholder="Buscar por DNI, nombre, teléfono o motivo..."
          >

        </div>


        <div id="conversationList"></div>

      </aside>


      <section class="chat">

        <div id="emptyChat">

          <div>

            <h3>
              Seleccioná una conversación
            </h3>

            <p>
              Las conversaciones aparecerán en este panel.
            </p>

          </div>

        </div>


        <div id="chatContent">

          <div class="chat-header">

            <h3 id="clientName">
              Cliente
            </h3>

            <div class="client-data">

              <span id="clientDni"></span>

              <span id="clientPhone"></span>

              <span id="clientMotive"></span>

              <span id="conversationStatus"></span>

            </div>

            <div id="assignmentInfo"></div>


            <div class="chat-actions">

              <button
                class="action-btn"
                id="takeConversationBtn"
              >
                Tomar conversación
              </button>

              <button
                class="action-btn blue"
                id="transferBtn"
              >
                Transferir
              </button>

              <button
                class="action-btn green"
                id="finalizeBtn"
              >
                Finalizar conversación
              </button>

            </div>

          </div>


          <div id="messages"></div>


          <div class="composer">

            <textarea
              id="messageInput"
              placeholder="Escribí un mensaje..."
            ></textarea>

            <button
              class="send-btn"
              id="sendBtn"
            >
              Enviar
            </button>

          </div>

        </div>

      </section>

    </div>

  </div>


  <!-- MODAL FINALIZAR -->

  <div id="finalizeModal">

    <div class="modal">

      <h3>
        Finalizar conversación
      </h3>

      <p>
        Seleccioná el motivo de finalización:
      </p>

      <select id="finalizationReason">

        <option value="">
          Seleccionar motivo
        </option>

        <option value="Alta de acuerdo">
          Alta de acuerdo
        </option>

        <option value="Carga de comprobante">
          Carga de comprobante
        </option>

        <option value="Servicio al cliente">
          Servicio al cliente
        </option>

        <option value="Consulta resuelta">
          Consulta resuelta
        </option>

        <option value="Sin acuerdo">
          Sin acuerdo
        </option>

        <option value="Cliente no responde">
          Cliente no responde
        </option>

        <option value="Derivado">
          Derivado
        </option>

        <option value="Otro">
          Otro
        </option>

      </select>


      <div class="modal-buttons">

        <button
          class="cancel-btn"
          id="cancelFinalize"
        >
          Cancelar
        </button>

        <button
          class="confirm-btn"
          id="confirmFinalize"
        >
          Finalizar
        </button>

      </div>

    </div>

  </div>


  <!-- MODAL TRANSFERIR -->

  <div id="transferModal">

    <div class="modal">

      <h3>
        Transferir conversación
      </h3>

      <p>
        Seleccioná el asesor al que querés transferir esta conversación:
      </p>

      <select id="transferAdvisor"></select>

      <div class="modal-buttons">

        <button
          class="cancel-btn"
          id="cancelTransfer"
        >
          Cancelar
        </button>

        <button
          class="confirm-btn"
          id="confirmTransfer"
        >
          Transferir
        </button>

      </div>

    </div>

  </div>


  <!-- FIREBASE -->

  <script type="module">

    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getDatabase,
      ref,
      onValue,
      push,
      set,
      update
    } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


    /* =========================
       CONFIGURACIÓN FIREBASE
       ========================= */

    const firebaseConfig = {

      apiKey:
        "AIzaSyBIwTvMk2FPGWMAjnqGQg6up_D6ofUo_I",

      authDomain:
        "estudiomansilla.firebaseapp.com",

      databaseURL:
        "https://estudiomansilla-default-rtdb.firebaseio.com",

      projectId:
        "estudiomansilla",

      storageBucket:
        "estudiomansilla.firebasestorage.app",

      messagingSenderId:
        "482010073100",

      appId:
        "1:482010073100:web:d5cb61259de293b1420629",

      measurementId:
        "G-8710S26Z8L"

    };


    const app =
      initializeApp(firebaseConfig);

    const db =
      getDatabase(app);

    const auth =
      getAuth(app);


    /* =========================
       PERFILES
       ========================= */

    const perfiles = {

      "Milagros": "supervisor",

      "Rocio": "senior",
      "Antonela": "senior",
      "Pilar": "senior",
      "Daniela": "senior",
      "Moriana": "senior",

      "Paula": "asesor",
      "Ana": "asesor",
      "Maria Paz": "asesor",
      "Agustina": "asesor",
      "Pablo": "asesor",
      "Giuliana": "asesor",
      "Candela": "asesor",
      "Belen": "asesor",
      "Delfina": "asesor",
      "Julieta": "asesor",
      "Keila": "asesor",
      "Alejandra": "asesor",
      "Maica": "asesor",
      "Natalia": "asesor",
      "Gustavo": "asesor",
      "Alejo": "asesor",
      "Gregorio": "asesor",
      "Francesca": "asesor",
      "Florencia": "asesor",
      "Valentina": "asesor",
      "Marcela": "asesor"

    };


    /* =========================
       EQUIPOS
       ========================= */

    const equipos = {

      "Verde": {

        seniors: [
          "Daniela",
          "Rocio"
        ],

        gestores: [
          "Maria Paz",
          "Agustina",
          "Pablo",
          "Florencia"
        ]

      },


      "Rojo": {

        seniors: [
          "Antonela"
        ],

        gestores: [
          "Ana",
          "Delfina",
          "Marcela",
          "Valentina",
          "Julieta"
        ]

      },


      "Azul": {

        seniors: [
          "Pilar"
        ],

        gestores: [
          "Paula",
          "Giuliana",
          "Candela",
          "Francesca",
          "Belen"
        ]

      },


      "1142": {

        seniors: [
          "Moriana"
        ],

        gestores: [
          "Natalia",
          "Maica",
          "Alejandra",
          "Keila",
          "Gustavo"
        ]

      },


      "Cuoteros": {

        seniors: [
          "Rocio",
          "Daniela",
          "Antonela",
          "Pilar",
          "Moriana"
        ],

        gestores: [
          "Alejo",
          "Gregorio"
        ]

      }

    };


    /* =========================
       ESTADO
       ========================= */

    let conversaciones = {};

    let conversacionSeleccionada =
      null;

    let vistaActual =
      "activos";

    let usuarioActual =
      null;

    let nombreUsuarioActual =
      "";

    let rolUsuarioActual =
      "asesor";


    /* =========================
       ELEMENTOS
       ========================= */

    const loginScreen =
      document.getElementById(
        "loginScreen"
      );

    const appScreen =
      document.getElementById(
        "app"
      );

    const loginBtn =
      document.getElementById(
        "loginBtn"
      );

    const logoutBtn =
      document.getElementById(
        "logoutBtn"
      );

    const loginError =
      document.getElementById(
        "loginError"
      );

    const emailInput =
      document.getElementById(
        "email"
      );

    const passwordInput =
      document.getElementById(
        "password"
      );

    const loggedUser =
      document.getElementById(
        "loggedUser"
      );

    const conversationList =
      document.getElementById(
        "conversationList"
      );

    const searchInput =
      document.getElementById(
        "searchInput"
      );

    const emptyChat =
      document.getElementById(
        "emptyChat"
      );

    const chatContent =
      document.getElementById(
        "chatContent"
      );

    const messages =
      document.getElementById(
        "messages"
      );

    const messageInput =
      document.getElementById(
        "messageInput"
      );

    const sendBtn =
      document.getElementById(
        "sendBtn"
      );

    const takeConversationBtn =
      document.getElementById(
        "takeConversationBtn"
      );

    const transferBtn =
      document.getElementById(
        "transferBtn"
      );

    const finalizeBtn =
      document.getElementById(
        "finalizeBtn"
      );

    const finalizeModal =
      document.getElementById(
        "finalizeModal"
      );

    const cancelFinalize =
      document.getElementById(
        "cancelFinalize"
      );

    const confirmFinalize =
      document.getElementById(
        "confirmFinalize"
      );

    const finalizationReason =
      document.getElementById(
        "finalizationReason"
      );

    const transferModal =
      document.getElementById(
        "transferModal"
      );

    const transferAdvisor =
      document.getElementById(
        "transferAdvisor"
      );

    const cancelTransfer =
      document.getElementById(
        "cancelTransfer"
      );

    const confirmTransfer =
      document.getElementById(
        "confirmTransfer"
      );

    const activeTab =
      document.getElementById(
        "activeTab"
      );

    const historyTab =
      document.getElementById(
        "historyTab"
      );


    /* =========================
       LOGIN
       ========================= */

    loginBtn.addEventListener(
      "click",
      async () => {

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;

        loginError.textContent = "";

        if (!email || !password) {

          loginError.textContent =
            "Ingresá correo y contraseña.";

          return;

        }

        loginBtn.disabled = true;

        loginBtn.textContent =
          "Ingresando...";


        try {

          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );

        } catch (error) {

          console.error(error);

          loginError.textContent =
            "Error: " +
            error.code +
            " — " +
            error.message;

        } finally {

          loginBtn.disabled = false;

          loginBtn.textContent =
            "Ingresar";

        }

      }
    );


    passwordInput.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key ===
          "Enter"
        ) {

          loginBtn.click();

        }

      }
    );


    /* =========================
       ESTADO LOGIN
       ========================= */

    onAuthStateChanged(
      auth,
      (user) => {

        if (user) {

          usuarioActual =
            user;

          nombreUsuarioActual =
            obtenerNombrePorEmail(
              user.email
            );

          rolUsuarioActual =
            perfiles[
              nombreUsuarioActual
            ] || "asesor";


          loginScreen.style.display =
            "none";

          appScreen.style.display =
            "block";


          loggedUser.textContent =
            nombreUsuarioActual +
            " · " +
            rolUsuarioActual;


          cargarConversaciones();

          cargarOpcionesTransferencia();


        } else {

          usuarioActual =
            null;

          nombreUsuarioActual =
            "";

          rolUsuarioActual =
            "asesor";


          loginScreen.style.display =
            "flex";

          appScreen.style.display =
            "none";

          loggedUser.textContent =
            "";

        }

      }
    );


    /* =========================
       CERRAR SESIÓN
       ========================= */

    logoutBtn.addEventListener(
      "click",
      async () => {

        await signOut(
          auth
        );

      }
    );


    /* =========================
       CAMBIO DE VISTA
       ========================= */

    activeTab.addEventListener(
      "click",
      () => {

        vistaActual =
          "activos";

        activeTab.classList.add(
          "active"
        );

        historyTab.classList.remove(
          "active"
        );

        cerrarChatSeleccionado();

        renderConversationList();

      }
    );


    historyTab.addEventListener(
      "click",
      () => {

        vistaActual =
          "historial";

        historyTab.classList.add(
          "active"
        );

        activeTab.classList.remove(
          "active"
        );

        cerrarChatSeleccionado();

        renderConversationList();

      }
    );


    /* =========================
       CARGAR CONVERSACIONES
       ========================= */

    function cargarConversaciones() {

      const conversacionesRef =
        ref(
          db,
          "conversaciones"
        );


      onValue(
        conversacionesRef,
        (snapshot) => {

          conversaciones =
            {};


          snapshot.forEach(
            (child) => {

              const data =
                child.val();

              if (!data)
                return;


              conversaciones[
                child.key
              ] = {

                id:
                  child.key,

                ...data

              };

            }
          );


          renderConversationList();


          if (
            conversacionSeleccionada
          ) {

            const actual =
              conversaciones[
                conversacionSeleccionada
              ];


            if (
              actual &&
              puedeVerConversacion(
                actual
              )
            ) {

              mostrarConversacion(
                actual
              );

            } else {

              cerrarChatSeleccionado();

            }

          }

        }
      );

    }


    /* =========================
       ADMINISTRADORES
       ========================= */

    function esSupervisor() {

      return (
        rolUsuarioActual ===
        "supervisor"
      );

    }


    function esSenior() {

      return (
        rolUsuarioActual ===
        "senior"
      );

    }


    function esAdministrador() {

      return (
        esSupervisor() ||
        esSenior()
      );

    }


    /* =========================
       EQUIPO DEL USUARIO
       ========================= */

    function obtenerEquiposDelUsuario(
      nombre
    ) {

      const resultado = [];


      Object.entries(
        equipos
      ).forEach(
        ([equipo, datos]) => {

          if (
            datos.seniors.includes(
              nombre
            ) ||
            datos.gestores.includes(
              nombre
            )
          ) {

            resultado.push(
              equipo
            );

          }

        }
      );


      return resultado;

    }


    function obtenerEquipoDePersona(
      nombre
    ) {

      for (
        const [equipo, datos]
        of Object.entries(
          equipos
        )
      ) {

        if (
          datos.gestores.includes(
            nombre
          )
        ) {

          return equipo;

        }

        if (
          datos.seniors.includes(
            nombre
          )
        ) {

          return equipo;

        }

      }


      return "";

    }


    function obtenerSeniorDelEquipo(
      equipo
    ) {

      if (
        !equipos[equipo]
      ) {

        return "";

      }


      return equipos[equipo]
        .seniors
        .join(" y ");

    }


    /* =========================
       EQUIPO DE CONVERSACIÓN
       ========================= */

    function obtenerEquipoConversacion(
      conversation
    ) {

      if (
        conversation.equipo
      ) {

        return conversation.equipo;

      }


      if (
        conversation.asesorAsignado
      ) {

        return obtenerEquipoDePersona(
          conversation.asesorAsignado
        );

      }


      return "";

    }


    /* =========================
       PERMISO PARA VER CHAT
       ========================= */

    function puedeVerConversacion(
      conversation
    ) {

      if (!conversation)
        return false;


      /* =====================
         HISTORIAL
         ===================== */

      if (
        conversation.estado ===
        "finalizada"
      ) {

        return true;

      }


      const equipo =
        obtenerEquipoConversacion(
          conversation
        );


      /* =====================
         SUPERVISOR
         ===================== */

      if (
        esSupervisor()
      ) {

        return true;

      }


      /* =====================
         SENIOR
         ===================== */

      if (
        esSenior()
      ) {

        const equiposUsuario =
          obtenerEquiposDelUsuario(
            nombreUsuarioActual
          );


        /*
         * Cuoteros es visible
         * para todos los seniors.
         */

        if (
          equipo ===
          "Cuoteros"
        ) {

          return true;

        }


        return equiposUsuario.includes(
          equipo
        );

      }


      /* =====================
         GESTORES
         ===================== */

      if (
        rolUsuarioActual ===
        "asesor"
      ) {

        /*
         * Si tiene asesor asignado,
         * solamente lo puede ver
         * el gestor correspondiente.
         */

        if (
          conversation.asesorAsignado
        ) {

          return (
            conversation.asesorAsignado ===
              nombreUsuarioActual ||
            conversation.asesorEmail ===
              usuarioActual?.email
          );

        }


        /*
         * Si no tiene asignado,
         * puede ver la ficha para
         * poder tomarla.
         *
         * Pero NO podrá ver
         * los mensajes.
         */

        return true;

      }


      return false;

    }


    /* =========================
       PERMISO PARA LEER MENSAJES
       ========================= */

    function puedeLeerMensajes(
      conversation
    ) {

      if (!conversation)
        return false;


      if (
        esAdministrador()
      ) {

        return true;

      }


      if (
        conversation.estado ===
        "finalizada"
      ) {

        return true;

      }


      /*
       * Un gestor solamente puede
       * leer cuando el chat está
       * asignado a él.
       */

      if (
        rolUsuarioActual ===
        "asesor"
      ) {

        return (
          conversation.asesorAsignado ===
            nombreUsuarioActual ||
          conversation.asesorEmail ===
            usuarioActual?.email
        );

      }


      return false;

    }


    /* =========================
       PERMISO PARA GESTIONAR
       ========================= */

    function puedeGestionarConversacion(
      conversation
    ) {

      if (!conversation)
        return false;


      if (
        conversation.estado ===
        "finalizada"
      ) {

        return false;

      }


      if (
        esAdministrador()
      ) {

        return true;

      }


      if (
        conversation.asesorAsignado ===
        nombreUsuarioActual
      ) {

        return true;

      }


      if (
        conversation.asesorEmail ===
        usuarioActual?.email
      ) {

        return true;

      }


      /*
       * Un chat sin asignar puede
       * ser tomado.
       */

      if (
        !conversation.asesorAsignado
      ) {

        return true;

      }


      return false;

    }


    /* =========================
       LISTA
       ========================= */

    function renderConversationList() {

      const search =
        searchInput.value
          .trim()
          .toLowerCase();


      conversationList.innerHTML =
        "";


      let lista =
        Object.values(
          conversaciones
        );


      /* =====================
         ACTIVOS
         ===================== */

      if (
        vistaActual ===
        "activos"
      ) {

        lista =
          lista.filter(
            (conversation) => {

              if (
                conversation.estado ===
                "finalizada"
              ) {

                return false;

              }


              return puedeVerConversacion(
                conversation
              );

            }
          );

      }


      /* =====================
         HISTORIAL
         ===================== */

      else {

        lista =
          lista.filter(
            (conversation) => {

              return (
                conversation.estado ===
                "finalizada"
              );

            }
          );

      }


      /* =====================
         BUSCADOR
         ===================== */

      lista =
        lista.filter(
          (conversation) => {

            const datos =
              conversation.datosCliente ||
              {};


            const texto = [

              datos.nombre,

              datos.dni,

              datos.telefono,

              datos.motivo,

              conversation.asesorAsignado,

              conversation.finalizadoPor,

              obtenerEquipoConversacion(
                conversation
              )

            ]
              .filter(Boolean)
              .join(" ")
              .toLowerCase();


            return texto.includes(
              search
            );

          }
        );


      /* =====================
         ORDEN
         ===================== */

      lista.sort(
        (a, b) => {

          return (
            obtenerUltimaFecha(b) -
            obtenerUltimaFecha(a)
          );

        }
      );


      if (
        lista.length === 0
      ) {

        conversationList.innerHTML = `

          <div style="
            padding:20px;
            color:#777;
            text-align:center;
          ">

            ${
              vistaActual ===
              "activos"

                ? "No hay conversaciones activas."

                : "No hay conversaciones finalizadas."
            }

          </div>

        `;

        return;

      }


      let equipoActual =
        null;


      lista.forEach(
        (conversation) => {

          const equipo =
            obtenerEquipoConversacion(
              conversation
            ) ||
            "Sin equipo";


          if (
            equipo !==
            equipoActual
          ) {

            equipoActual =
              equipo;


            const titulo =
              document.createElement(
                "div"
              );


            titulo.className =
              "team-title";


            titulo.textContent =
              "Equipo " +
              equipo;


            conversationList.appendChild(
              titulo
            );

          }


          const datos =
            conversation.datosCliente ||
            {};


          const mensajesObj =
            conversation.mensajes ||
            {};


          const mensajesArray =
            Object.values(
              mensajesObj
            );


          const ultimo =
            mensajesArray.length
              ? mensajesArray[
                  mensajesArray.length - 1
                ]
              : null;


          const div =
            document.createElement(
              "div"
            );


          div.className =
            "conversation-item" +
            (
              conversation.id ===
              conversacionSeleccionada
                ? " active"
                : ""
            );


          let estadoTexto =
            "";


          if (
            conversation.estado ===
            "finalizada"
          ) {

            estadoTexto = `

              <span class="finished">
                Finalizada
              </span>

            `;

          }

          else if (
            !conversation.asesorAsignado
          ) {

            estadoTexto = `

              <span class="available">
                Pendiente de asignación
              </span>

            `;

          }

          else if (
            ultimo &&
            ultimo.remitente ===
            "cliente"
          ) {

            estadoTexto = `

              <span class="waiting">
                Esperando respuesta
              </span>

            `;

          }

          else {

            estadoTexto = `

              <span class="assigned">
                En atención
              </span>

            `;

          }


          let asignacion =
            "";


          if (
            conversation.asesorAsignado
          ) {

            asignacion =
              " · " +
              escaparHTML(
                conversation.asesorAsignado
              );

          }


          /*
           * MUY IMPORTANTE:
           * Si es un gestor y el chat
           * no está asignado, no se
           * muestra el último mensaje.
           */

          let preview =
            "Sin mensajes";


          if (
            puedeLeerMensajes(
              conversation
            )
          ) {

            preview =
              ultimo?.texto ||
              "Sin mensajes";

          }

          else if (
            !conversation.asesorAsignado
          ) {

            preview =
              "Mensaje oculto hasta asignación";

          }


          div.innerHTML = `

            <div class="conversation-name">

              ${escaparHTML(
                datos.nombre ||
                "Sin nombre"
              )}

            </div>

            <div class="conversation-preview">

              ${escaparHTML(
                preview
              )}

            </div>

            <div class="conversation-meta">

              ${estadoTexto}

              ${asignacion}

              <br>

              <span class="team-badge">

                ${escaparHTML(
                  equipo
                )}

              </span>

              ·

              ${tiempoRelativo(
                ultimo?.fecha ||
                conversation.fechaCreacion
              )}

            </div>

          `;


          div.addEventListener(
            "click",
            () => {

              if (
                !puedeVerConversacion(
                  conversation
                )
              ) {

                alert(
                  "No tenés acceso a esta conversación."
                );

                return;

              }


              conversacionSeleccionada =
                conversation.id;


              mostrarConversacion(
                conversation
              );


              renderConversationList();

            }
          );


          conversationList.appendChild(
            div
          );

        }
      );

    }


    searchInput.addEventListener(
      "input",
      renderConversationList
    );


    /* =========================
       MOSTRAR CONVERSACIÓN
       ========================= */

    function mostrarConversacion(
      conversation
    ) {

      if (
        !puedeVerConversacion(
          conversation
        )
      ) {

        cerrarChatSeleccionado();

        return;

      }


      emptyChat.style.display =
        "none";

      chatContent.style.display =
        "flex";


      const datos =
        conversation.datosCliente ||
        {};


      document.getElementById(
        "clientName"
      ).textContent =
        datos.nombre ||
        "Cliente";


      document.getElementById(
        "clientDni"
      ).textContent =
        datos.dni
          ? "DNI: " +
            datos.dni
          : "";


      document.getElementById(
        "clientPhone"
      ).textContent =
        datos.telefono
          ? "Tel: " +
            datos.telefono
          : "";


      document.getElementById(
        "clientMotive"
      ).textContent =
        datos.motivo
          ? "Motivo: " +
            datos.motivo
          : "";


      const equipo =
        obtenerEquipoConversacion(
          conversation
        );


      document.getElementById(
        "conversationStatus"
      ).innerHTML =

        conversation.estado ===
        "finalizada"

          ? `

            <span class="finished">
              Finalizada
            </span>

          `

          : !conversation.asesorAsignado

            ? `

              <span class="available">
                Pendiente de asignación
              </span>

            `

            : `

              <span>
                Estado:
                ${
                  escaparHTML(
                    conversation.estado ||
                    "en_atencion"
                  )
                }
              </span>

            `;


      let assignment =
        "";


      if (equipo) {

        assignment += `

          <div style="
            margin-top:10px;
            font-size:13px;
            color:#555;
          ">

            Equipo:
            <strong>

              ${escaparHTML(
                equipo
              )}

            </strong>

          </div>

        `;

      }


      if (
        conversation.asesorAsignado
      ) {

        assignment += `

          <div style="
            margin-top:6px;
            font-size:13px;
            color:#555;
          ">

            Asignada a:
            <strong>

              ${escaparHTML(
                conversation.asesorAsignado
              )}

            </strong>

          </div>

        `;

      }

      else {

        assignment += `

          <div style="
            margin-top:6px;
            font-size:13px;
            color:#1565c0;
            font-weight:bold;
          ">

            Conversación pendiente de asignación

          </div>

        `;

      }


      if (
        equipo &&
        equipos[equipo]
      ) {

        assignment += `

          <div style="
            margin-top:6px;
            font-size:13px;
            color:#555;
          ">

            Senior:
            <strong>

              ${escaparHTML(
                obtenerSeniorDelEquipo(
                  equipo
                )
              )}

            </strong>

          </div>

        `;

      }


      if (
        conversation.motivoFinalizacion
      ) {

        assignment += `

          <div style="
            margin-top:6px;
            font-size:13px;
            color:#555;
          ">

            Motivo de finalización:
            <strong>

              ${escaparHTML(
                conversation.motivoFinalizacion
              )}

            </strong>

          </div>

        `;

      }


      if (
        conversation.finalizadoPor
      ) {

        assignment += `

          <div style="
            margin-top:6px;
            font-size:13px;
            color:#555;
          ">

            Finalizada por:
            <strong>

              ${escaparHTML(
                conversation.finalizadoPor
              )}

            </strong>

          </div>

        `;

      }


      document.getElementById(
        "assignmentInfo"
      ).innerHTML =
        assignment;


      const finalizada =
        conversation.estado ===
        "finalizada";


      const sinAsignar =
        !conversation.asesorAsignado;


      const soyAsignado =
        conversation.asesorAsignado ===
          nombreUsuarioActual ||
        conversation.asesorEmail ===
          usuarioActual?.email;


      /* =====================
         TOMAR
         ===================== */

      takeConversationBtn.style.display =
        "inline-block";


      if (finalizada) {

        takeConversationBtn.disabled =
          true;

        takeConversationBtn.textContent =
          "Conversación finalizada";

      }

      else if (sinAsignar) {

        takeConversationBtn.disabled =
          false;

        takeConversationBtn.textContent =
          "Tomar conversación";

      }

      else if (soyAsignado) {

        takeConversationBtn.disabled =
          true;

        takeConversationBtn.textContent =
          "Asignada a vos";

      }

      else {

        takeConversationBtn.disabled =
          true;

        takeConversationBtn.textContent =
          "Asignada a otro gestor";

      }


      /* =====================
         TRANSFERIR
         ===================== */

      transferBtn.style.display =
        "inline-block";


      transferBtn.disabled =
        finalizada ||
        !puedeGestionarConversacion(
          conversation
        );


      /* =====================
         FINALIZAR
         ===================== */

      finalizeBtn.disabled =
        finalizada ||
        !puedeGestionarConversacion(
          conversation
        );


      /* =====================
         RESPUESTA
         ===================== */

      const puedeResponder =
        !finalizada &&
        puedeGestionarConversacion(
          conversation
        ) &&
        !sinAsignar;


      messageInput.disabled =
        !puedeResponder;


      sendBtn.disabled =
        !puedeResponder;


      if (finalizada) {

        messageInput.placeholder =
          "Esta conversación está finalizada.";

      }

      else if (sinAsignar) {

        messageInput.placeholder =
          "Tomá la conversación para poder responder.";

      }

      else if (!puedeResponder) {

        messageInput.placeholder =
          "Esta conversación está asignada a otro gestor.";

      }

      else {

        messageInput.placeholder =
          "Escribí un mensaje...";

      }


      /*
       * CARGAMOS LOS MENSAJES
       * solamente si el usuario
       * tiene permiso para leerlos.
       */

      cargarMensajes(
        conversation.id
      );

    }


    /* =========================
       CERRAR CHAT
       ========================= */

    function cerrarChatSeleccionado() {

      conversacionSeleccionada =
        null;

      chatContent.style.display =
        "none";

      emptyChat.style.display =
        "flex";

      messages.innerHTML =
        "";

      messageInput.value =
        "";

    }


    /* =========================
       MENSAJES
       ========================= */

    function cargarMensajes(
      conversationId
    ) {

      const conversation =
        conversaciones[
          conversationId
        ];


      if (!conversation)
        return;


      /*
       * Si el gestor todavía
       * no tiene asignado el chat,
       * NO cargamos los mensajes.
       */

      if (
        !puedeLeerMensajes(
          conversation
        )
      ) {

        messages.innerHTML = `

          <div class="hidden-messages">

            <div class="hidden-messages-box">

              <strong>
                🔒 Mensajes ocultos
              </strong>

              <div>
                Esta conversación todavía
                no está asignada a vos.
              </div>

              <div style="
                margin-top:10px;
                color:#777;
                font-size:13px;
              ">

                Tomá la conversación para
                poder ver el historial y
                responder al cliente.

              </div>

            </div>

          </div>

        `;

        return;

      }


      messages.innerHTML =
        "";


      const mensajesRef =
        ref(
          db,
          `conversaciones/${conversationId}/mensajes`
        );


      onValue(
        mensajesRef,
        (snapshot) => {

          /*
           * Verificamos nuevamente
           * el permiso antes de mostrar.
           */

          const actual =
            conversaciones[
              conversationId
            ];


          if (
            !actual ||
            !puedeLeerMensajes(
              actual
            )
          ) {

            messages.innerHTML = `

              <div class="hidden-messages">

                <div class="hidden-messages-box">

                  <strong>
                    🔒 Mensajes ocultos
                  </strong>

                  <div>
                    Esta conversación
                    ya no está asignada a vos.
                  </div>

                </div>

              </div>

            `;

            return;

          }


          messages.innerHTML =
            "";


          const lista = [];


          snapshot.forEach(
            (child) => {

              const data =
                child.val();

              if (!data)
                return;


              lista.push({

                id:
                  child.key,

                ...data

              });

            }
          );


          lista.sort(
            (a, b) => {

              return (
                (a.fecha || 0) -
                (b.fecha || 0)
              );

            }
          );


          lista.forEach(
            (message) => {

              mostrarMensaje(
                message
              );

            }
          );


          messages.scrollTop =
            messages.scrollHeight;

        }
      );

    }


    function mostrarMensaje(
      message
    ) {

      const div =
        document.createElement(
          "div"
        );


      if (
        message.remitente ===
        "sistema"
      ) {

        div.className =
          "message message-system";

      }

      else if (
        message.remitente ===
        "asesor"
      ) {

        div.className =
          "message advisor";

      }

      else {

        div.className =
          "message client";

      }


      const nombre =

        message.remitente ===
        "asesor"

          ? (
              message.asesorNombre ||
              "Asesor"
            )

          : message.remitente ===
            "cliente"

            ? "Cliente"

            : "Sistema";


      div.innerHTML = `

        <div>

          ${escaparHTML(
            message.texto ||
            ""
          )}

        </div>

        <div class="message-info">

          ${escaparHTML(
            nombre
          )}

          ·

          ${formatearFecha(
            message.fecha
          )}

        </div>

      `;


      messages.appendChild(
        div
      );

    }


    /* =========================
       TOMAR CONVERSACIÓN
       ========================= */

    takeConversationBtn.addEventListener(
      "click",
      async () => {

        if (
          !conversacionSeleccionada
        )
          return;


        const user =
          auth.currentUser;


        if (!user)
          return;


        const conversation =
          conversaciones[
            conversacionSeleccionada
          ];


        if (!conversation)
          return;


        if (
          conversation.estado ===
          "finalizada"
        ) {

          return;

        }


        if (
          conversation.asesorAsignado
        ) {

          alert(
            "Esta conversación ya fue tomada por otro gestor."
          );

          return;

        }


        const nombre =
          obtenerNombrePorEmail(
            user.email
          );


        const equipo =
          obtenerEquipoDePersona(
            nombre
          );


        /*
         * Cuoteros y otros equipos
         * se guardan explícitamente.
         */

        await update(

          ref(
            db,
            `conversaciones/${conversacionSeleccionada}`
          ),

          {

            estado:
              "en_atencion",

            asesorAsignado:
              nombre,

            asesorEmail:
              user.email,

            equipo:
              equipo ||
              conversation.equipo ||
              "",

            senior:
              equipo
                ? obtenerSeniorDelEquipo(
                    equipo
                  )
                : "",

            fechaAsignacion:
              Date.now()

          }

        );


        alert(
          "Conversación tomada correctamente."
        );

      }
    );


    /* =========================
       ENVIAR MENSAJE
       ========================= */

    sendBtn.addEventListener(
      "click",
      enviarMensaje
    );


    messageInput.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key ===
          "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          enviarMensaje();

        }

      }
    );


    async function enviarMensaje() {

      const texto =
        messageInput.value.trim();


      if (
        !texto ||
        !conversacionSeleccionada
      ) {

        return;

      }


      const user =
        auth.currentUser;


      if (!user)
        return;


      const conversation =
        conversaciones[
          conversacionSeleccionada
        ];


      if (!conversation)
        return;


      if (
        !puedeGestionarConversacion(
          conversation
        )
      ) {

        alert(
          "No podés responder esta conversación."
        );

        return;

      }


      /*
       * Un gestor NO puede responder
       * si todavía no está asignado.
       */

      if (
        !conversation.asesorAsignado
      ) {

        alert(
          "Primero tenés que tomar la conversación."
        );

        return;

      }


      const nombre =
        obtenerNombrePorEmail(
          user.email
        );


      const mensajesRef =
        ref(
          db,
          `conversaciones/${conversacionSeleccionada}/mensajes`
        );


      const nuevoMensaje =
        push(
          mensajesRef
        );


      await set(
        nuevoMensaje,
        {

          texto,

          remitente:
            "asesor",

          asesorNombre:
            nombre,

          asesorEmail:
            user.email,

          fecha:
            Date.now()

        }
      );


      await update(

        ref(
          db,
          `conversaciones/${conversacionSeleccionada}`
        ),

        {

          estado:
            "en_atencion",

          asesorAsignado:
            nombre,

          asesorEmail:
            user.email,

          ultimaRespuesta:
            Date.now()

        }

      );


      messageInput.value =
        "";

    }


    /* =========================
       TRANSFERIR
       ========================= */

    transferBtn.addEventListener(
      "click",
      () => {

        if (
          !conversacionSeleccionada
        )
          return;


        const conversation =
          conversaciones[
            conversacionSeleccionada
          ];


        if (
          !puedeGestionarConversacion(
            conversation
          )
        ) {

          alert(
            "No podés transferir esta conversación."
          );

          return;

        }


        cargarOpcionesTransferencia();


        transferModal.style.display =
          "flex";

      }
    );


    cancelTransfer.addEventListener(
      "click",
      () => {

        transferModal.style.display =
          "none";

      }
    );


    confirmTransfer.addEventListener(
      "click",
      async () => {

        const nuevoAsesor =
          transferAdvisor.value;


        if (!nuevoAsesor) {

          alert(
            "Seleccioná un gestor."
          );

          return;

        }


        const conversation =
          conversaciones[
            conversacionSeleccionada
          ];


        if (
          !puedeGestionarConversacion(
            conversation
          )
        ) {

          alert(
            "No podés transferir esta conversación."
          );

          transferModal.style.display =
            "none";

          return;

        }


        /*
         * No permitimos transferir
         * a supervisores ni seniors.
         * La transferencia es entre
         * gestores.
         */

        if (
          perfiles[nuevoAsesor] !==
          "asesor"
        ) {

          alert(
            "Seleccioná un gestor, no un senior o supervisor."
          );

          return;

        }


        const emailNuevoAsesor =
          obtenerEmailPorNombre(
            nuevoAsesor
          );


        const nuevoEquipo =
          obtenerEquipoDePersona(
            nuevoAsesor
          );


        await update(

          ref(
            db,
            `conversaciones/${conversacionSeleccionada}`
          ),

          {

            estado:
              "en_atencion",

            asesorAsignado:
              nuevoAsesor,

            asesorEmail:
              emailNuevoAsesor,

            equipo:
              nuevoEquipo ||
              conversation.equipo ||
              "",

            senior:
              nuevoEquipo
                ? obtenerSeniorDelEquipo(
                    nuevoEquipo
                  )
                : "",

            fechaTransferencia:
              Date.now(),

            transferidoPor:
              nombreUsuarioActual,

            transferidoPorEmail:
              usuarioActual?.email ||
              ""

          }

        );


        /*
         * Guardamos un mensaje
         * de sistema para dejar
         * registro de la transferencia.
         */

        const mensajesRef =
          ref(
            db,
            `conversaciones/${conversacionSeleccionada}/mensajes`
          );


        const mensajeSistema =
          push(
            mensajesRef
          );


        await set(
          mensajeSistema,
          {

            texto:
              "Conversación transferida de " +
              nombreUsuarioActual +
              " a " +
              nuevoAsesor +
              ".",

            remitente:
              "sistema",

            fecha:
              Date.now()

          }
        );


        transferModal.style.display =
          "none";


        alert(
          "Conversación transferida correctamente."
        );

      }
    );


    /* =========================
       OPCIONES TRANSFERENCIA
       ========================= */

    function cargarOpcionesTransferencia() {

      transferAdvisor.innerHTML = `

        <option value="">
          Seleccionar gestor
        </option>

      `;


      Object.keys(perfiles)
        .filter(
          (nombre) =>
            perfiles[nombre] ===
            "asesor"
        )
        .sort()
        .forEach(
          (nombre) => {

            const option =
              document.createElement(
                "option"
              );


            option.value =
              nombre;


            const equipo =
              obtenerEquipoDePersona(
                nombre
              );


            option.textContent =
              nombre +
              (
                equipo
                  ? " · Equipo " +
                    equipo
                  : ""
              );


            if (
              nombre ===
              nombreUsuarioActual
            ) {

              option.disabled =
                true;

            }


            transferAdvisor.appendChild(
              option
            );

          }
        );

    }


    /* =========================
       FINALIZAR
       ========================= */

    finalizeBtn.addEventListener(
      "click",
      () => {

        if (
          !conversacionSeleccionada
        )
          return;


        const conversation =
          conversaciones[
            conversacionSeleccionada
          ];


        if (
          !puedeGestionarConversacion(
            conversation
          )
        ) {

          alert(
            "No podés finalizar esta conversación."
          );

          return;

        }


        finalizationReason.value =
          "";


        finalizeModal.style.display =
          "flex";

      }
    );


    cancelFinalize.addEventListener(
      "click",
      () => {

        finalizeModal.style.display =
          "none";

      }
    );


    confirmFinalize.addEventListener(
      "click",
      async () => {

        const motivo =
          finalizationReason.value;


        if (!motivo) {

          alert(
            "Seleccioná un motivo."
          );

          return;

        }


        const user =
          auth.currentUser;


        if (!user)
          return;


        const conversation =
          conversaciones[
            conversacionSeleccionada
          ];


        if (
          !puedeGestionarConversacion(
            conversation
          )
        ) {

          alert(
            "No podés finalizar esta conversación."
          );

          finalizeModal.style.display =
            "none";

          return;

        }


        const nombre =
          obtenerNombrePorEmail(
            user.email
          );


        await update(

          ref(
            db,
            `conversaciones/${conversacionSeleccionada}`
          ),

          {

            estado:
              "finalizada",

            motivoFinalizacion:
              motivo,

            fechaFinalizacion:
              Date.now(),

            finalizadoPor:
              nombre,

            finalizadoPorEmail:
              user.email

          }

        );


        finalizeModal.style.display =
          "none";


        alert(
          "Conversación finalizada correctamente."
        );


        vistaActual =
          "activos";


        activeTab.classList.add(
          "active"
        );


        historyTab.classList.remove(
          "active"
        );


        cerrarChatSeleccionado();

        renderConversationList();

      }
    );

    /* =========================
       ÚLTIMA FECHA
       ========================= */

    function obtenerUltimaFecha(
      conversation
    ) {

      const mensajes =
        Object.values(
          conversation.mensajes ||
          {}
        );


      if (
        mensajes.length
      ) {

        return Math.max(
          ...mensajes.map(
            (m) =>
              m.fecha || 0
          )
        );

      }


      return (
        conversation.fechaCreacion ||
        0
      );

    }


    /* =========================
       ESCAPAR HTML
       ========================= */

    function escaparHTML(
      texto
    ) {

      return String(
        texto ?? ""
      )
        .replaceAll(
          "&",
          "&amp;"
        )
        .replaceAll(
          "<",
          "&lt;"
        )
        .replaceAll(
          ">",
          "&gt;"
        )
        .replaceAll(
          '"',
          "&quot;"
        )
        .replaceAll(
          "'",
          "&#039;"
        );

    }


    /* =========================
       FECHA
       ========================= */

    function formatearFecha(
      timestamp
    ) {

      if (!timestamp)
        return "";


      return new Date(
        timestamp
      ).toLocaleString(
        "es-AR",
        {

          day:
            "2-digit",

          month:
            "2-digit",

          year:
            "numeric",

          hour:
            "2-digit",

          minute:
            "2-digit"

        }
      );

    }


    /* =========================
       TIEMPO RELATIVO
       ========================= */

    function tiempoRelativo(
      timestamp
    ) {

      if (!timestamp)
        return "";


      const diferencia =
        Date.now() -
        timestamp;


      const minutos =
        Math.floor(
          diferencia /
          60000
        );


      if (
        minutos < 1
      )
        return "Ahora";


      if (
        minutos < 60
      )
        return (
          "Hace " +
          minutos +
          " min"
        );


      const horas =
        Math.floor(
          minutos / 60
        );


      if (
        horas < 24
      )
        return (
          "Hace " +
          horas +
          " h"
        );


      const dias =
        Math.floor(
          horas / 24
        );


      return (
        "Hace " +
        dias +
        " día" +
        (
          dias === 1
            ? ""
            : "s"
        )
      );

    }
