<title>Centro de Atención</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f8;
    color:#202124;
}

button,
input,
textarea,
select{
    font-family:inherit;
}

.hidden{
    display:none !important;
}

/* =========================
   LOGIN
========================= */

#login{
    width:100%;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f4f6f8;
}

.login-box{
    width:380px;
    background:white;
    padding:35px;
    border-radius:16px;
    box-shadow:0 8px 30px rgba(0,0,0,.10);
}

.login-box h1{
    margin-top:0;
    text-align:center;
}

.login-box input{
    width:100%;
    padding:13px;
    margin-bottom:12px;
    border:1px solid #ddd;
    border-radius:8px;
}

.login-box button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:8px;
    background:#111827;
    color:white;
    cursor:pointer;
}

.login-box button:hover{
    background:#1f2937;
}

#loginError{
    color:#c62828;
    margin-top:12px;
    font-size:14px;
    line-height:1.5;
}

/* =========================
   APP
========================= */

#app{
    height:100vh;
    display:flex;
    overflow:hidden;
}

.sidebar{
    width:270px;
    background:#111827;
    color:white;
    display:flex;
    flex-direction:column;
}

.logo{
    padding:24px 20px;
    font-size:21px;
    font-weight:bold;
    border-bottom:1px solid rgba(255,255,255,.1);
}

.user-box{
    padding:18px 20px;
    border-bottom:1px solid rgba(255,255,255,.1);
}

.user-name{
    font-weight:bold;
}

.user-role{
    font-size:13px;
    opacity:.7;
    margin-top:4px;
}

.menu{
    padding:12px;
}

.menu button{
    width:100%;
    text-align:left;
    padding:12px 14px;
    border:none;
    background:transparent;
    color:white;
    border-radius:8px;
    cursor:pointer;
    margin-bottom:5px;
}

.menu button:hover,
.menu button.active{
    background:rgba(255,255,255,.12);
}

.logout{
    margin-top:auto;
    padding:15px;
    border-top:1px solid rgba(255,255,255,.1);
}

.logout button{
    width:100%;
    padding:10px;
    border:none;
    border-radius:8px;
    background:#374151;
    color:white;
    cursor:pointer;
}

/* =========================
   MAIN
========================= */

.main{
    flex:1;
    display:flex;
    min-width:0;
}

.conversations-panel{
    width:360px;
    background:white;
    border-right:1px solid #ddd;
    display:flex;
    flex-direction:column;
}

.panel-header{
    padding:18px;
    border-bottom:1px solid #ddd;
}

.panel-header h2{
    margin:0;
    font-size:19px;
}

.panel-subtitle{
    color:#777;
    font-size:13px;
    margin-top:5px;
}

.search-box{
    padding:12px;
    border-bottom:1px solid #eee;
}

.search-box input{
    width:100%;
    padding:10px;
    border:1px solid #ddd;
    border-radius:8px;
}

.conversations-list{
    flex:1;
    overflow-y:auto;
}

.conversation-item{
    padding:15px;
    border-bottom:1px solid #eee;
    cursor:pointer;
}

.conversation-item:hover{
    background:#f7f7f7;
}

.conversation-item.active{
    background:#eef3ff;
}

.conversation-name{
    font-weight:bold;
}

.conversation-dni{
    font-size:12px;
    color:#777;
    margin-top:3px;
}

.conversation-message{
    font-size:13px;
    color:#666;
    margin-top:7px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.conversation-date{
    font-size:11px;
    color:#999;
    margin-top:7px;
}

.empty{
    padding:30px 20px;
    text-align:center;
    color:#888;
}

/* =========================
   CHAT
========================= */

.chat-panel{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    background:#f5f6f8;
}

.chat-empty{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#888;
}

.chat-header{
    background:white;
    border-bottom:1px solid #ddd;
    padding:15px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.chat-client{
    font-size:18px;
    font-weight:bold;
}

.chat-info{
    font-size:13px;
    color:#777;
    margin-top:4px;
}

.chat-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.btn{
    border:none;
    border-radius:7px;
    padding:9px 13px;
    cursor:pointer;
}

.btn-primary{
    background:#111827;
    color:white;
}

.btn-secondary{
    background:#e5e7eb;
    color:#111827;
}

.btn-danger{
    background:#dc2626;
    color:white;
}

.btn-success{
    background:#16a34a;
    color:white;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

.message{
    max-width:70%;
    margin-bottom:12px;
    padding:11px 13px;
    border-radius:12px;
    background:white;
    box-shadow:0 1px 2px rgba(0,0,0,.05);
}

.message.mine{
    margin-left:auto;
    background:#dbeafe;
}

.message-author{
    font-size:11px;
    font-weight:bold;
    margin-bottom:4px;
}

.message-time{
    font-size:10px;
    color:#888;
    margin-top:5px;
}

.message-form{
    background:white;
    border-top:1px solid #ddd;
    padding:12px;
    display:flex;
    gap:10px;
}

.message-form textarea{
    flex:1;
    resize:none;
    height:60px;
    padding:10px;
    border:1px solid #ddd;
    border-radius:8px;
}

.message-form button{
    width:100px;
}

/* =========================
   AGENTES
========================= */

.agents-view,
.history-view{
    flex:1;
    overflow:auto;
    padding:25px;
}

.section-title{
    font-size:22px;
    font-weight:bold;
    margin-bottom:20px;
}

.agents-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:15px;
}

.agent-card{
    background:white;
    border:1px solid #ddd;
    border-radius:12px;
    padding:18px;
    cursor:pointer;
}

.agent-card:hover{
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.agent-name{
    font-size:17px;
    font-weight:bold;
}

.agent-team{
    color:#777;
    font-size:13px;
    margin-top:4px;
}

.agent-count{
    margin-top:12px;
    font-size:13px;
}

/* =========================
   HISTORY
========================= */

.history-search{
    display:flex;
    gap:10px;
    margin-bottom:18px;
}

.history-search input{
    flex:1;
    padding:11px;
    border:1px solid #ddd;
    border-radius:8px;
}

.history-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.history-item{
    background:white;
    padding:16px;
    border:1px solid #ddd;
    border-radius:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.history-client{
    font-weight:bold;
}

.history-info{
    font-size:13px;
    color:#777;
    margin-top:4px;
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:1000;
}

.modal-box{
    background:white;
    width:430px;
    max-width:90%;
    border-radius:14px;
    padding:22px;
}

.modal-box h3{
    margin-top:0;
}

.modal-box select{
    width:100%;
    padding:11px;
    border:1px solid #ddd;
    border-radius:8px;
    margin-bottom:12px;
}

.modal-buttons{
    display:flex;
    justify-content:flex-end;
    gap:8px;
}

.readonly{
    background:#f3f4f6;
    border:1px solid #ddd;
    padding:12px;
    border-radius:8px;
    color:#666;
}

@media(max-width:800px){

    .sidebar{
        width:210px;
    }

    .conversations-panel{
        width:300px;
    }

}

</style>
</head>

let usuarioActual = null;

let nombreUsuarioActual = "";

let conversacionesArray = [];

/* =========================================================
   FUNCIONES DE USUARIO
========================================================= */

function obtenerNombreUsuarioPorEmail(email){

    if(!email){
        return "";
    }

    const emailNormalizado =
        String(email).trim().toLowerCase();

    return emailsPorNombre[emailNormalizado] || "";

}


function obtenerRolUsuario(){

    if(!nombreUsuarioActual){
        return "";
    }

    return perfiles[nombreUsuarioActual] || "";

}


function esSupervisor(){

    return obtenerRolUsuario() === "supervisor";

}


function esSenior(){

    return obtenerRolUsuario() === "senior";

}


function esAsesor(){

    return obtenerRolUsuario() === "asesor";

}


/* =========================================================
   EQUIPOS
========================================================= */

function obtenerEquipoParaGestor(gestor){

    if(!gestor){
        return "";
    }

    for(const nombreEquipo in equipos){

        if(
            equipos[nombreEquipo].gestores.includes(
                gestor
            )
        ){
            return nombreEquipo;
        }

    }

    return "";

}


function obtenerEquiposDeUsuario(){

    const resultado = [];

    for(const nombreEquipo in equipos){

        const equipo = equipos[nombreEquipo];

        if(
            equipo.seniors.includes(nombreUsuarioActual)
        ){
            resultado.push(nombreEquipo);
        }

    }

    return resultado;

}


function usuarioTieneEquipo(nombreEquipo){

    if(esSupervisor()){
        return true;
    }

    if(!nombreEquipo){
        return false;
    }

    const equipo = equipos[nombreEquipo];

    if(!equipo){
        return false;
    }

    return equipo.seniors.includes(
        nombreUsuarioActual
    );

}


/* =========================================================
   OBTENER EQUIPO DE UNA CONVERSACIÓN
========================================================= */

function obtenerEquipoConversacion(c){

    if(!c){
        return "";
    }

    if(c.equipo){
        return String(c.equipo);
    }

    if(c.team){
        return String(c.team);
    }

    if(c.equipoAsignado){
        return String(c.equipoAsignado);
    }

    if(c.asesorAsignado){

        return obtenerEquipoParaGestor(
            String(c.asesorAsignado).trim()
        );

    }

    if(c.asesor){

        return obtenerEquipoParaGestor(
            String(c.asesor).trim()
        );

    }

    return "";

}


/* =========================================================
   OBTENER GESTOR
========================================================= */

function obtenerGestorConversacion(c){

    if(!c){
        return "";
    }

    return String(
        c.asesorAsignado ||
        c.gestorAsignado ||
        c.asesor ||
        c.gestor ||
        ""
    ).trim();

}


/* =========================================================
   ESTADO ACTIVO
========================================================= */

function esConversacionActiva(c){

    if(!c){
        return false;
    }

    const estado =
        String(c.estado || "").toLowerCase();

    return estado !== "finalizada";

}


/* =========================================================
   PERMISOS
========================================================= */

/*
    PRINCIPAL

    Asesor:
    solamente sus propias cuentas.

    Senior:
    solamente sus propias cuentas.

    Supervisor:
    no mostramos cuentas propias en principal.
*/


function puedeVerEnPrincipal(c){

    if(!c){
        return false;
    }

    if(!esConversacionActiva(c)){
        return false;
    }

    if(esSupervisor()){
        return false;
    }

    const gestor =
        obtenerGestorConversacion(c);

    if(!gestor){

        /*
            Una cuenta sin gestor:
            puede ser vista por seniors
            para poder tomarla/gestionarla.
        */

        if(esSenior()){
            return true;
        }

        return false;
    }

    return gestor === nombreUsuarioActual;

}


/*
    EQUIPO / AGENTES

    Supervisor:
    todo.

    Senior:
    cualquier cuenta de su equipo.

    Asesor:
    cuentas de su propio equipo.
*/

function puedeVerPorEquipo(c){

    if(!c){
        return false;
    }

    if(!esConversacionActiva(c)){
        return false;
    }

    if(esSupervisor()){
        return true;
    }

    const gestor =
        obtenerGestorConversacion(c);

    if(gestor){

        const equipoGestor =
            obtenerEquipoParaGestor(gestor);

        if(equipoGestor){

            return usuarioTieneEquipo(
                equipoGestor
            );

        }

    }

    const equipo =
        obtenerEquipoConversacion(c);

    if(!equipo){
        return false;
    }

    return usuarioTieneEquipo(equipo);

}


/*
    QUIÉN PUEDE ABRIR/GESTIONAR.
*/

function puedeGestionarConversacion(
    c,
    modo = "principal"
){

    if(!c){
        return false;
    }

    if(c.estado === "finalizada"){
        return false;
    }

    if(esSupervisor()){
        return true;
    }

    /*
        Senior mirando por equipo:
        puede gestionar cuentas de su equipo
        y también cuentas sin gestor.
    */

    if(
        modo === "equipo" ||
        modo === "agente"
    ){

        if(esSenior()){

            if(
                !c.asesorAsignado &&
                !c.asesorEmail &&
                !c.gestorAsignado &&
                !c.gestor
            ){
                return true;
            }

        }

        return puedeVerPorEquipo(c);

    }

    /*
        Principal:
        solamente la propia cuenta.
    */

    return puedeVerEnPrincipal(c);

}


/* =========================================================
   LOGIN
========================================================= */

async function iniciarSesion(){

    const emailInput =
        document.getElementById("email");

    const passwordInput =
        document.getElementById("password");

    const error =
        document.getElementById("loginError");

    const button =
        document.getElementById("loginButton");

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;

    error.textContent = "";

    if(!email){

        error.textContent =
            "Ingresá tu correo electrónico.";

        return;

    }

    if(!password){

        error.textContent =
            "Ingresá tu contraseña.";

        return;

    }

    button.disabled = true;

    button.textContent = "Ingresando...";

    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

    }catch(e){

        console.error(
            "ERROR FIREBASE LOGIN:",
            e
        );

        error.textContent =
            traducirErrorFirebase(e);

    }finally{

        button.disabled = false;

        button.textContent = "Ingresar";

    }

}


/* =========================================================
   ERRORES FIREBASE
========================================================= */

function traducirErrorFirebase(error){

    if(!error){
        return "Ocurrió un error.";
    }

    const code =
        error.code || "";

    if(
        code ===
        "auth/invalid-credential"
    ){

        return "El correo o la contraseña son incorrectos.";

    }

    if(
        code ===
        "auth/invalid-email"
    ){

        return "El correo electrónico no es válido.";

    }

    if(
        code ===
        "auth/user-not-found"
    ){

        return "No existe una cuenta con ese correo.";

    }

    if(
        code ===
        "auth/wrong-password"
    ){

        return "La contraseña es incorrecta.";

    }

    if(
        code ===
        "auth/too-many-requests"
    ){

        return "Demasiados intentos. Esperá unos minutos.";

    }

    if(
        code ===
        "auth/network-request-failed"
    ){

        return "No hay conexión con Firebase.";

    }

    return (
        code +
        " - " +
        (error.message || "Error desconocido.")
    );

}

/* =========================================================
   FILTRAR CONVERSACIONES
========================================================= */

function obtenerConversacionesVisibles(){

    const activas =
        conversacionesArray.filter(
            esConversacionActiva
        );


    if(esSupervisor()){

        /*
            Supervisor:
            la vista principal no muestra clientes.
        */

        if(
            vistaConversacionesModo ===
            "agente"
        ){

            return activas.filter(c => {

                return (
                    obtenerGestorConversacion(c)
                    ===
                    gestorConsultado
                );

            });

        }

        return [];

    }


    if(
        vistaConversacionesModo ===
        "agente"
    ){

        return activas.filter(c => {

            return (
                obtenerGestorConversacion(c)
                ===
                gestorConsultado
            );

        });

    }


    if(
        vistaConversacionesModo ===
        "equipo"
    ){

        return activas.filter(
            c => puedeVerPorEquipo(c)
        );

    }


    /*
        PRINCIPAL
    */

    return activas.filter(
        c => puedeVerEnPrincipal(c)
    );

}

function renderizarConversaciones(){

        document.getElementById(
            "conversationsList"
        );

    }

    lista.innerHTML = "";

    const searchInput =
        document.getElementById(
            "searchConversation"
        );

    const search =
        String(
            searchInput?.value || ""
        )
        .trim()
        .toLowerCase();


    let conversaciones =
        obtenerConversacionesVisibles();


    if(search){

        conversaciones =
            conversaciones.filter(c => {

                const nombre =
                    String(
                        c.clienteNombre ||
                        c.nombre ||
                        c.cliente ||
                        ""
                    ).toLowerCase();

                const dni =
                    String(
                        c.dni ||
                        c.DNI ||
                        c.documento ||
                        ""
                    ).toLowerCase();

                    dni.includes(search)

    if(conversaciones.length === 0){

            "";

            obtenerUltimoTexto(c);


        const fecha =
            formatearFecha(

                c.updatedAt ||

                c.fecha

/* =========================================================
   MENSAJES
========================================================= */

function obtenerMensajes(c){

    if(!c){
        return [];
    }


    if(Array.isArray(c.mensajes)){

        return c.mensajes.map(
            (m, index) => ({
                ...m,
                _index:index
            })
        );

    }


    if(
        c.mensajes &&
        typeof c.mensajes === "object"
    ){

        return Object.entries(
            c.mensajes
        ).map(([key,value]) => ({
            ...(value || {}),
            _key:key
        }));

    }


    if(Array.isArray(c.messages)){

        return c.messages.map(
            (m,index) => ({
                ...m,
                _index:index
            })
        );

    }


    if(
        c.messages &&
        typeof c.messages === "object"
    ){

        return Object.entries(
            c.messages
        ).map(([key,value]) => ({
            ...(value || {}),
            _key:key
        }));

    }


    return [];

}


/* =========================================================
   ÚLTIMO MENSAJE
========================================================= */

function obtenerUltimoTexto(c){

    const mensajes =
        obtenerMensajes(c);

    if(mensajes.length === 0){

        return (
            c.ultimoMensaje ||
            c.lastMessage ||
            "Sin mensajes"
        );

    }


    const ultimo =
        mensajes[mensajes.length - 1];


    return (
        ultimo.texto ||
        ultimo.mensaje ||
        ultimo.text ||
        ultimo.contenido ||
        "Mensaje"
    );

}

        `;

    }


    const textarea =

        "button";

        "Enviar";

    );

    textarea.addEventListener(
        "keydown",

                event.key === "Enter" &&
                !event.shiftKey
            ){

                event.preventDefault();

                enviarMensaje(c);

            }

        }
    );

}


/* =========================================================
   ENVIAR MENSAJE
========================================================= */

async function enviarMensaje(c){

    if(!c){
        return;
    }


    if(
        !puedeGestionarConversacion(
            c,
            vistaConversacionesModo
        )
    ){

        alert(
            "No tenés permiso para responder esta conversación."
        );

        return;

    }


    const textarea =
        document.getElementById(
            "newMessage"
        );


    if(!textarea){
        return;
    }


    const texto =
        textarea.value.trim();


    if(!texto){
        return;
    }


    try{

        const mensajeRef =
            push(
                ref(
                    db,
                    `conversaciones/${c.id}/mensajes`
                )
            );


        await set(
            mensajeRef,
            {

                texto: texto,

                autor:
                    nombreUsuarioActual,

                email:
                    usuarioActual?.email || "",

                timestamp:
                    Date.now(),

                tipo:
                    "gestor"

            }
        );


        await update(
            ref(
                db,
                `conversaciones/${c.id}`
            ),
            {

                ultimaActividad:
                    Date.now(),

                ultimoMensaje:
                    texto

            }
        );


        textarea.value = "";


    }catch(e){

        console.error(
            "ERROR ENVIANDO MENSAJE:",
            e
        );

        alert(
            "No se pudo enviar el mensaje.\n\n" +
            (e.message || "")
        );

    }

}


/* =========================================================
   FINALIZAR
========================================================= */

async function finalizarConversacion(c){

    if(!c){
        return;
    }


    if(!puedeGestionarConversacion(
        c,
        vistaConversacionesModo
    )){

        alert(
            "No tenés permiso para finalizar esta conversación."
        );

        return;

    }


    const confirmar =
        confirm(
            "¿Querés finalizar esta conversación?"
        );


    if(!confirmar){
        return;
    }


    try{

        await update(
            ref(
                db,
                `conversaciones/${c.id}`
            ),
            {

                estado:
                    "finalizada",

                finalizadaPor:
                    nombreUsuarioActual,

                finalizadaPorEmail:
                    usuarioActual?.email || "",

                fechaFinalizacion:
                    Date.now()

            }
        );


        conversacionSeleccionada = null;


        document
            .getElementById("chatContent")
            .classList.add("hidden");


        document
            .getElementById("chatEmpty")
            .classList.remove("hidden");


        renderizarConversaciones();


    }catch(e){

        console.error(
            "ERROR FINALIZANDO:",
            e
        );

        alert(
            "No se pudo finalizar la conversación.\n\n" +
            (e.message || "")
        );

    }

}

        for(const nombreEquipo in equipos){

                .forEach(gestor => {

                    if(!todos.includes(gestor)){
                        todos.push(gestor);
                    }

                });

        }

        return todos;

    }


    const equiposUsuario =
        obtenerEquiposDeUsuario();

    const gestores = [];

    equiposUsuario.forEach(
        nombreEquipo => {

            equipos[nombreEquipo].gestores
                .forEach(gestor => {

                    if(!gestores.includes(gestor)){
                        gestores.push(gestor);
                    }

                });

        }
    );

    return gestores;

                );

            });

    }


    lista.innerHTML = "";


    if(finalizadas.length === 0){

        lista.innerHTML = `
            <div class="empty">
                No hay conversaciones finalizadas.
            </div>
        `;

        return;

    }


    finalizadas.forEach(c => {

        const item =
            document.createElement("div");

        item.className =
            "history-item";


        const nombre =
            c.clienteNombre ||
            c.nombre ||
            c.cliente ||
            "Cliente";


        const dni =
            c.dni ||
            c.DNI ||
            c.documento ||
            "Sin DNI";


        const gestor =
            obtenerGestorConversacion(c);


        item.innerHTML = `

            <div>

                <div class="history-client">
                    ${escaparHTML(nombre)}
                </div>

                <div class="history-info">
                    DNI: ${escaparHTML(dni)}
                    ${
                        gestor
                        ?
                        " · Gestor: " +
                        escaparHTML(gestor)
                        :
                        ""
                    }
                </div>

            </div>

            <button
                class="btn btn-secondary"
                type="button"
            >
                Ver gestión
            </button>

        `;


        item
            .querySelector("button")
            .addEventListener(
                "click",
                () => verHistorial(c)
            );


        lista.appendChild(item);

    });

}


/* =========================================================
   VER HISTORIAL
========================================================= */

function verHistorial(c){

    conversacionSeleccionada =
        c;


    document
        .getElementById("historyView")
        .classList.add("hidden");


    document
        .getElementById("conversationsPanel")
        .classList.remove("hidden");


    document
        .getElementById("chatPanel")
        .classList.remove("hidden");


    document
        .querySelectorAll(".menu button")
        .forEach(
            btn => btn.classList.remove("active")
        );


    document
        .getElementById("menuHistorial")
        .classList.add("active");


    document
        .getElementById("chatEmpty")
        .classList.add("hidden");


    document
        .getElementById("chatContent")
        .classList.remove("hidden");


    renderizarHeaderHistorial(c);

    renderizarMensajes(c);

    document
        .getElementById("messageForm")
        .innerHTML = `
            <div class="readonly">
                Esta conversación está finalizada.
                Es solo de lectura.
            </div>
        `;

}

/* =========================================================
   TRANSFERENCIA
========================================================= */

function abrirTransferencia(c){

    if(!c){
        return;
    }


    if(
        !esSupervisor() &&
        !esSenior()
    ){

        alert(
            "Solo un senior o supervisor puede transferir conversaciones."
        );

        return;

    }


    conversacionTransferencia =
        c;


    const modal =
        document.getElementById(
            "transferModal"
        );


    const teamSelect =
        document.getElementById(
            "transferTeam"
        );


    const agentSelect =
        document.getElementById(
            "transferAgent"
        );


    teamSelect.innerHTML = `
        <option value="">
            Seleccionar equipo
        </option>
    `;


    Object.keys(equipos)
        .forEach(equipo => {

            teamSelect.innerHTML += `
                <option value="${escaparAtributo(equipo)}">
                    ${escaparHTML(equipo)}
                </option>
            `;

        });


    agentSelect.innerHTML = `
        <option value="">
            Seleccionar gestor
        </option>
    `;


    teamSelect.onchange =
        function(){

            agentSelect.innerHTML = `
                <option value="">
                    Seleccionar gestor
                </option>
            `;


            const equipo =
                equipos[this.value];


            if(!equipo){
                return;
            }


            equipo.gestores.forEach(
                gestor => {

                    agentSelect.innerHTML += `
                        <option value="${escaparAtributo(gestor)}">
                            ${escaparHTML(gestor)}
                        </option>
                    `;

                }
            );

        };


    modal.classList.remove(
        "hidden"
    );

}


function cerrarTransferencia(){

    document
        .getElementById("transferModal")
        .classList.add("hidden");

    conversacionTransferencia =
        null;

}


async function confirmarTransferencia(){

    const c =
        conversacionTransferencia;


    if(!c){
        return;
    }


    const equipo =
        document.getElementById(
            "transferTeam"
        ).value;


    const gestor =
        document.getElementById(
            "transferAgent"
        ).value;


    if(!equipo){

        alert(
            "Seleccioná un equipo."
        );

        return;

    }


    if(!gestor){

        alert(
            "Seleccioná un gestor."
        );

        return;

    }


    try{

        await update(
            ref(
                db,
                `conversaciones/${c.id}`
            ),
            {

                equipo:
                    equipo,

                equipoAsignado:
                    equipo,

                asesorAsignado:
                    gestor,

                gestorAsignado:
                    gestor,

                ultimaActividad:
                    Date.now(),

                transferidoPor:
                    nombreUsuarioActual,

                transferidoPorEmail:
                    usuarioActual?.email || ""

            }
        );


        cerrarTransferencia();


        alert(
            "Conversación transferida correctamente."
        );


    }catch(e){

        console.error(
            "ERROR TRANSFERENCIA:",
            e
        );

        alert(
            "No se pudo transferir la conversación.\n\n" +
            (e.message || "")
        );

    }

}


/* =========================================================
   CARGAR CONVERSACIONES
========================================================= */

function escucharConversaciones(){

    if(unsubscribeConversaciones){

        unsubscribeConversaciones();

    }


    const conversacionesRef =
        ref(
            db,
            "conversaciones"
        );


    unsubscribeConversaciones =
        onValue(
            conversacionesRef,
            snapshot => {

                const data =
                    snapshot.val() || {};


                conversacionesArray =
                    Object.entries(data)
                        .map(
                            ([id, value]) => ({
                                ...(value || {}),
                                id
                            })
                        );


                renderizarConversaciones();


                if(
                    document
                        .getElementById(
                            "agentsView"
                        )
                        ?.classList.contains(
                            "hidden"
                        ) === false
                ){

                    renderizarAgentes();

                }


                if(
                    document
                        .getElementById(
                            "historyView"
                        )
                        ?.classList.contains(
                            "hidden"
                        ) === false
                ){

                    renderizarListaHistorial();

                }


                if(
                    conversacionSeleccionada
                ){

                    const actual =
                        conversacionesArray.find(
                            c =>
                                c.id ===
                                conversacionSeleccionada.id
                        );


                    if(actual){

                        conversacionSeleccionada =
                            actual;

                        renderizarMensajes(actual);

                    }

                }

            },
            error => {

                console.error(
                    "ERROR LEYENDO CONVERSACIONES:",
                    error
                );


                const lista =
                    document.getElementById(
                        "conversationsList"
                    );


                if(lista){

                    lista.innerHTML = `
                        <div class="empty">
                            No se pudieron cargar las conversaciones.
                        </div>
                    `;

                }

            }
        );

}


/* =========================================================
   SESIÓN
========================================================= */

onAuthStateChanged(
    auth,
    user => {

        usuarioActual =
            user;


        const login =
            document.getElementById(
                "login"
            );


        const appElement =
            document.getElementById(
                "app"
            );


        if(!user){

            nombreUsuarioActual = "";

            login.classList.remove(
                "hidden"
            );

            appElement.classList.add(
                "hidden"
            );

            return;

        }


        const nombre =
            obtenerNombreUsuarioPorEmail(
                user.email
            );


        if(!nombre){

            console.error(
                "No hay nombre configurado para:",
                user.email
            );


            signOut(auth);

            document
                .getElementById(
                    "loginError"
                )
                .textContent =
                    "Este usuario todavía no está configurado en el sistema.";

            return;

        }


        nombreUsuarioActual =
            nombre;


        login.classList.add(
            "hidden"
        );


        appElement.classList.remove(
            "hidden"
        );


        document
            .getElementById(
                "usuarioNombre"
            )
            .textContent =
                nombreUsuarioActual;


        document
            .getElementById(
                "usuarioRol"
            )
            .textContent =
                obtenerRolUsuario();


        configurarInterfazPorRol();

        escucharConversaciones();

        mostrarVista("principal");

    }
);

/* =========================================================
   UTILIDADES
========================================================= */

function formatearFecha(valor){

    if(!valor){
        return "";
    }


    let fecha;


    if(
        typeof valor === "number"
    ){

        fecha =
            new Date(valor);

    }else{

        fecha =
            new Date(valor);

    }


    if(
        isNaN(
            fecha.getTime()
        )
    ){

        return String(valor);

    }


    return fecha.toLocaleString(
        "es-AR",
        {
            day:"2-digit",
            month:"2-digit",
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


function escaparHTML(valor){

    return String(
        valor ?? ""
    )
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function escaparAtributo(valor){

    return escaparHTML(valor);

}
