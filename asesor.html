/* ============================================================

============================================================ */

function obtenerRolUsuario() {

  return perfiles[nombreUsuarioActual] || "asesor";

}


function esSupervisor() {

  return obtenerRolUsuario() === "supervisor";

}


function esSenior() {

============================================================ */

function obtenerEquiposDelUsuario(nombre) {

  const resultado = [];

  Object.entries(equipos).forEach(([equipo, datos]) => {

    if (
      datos.seniors.includes(nombre) ||
      datos.gestores.includes(nombre)
    ) {
      resultado.push(equipo);
    }

  });

  return resultado;

}


function usuarioTieneEquipo(equipo) {

    nombreUsuarioActual
  ).includes(equipo);

}


/* ============================================================

function obtenerEquipoConversacion(c) {

  if (!c) return "";

  if (c.equipo) {
    return c.equipo;
  }

  if (c.team) {
    return c.team;
  }

  if (c.equipoAsignado) {
    return c.equipoAsignado;
  }

  if (c.asesorAsignado) {

    for (const [equipo, datos] of Object.entries(equipos)) {

      if (datos.gestores.includes(c.asesorAsignado)) {
        return equipo;
      }

    }

  }

  return "";

}

function esCuentaAsignadaAlUsuario(c) {

      usuarioActual?.email &&
      c.asesorEmail.toLowerCase() ===
      usuarioActual.email.toLowerCase()

  );

}

function puedeVerPorEquipo(c) {

  if (!c) return false;

  if (c.estado === "finalizada") return false;

  if (esSupervisor()) return true;

  const equipo = obtenerEquipoConversacion(c);

  if (!equipo) return false;

  return usuarioTieneEquipo(equipo);

}


function puedeGestionarConversacion(
  c,
  modo = "principal"
) {

  if (!c) return false;

  if (c.estado === "finalizada") return false;

  if (esSupervisor()) return true;

  if (
    modo === "equipo" ||
    modo === "agente"
  ) {
    return puedeVerPorEquipo(c);
  }

  return puedeVerEnPrincipal(c);

}


function puedeTomarConversacion(c) {

  if (!c) return false;

  if (c.estado === "finalizada") return false;

  if (
    c.asesorAsignado ||
    c.asesorEmail
  ) {
    return false;
  }

  return esSupervisor() || esSenior();

}


function puedeTransferirConversacion(c) {

  if (!c) return false;

  if (c.estado === "finalizada") return false;

  return esSupervisor() || esSenior();

}


/* ============================================================
   DNI
============================================================ */

function normalizarDni(valor) {

  return String(valor ?? "")
    .replace(/\D/g, "");

}


function obtenerDniConversacion(c) {

  if (!c) return "";

  const candidatos = [

    c.dni,
    c.DNI,
    c.documento,
    c.document,
    c.documentNumber,
    c.numeroDocumento,
    c.nroDocumento,
    c.nroDni,
    c.dniCliente,
    c.clienteDni,
    c.clienteDNI,
    c.clienteDocumento,
    c.documentoCliente,
    c.clientDni,
    c.clientDNI,
    c.customerDni,
    c.customerDNI,

    c.cliente?.dni,
    c.cliente?.DNI,
    c.cliente?.documento,
    c.cliente?.documentNumber,
    c.cliente?.numeroDocumento,

    c.datosCliente?.dni,
    c.datosCliente?.DNI,
    c.datosCliente?.documento,
    c.datosCliente?.documentNumber,
    c.datosCliente?.numeroDocumento,

    c.usuario?.dni,
    c.usuario?.DNI,
    c.usuario?.documento,

    c.customer?.dni,
    c.customer?.DNI,
    c.customer?.documento,

    c.client?.dni,
    c.client?.DNI,
    c.client?.documento

  ];

  for (const valor of candidatos) {

    const dni = normalizarDni(valor);

    if (dni) return dni;

  }

  return "";

}


/* ============================================================
   NOMBRE CLIENTE
============================================================ */

function obtenerNombreCliente(c) {

  if (!c) return "";

  const candidatos = [

    c.clienteNombre,
    c.nombreCliente,
    c.nombreCompletoCliente,
    c.clienteNombreCompleto,
    c.nombreCompleto,
    c.nombre,

    c.cliente?.nombreCompleto,
    c.cliente?.nombre,

    c.datosCliente?.nombreCompleto,
    c.datosCliente?.nombre,

    c.customer?.name,
    c.customer?.nombre,

    c.client?.name,
    c.client?.nombre

  ];

  for (const valor of candidatos) {

    if (
      typeof valor === "string" &&
      valor.trim()
    ) {
      return valor.trim();
    }

  }

  if (
    typeof c.cliente === "string" &&
    c.cliente.trim()
  ) {
    return c.cliente.trim();
  }

  return "";

}


function obtenerCliente(c) {

  const nombre = obtenerNombreCliente(c);

  if (nombre) return nombre;

  const dni = obtenerDniConversacion(c);

  if (dni) return "DNI " + dni;

  return "Sin identificar";

}

   INICIO DE SESIÓN
============================================================ */

document
  .getElementById("loginButton")
  .addEventListener(
    "click",
    iniciarSesion
  );


document

async function iniciarSesion() {

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;

  const error =
    document
      .getElementById("loginError");

  error.textContent = "";

  if (!email || !password) {

    error.textContent =
      "Ingresá correo y contraseña.";

    return;

  }

  try {

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  } catch (e) {

    console.error(e);

    error.textContent =
      traducirErrorFirebase(e);

  }

}


/* ============================================================
   ERRORES FIREBASE
============================================================ */

function traducirErrorFirebase(error) {

  const code = error?.code || "";

  if (
    code.includes("invalid-credential") ||
    code.includes("wrong-password")
  ) {
    return "El correo o la contraseña son incorrectos.";
  }

  if (
    code.includes("user-not-found")
  ) {
    return "No existe un usuario con ese correo.";
  }

  if (
    code.includes("invalid-email")
  ) {
    return "El correo electrónico no es válido.";
  }

  if (
    code.includes("too-many-requests")
  ) {
    return "Demasiados intentos. Esperá unos minutos.";
  }

  if (
    code.includes("api-key-not-valid")
  ) {
    return "La API Key de Firebase no es válida. Revisá la configuración de Firebase.";
  }

  return error?.message ||
    "No se pudo iniciar sesión.";

}


/* ============================================================
   AUTH STATE
============================================================ */

onAuthStateChanged(
  auth,
  usuario => {

    if (usuario) {

      usuarioActual = usuario;

      nombreUsuarioActual =
        emailsPorNombre[
          usuario.email.toLowerCase()
        ] || "";

      if (!nombreUsuarioActual) {

        const email = usuario.email.toLowerCase();

        nombreUsuarioActual =
          email.split("@")[0];

      }

      document
        .getElementById("loginScreen")
        .classList.add("hidden");

      document
        .getElementById("app")
        .classList.remove("hidden");

      actualizarUsuarioUI();

      iniciarAplicacion();

    } else {

      usuarioActual = null;

      nombreUsuarioActual = "";

      document
        .getElementById("loginScreen")
        .classList.remove("hidden");

      document
        .getElementById("app")
        .classList.add("hidden");

    }

  }
);

/* ============================================================
   CARGAR CONVERSACIONES
============================================================ */

function iniciarAplicacion() {

  const conversacionesRef =
    ref(db, "conversaciones");

  onValue(
    conversacionesRef,
    snapshot => {

      const datos =
        snapshot.val() || {};

      conversacionesArray =
        Object.entries(datos).map(
          ([id, valor]) => ({
            id,
            ...valor
          })
        );

      renderizarVistaConversaciones();

      renderizarAgentes();

      renderizarHistorial();

    },
    error => {

      console.error(
        "Error leyendo conversaciones:",
        error
      );

      mostrarErrorFirebase(
        "No se pudieron cargar las conversaciones: " +
        error.message
      );

    }
  );

}


/* ============================================================
   ERROR FIREBASE
============================================================ */

function mostrarErrorFirebase(mensaje) {

  const contenedor =
    document.getElementById("conversationItems");

  if (!contenedor) return;

  contenedor.innerHTML =
    `<div class="error-box">${escapeHtml(mensaje)}</div>`;

}


/* ============================================================
   ESCAPE HTML
============================================================ */

function escapeHtml(texto) {

  return String(texto ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* ============================================================
   FECHA
============================================================ */

function formatearFecha(valor) {

  if (!valor) return "";

  const fecha =
    new Date(valor);

  if (Number.isNaN(fecha.getTime())) {
    return "";
  }

  return fecha.toLocaleString(
    "es-AR",
    {
      day: "2-digit",
      month: "2-digit",
      hour: "2-digit",
      minute: "2-digit"
    }
  );

}


/* ============================================================
   ÚLTIMO MENSAJE
============================================================ */

function obtenerUltimoMensaje(c) {

  if (!c) return "";

  if (
    Array.isArray(c.mensajes) &&
    c.mensajes.length
  ) {

    const ultimo =
      c.mensajes[c.mensajes.length - 1];

    return ultimo.texto ||
      ultimo.mensaje ||
      ultimo.contenido ||
      "";

  }

  if (
    c.mensajes &&
    typeof c.mensajes === "object"
  ) {

    const lista =
      Object.values(c.mensajes);

    if (lista.length) {

      const ultimo =
        lista[lista.length - 1];

      return ultimo.texto ||
        ultimo.mensaje ||
        ultimo.contenido ||
        "";

    }

  }

  return c.ultimoMensaje ||
    c.mensaje ||
    "";

}


/* ============================================================
   VISTA PRINCIPAL
============================================================ */

function renderizarVistaConversaciones() {

  if (
    esSupervisor() &&
    vistaConversacionesModo === "principal"
  ) {

    renderizarGestoresPrincipal();

    return;

  }

  if (
    vistaConversacionesModo === "agente" &&
    gestorConsultado
  ) {

    renderizarConversacionesDeAgente(
      gestorConsultado
    );

    return;

  }

  renderizarConversaciones();

}


/* ============================================================
   CONVERSACIONES PRINCIPALES
============================================================ */

function renderizarConversaciones() {

  const contenedor =
    document.getElementById(
      "conversationItems"
    );

  if (!contenedor) return;

  const texto =
    document
      .getElementById(
        "conversationSearch"
      )
      .value
      .toLowerCase()
      .trim();

  const visibles =
    conversacionesArray
      .filter(
        c => c.estado !== "finalizada"
      )
      .filter(
        c => puedeVerEnPrincipal(c)
      )
      .filter(c => {

        if (!texto) return true;

        const cliente =
          obtenerCliente(c)
            .toLowerCase();

        const dni =
          obtenerDniConversacion(c);

        return (
          cliente.includes(texto) ||
          dni.includes(
            normalizarDni(texto)
          )
        );

      });

  document
    .getElementById(
      "conversationListTitle"
    )
    .textContent =
      "Mis conversaciones";

  if (!visibles.length) {

    contenedor.innerHTML =
      `<div style="padding:20px;color:#9ca3af">
        No hay conversaciones activas.
      </div>`;

    return;

  }

  contenedor.innerHTML =
    visibles
      .map(c => {

        const activo =
          conversacionSeleccionada?.id === c.id;

        return `
          <div
            class="conversation-item ${activo ? "active" : ""}"
            data-id="${escapeHtml(c.id)}"
          >

            <div class="conversation-client">
              ${escapeHtml(obtenerCliente(c))}
            </div>

            <div class="conversation-preview">
              ${escapeHtml(
                obtenerUltimoMensaje(c) ||
                "Sin mensajes"
              )}
            </div>

            <div class="conversation-meta">
              ${escapeHtml(
                c.asesorAsignado ||
                "Sin gestor"
              )}
            </div>

          </div>
        `;

      })
      .join("");

  contenedor
    .querySelectorAll(
      ".conversation-item"
    )
    .forEach(item => {

      item.addEventListener(
        "click",
        () => {

          mostrarConversacion(
            item.dataset.id,
            "principal"
          );

        }
      );

    });

}


/* ============================================================
   SUPERVISOR - GESTORES PRINCIPAL
============================================================ */

function renderizarGestoresPrincipal() {

  const contenedor =
    document.getElementById(
      "conversationItems"
    );

  const texto =
    document
      .getElementById(
        "conversationSearch"
      )
      .value
      .toLowerCase()
      .trim();

  document
    .getElementById(
      "conversationListTitle"
    )
    .textContent =
      "Gestores";

  const gestores = [];

  Object.entries(equipos)
    .forEach(
      ([equipo, datos]) => {

        datos.gestores.forEach(
          gestor => {

            if (
              !gestores.some(
                x => x.nombre === gestor
              )
            ) {

              gestores.push({
                nombre: gestor,
                equipo
              });

            }

          }
        );

      }
    );

  const filtrados =
    gestores.filter(
      g => {

        if (!texto) return true;

        return (
          g.nombre
            .toLowerCase()
            .includes(texto) ||
          g.equipo
            .toLowerCase()
            .includes(texto)
        );

      }
    );

  contenedor.innerHTML =
    filtrados.map(
      g => {

        const cantidad =
          conversacionesArray.filter(
            c =>
              c.estado !== "finalizada" &&
              c.asesorAsignado === g.nombre
          ).length;

        return `
          <div
            class="conversation-item"
            data-gestor="${escapeHtml(g.nombre)}"
          >

            <div class="conversation-client">
              ${escapeHtml(g.nombre)}
            </div>

            <div class="conversation-preview">
              Equipo ${escapeHtml(g.equipo)}
            </div>

            <div class="conversation-meta">
              ${cantidad} conversación(es) activa(s)
            </div>

          </div>
        `;

      }
    ).join("");

  contenedor
    .querySelectorAll(
      ".conversation-item"
    )
    .forEach(item => {

      item.addEventListener(
        "click",
        () => {

          verCuentasDelAgente(
            item.dataset.gestor
          );

        }
      );

    });

}

   VER CUENTAS DEL AGENTE

  vistaConversacionesModo = "agente";

  renderizarVistaConversaciones();

}


/* ============================================================
   CONVERSACIONES DE AGENTE
============================================================ */

function renderizarConversacionesDeAgente(
  nombre
) {

  const contenedor =
    document.getElementById(
      "conversationItems"
    );

  const texto =
    document
      .getElementById(
        "conversationSearch"
      )
      .value
      .toLowerCase()
      .trim();

  const visibles =
    conversacionesArray
      .filter(
        c =>
          c.estado !== "finalizada"
      )
      .filter(
        c =>
          c.asesorAsignado === nombre
      )
      .filter(c => {

        if (!texto) return true;

        return (
          obtenerCliente(c)
            .toLowerCase()
            .includes(texto) ||

          obtenerDniConversacion(c)
            .includes(
              normalizarDni(texto)
            )

        );

      });

  document
    .getElementById(
      "conversationListTitle"
    )
    .textContent =
      "Cuentas de " + nombre;

  contenedor.innerHTML =
    visibles.length
      ? visibles.map(c => {

          return `
            <div
              class="conversation-item"
              data-id="${escapeHtml(c.id)}"
            >

              <div class="conversation-client">
                ${escapeHtml(obtenerCliente(c))}
              </div>

              <div class="conversation-preview">
                ${escapeHtml(
                  obtenerUltimoMensaje(c) ||
                  "Sin mensajes"
                )}
              </div>

              <div class="conversation-meta">
                ${escapeHtml(
                  c.asesorAsignado || ""
                )}
              </div>

            </div>
          `;

        }).join("")
      :
        `<div style="padding:20px;color:#9ca3af">
          Este gestor no tiene cuentas activas.
        </div>`;

  contenedor
    .querySelectorAll(
      ".conversation-item"
    )
    .forEach(item => {

      item.addEventListener(
        "click",
        () => {

          mostrarConversacion(
            item.dataset.id,
            "agente"
          );

        }
      );

    });

}


/* ============================================================
   MOSTRAR CONVERSACIÓN
============================================================ */

function mostrarConversacion(
  id,
  modo = "principal"
) {

  const conversacion =
    conversacionesArray.find(
      c => c.id === id
    );

  if (!conversacion) return;

  if (
    !puedeGestionarConversacion(
      conversacion,
      modo
    ) &&
    modo !== "historial"
  ) {

    alert(
      "No tenés permiso para gestionar esta conversación."
    );

    return;

  }

  conversacionSeleccionada =
    conversacion;

  const chatPanel =
    document.getElementById(
      "chatPanel"
    );

  const cliente =
    obtenerCliente(conversacion);

  const dni =
    obtenerDniConversacion(
      conversacion
    );

  const finalizada =
    conversacion.estado === "finalizada";

  const puedeGestionar =
    modo !== "historial" &&
    puedeGestionarConversacion(
      conversacion,
      modo
    );

  chatPanel.innerHTML = `

    <div class="chat-header">

      <div>

        <div class="chat-client">
          ${escapeHtml(cliente)}
        </div>

        <div class="chat-info">

          ${dni
            ? "DNI: " + escapeHtml(dni)
            : "DNI no informado"
          }

          · Gestor:
          ${escapeHtml(
            conversacion.asesorAsignado ||
            "Sin gestor"
          )}

          ${
            finalizada
              ? ' · <span class="status-badge">Finalizada</span>'
              : ''
          }

        </div>

      </div>


      <div class="chat-actions">

        ${
          modo === "agente"
            ? `
              <button
                class="small-btn"
                id="backToAgentsButton"
              >
                ← Volver
              </button>
            `
            : ""
        }

        ${
          puedeGestionar &&
          puedeTomarConversacion(
            conversacion
          )
            ? `
              <button
                class="small-btn blue"
                id="takeConversationButton"
              >
                Tomar conversación
              </button>
            `
            : ""
        }

        ${
          puedeGestionar &&
          puedeTransferirConversacion(
            conversacion
          )
            ? `
              <button
                class="small-btn"
                id="transferConversationButton"
              >
                Transferir
              </button>
            `
            : ""
        }

        ${
          puedeGestionar &&
          !finalizada
            ? `
              <button
                class="small-btn green"
                id="finishConversationButton"
              >
                Finalizar
              </button>
            `
            : ""
        }

      </div>

    </div>


    <div
      id="messages"
      class="messages"
    ></div>


    <div
      id="messageArea"
      class="message-area"
    ></div>

  `;


  if (
    document.getElementById(
      "backToAgentsButton"
    )
  ) {

    document
      .getElementById(
        "backToAgentsButton"
      )
      .addEventListener(
        "click",
        () => {

          vistaConversacionesModo =
            "principal";

          gestorConsultado = "";

          conversacionSeleccionada =
            null;

          renderizarVistaConversaciones();

          document
            .getElementById(
              "chatPanel"
            )
            .className =
              "empty-chat";

          document
            .getElementById(
              "chatPanel"
            )
            .textContent =
              "Seleccioná una conversación";

        }
      );

  }


  if (
    document.getElementById(
      "takeConversationButton"
    )
  ) {

    document
      .getElementById(
        "takeConversationButton"
      )
      .addEventListener(
        "click",
        () => tomarConversacion(conversacion)
      );

  }


  if (
    document.getElementById(
      "transferConversationButton"
    )
  ) {

    document
      .getElementById(
        "transferConversationButton"
      )
      .addEventListener(
        "click",
        () =>
          abrirModalTransferencia(
            conversacion
          )
      );

  }


  if (
    document.getElementById(
      "finishConversationButton"
    )
  ) {

    document
      .getElementById(
        "finishConversationButton"
      )
      .addEventListener(
        "click",
        () =>
          finalizarConversacion(
            conversacion
          )
      );

  }


  renderizarMensajes(
    conversacion
  );

  actualizarFormularioMensaje(
    conversacion,
    puedeGestionar &&
    !finalizada
  );

}


/* ============================================================
   MENSAJES
============================================================ */

function obtenerMensajes(c) {

  if (!c?.mensajes) return [];

  if (Array.isArray(c.mensajes)) {

    return c.mensajes;

  }

  return Object.entries(
    c.mensajes
  ).map(
    ([id, mensaje]) => ({
      id,
      ...mensaje
    })
  );

}


function renderizarMensajes(c) {

  const contenedor =
    document.getElementById(
      "messages"
    );

  if (!contenedor) return;

  const mensajes =
    obtenerMensajes(c);

  if (!mensajes.length) {

    contenedor.innerHTML =
      `<div style="color:#9ca3af">
        No hay mensajes.
      </div>`;

    return;

  }

  contenedor.innerHTML =
    mensajes.map(
      mensaje => {

        const autor =
          mensaje.autor ||
          mensaje.usuario ||
          mensaje.remitente ||
          "";

        const esCliente =
          mensaje.tipo === "cliente" ||
          mensaje.remitente === "cliente" ||
          mensaje.autorTipo === "cliente";

        return `
          <div class="message ${
            esCliente
              ? "client"
              : "agent"
          }">

            <div class="message-author">
              ${escapeHtml(
                autor ||
                (
                  esCliente
                    ? "Cliente"
                    : "Gestor"
                )
              )}
            </div>

            <div>
              ${escapeHtml(
                mensaje.texto ||
                mensaje.mensaje ||
                mensaje.contenido ||
                ""
              )}
            </div>

            <div class="message-time">
              ${escapeHtml(
                formatearFecha(
                  mensaje.fecha ||
                  mensaje.timestamp ||
                  mensaje.createdAt
                )
              )}
            </div>

          </div>
        `;

      }
    ).join("");

  contenedor.scrollTop =
    contenedor.scrollHeight;

}


/* ============================================================
   FORMULARIO MENSAJE
============================================================ */

function actualizarFormularioMensaje(
  c,
  habilitado
) {

  const area =
    document.getElementById(
      "messageArea"
    );

  if (!area) return;

  if (!habilitado) {

    area.innerHTML =
      `<div style="color:#9ca3af;font-size:13px">
        Esta gestión es de solo lectura.
      </div>`;

    return;

  }

  area.innerHTML = `

    <textarea
      id="messageInput"
      placeholder="Escribí un mensaje..."
    ></textarea>

    <div class="send-row">

      <button
        class="send-btn"
        id="sendMessageButton"
      >
        Enviar
      </button>

    </div>

  `;


  document
    .getElementById(
      "sendMessageButton"
    )
    .addEventListener(
      "click",
      () => enviarMensaje(c)
    );


  document
    .getElementById(
      "messageInput"
    )
    .addEventListener(
      "keydown",
      e => {

        if (
          e.key === "Enter" &&
          !e.shiftKey
        ) {

          e.preventDefault();

          enviarMensaje(c);

        }

      }
    );

}


/* ============================================================
   ENVIAR MENSAJE
============================================================ */

async function enviarMensaje(c) {

  if (
    !puedeGestionarConversacion(
      c,
      vistaConversacionesModo === "agente"
        ? "agente"
        : "principal"
    )
  ) {

    return;

  }

  const input =
    document.getElementById(
      "messageInput"
    );

  if (!input) return;

  const texto =
    input.value.trim();

  if (!texto) return;

  const mensajesRef =
    ref(
      db,
      `conversaciones/${c.id}/mensajes`
    );

  await push(
    mensajesRef,
    {

      texto,

      autor:
        nombreUsuarioActual,

      autorEmail:
        usuarioActual?.email || "",

      tipo: "gestor",

      fecha:
        Date.now()

    }
  );

  await update(
    ref(
      db,
      `conversaciones/${c.id}`
    ),
    {
      ultimoMensaje: texto,
      actualizadoEn: Date.now()
    }
  );

  input.value = "";

}


/* ============================================================
   TOMAR CONVERSACIÓN
============================================================ */

async function tomarConversacion(c) {

  if (!puedeTomarConversacion(c)) {

    return;

  }

  await update(
    ref(
      db,
      `conversaciones/${c.id}`
    ),
    {

      asesorAsignado:
        nombreUsuarioActual,

      asesorEmail:
        usuarioActual?.email || "",

      actualizadoEn:
        Date.now()

    }
  );

}


/* ============================================================
   FINALIZAR
============================================================ */

async function finalizarConversacion(c) {

  if (
    !puedeGestionarConversacion(
      c,
      vistaConversacionesModo === "agente"
        ? "agente"
        : "principal"
    )
  ) {

    return;

  }

  const confirmar =
    confirm(
      "¿Querés finalizar esta conversación?"
    );

  if (!confirmar) return;

  await update(
    ref(
      db,
      `conversaciones/${c.id}`
    ),
    {

      estado: "finalizada",

      finalizadaEn:
        Date.now(),

      finalizadaPor:
        nombreUsuarioActual,

      finalizadaPorEmail:
        usuarioActual?.email || "",

      actualizadoEn:
        Date.now()

    }
  );

  conversacionSeleccionada =
    null;

  document
    .getElementById(
      "chatPanel"
    )
    .className =
      "empty-chat";

  document
    .getElementById(
      "chatPanel"
    )
    .textContent =
      "Seleccioná una conversación";

}

============================================================ */

function renderizarAgentes() {

  const grid =
    document.getElementById(
      "agentsGrid"
    );

  if (!grid) return;

  const search =
    document
      .getElementById(
        "agentsSearch"
      )
      .value
      .toLowerCase()
      .trim();

  const filtroEquipo =
    document
      .getElementById(
        "agentsTeamFilter"
      )
      .value;

  const agentes = [];

  Object.entries(equipos)
    .forEach(
      ([equipo, datos]) => {

        if (
          !esSupervisor() &&
          !usuarioTieneEquipo(equipo)
        ) {
          return;
        }

        datos.gestores.forEach(
          gestor => {

            if (
              !agentes.some(
                x => x.nombre === gestor
              )
            ) {

              agentes.push({
                nombre: gestor,
                equipo
              });

            }

          }
        );

      }
    );


  const filtrados =
    agentes.filter(
      agente => {

        if (
          filtroEquipo &&
          agente.equipo !== filtroEquipo
        ) {
          return false;
        }

        if (
          search &&
          !agente.nombre
            .toLowerCase()
            .includes(search)
        ) {
          return false;
        }

        return true;

      }
    );


  grid.innerHTML =
    filtrados.map(
      agente => {

        const cantidad =
          conversacionesArray.filter(
            c =>
              c.estado !== "finalizada" &&
              c.asesorAsignado ===
                agente.nombre
          ).length;

        return `

          <div
            class="agent-card"
            data-agent="${escapeHtml(
              agente.nombre
            )}"
          >

            <div class="agent-name">
              ${escapeHtml(
                agente.nombre
              )}
            </div>

            <div class="agent-team">
              Equipo ${escapeHtml(
                agente.equipo
              )}
            </div>

            <div class="agent-count">
              ${cantidad}
              conversación(es) activa(s)
            </div>

          </div>

        `;

      }
    ).join("");


  grid
    .querySelectorAll(
      ".agent-card"
    )
    .forEach(card => {

      card.addEventListener(
        "click",
        () => {

          mostrarVista(
            "conversations"
          );

          verCuentasDelAgente(
            card.dataset.agent
          );

        }
      );

    });

}


/* ============================================================
   HISTORIAL
============================================================ */

function obtenerConversacionesFinalizadas() {

  return conversacionesArray
    .filter(
      c =>
        c.estado === "finalizada"
    )
    .sort(
      (a, b) =>
        (
          b.finalizadaEn ||
          b.actualizadoEn ||
          b.fecha ||
          0
        ) -
        (
          a.finalizadaEn ||
          a.actualizadoEn ||
          a.fecha ||
          0
        )
    );

}


function renderizarHistorial() {

  const tabla =
    document.getElementById(
      "historyTable"
    );

  if (!tabla) return;

  const texto =
    document
      .getElementById(
        "historySearch"
      )
      .value
      .toLowerCase()
      .trim();

  const textoDni =
    normalizarDni(texto);

  const finalizadas =
    obtenerConversacionesFinalizadas()
      .filter(c => {

        if (!texto) return true;

        const cliente =
          obtenerCliente(c)
            .toLowerCase();

        const nombre =
          obtenerNombreCliente(c)
            .toLowerCase();

        const dni =
          obtenerDniConversacion(c);

        const gestor =
          String(
            c.asesorAsignado || ""
          ).toLowerCase();

        const equipo =
          obtenerEquipoConversacion(c)
            .toLowerCase();

        return (

          cliente.includes(texto) ||

          nombre.includes(texto) ||

          (
            textoDni &&
            dni.includes(textoDni)
          ) ||

          gestor.includes(texto) ||

          equipo.includes(texto)

        );

      });


  document
    .getElementById(
      "historyCounter"
    )
    .textContent =
      `${finalizadas.length} gestión(es)`;


  tabla.innerHTML =
    finalizadas.map(
      c => {

        const dni =
          obtenerDniConversacion(c);

        return `

          <tr>

            <td>
              ${escapeHtml(
                obtenerCliente(c)
              )}
            </td>

            <td>
              ${escapeHtml(
                dni || "-"
              )}
            </td>

            <td>
              ${escapeHtml(
                c.asesorAsignado ||
                "-"
              )}
            </td>

            <td>
              ${escapeHtml(
                obtenerEquipoConversacion(c) ||
                "-"
              )}
            </td>

            <td>
              ${escapeHtml(
                formatearFecha(
                  c.finalizadaEn
                )
              )}
            </td>

            <td>

              <button
                data-history-id="${escapeHtml(
                  c.id
                )}"
              >
                Ver gestión
              </button>

            </td>

          </tr>

        `;

      }
    ).join("");


  tabla
    .querySelectorAll(
      "button[data-history-id]"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        () =>
          verGestionHistorial(
            button.dataset.historyId
          )
      );

    });

}

function cargarGestoresTransferencia() {

  const equipo =
    document
      .getElementById(
        "transferTeam"
      )
      .value;

  const select =
    document.getElementById(
      "transferAgent"
    );

  select.innerHTML =
    `<option value="">
      Seleccionar gestor
    </option>`;

  if (!equipo) return;

  const datos =
    equipos[equipo];

  if (!datos) return;

  const gestores =
    datos.gestores.filter(
      gestor =>
        Object.values(
          emailsPorNombre
        ).includes(gestor)
    );

  if (!gestores.length) {

    select.innerHTML =
      `<option value="">
        No hay gestores configurados
      </option>`;

    return;

  }

  gestores.forEach(
    gestor => {

      const option =
        document.createElement(
          "option"
        );

      option.value = gestor;

      option.textContent =
        gestor;

      select.appendChild(
        option
      );

    }
  );

}


document
  .getElementById(
    "confirmTransfer"
  )
  .addEventListener(
    "click",
    confirmarTransferencia

async function confirmarTransferencia() {

  const c =
    conversacionTransferencia;

  if (!c) return;

  if (
    !puedeTransferirConversacion(c)
  ) {

    return;

  }

  const equipo =
    document
      .getElementById(
        "transferTeam"
      )
      .value;

  const gestor =
    document
      .getElementById(
        "transferAgent"
      )
      .value;

  if (!equipo || !gestor) {

    alert(
      "Seleccioná equipo y gestor."
    );

    return;

  }

  const emailGestor =
    Object.entries(
      emailsPorNombre
    ).find(
      ([email, nombre]) =>
        nombre === gestor
    )?.[0] || "";

  if (!emailGestor) {

    alert(
      "Ese gestor todavía no tiene un correo configurado."
    );

    return;

  }

  await update(
    ref(
      db,
      `conversaciones/${c.id}`
    ),
    {

      asesorAsignado:
        gestor,

      asesorEmail:
        emailGestor,

      equipo:
        equipo,

      transferidoPor:
        nombreUsuarioActual,

      transferidoEn:
        Date.now(),

      actualizadoEn:
        Date.now()

    }
  );

  cerrarModalTransferencia();

}
