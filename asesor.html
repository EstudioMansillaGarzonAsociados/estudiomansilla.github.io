<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f8;
    color:#202124;
}

button,
input,
textarea,
select{
    font-family:inherit;
}

.hidden{
    display:none !important;
}

/* LOGIN */

#login{
    width:100%;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f4f6f8;
}

.login-box{
    width:380px;
    background:white;
    padding:35px;
    border-radius:16px;
    box-shadow:0 8px 30px rgba(0,0,0,.10);
}

.login-box h1{
    margin-top:0;
    text-align:center;
}

.login-box input{
    width:100%;
    padding:13px;
    margin-bottom:12px;
    border:1px solid #ddd;
    border-radius:8px;
}

.login-box button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:8px;
    background:#111827;
    color:white;
    cursor:pointer;
}

#loginError{
    color:#c62828;
    margin-top:12px;
    font-size:14px;
    line-height:1.5;
}

/* APP */

#app{
    height:100vh;
    display:flex;
    overflow:hidden;
}

.sidebar{
    width:270px;
    background:#111827;
    color:white;
    display:flex;
    flex-direction:column;
}

.logo{
    padding:24px 20px;
    font-size:21px;
    font-weight:bold;
    border-bottom:1px solid rgba(255,255,255,.1);
}

.user-box{
    padding:18px 20px;
    border-bottom:1px solid rgba(255,255,255,.1);
}

.user-name{
    font-weight:bold;
}

.user-role{
    font-size:13px;
    opacity:.7;
    margin-top:4px;
}

.menu{
    padding:12px;
}

.menu button{
    width:100%;
    text-align:left;
    padding:12px 14px;
    border:none;
    background:transparent;
    color:white;
    border-radius:8px;
    cursor:pointer;
    margin-bottom:5px;
}

.menu button:hover,
.menu button.active{
    background:rgba(255,255,255,.12);
}

.logout{
    margin-top:auto;
    padding:15px;
    border-top:1px solid rgba(255,255,255,.1);
}

.logout button{
    width:100%;
    padding:10px;
    border:none;
    border-radius:8px;
    background:#374151;
    color:white;
    cursor:pointer;
}

/* MAIN */

.main{
    flex:1;
    display:flex;
    min-width:0;
}

.conversations-panel{
    width:360px;
    background:white;
    border-right:1px solid #ddd;
    display:flex;
    flex-direction:column;
}

.panel-header{
    padding:18px;
    border-bottom:1px solid #ddd;
}

.panel-header h2{
    margin:0;
    font-size:19px;
}

.panel-subtitle{
    color:#777;
    font-size:13px;
    margin-top:5px;
}

.search-box{
    padding:12px;
    border-bottom:1px solid #eee;
}

.search-box input{
    width:100%;
    padding:10px;
    border:1px solid #ddd;
    border-radius:8px;
}

.conversations-list{
    flex:1;
    overflow-y:auto;
}

.conversation-item{
    padding:15px;
    border-bottom:1px solid #eee;
    cursor:pointer;
}

.conversation-item:hover{
    background:#f7f7f7;
}

.conversation-item.active{
    background:#eef3ff;
}

.conversation-name{
    font-weight:bold;
}

.conversation-dni{
    font-size:12px;
    color:#777;
    margin-top:3px;
}

.conversation-message{
    font-size:13px;
    color:#666;
    margin-top:7px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.conversation-date{
    font-size:11px;
    color:#999;
    margin-top:7px;
}

.empty{
    padding:30px 20px;
    text-align:center;
    color:#888;
}

/* CHAT */

.chat-panel{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    background:#f5f6f8;
}

.chat-empty{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#888;
}

.chat-header{
    background:white;
    border-bottom:1px solid #ddd;
    padding:15px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.chat-client{
    font-size:18px;
    font-weight:bold;
}

.chat-info{
    font-size:13px;
    color:#777;
    margin-top:4px;
}

.chat-actions{
    display:flex;
    gap:8px;
}

.btn{
    border:none;
    border-radius:7px;
    padding:9px 13px;
    cursor:pointer;
}

.btn-primary{
    background:#111827;
    color:white;
}

.btn-secondary{
    background:#e5e7eb;
    color:#111827;
}

.btn-danger{
    background:#dc2626;
    color:white;
}

.btn-success{
    background:#16a34a;
    color:white;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

.message{
    max-width:70%;
    margin-bottom:12px;
    padding:11px 13px;
    border-radius:12px;
    background:white;
    box-shadow:0 1px 2px rgba(0,0,0,.05);
}

.message.mine{
    margin-left:auto;
    background:#dbeafe;
}

.message-author{
    font-size:11px;
    font-weight:bold;
    margin-bottom:4px;
}

.message-time{
    font-size:10px;
    color:#888;
    margin-top:5px;
}

.message-form{
    background:white;
    border-top:1px solid #ddd;
    padding:12px;
    display:flex;
    gap:10px;
}

.message-form textarea{
    flex:1;
    resize:none;
    height:60px;
    padding:10px;
    border:1px solid #ddd;
    border-radius:8px;
}

.message-form button{
    width:100px;
}

/* AGENTES */

.agents-view,
.history-view{
    flex:1;
    overflow:auto;
    padding:25px;
}

.section-title{
    font-size:22px;
    font-weight:bold;
    margin-bottom:20px;
}

.agents-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:15px;
}

.agent-card{
    background:white;
    border:1px solid #ddd;
    border-radius:12px;
    padding:18px;
    cursor:pointer;
}

.agent-card:hover{
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.agent-name{
    font-size:17px;
    font-weight:bold;
}

.agent-team{
    color:#777;
    font-size:13px;
    margin-top:4px;
}

.agent-count{
    margin-top:12px;
    font-size:13px;
}

/* HISTORY */

.history-search{
    display:flex;
    gap:10px;
    margin-bottom:18px;
}

.history-search input{
    flex:1;
    padding:11px;
    border:1px solid #ddd;
    border-radius:8px;
}

.history-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.history-item{
    background:white;
    padding:16px;
    border:1px solid #ddd;
    border-radius:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.history-client{
    font-weight:bold;
}

.history-info{
    font-size:13px;
    color:#777;
    margin-top:4px;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:1000;
}

.modal-box{
    background:white;
    width:430px;
    max-width:90%;
    border-radius:14px;
    padding:22px;
}

.modal-box h3{
    margin-top:0;
}

.modal-box select{
    width:100%;
    padding:11px;
    border:1px solid #ddd;
    border-radius:8px;
    margin-bottom:12px;
}

.modal-buttons{
    display:flex;
    justify-content:flex-end;
    gap:8px;
}

@media(max-width:800px){

    .sidebar{
        width:210px;
    }

    .conversations-panel{
        width:300px;
    }

}
