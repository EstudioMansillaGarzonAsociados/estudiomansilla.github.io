<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centro de Atención | Estudio Mansilla Garzon y Asociados</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --verde: #2f6f58;
      --verde-oscuro: #214d3e;
      --verde-claro: #eaf4ef;
      --fondo: #f5f7f6;
      --blanco: #ffffff;
      --texto: #26332e;
      --texto-suave: #718079;
      --borde: #e2e8e5;
      --rojo: #c95b5b;
      --amarillo: #d69b35;
      --azul: #5279a8;
      --sombra: 0 8px 25px rgba(35, 58, 48, .08);
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--fondo);
      color: var(--texto);
      height: 100vh;
      overflow: hidden;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================
       LOGIN
    ========================= */

    #loginScreen {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #edf5f0, #f8faf9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .login-box {
      width: min(420px, calc(100% - 32px));
      background: white;
      border-radius: 22px;
      padding: 38px;
      box-shadow: 0 20px 60px rgba(30, 60, 45, .14);
      border: 1px solid var(--borde);
    }

    .login-logo {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: var(--verde);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 27px;
      font-weight: 800;
      margin: 0 auto 20px;
    }

    .login-box h1 {
      text-align: center;
      margin: 0;
      font-size: 22px;
    }

    .login-subtitle {
      text-align: center;
      color: var(--texto-suave);
      margin: 8px 0 28px;
      font-size: 14px;
    }

    .field {
      margin-bottom: 15px;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 7px;
      color: #52615a;
    }

    .field input {
      width: 100%;
      border: 1px solid var(--borde);
      border-radius: 11px;
      padding: 13px 14px;
      outline: none;
      background: #fbfcfc;
    }

    .field input:focus {
      border-color: var(--verde);
      box-shadow: 0 0 0 3px rgba(47,111,88,.08);
    }

    .login-button {
      width: 100%;
      border: 0;
      border-radius: 11px;
      padding: 13px;
      background: var(--verde);
      color: white;
      font-weight: 800;
      margin-top: 7px;
    }

    .login-button:hover {
      background: var(--verde-oscuro);
    }

    #loginError {
      display: none;
      background: #fff1f1;
      border: 1px solid #f1cccc;
      color: #a44343;
      border-radius: 10px;
      padding: 11px;
      margin-top: 15px;
      font-size: 12px;
      line-height: 1.45;
    }

    /* =========================
       APP
    ========================= */

    #app {
      display: none;
      height: 100vh;
      width: 100%;
    }

    .app-shell {
      height: 100vh;
      display: grid;
      grid-template-columns: 250px 340px minmax(0, 1fr);
      overflow: hidden;
    }

    /* =========================
       SIDEBAR
    ========================= */

    .sidebar {
      background: #ffffff;
      border-right: 1px solid var(--borde);
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .brand {
      padding: 25px 20px 20px;
      border-bottom: 1px solid var(--borde);
    }

    .brand-title {
      font-weight: 900;
      font-size: 16px;
      line-height: 1.25;
      color: var(--verde-oscuro);
    }

    .brand-subtitle {
      margin-top: 5px;
      color: var(--texto-suave);
      font-size: 12px;
    }

    .user-box {
      margin: 17px 14px;
      padding: 13px;
      background: var(--verde-claro);
      border-radius: 14px;
    }

    .user-name {
      font-size: 13px;
      font-weight: 800;
    }

    .user-role {
      font-size: 11px;
      color: var(--texto-suave);
      margin-top: 3px;
      text-transform: capitalize;
    }

    .presence {
      margin-top: 9px;
      position: relative;
    }

    .presence-button {
      width: 100%;
      border: 1px solid #d8e6df;
      background: white;
      border-radius: 9px;
      padding: 8px 9px;
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      font-weight: 700;
      color: #405049;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #aab5b0;
      flex-shrink: 0;
    }

    .status-dot.active {
      background: #4fa36f;
    }

    .status-dot.break {
      background: #d59b3c;
    }

    .status-dot.rest {
      background: #6d91b8;
    }

    .status-dot.finished {
      background: #a9b1ae;
    }

    .presence-menu {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 5px);
      background: white;
      border: 1px solid var(--borde);
      border-radius: 10px;
      box-shadow: var(--sombra);
      overflow: hidden;
      z-index: 100;
    }

    .presence-menu button {
      display: block;
      width: 100%;
      border: 0;
      background: white;
      text-align: left;
      padding: 10px;
      font-size: 11px;
    }

    .presence-menu button:hover {
      background: #f4f7f5;
    }

    .nav {
      padding: 5px 12px;
      flex: 1;
    }

    .nav-btn {
      width: 100%;
      border: 0;
      background: transparent;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 12px;
      margin-bottom: 4px;
      border-radius: 11px;
      color: #53615b;
      font-size: 13px;
      font-weight: 700;
      text-align: left;
    }

    .nav-btn:hover {
      background: #f2f6f4;
    }

    .nav-btn.active {
      background: var(--verde-claro);
      color: var(--verde-oscuro);
    }

    .nav-icon {
      width: 21px;
      text-align: center;
      font-size: 16px;
    }

    .nav-badge {
      margin-left: auto;
      min-width: 21px;
      height: 21px;
      border-radius: 20px;
      background: #e6ece9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      padding: 0 5px;
    }

    .logout-area {
      padding: 15px;
      border-top: 1px solid var(--borde);
    }

    .logout {
      width: 100%;
      border: 0;
      background: #f6f7f7;
      border-radius: 10px;
      padding: 10px;
      color: #69746f;
      font-size: 12px;
      font-weight: 700;
    }

    /* =========================
       LIST
    ========================= */

    .list-panel {
      background: #f9fbfa;
      border-right: 1px solid var(--borde);
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .list-header {
      padding: 22px 18px 13px;
      border-bottom: 1px solid var(--borde);
      background: white;
    }

    .list-title {
      font-size: 18px;
      font-weight: 850;
      margin-bottom: 12px;
    }

    .search {
      position: relative;
    }

    .search input {
      width: 100%;
      border: 1px solid var(--borde);
      background: #f8faf9;
      border-radius: 10px;
      padding: 10px 12px 10px 35px;
      outline: none;
      font-size: 12px;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 9px;
      font-size: 13px;
      color: #87928d;
    }

    #items {
      overflow-y: auto;
      padding: 12px;
      flex: 1;
    }

    .empty {
      text-align: center;
      color: #89948f;
      font-size: 12px;
      line-height: 1.5;
      padding: 35px 15px;
    }

    /* =========================
       CARDS
    ========================= */

    .client-card,
    .agent-card {
      background: white;
      border: 1px solid var(--borde);
      border-radius: 13px;
      padding: 13px;
      margin-bottom: 9px;
      cursor: pointer;
      transition: .15s ease;
    }

    .client-card:hover,
    .agent-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 5px 16px rgba(35,58,48,.07);
      border-color: #cadbd3;
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      gap: 9px;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      background: var(--verde-claro);
      color: var(--verde-oscuro);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 13px;
      flex-shrink: 0;
    }

    .card-main {
      min-width: 0;
      flex: 1;
    }

    .card-name {
      font-size: 13px;
      font-weight: 850;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-dni {
      font-size: 12px;
      font-weight: 800;
      color: var(--verde-oscuro);
      margin-top: 2px;
    }

    .card-secondary {
      color: var(--texto-suave);
      font-size: 10px;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-meta {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .tag {
      background: #f0f4f2;
      color: #5e6c65;
      border-radius: 20px;
      padding: 4px 7px;
      font-size: 9px;
      font-weight: 750;
    }

    .tag.green {
      background: #e9f5ee;
      color: #347254;
    }

    .tag.yellow {
      background: #fff6df;
      color: #946b1e;
    }

    .tag.red {
      background: #fff0f0;
      color: #9f4949;
    }

    .agent-card {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .agent-avatar {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: #eaf2ef;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 900;
      color: var(--verde-oscuro);
    }

    .agent-info {
      min-width: 0;
      flex: 1;
    }

    .agent-name {
      font-size: 13px;
      font-weight: 850;
    }

    .agent-team {
      font-size: 10px;
      color: var(--texto-suave);
      margin-top: 4px;
    }

    .presence-small {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 5px;
      font-size: 9px;
      color: #76827d;
    }

    /* =========================
       CHAT
    ========================= */

    .chat-panel {
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: #f8faf9;
    }

    .chat-empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #84918b;
      padding: 30px;
    }

    .chat-empty-icon {
      font-size: 44px;
      margin-bottom: 10px;
    }

    .chat-empty h2 {
      margin: 0 0 7px;
      color: #4e5b55;
      font-size: 18px;
    }

    .chat-empty p {
      margin: 0;
      font-size: 12px;
    }

    .chat-content {
      display: none;
      height: 100%;
      flex-direction: column;
      min-height: 0;
    }

    .chat-header {
      background: white;
      border-bottom: 1px solid var(--borde);
      padding: 13px 18px;
      display: flex;
      align-items: center;
      gap: 11px;
      min-height: 69px;
    }

    .chat-header-main {
      flex: 1;
      min-width: 0;
    }

    .chat-header-name {
      font-weight: 850;
      font-size: 15px;
    }

    .chat-header-sub {
      color: var(--texto-suave);
      font-size: 10px;
      margin-top: 3px;
    }

    .header-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .small-button {
      border: 1px solid var(--borde);
      background: white;
      border-radius: 8px;
      padding: 7px 9px;
      font-size: 10px;
      font-weight: 750;
      color: #526059;
    }

    .small-button:hover {
      background: #f3f6f4;
    }

    .small-button.primary {
      background: var(--verde);
      border-color: var(--verde);
      color: white;
    }

    .small-button.danger {
      background: #fff2f2;
      border-color: #f0d2d2;
      color: #a54b4b;
    }

    /* =========================
       CLIENT FICHA
    ========================= */

    .client-ficha {
      background: white;
      border-bottom: 1px solid var(--borde);
      padding: 12px 18px;
    }

    .ficha-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(120px, 1fr));
      gap: 8px;
    }

    .ficha-item {
      background: #f7f9f8;
      border-radius: 9px;
      padding: 8px 10px;
      min-width: 0;
    }

    .ficha-label {
      font-size: 8px;
      text-transform: uppercase;
      letter-spacing: .4px;
      color: #8a9590;
      font-weight: 800;
      margin-bottom: 3px;
    }

    .ficha-value {
      font-size: 11px;
      color: #3f4e47;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* =========================
       MESSAGES
    ========================= */

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .message-row {
      display: flex;
      width: 100%;
    }

    .message-row.mine {
      justify-content: flex-end;
    }

    .message-bubble {
      max-width: min(70%, 650px);
      border-radius: 13px;
      padding: 9px 11px;
      background: white;
      border: 1px solid var(--borde);
      font-size: 12px;
      line-height: 1.45;
    }

    .message-row.mine .message-bubble {
      background: var(--verde-claro);
      border-color: #d8e9df;
    }

    .message-sender {
      font-size: 9px;
      font-weight: 850;
      color: var(--verde-oscuro);
      margin-bottom: 3px;
    }

    .message-time {
      font-size: 8px;
      color: #8d9893;
      text-align: right;
      margin-top: 5px;
    }

    .message-image {
      max-width: 330px;
      max-height: 330px;
      border-radius: 9px;
      display: block;
      cursor: pointer;
    }

    /* =========================
       COMPOSER
    ========================= */

    .composer {
      background: white;
      border-top: 1px solid var(--borde);
      padding: 11px 14px;
      display: flex;
      gap: 7px;
      align-items: flex-end;
    }

    .composer textarea {
      flex: 1;
      min-height: 40px;
      max-height: 120px;
      resize: none;
      border: 1px solid var(--borde);
      border-radius: 10px;
      padding: 10px;
      outline: none;
      font-size: 12px;
    }

    .composer textarea:focus {
      border-color: var(--verde);
    }

    .icon-button {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 1px solid var(--borde);
      background: white;
      font-size: 17px;
    }

    .send-button {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 10px;
      background: var(--verde);
      color: white;
      font-size: 16px;
    }

    .read-only {
      padding: 12px 18px;
      background: #f1f4f2;
      border-top: 1px solid var(--borde);
      color: #77837d;
      text-align: center;
      font-size: 11px;
      font-weight: 700;
    }

    /* =========================
       MODAL
    ========================= */

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(25, 39, 33, .38);
      z-index: 5000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal {
      width: min(450px, 100%);
      background: white;
      border-radius: 17px;
      padding: 22px;
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
    }

    .modal h3 {
      margin: 0 0 18px;
      font-size: 17px;
    }

    .modal label {
      display: block;
      font-size: 11px;
      font-weight: 800;
      margin: 12px 0 6px;
    }

    .modal select {
      width: 100%;
      border: 1px solid var(--borde);
      border-radius: 9px;
      padding: 10px;
      background: white;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 7px;
      margin-top: 20px;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 1000px) {
      .app-shell {
        grid-template-columns: 220px 300px minmax(0, 1fr);
      }

      .ficha-grid {
        grid-template-columns: repeat(2, minmax(120px, 1fr));
      }
    }

    @media (max-width: 760px) {
      body {
        overflow: auto;
      }

      #app,
      .app-shell {
        height: auto;
        min-height: 100vh;
      }

      .app-shell {
        display: flex;
        flex-direction: column;
      }

      .sidebar {
        min-height: auto;
      }

      .nav {
        display: flex;
        overflow-x: auto;
      }

      .nav-btn {
        min-width: 120px;
      }

      .list-panel {
        min-height: 400px;
      }

      .chat-panel {
        min-height: 650px;
      }

      .header-actions {
        display: none;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       LOGIN
  ========================== -->

  <div id="loginScreen">
    <div class="login-box">
      <div class="login-logo">M</div>

      <h1>Estudio Mansilla Garzon y Asociados</h1>
      <div class="login-subtitle">Centro de Atención</div>

      <form id="loginForm">
        <div class="field">
          <label for="emailInput">Email</label>
          <input
            id="emailInput"
            type="email"
            autocomplete="username"
            placeholder="Ingresá tu email"
            required
          >
        </div>

        <div class="field">
          <label for="passwordInput">Contraseña</label>
          <input
            id="passwordInput"
            type="password"
            autocomplete="current-password"
            placeholder="Ingresá tu contraseña"
            required
          >
        </div>

        <button class="login-button" id="loginButton" type="submit">
          Iniciar sesión
        </button>
      </form>

      <div id="loginError"></div>
    </div>
  </div>


  <!-- =========================
       APP
  ========================== -->

  <div id="app">

    <div class="app-shell">

      <!-- SIDEBAR -->
      <aside class="sidebar">

        <div class="brand">
          <div class="brand-title">
            Estudio Mansilla Garzon y Asociados
          </div>
          <div class="brand-subtitle">
            Centro de Atención
          </div>
        </div>

        <div class="user-box">

          <div class="user-name" id="userName">
            —
          </div>

          <div class="user-role" id="userRole">
            —
          </div>

          <div class="presence">

            <button
              class="presence-button"
              id="presenceButton"
              type="button"
            >
              <span class="status-dot" id="presenceDot"></span>
              <span id="presenceText">Sin jornada</span>
            </button>

            <div
              class="presence-menu"
              id="presenceMenu"
            >
              <button type="button" data-presence="Activo">
                🟢 Activo
              </button>

              <button type="button" data-presence="Break">
                🟡 Break
              </button>

              <button type="button" data-presence="Descanso">
                🔵 Descanso
              </button>

              <button type="button" data-presence="Jornada finalizada">
                ⚪ Finalizar jornada
              </button>
            </div>

          </div>
        </div>


        <nav class="nav">

          <button
            class="nav-btn active"
            id="btnPrincipal"
            type="button"
            onclick="cambiarModo('principal')"
          >
            <span class="nav-icon">🏠</span>
            <span>Principal</span>
            <span class="nav-badge" id="badgePrincipal">0</span>
          </button>


          <button
            class="nav-btn"
            id="btnAgentes"
            type="button"
            onclick="cambiarModo('agentes')"
          >
            <span class="nav-icon">👥</span>
            <span>Agentes</span>
            <span class="nav-badge" id="badgeAgentes">0</span>
          </button>


          <button
            class="nav-btn"
            id="btnSinAsignar"
            type="button"
            onclick="cambiarModo('sinAsignar')"
          >
            <span class="nav-icon">📥</span>
            <span>Sin asignar</span>
            <span class="nav-badge" id="badgeSinAsignar">0</span>
          </button>


          <button
            class="nav-btn"
            id="btnHistorial"
            type="button"
            onclick="cambiarModo('historial')"
          >
            <span class="nav-icon">📚</span>
            <span>Historial</span>
            <span class="nav-badge" id="badgeHistorial">0</span>
          </button>

        </nav>


        <div class="logout-area">
          <button
            class="logout"
            id="logoutButton"
            type="button"
          >
            Cerrar sesión
          </button>
        </div>

      </aside>


      <!-- LISTA -->
      <section class="list-panel">

        <div class="list-header">

          <div
            class="list-title"

    function normalizarTexto(valor) {

      return String(valor || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim()
        .toLowerCase();

    }


    function escaparHTML(valor) {

      return String(valor ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function nombreInicial(nombre) {

      const partes = String(nombre || "")
        .trim()
        .split(/\s+/)
        .filter(Boolean);

      if (!partes.length) {
        return "C";
      }

      if (partes.length === 1) {
        return partes[0].substring(0, 2).toUpperCase();
      }

      return (
        partes[0][0] +
        partes[partes.length - 1][0]
      ).toUpperCase();

    }


    function formatearFecha(valor) {

      if (!valor) {
        return "—";
      }

      let fecha;

      if (typeof valor === "number") {
        fecha = new Date(valor);
      }
      else if (
        typeof valor === "string" &&
        !isNaN(Number(valor))
      ) {
        fecha = new Date(Number(valor));
      }
      else {
        fecha = new Date(valor);
      }

      if (isNaN(fecha.getTime())) {
        return String(valor);
      }

      return fecha.toLocaleString("es-AR", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });

    }


    function formatearSoloFecha(valor) {

      if (!valor) {
        return "—";
      }

      let fecha;

      if (typeof valor === "number") {
        fecha = new Date(valor);
      }
      else {
        fecha = new Date(valor);
      }

      if (isNaN(fecha.getTime())) {
        return String(valor);
      }

      return fecha.toLocaleDateString("es-AR");

    }

    function obtenerEquipoDeConversacion(c) {

      return (
        c.equipo ||
        c.nombreEquipo ||
        c.team ||
        c.equipoAsignado ||
        ""
      );

    function obtenerGestorDeConversacion(c) {

      return (
        c.gestor ||
        c.gestorAsignado ||
        c.asignadoA ||
        c.asesor ||
        c.usuarioAsignado ||

    function obtenerEmailGestor(c) {

      return (
        c.gestorEmail ||
        c.asignadoEmail ||
        c.emailGestor ||
        c.asesorEmail ||
        ""
      );

    }


    function obtenerEquipoDeGestor(nombre) {

      const resultado = [];

      for (const equipo in equipos) {

        if (
          equipos[equipo].gestores
            .some(
              x =>
                normalizarTexto(x) ===
                normalizarTexto(nombre)
            )
        ) {
          resultado.push(equipo);
        }

      }

      return resultado;

    }


    function obtenerEquipoDePersona(nombre) {

      const resultado = [];

      for (const equipo in equipos) {

        const pertenece =
          equipos[equipo].gestores.some(
            x =>
              normalizarTexto(x) ===
              normalizarTexto(nombre)
          ) ||
          equipos[equipo].seniors.some(
            x =>
              normalizarTexto(x) ===
              normalizarTexto(nombre)
          );

        if (pertenece) {
          resultado.push(equipo);
        }

      }

      return resultado;

    }


    function obtenerPersonaPorEmail(email) {

      const normalizado =
        normalizarTexto(email);

      if (emailsPorNombre[normalizado]) {
        return emailsPorNombre[normalizado];
      }

      return "";

    }


    /* ==========================================================

    ========================================================== */

    function esSupervisor() {
      return perfilActual === "supervisor";
    }

    function esSenior() {
      return perfilActual === "senior";
    }

    function esAsesor() {
      return perfilActual === "asesor";
    }


    function obtenerTodosLosGestores() {

      const lista = [];

      for (const equipo in equipos) {

        equipos[equipo].gestores.forEach(nombre => {

          if (!lista.includes(nombre)) {
            lista.push(nombre);
          }

        });

      }

      return lista;

    }


    function estaSinAsignar(c) {

      const gestor =
        obtenerGestorDeConversacion(c);

      const email =
        obtenerEmailGestor(c);

      return !gestor && !email;

    }


    function conversacionEsMia(c) {

      const gestor =
        normalizarTexto(
          obtenerGestorDeConversacion(c)
        );

      const email =
        normalizarTexto(
          obtenerEmailGestor(c)
        );

      const miNombre =
        normalizarTexto(nombreActual);

      const miEmail =
        normalizarTexto(
          usuarioActual?.email || ""
        );

      if (
        gestor &&
        gestor === miNombre
      ) {
        return true;
      }

      if (
        email &&
        miEmail &&
        email === miEmail
      ) {
        return true;
      }

      const nombrePorEmail =
        obtenerPersonaPorEmail(email);

      if (
        nombrePorEmail &&
        normalizarTexto(nombrePorEmail) ===
        miNombre
      ) {
        return true;
      }

      return false;

    }


    function puedeVerPorEquipo(c) {

      if (esSupervisor()) {
        return true;
      }

      let equipo =
        obtenerEquipoDeConversacion(c);

      if (!equipo) {

        const gestor =
          obtenerGestorDeConversacion(c);

        if (gestor) {

          const equiposGestor =
            obtenerEquipoDeGestor(gestor);

          if (equiposGestor.length) {
            equipo = equiposGestor[0];
          }

        }

      }

      if (!equipo) {

        const email =
          normalizarTexto(
            obtenerEmailGestor(c)
          );

        if (email) {

          const nombrePorEmail =
            emailsPorNombre[email];

          if (nombrePorEmail) {

            const equiposPersona =
              obtenerEquipoDePersona(
                nombrePorEmail
              );

            if (equiposPersona.length) {
              equipo = equiposPersona[0];
            }

          }

        }

      }

      if (!equipo) {
        return false;
      }

      const misEquipos =
        obtenerEquipoDePersona(
          nombreActual
        );

      return misEquipos.some(
        e =>
          normalizarTexto(e) ===
          normalizarTexto(equipo)
      );

    }


    function puedeGestionarConversacion(c) {

      if (esSupervisor()) {
        return true;
      }

      if (esSenior()) {
        return puedeVerPorEquipo(c);
      }

      if (esAsesor()) {
        return puedeVerPorEquipo(c);
      }

      return false;

    }


    function puedeAsignar() {

      return esSupervisor() || esSenior();

    }


    /* ==========================================================
       CONVERSACIONES
    ========================================================== */

    function conversacionesActivas() {

      return Object.entries(conversaciones)
        .map(([id, c]) => ({
          ...c,
          id
        }))
        .filter(
          c =>
            normalizarTexto(c.estado) !==
            "finalizada"
        );

    }


    function conversacionesFinalizadas() {

      return Object.entries(conversaciones)
        .map(([id, c]) => ({
          ...c,
          id
        }))
        .filter(
          c =>
            normalizarTexto(c.estado) ===
            "finalizada"
        );

    }


    function aplicarFiltroLista(lista) {

      const texto =
        normalizarTexto(
          document.getElementById("searchInput")?.value
        );

      if (!texto) {
        return lista;
      }

      return lista.filter(c => {

        const d =
          obtenerDatosCliente(c);

        const contenido = [

          d.nombre,
          d.dni,
          d.telefono,
          d.motivo,
          obtenerGestorDeConversacion(c),
          obtenerEquipoDeConversacion(c)

        ]
          .map(normalizarTexto)
          .join(" ");

        return contenido.includes(texto);

      });

    }

    function obtenerEstadoPresencia(nombre) {

      const encontrado =
        Object.values(presencias)
          .find(
            p =>
              normalizarTexto(p.nombre) ===
              normalizarTexto(nombre)
          );

      return encontrado?.estado || "Sin jornada";

    }


    function clasePresencia(estado) {

      switch (normalizarTexto(estado)) {

        case "activo":
          return "active";

        case "break":
          return "break";

        case "descanso":
          return "rest";

        case "jornada finalizada":
          return "finished";

        default:
          return "";

      }

    }


    function crearCardGestor(nombre) {

      const card =
        document.createElement("div");

      card.className = "agent-card";

      const equiposPersona =
        obtenerEquipoDePersona(nombre);

      const estado =
        obtenerEstadoPresencia(nombre);

      const cantidad =
        conversacionesActivas()
          .filter(
            c =>
              normalizarTexto(
                obtenerGestorDeConversacion(c)
              ) ===
              normalizarTexto(nombre)
          )
          .length;

      card.innerHTML = `

        <div class="agent-avatar">
          ${escaparHTML(nombreInicial(nombre))}
        </div>

        <div class="agent-info">

          <div class="agent-name">
            ${escaparHTML(nombre)}

          <div class="agent-team">
            ${escaparHTML(equiposPersona.join(" · "))}
          </div>

            <span

            ${escaparHTML(estado)}

            <span style="margin-left:4px;">
              · ${cantidad} activas
            </span>

          </div>

        </div>

      `;

      card.addEventListener(
        "click",
        () => abrirChatsDeGestor(nombre)
      );

      return card;

    }

      if (esSupervisor()) {

        let gestores =
          obtenerTodosLosGestores();

        gestores =
          gestores.sort(
            (a,b) =>
              a.localeCompare(b, "es")
          );

        if (!gestores.length) {

          items.innerHTML = `
            <div class="empty">
              No hay gestores para mostrar.
            </div>
          `;

          return;
        }

        gestores.forEach(
          nombre =>
            items.appendChild(
              crearCardGestor(nombre)
            )
        );

        return;

      }


      let lista =
        conversacionesActivas()
          .filter(
            c =>
              conversacionEsMia(c)
          );

      lista =
        aplicarFiltroLista(lista);

      lista.sort(
        (a,b) =>
          (b.fechaCreacion || 0) -
          (a.fechaCreacion || 0)
      );


      if (!lista.length) {

        items.innerHTML = `

          </div>
        `;

        return;

      }


      lista.forEach(
        c =>
          items.appendChild(
            crearCardCliente(c)
          )
      );

    /* ==========================================================
       AGENTES
    ========================================================== */

    function renderizarAgentes() {

      const items =
        document.getElementById("items");

      const titulo =
        document.getElementById("listTitle");

      items.innerHTML = "";

      titulo.textContent =
        "👥 Agentes";


      let gestores = [];


      if (esSupervisor()) {

        gestores =
          obtenerTodosLosGestores();

      }
      else {

        const misEquipos =
          obtenerEquipoDePersona(
            nombreActual
          );

        misEquipos.forEach(
          equipo => {

            const gestoresEquipo =
              equipos[equipo]?.gestores || [];

            gestoresEquipo.forEach(
              gestor => {

                if (
                  !gestores.includes(gestor)
                ) {
                  gestores.push(gestor);
                }

              }
            );

          }
        );

      }


      gestores =
        gestores.sort(
          (a,b) =>
            a.localeCompare(b, "es")
        );


      if (!gestores.length) {

        items.innerHTML = `
          <div class="empty">
            No hay gestores para mostrar.
          </div>
        `;

        return;

      }


      gestores.forEach(
        nombre =>
          items.appendChild(
            crearCardGestor(nombre)
          )
      );

    }

    /* ==========================================================
       CONTADORES
    ========================================================== */

    function actualizarContadores() {

      const activas =
        conversacionesActivas();

      const finalizadas =
        conversacionesFinalizadas();

      let principal = 0;
      let agentes = 0;
      let sinAsignar = 0;

      const historial =
        finalizadas.length;


      if (esSupervisor()) {

        principal =
          obtenerTodosLosGestores().length;

        agentes =
          activas.length;

        sinAsignar =
          activas.filter(
            c =>
              estaSinAsignar(c)
          ).length;

      }
      else if (esSenior()) {

        principal =
          activas.filter(
            c =>
              conversacionEsMia(c)
          ).length;

        agentes =
          activas.filter(
            c =>
              !estaSinAsignar(c) &&
              puedeVerPorEquipo(c)
          ).length;

        sinAsignar =
          activas.filter(
            c =>
              estaSinAsignar(c)
          ).length;

      }
      else {

        principal =
          activas.filter(
            c =>
              conversacionEsMia(c)
          ).length;

        agentes =
          activas.filter(
            c =>
              conversacionEsMia(c)
          ).length;

      }


      document
        .getElementById("badgePrincipal")
        .textContent = principal;

      document
        .getElementById("badgeAgentes")
        .textContent = agentes;

      document
        .getElementById("badgeSinAsignar")
        .textContent = sinAsignar;

      document
        .getElementById("badgeHistorial")
        .textContent = historial;

    }

    /* ==========================================================
       ABRIR CONVERSACIÓN
    ========================================================== */

    async function abrirConversacion(id) {

      const c =
        conversaciones[id];

      if (!c) {
        return;
      }

      conversacionSeleccionada =
        id;


      const datos =
        obtenerDatosCliente(c);

      const historial =
        normalizarTexto(c.estado) ===
        "finalizada";


      document
        .getElementById("chatEmpty")
        .style.display = "none";

      document
        .getElementById("chatContent")
        .style.display = "flex";


      const nombre =
        datos.nombre ||
        (
          datos.dni
            ? `DNI ${datos.dni}`
            : "Cliente sin datos"
        );


      document
        .getElementById("chatAvatar")
        .textContent =
        nombreInicial(nombre);


      document
        .getElementById("chatHeaderName")
        .textContent =
        nombre;


      let subtitulo = "";

      if (datos.dni) {
        subtitulo += `DNI ${datos.dni}`;
      }

      if (datos.telefono) {

        if (subtitulo) {
          subtitulo += " · ";
        }

        subtitulo +=
          `📞 ${datos.telefono}`;

      }


      document
        .getElementById("chatHeaderSub")
        .textContent =
        subtitulo || "Gestión";


      renderizarFicha(c);


      const gestionable =
        puedeGestionarConversacion(c);


      const assignButton =
        document.getElementById("assignButton");

      const finishButton =
        document.getElementById("finishButton");

      const composer =
        document.getElementById("composer");

      const readOnly =
        document.getElementById("readOnly");


      assignButton.style.display =
        (
          puedeAsignar() &&
          !historial
        )
          ? "block"
          : "none";


      finishButton.style.display =
        (
          gestionable &&
          !historial
        )
          ? "block"
          : "none";


      composer.style.display =
        (
          gestionable &&
          !historial
        )
          ? "flex"
          : "none";


      readOnly.style.display =
        historial
          ? "block"
          : "none";


      renderizarMensajes(c);


      if (conversacionListener) {
        conversacionListener();
        conversacionListener = null;
      }


      conversacionListener =
        onValue(
          ref(
            db,
            `conversaciones/${id}`
          ),
          snapshot => {

            const actualizado =
              snapshot.val();

            if (!actualizado) {
              return;
            }

            conversaciones[id] = actualizado;

            renderizarMensajes({
              ...actualizado,
              id
            });

            renderizarFicha({
              ...actualizado,
              id
            });

          }
        );

    }


    /* ==========================================================
       FICHA CLIENTE
    ========================================================== */

    function renderizarFicha(c) {

      const datos =
        obtenerDatosCliente(c);

      const equipo =
        obtenerEquipoDeConversacion(c);

      const gestor =
        obtenerGestorDeConversacion(c);

      const estado =
        normalizarTexto(c.estado) ===
        "finalizada"
          ? "Finalizada"
          : "Activa";


      const items = [

        {
          label: "Nombre",
          value: datos.nombre
        },

        {
          label: "DNI",
          value: datos.dni
        },

        {
          label: "Teléfono",
          value: datos.telefono
        },

        {
          label: "Fecha",
          value:
            datos.fecha
              ? formatearSoloFecha(datos.fecha)
              : ""
        },

        {
          label: "Motivo",
          value: datos.motivo
        },

        {
          label: "Equipo",
          value: equipo
        },

        {
          label: "Gestor",
          value: gestor
        },

        {
          label: "Estado",
          value: estado
        }

      ].filter(
        item =>
          item.value !== undefined &&
          item.value !== null &&
          String(item.value).trim() !== ""
      );


      const ficha =
        document.getElementById("clientFicha");


      ficha.innerHTML = `

        <div class="ficha-grid">

          ${items.map(
            item => `

              <div class="ficha-item">

                <div class="ficha-label">
                  ${escaparHTML(item.label)}
                </div>

                <div
                  class="ficha-value"
                  title="${escaparHTML(item.value)}"
                >
                  ${escaparHTML(item.value)}
                </div>

              </div>

            `
          ).join("")}

        </div>

      `;

    }


    /* ==========================================================
       MENSAJES
    ========================================================== */

    function renderizarMensajes(c) {

      const container =
        document.getElementById("messages");

      container.innerHTML = "";


      const mensajes =
        c.mensajes || {};


      const lista =
        Object.entries(mensajes)
          .map(
            ([id, mensaje]) => ({
              id,
              ...mensaje
            })
          )
          .sort(
            (a,b) =>
              (a.fecha || 0) -
              (b.fecha || 0)
          );


      if (!lista.length) {

        container.innerHTML = `
          <div
            style="
              text-align:center;
              color:#89948f;
              font-size:11px;
              padding:35px;
            "
          >
            No hay mensajes todavía.
          </div>
        `;

        return;

      }


      lista.forEach(
        mensaje => {

          const fila =
            document.createElement("div");

          const remitente =
            String(
              mensaje.remitente ||
              mensaje.autor ||
              mensaje.sender ||
              ""
            );


          const esMio =
            normalizarTexto(remitente) ===
            normalizarTexto(nombreActual)
            ||
            normalizarTexto(remitente) ===
            normalizarTexto(
              usuarioActual?.email || ""
            );


          fila.className =
            "message-row" +
            (esMio ? " mine" : "");


          const burbuja =
            document.createElement("div");

          burbuja.className =
            "message-bubble";


          if (remitente) {

            const sender =
              document.createElement("div");

            sender.className =
              "message-sender";

            sender.textContent =
              remitente;

            burbuja.appendChild(sender);

          }


          if (
            mensaje.tipo === "imagen" &&
            mensaje.url
          ) {

            const img =
              document.createElement("img");

            img.className =
              "message-image";

            img.src =
              mensaje.url;

            img.alt =
              "Imagen enviada";

            img.onclick =
              () =>
                window.open(
                  mensaje.url,
                  "_blank"
                );

            burbuja.appendChild(img);

          }
          else {

            const texto =
              document.createElement("div");

            texto.textContent =
              mensaje.texto || "";

            burbuja.appendChild(texto);

          }


          const hora =
            document.createElement("div");

          hora.className =
            "message-time";

          hora.textContent =
            formatearFecha(
              mensaje.fecha
            );

          burbuja.appendChild(hora);

          fila.appendChild(burbuja);

          container.appendChild(fila);

        }
      );


      container.scrollTop =
        container.scrollHeight;

    }


    /* ==========================================================
       ENVIAR MENSAJE
    ========================================================== */

    async function enviarMensaje() {

      if (!conversacionSeleccionada) {
        return;
      }


      const c =
        conversaciones[
          conversacionSeleccionada
        ];


      if (!c) {
        return;
      }


      if (!puedeGestionarConversacion(c)) {

        alert(
          "No tenés permiso para responder esta gestión."
        );

        return;

      }


      if (
        normalizarTexto(c.estado) ===
        "finalizada"
      ) {
        return;
      }


      const input =
        document.getElementById(
          "messageInput"
        );

      const texto =
        input.value.trim();


      if (!texto) {
        return;
      }


      const mensajesRef =
        ref(
          db,
          `conversaciones/${conversacionSeleccionada}/mensajes`
        );


      const nuevoMensaje =
        push(mensajesRef);


      await set(
        nuevoMensaje,
        {
          fecha: Date.now(),
          remitente: nombreActual,
          remitenteEmail:
            usuarioActual?.email || "",
          texto,
          tipo: "texto"
        }
      );


      input.value = "";

    }


    /* ==========================================================
       IMAGEN
    ========================================================== */

    async function enviarImagen(file) {

      if (!file) {
        return;
      }


      if (!conversacionSeleccionada) {
        return;
      }


      const c =
        conversaciones[
          conversacionSeleccionada
        ];


      if (
        !c ||
        !puedeGestionarConversacion(c)
      ) {

        alert(
          "No tenés permiso para enviar imágenes en esta gestión."
        );

        return;

      }


      if (
        normalizarTexto(c.estado) ===
        "finalizada"
      ) {
        return;
      }


      try {

        const extension =
          file.name.includes(".")
            ? file.name.split(".").pop()
            : "jpg";


        const ruta =
          `imagenes/${conversacionSeleccionada}/${Date.now()}_${Math.random().toString(36).slice(2)}.${extension}`;


        const archivoRef =
          storageRef(
            storage,
            ruta
          );


        await uploadBytes(
          archivoRef,
          file
        );


        const url =
          await getDownloadURL(
            archivoRef
          );


        const mensajesRef =
          ref(
            db,
            `conversaciones/${conversacionSeleccionada}/mensajes`
          );


        const nuevoMensaje =
          push(mensajesRef);


        await set(
          nuevoMensaje,
          {
            fecha: Date.now(),
            remitente: nombreActual,
            remitenteEmail:
              usuarioActual?.email || "",
            tipo: "imagen",
            url
          }
        );

      }
      catch (error) {

        console.error(error);

        alert(
          "No se pudo enviar la imagen. Revisá los permisos de Firebase Storage."
        );

      }

    }


    /* ==========================================================
       FINALIZAR
    ========================================================== */

    async function finalizarConversacion() {

      if (!conversacionSeleccionada) {
        return;
      }


      const c =
        conversaciones[
          conversacionSeleccionada
        ];


      if (!c) {
        return;
      }


      if (
        !puedeGestionarConversacion(c)
      ) {

        alert(
          "No tenés permiso para finalizar esta gestión."
        );

        return;

      }


      if (
        normalizarTexto(c.estado) ===
        "finalizada"
      ) {
        return;
      }


      const confirmar =
        confirm(
          "¿Querés finalizar esta gestión?\n\nLos mensajes y los datos del cliente se conservarán en Historial."
        );


      if (!confirmar) {
        return;
      }


      try {

        await update(
          ref(
            db,
            `conversaciones/${conversacionSeleccionada}`
          ),
          {

            estado: "finalizada",

            fechaFinalizacion:
              Date.now(),

            finalizadoPor:
              nombreActual,

            finalizadoPorEmail:
              usuarioActual?.email || "",

            motivoFinalizacion:
              "Finalizada desde Centro de Atención"

          }
        );


        abrirConversacion(
          conversacionSeleccionada
        );


        actualizarVistaActual();

      }
      catch (error) {

        console.error(error);

        alert(
          "No se pudo finalizar la gestión: " +
          traducirErrorFirebase(error)
        );

      }

    }

    function cargarGestoresModal(
      equipo,
      gestorSeleccionado = ""
    ) {

      const select =
        document.getElementById(
          "gestorSelect"
        );


      select.innerHTML = `

        <option value="">
          Sin asignar
        </option>

      `;


      if (!equipo) {
        return;
      }


      const lista =
        equipos[equipo]?.gestores || [];


      lista.forEach(
        nombre => {

          const option =
            document.createElement("option");

          option.value =
            nombre;

          option.textContent =
            nombre;

          select.appendChild(option);

        }
      );


      if (
        lista.some(
          x =>
            normalizarTexto(x) ===
            normalizarTexto(
              gestorSeleccionado
            )
        )
      ) {

        select.value =
          gestorSeleccionado;

          .getElementById(

    async function guardarAsignacion() {

      if (!puedeAsignar()) {
        return;
      }


      if (!conversacionSeleccionada) {
        return;
      }


      const equipo =
        document
          .getElementById("teamSelect")
          .value;

      const gestor =
        document
          .getElementById("gestorSelect")
          .value;


      const cambios = {

        equipo:
          equipo || null,

        nombreEquipo:
          equipo || null,

        equipoAsignado:
          equipo || null,

        gestor:
          gestor || null,

        gestorAsignado:
          gestor || null,

        asignadoA:
          gestor || null,

        asesor:
          gestor || null,

        usuarioAsignado:
          gestor || null,

        nombreGestor:
          gestor || null,

        gestorEmail: null,
        asignadoEmail: null,
        emailGestor: null,
        asesorEmail: null

      };


      await update(
        ref(
          db,
          `conversaciones/${conversacionSeleccionada}`
        ),
        cambios
      );


      cerrarModalAsignacion();

      actualizarVistaActual();

      abrirConversacion(
        conversacionSeleccionada
      );

    }


    /* ==========================================================
       VISTA ACTUAL
    ========================================================== */

    function actualizarVistaActual() {

      actualizarContadores();

      if (modoActual === "principal") {
        renderizarPrincipal();
      }

      if (modoActual === "agentes") {
        renderizarAgentes();
      }

      if (modoActual === "sinAsignar") {
        renderizarSinAsignar();
      }

      if (modoActual === "historial") {
        renderizarHistorial();
      }

    }


    /* ==========================================================
       PRESENCIA
    ========================================================== */

    async function actualizarPresencia(estado) {

      if (!usuarioActual) {
        return;
      }


      try {

        await set(
          ref(
            db,
            `presencia/${usuarioActual.uid}`
          ),
          {

            nombre:
              nombreActual,

            email:
              usuarioActual.email || "",

            estado,

            ultimaActualizacion:
              Date.now()

          }
        );


        actualizarBotonPresencia(
          estado
        );

      }
      catch (error) {

        console.error(
          "Error de presencia:",
          error
        );

        alert(
          "No se pudo actualizar tu estado de presencia. Revisá las reglas de Firebase."
        );

      }

    }


    function actualizarBotonPresencia(
      estado
    ) {

      const texto =
        document.getElementById(
          "presenceText"
        );

      const dot =
        document.getElementById(
          "presenceDot"
        );


      texto.textContent =
        estado;


      dot.className =
        "status-dot " +
        clasePresencia(estado);

    }


    /* ==========================================================
       SALUDO
    ========================================================== */

    function saludo() {

      const hora =
        new Date().getHours();


      if (hora >= 5 && hora < 12) {
        return `¡Buen día, ${nombreActual}! 👋`;
      }

      if (hora >= 12 && hora < 19) {
        return `¡Buenas tardes, ${nombreActual}! 👋`;
      }

      return `¡Buenas noches, ${nombreActual}! 👋`;

    }


    /* ==========================================================
       LOGIN / USUARIO
    ========================================================== */

    async function resolverNombreUsuario(
      user
    ) {

      const email =
        normalizarTexto(
          user.email || ""
        );


      if (emailsPorNombre[email]) {
        return emailsPorNombre[email];
      }


      if (
        user.displayName &&
        perfiles[user.displayName]
      ) {

        return user.displayName;

      }


      try {

        const snapshot =
          await get(
            ref(db, "usuarios")
          );


        const usuarios =
          snapshot.val() || {};


        for (
          const key in usuarios
        ) {

          const registro =
            usuarios[key];

          if (!registro) {
            continue;
          }


          const emailRegistro =
            normalizarTexto(
              registro.email || ""
            );


          if (
            emailRegistro &&
            emailRegistro === email
          ) {

            return (
              registro.nombre ||
              registro.nombreCompleto ||
              registro.displayName ||
              ""
            );

          }

        }

      }
      catch (error) {

        console.warn(
          "No se pudo consultar usuarios:",
          error
        );

      }


      return "";

    }


    async function resolverPerfil(
      nombre,
      user
    ) {

      if (perfiles[nombre]) {
        return perfiles[nombre];
      }


      try {

        const snapshot =
          await get(
            ref(db, "usuarios")
          );


        const usuarios =
          snapshot.val() || {};


        for (
          const key in usuarios
        ) {

          const registro =
            usuarios[key];

          if (!registro) {
            continue;
          }


          const mismoNombre =
            normalizarTexto(
              registro.nombre
            ) ===
            normalizarTexto(nombre);


          const mismoEmail =
            normalizarTexto(
              registro.email
            ) ===
            normalizarTexto(
              user.email
            );


          if (
            mismoNombre ||
            mismoEmail
          ) {

            return (
              registro.perfil ||
              registro.rol ||
              registro.role ||
              ""
            );

          }

        }

      }
      catch (error) {

        console.warn(error);

      }


      return "";

    }


    function traducirErrorFirebase(
      error
    ) {

      const code =
        error?.code || "";


      switch (code) {

        case "auth/invalid-credential":
          return "El email o la contraseña no son correctos.";

        case "auth/invalid-login-credentials":
          return "El email o la contraseña no son correctos.";

        case "auth/user-not-found":
          return "No existe una cuenta de Firebase Authentication con ese email.";

        case "auth/wrong-password":
          return "La contraseña no es correcta.";

        case "auth/invalid-email":
          return "El formato del email no es válido.";

        case "auth/user-disabled":
          return "Esta cuenta está deshabilitada en Firebase Authentication.";

        case "auth/too-many-requests":
          return "Firebase bloqueó temporalmente los intentos de inicio de sesión. Esperá unos minutos e intentá nuevamente.";

        case "auth/network-request-failed":
          return "No se pudo conectar con Firebase. Revisá tu conexión a Internet.";

        default:
          return (
            error?.message ||
            "No se pudo iniciar sesión."
          );

      }

    }


    async function iniciarSesion(
      email,
      password
    ) {

      try {

        const resultado =
          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );

        return resultado.user;

      }
      catch (error) {

        console.error(
          "Firebase Auth:",
          error
        );

        throw error;

      }

    }


    /* ==========================================================
       CARGA DE DATOS
    ========================================================== */

    function iniciarEscuchaConversaciones() {

      if (unsubscribeConversaciones) {
        unsubscribeConversaciones();
      }


      unsubscribeConversaciones =
        onValue(
          ref(db, "conversaciones"),
          snapshot => {

            conversaciones =
              snapshot.val() || {};


            actualizarContadores();

            actualizarVistaActual();


            if (
              conversacionSeleccionada &&
              conversaciones[
                conversacionSeleccionada
              ]
            ) {

              renderizarFicha(
                conversaciones[
                  conversacionSeleccionada
                ]
              );

            }

          },
          error => {

            console.error(
              "Error leyendo conversaciones:",
              error
            );

            alert(
              "No se pudieron cargar las conversaciones. Revisá las reglas de Firebase Realtime Database."
            );

          }
        );

    }


    function iniciarEscuchaPresencias() {

      if (unsubscribePresencias) {
        unsubscribePresencias();
      }


      unsubscribePresencias =
        onValue(
          ref(db, "presencia"),
          snapshot => {

            presencias =
              snapshot.val() || {};

            actualizarVistaActual();

          },
          error => {

            console.warn(
              "No se pudieron cargar presencias:",
              error
            );

          }
        );

    }


    /* ==========================================================
       INICIALIZAR APP
    ========================================================== */

    async function inicializarUsuario(
      user
    ) {

      usuarioActual =
        user;


      const nombre =
        await resolverNombreUsuario(
          user
        );


      if (!nombre) {

        await signOut(auth);

        mostrarErrorLogin(
          "La cuenta de Firebase inició sesión, pero no está vinculada a ningún usuario del Centro de Atención. Agregá el email del usuario en emailsPorNombre o en la colección usuarios de Firebase."
        );

        return;

      }


      const perfil =
        await resolverPerfil(
          nombre,
          user
        );


      if (!perfil) {

        await signOut(auth);

        mostrarErrorLogin(
          `El usuario ${nombre} no tiene un perfil configurado.`
        );

        return;

      }


      nombreActual =
        nombre;

      perfilActual =
        normalizarTexto(perfil);


      document
        .getElementById("userName")
        .textContent =
        saludo();


      document
        .getElementById("userRole")
        .textContent =
        perfilActual;


      document
        .getElementById("loginScreen")
        .style.display =
        "none";


      document
        .getElementById("app")
        .style.display =
        "block";


      configurarPermisosMenu();

      iniciarEscuchaConversaciones();

      iniciarEscuchaPresencias();

      configurarPresenciaUsuario();

      actualizarVistaActual();

    }


    function configurarPermisosMenu() {

      const sinAsignar =
        document.getElementById(
          "btnSinAsignar"
        );


      sinAsignar.style.display =
        (
          esSupervisor() ||
          esSenior()
        )
          ? "flex"
          : "none";

    }


    async function configurarPresenciaUsuario() {

      if (!usuarioActual) {
        return;
      }


      try {

        const presenceRef =
          ref(
            db,
            `presencia/${usuarioActual.uid}`
          );


        onDisconnect(
          presenceRef
        ).update({

          estado:
            "Jornada finalizada",

          ultimaActualizacion:
            Date.now()

        });


        const snapshot =
          await get(
            presenceRef
          );


        if (
          snapshot.exists() &&
          snapshot.val()?.estado
        ) {

          actualizarBotonPresencia(
            snapshot.val().estado
          );

        }
        else {

          actualizarBotonPresencia(
            "Sin jornada"
          );

        }

      }
      catch (error) {

        console.warn(error);

      }

    }


    function mostrarErrorLogin(
      mensaje
    ) {

      const box =
        document.getElementById(
          "loginError"
        );

      box.textContent =
        mensaje;

      box.style.display =
        "block";

    }


    /* ==========================================================
       EVENTOS
    ========================================================== */

    document
      .getElementById("loginForm")
      .addEventListener(
        "submit",
        async event => {

          event.preventDefault();


          const email =
            document
              .getElementById("emailInput")
              .value
              .trim();

          const password =
            document
              .getElementById("passwordInput")
              .value;


          const button =
            document
              .getElementById("loginButton");


          const errorBox =
            document
              .getElementById("loginError");


          errorBox.style.display =
            "none";


          button.disabled =
            true;

          button.textContent =
            "Ingresando...";


          try {

            await iniciarSesion(
              email,
              password
            );

          }
          catch (error) {

            mostrarErrorLogin(
              traducirErrorFirebase(error)
            );

          }
          finally {

            button.disabled =
              false;

            button.textContent =
              "Iniciar sesión";

          }

        }
      );


    document
      .getElementById("logoutButton")
      .addEventListener(
        "click",
        async () => {

          try {

            await signOut(auth);

          }
          catch (error) {

            console.error(error);

          }

        }
      );


    document
      .getElementById("searchInput")
      .addEventListener(
        "input",
        () => {

          if (modoActual === "principal") {
            renderizarPrincipal();
          }

          if (modoActual === "agentes") {
            renderizarAgentes();
          }

          if (modoActual === "sinAsignar") {
            renderizarSinAsignar();
          }

          if (modoActual === "historial") {
            renderizarHistorial();
          }

        }
      );


    document
      .getElementById("sendButton")
      .addEventListener(
        "click",
        enviarMensaje
      );


    document
      .getElementById("messageInput")
      .addEventListener(
        "keydown",
        event => {

          if (
            event.key === "Enter" &&
            !event.shiftKey
          ) {

            event.preventDefault();

            enviarMensaje();

          }

        }
      );


    document
      .getElementById("imageButton")
      .addEventListener(
        "click",
        () => {

          document
            .getElementById("imageInput")
            .click();

        }
      );


    document
      .getElementById("imageInput")
      .addEventListener(
        "change",
        event => {

          const file =
            event.target.files?.[0];

          if (file) {
            enviarImagen(file);
          }

          event.target.value = "";

        }
      );


    document
      .getElementById("finishButton")
      .addEventListener(
        "click",
        finalizarConversacion
      );


    document
      .getElementById("assignButton")
      .addEventListener(
        "click",
        abrirModalAsignacion
      );


    document
      .getElementById("saveAssignmentButton")
      .addEventListener(
        "click",
        async () => {

          try {

            await guardarAsignacion();

          }
          catch (error) {

            console.error(error);

            alert(
              "No se pudo guardar la asignación: " +
              traducirErrorFirebase(error)
            );

          }

        }
      );


    document
      .getElementById("teamSelect")
      .addEventListener(
        "change",
        event => {

          cargarGestoresModal(
            event.target.value
          );

        }
      );


    document
      .getElementById("presenceButton")
      .addEventListener(
        "click",
        event => {

          event.stopPropagation();

          const menu =
            document.getElementById(
              "presenceMenu"
            );

          menu.style.display =
            menu.style.display === "block"
              ? "none"
              : "block";

        }
      );


    document
      .querySelectorAll(
        "[data-presence]"
      )
      .forEach(
        button => {

          button.addEventListener(
            "click",
            async () => {

              const estado =
                button.dataset.presence;

              document
                .getElementById(
                  "presenceMenu"
                )
                .style.display =
                "none";

              await actualizarPresencia(
                estado
              );

            }
          );

        }
      );


    document.addEventListener(
      "click",
      event => {

        const menu =
          document.getElementById(
            "presenceMenu"
          );

        const button =
          document.getElementById(
            "presenceButton"
          );

        if (
          !menu.contains(event.target) &&
          !button.contains(event.target)
        ) {

          menu.style.display =
            "none";

        }

      }
    );


    /* ==========================================================
       AUTH STATE
    ========================================================== */

    onAuthStateChanged(
      auth,
      async user => {

        if (!user) {

          document
            .getElementById("loginScreen")
            .style.display =
            "flex";

          document
            .getElementById("app")
            .style.display =
            "none";

          return;

        }


        try {

          await inicializarUsuario(
            user
          );

        }
        catch (error) {

          console.error(
            "Error inicializando usuario:",
            error
          );

          await signOut(auth);

          mostrarErrorLogin(
            "La sesión se inició pero no se pudo cargar el usuario. Revisá la configuración de usuarios."
          );

        }

      }
    );


    /* ==========================================================
       RELOJ / SALUDO
    ========================================================== */

    setInterval(
      () => {

        if (!usuarioActual) {
          return;
        }

        document
          .getElementById("userName")
          .textContent =
          saludo();

      },
      60000
    );

  </script>

</body>
</html>
