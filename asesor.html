<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Centro de Atención</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f9;
      color: #202124;
    }

    body {
      overflow: hidden;
    }

    button,
    input,
    textarea,
    select {
      font-family: inherit;
    }

    .hidden {
      display: none !important;
    }

    /* =====================================================
       LOGIN
    ===================================================== */

    #loginScreen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #172033, #273b64);
      padding: 20px;
      z-index: 9999;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 18px;
      padding: 35px;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }

    .login-box h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .login-box p {
      color: #6b7280;
      margin-bottom: 25px;
    }

    .login-box input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      margin-bottom: 12px;
      font-size: 15px;
    }

    .primary-btn {
      width: 100%;
      border: none;
      background: #2563eb;
      color: white;
      padding: 13px;
      border-radius: 9px;
      font-weight: bold;
      cursor: pointer;
    }

    #loginError {
      margin-top: 15px;
      color: #dc2626;
      font-size: 14px;
    }

    /* =====================================================
       APP GENERAL
    ===================================================== */

    #app {
      width: 100%;
      height: 100vh;
      display: flex;
    }

    .sidebar {
      width: 245px;
      height: 100vh;
      flex-shrink: 0;
      background: #172033;
      color: white;
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
    }

    .logo {
      font-size: 21px;
      font-weight: bold;
      padding: 10px 12px 25px;
    }

    .user-info {
      padding: 12px;
      background: rgba(255,255,255,.08);
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .user-name {
      font-weight: bold;
    }

    .user-role {
      font-size: 12px;
      color: #b9c3d4;
      margin-top: 4px;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .menu button {
      border: none;
      background: transparent;
      color: #dce3ef;
      padding: 12px;
      text-align: left;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    .menu button:hover,
    .menu button.active {
      background: rgba(255,255,255,.12);
      color: white;
    }

    .logout {
      margin-top: auto;
      border: none;
      background: #dc2626;
      color: white;
      padding: 11px;
      border-radius: 8px;
      cursor: pointer;
    }

    .main {
      flex: 1;
      min-width: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 65px;
      flex-shrink: 0;
      background: white;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      padding: 0 25px;
    }

    .topbar h2 {
      margin: 0;
      font-size: 20px;
    }

    .content {
      flex: 1;
      min-height: 0;
      padding: 20px;
    }

    /* =====================================================
       CHAT / CONVERSACIONES
    ===================================================== */

    .conversation-layout {
      width: 100%;
      height: 100%;
      min-height: 0;
      display: flex;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #e5e7eb;
    }

    .conversation-list {
      width: 350px;
      min-width: 350px;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #fff;
      border-right: 1px solid #e5e7eb;
    }

    .list-header {
      flex-shrink: 0;
      padding: 15px;
      border-bottom: 1px solid #e5e7eb;
      background: white;
    }

    .list-header h3 {
      margin: 0 0 12px;
      font-size: 16px;
    }

    .search-input {
      width: 100%;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      outline: none;
    }

    .conversation-items {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
    }

    .conversation-item {
      padding: 14px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
    }

    .conversation-item:hover {
      background: #f8fafc;
    }

    .conversation-item.active {
      background: #eff6ff;
      border-left: 3px solid #2563eb;
    }

    .conversation-client {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .conversation-preview {
      color: #6b7280;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .conversation-meta {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 7px;
    }

    /* CHAT */

    .chat-panel {
      flex: 1;
      min-width: 0;
      min-height: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #f8fafc;
    }

    .empty-chat {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #9ca3af;
      background: #f8fafc;
    }

    .chat-header {
      min-height: 72px;
      flex-shrink: 0;
      padding: 12px 18px;
      background: white;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .chat-client {
      font-weight: bold;
      font-size: 17px;
    }

    .chat-info {
      color: #6b7280;
      font-size: 12px;
      margin-top: 4px;
    }

    .chat-actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .small-btn {
      border: none;
      padding: 8px 11px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 12px;
      background: #e5e7eb;
    }

    .small-btn.blue {
      background: #2563eb;
      color: white;
    }

    .small-btn.green {
      background: #16a34a;
      color: white;
    }

    .small-btn.red {
      background: #dc2626;
      color: white;
    }

    .messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 20px 30px;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
    }

    .message {
      max-width: 70%;
      width: fit-content;
      margin-bottom: 12px;
      padding: 10px 13px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.4;
      word-break: break-word;
    }

    .message.client {
      background: white;
      border: 1px solid #e5e7eb;
      margin-right: auto;
      border-bottom-left-radius: 4px;
    }

    .message.agent {
      background: #dbeafe;
      margin-left: auto;
      border-bottom-right-radius: 4px;
    }

    .message-author {
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 4px;
      color: #4b5563;
    }

    .message-time {
      font-size: 10px;
      color: #9ca3af;
      margin-top: 5px;
      text-align: right;
    }

    .message-area {
      flex-shrink: 0;
      border-top: 1px solid #e5e7eb;
      background: white;
      padding: 12px;
    }

    .message-area textarea {
      display: block;
      width: 100%;
      min-height: 65px;
      max-height: 150px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      resize: vertical;
      padding: 10px;
      outline: none;
    }

    .message-area textarea:focus {
      border-color: #2563eb;
    }

    .send-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 8px;
    }

    .send-btn {
      border: none;
      background: #2563eb;
      color: white;
      padding: 9px 18px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
    }

    /* =====================================================
       AGENTES
    ===================================================== */

    .page-card {
      height: 100%;
      overflow-y: auto;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 20px;
    }

    .filters {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filters input,
    .filters select {
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
    }

    .agents-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 15px;
    }

    .agent-card {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 16px;
      cursor: pointer;
      background: white;
    }

    .agent-card:hover {
      border-color: #2563eb;
      background: #f8fafc;
    }

    .agent-name {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .agent-team {
      color: #6b7280;
      font-size: 13px;
    }

    .agent-count {
      margin-top: 12px;
      font-size: 12px;
      color: #2563eb;
    }

    /* =====================================================
       HISTORIAL
    ===================================================== */

    .history-table {
      width: 100%;
      border-collapse: collapse;
    }

    .history-table th,
    .history-table td {
      padding: 12px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
      font-size: 13px;
    }

    .history-table th {
      background: #f8fafc;
    }

    .history-table button {
      border: none;
      background: #2563eb;
      color: white;
      border-radius: 6px;
      padding: 7px 10px;
      cursor: pointer;
    }

    /* =====================================================
       MODAL TRANSFERENCIA
    ===================================================== */

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 10000;
    }

    .modal {
      width: 100%;
      max-width: 480px;
      background: white;
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 20px 50px rgba(0,0,0,.25);
    }

    .modal h3 {
      margin-top: 0;
    }

    .modal label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin: 15px 0 6px;
    }

    .modal select {
      width: 100%;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 20px;
    }

    .warning {
      background: #fff7ed;
      border: 1px solid #fed7aa;
      color: #9a3412;
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      margin-top: 12px;
    }

    .status-badge {
      display: inline-block;
      padding: 3px 7px;
      border-radius: 20px;
      font-size: 10px;
      background: #dcfce7;
      color: #166534;
    }

    .error-box {
      background: #fee2e2;
      color: #991b1b;
      padding: 10px;
      border-radius: 8px;
      margin: 10px;
      font-size: 13px;
    }

    @media (max-width: 900px) {

      .sidebar {
        width: 200px;
      }

      .conversation-list {
        width: 300px;
        min-width: 300px;
      }

      .message {
        max-width: 80%;
      }

    }

  </style>
</head>

<!-- =========================================================
     LOGIN
========================================================= -->

<div id="loginScreen">

  <div class="login-box">

    <h1>Centro de Atención</h1>

    <p>
      Ingresá con tu cuenta de trabajo
    </p>

    <input
      id="email"
      type="email"
      placeholder="Correo electrónico"
      autocomplete="username"
    >

    <input
      id="password"
      type="password"
      placeholder="Contraseña"
      autocomplete="current-password"
    >

    <button
      class="primary-btn"
      id="loginButton"
    >
      Iniciar sesión
    </button>

    <div id="loginError"></div>

  </div>

</div>


<!-- =========================================================
     APP
========================================================= -->

<div id="app" class="hidden">

  <aside class="sidebar">

    <div class="logo">
      Centro de Atención
    </div>

    <div class="user-info">

      <div
        class="user-name"
        id="sidebarUserName"
      >
        Usuario
      </div>

      <div

        Rol

    </div>


    <div class="menu">

      <button

        💬 Conversaciones
      </button>

      <button id="menuUnassigned">
        🆕 Chats sin gestor
      </button>

      <button id="menuAgents">
        👥 Agentes
      </button>

      <button id="menuHistory">
        🕘 Historial
      </button>

    </div>


    <button
      class="logout"
      id="logoutButton"
    >
      Cerrar sesión
    </button>

  </aside>


  <main class="main">

    <header class="topbar">

      <h2 id="pageTitle">
        Conversaciones
      </h2>

    </header>


    <div class="content">

      <!-- ===================================================
           CONVERSACIONES
      =================================================== -->

      <section id="conversationsView">

        <div class="conversation-layout">

          <div class="conversation-list">

            <div class="list-header">

              <h3 id="conversationListTitle">
                Mis conversaciones
              </h3>

              <input
                id="conversationSearch"
                class="search-input"
                type="text"
                placeholder="Buscar cliente o DNI..."
              >

            </div>

            <div
              id="conversationItems"
              class="conversation-items"
            ></div>

          </div>


          <div
            id="chatPanel"
            class="chat-panel empty-chat"
          >
            Seleccioná una conversación
          </div>

        </div>

      </section>


      <!-- ===================================================
           AGENTES
      =================================================== -->

      <section
        id="agentsView"
        class="hidden"
      >

        <div class="page-card">

          <h3>Agentes</h3>

          <div class="filters">

            <input
              id="agentsSearch"
              type="text"
              placeholder="Buscar gestor..."
            >

            <select id="agentsTeamFilter">

              <option value="">
                Todos los equipos
              </option>

              <option value="Verde">
                Verde
              </option>

              <option value="Rojo">
                Rojo
              </option>

              <option value="Azul">
                Azul
              </option>

              <option value="1142">
                1142
              </option>

              <option value="Cuoteros">
                Cuoteros
              </option>

            </select>

          </div>

          <div
            id="agentsGrid"
            class="agents-grid"
          ></div>

        </div>

      </section>


      <!-- ===================================================
           HISTORIAL
      =================================================== -->

      <section
        id="historyView"
        class="hidden"
      >

        <div class="page-card">

          <h3>
            Historial de gestiones
          </h3>

          <div class="filters">

            <input
              id="historySearch"
              type="text"
              placeholder="Buscar por cliente o DNI..."
            >

            <span id="historyCounter"></span>

          </div>

          <div style="overflow:auto">

            <table class="history-table">

              <thead>

                <tr>

                  <th>Cliente</th>
                  <th>DNI</th>
                  <th>Gestor</th>
                  <th>Equipo</th>
                  <th>Finalizada</th>
                  <th></th>

                </tr>

              </thead>

              <tbody id="historyTable"></tbody>

            </table>

          </div>

        </div>

      </section>

    </div>

  </main>

</div>


<!-- =========================================================
     MODAL TRANSFERENCIA
========================================================= -->

<div
  id="transferModal"
  class="modal-overlay hidden"
>

  <div class="modal">

    <h3>
      Transferir conversación
    </h3>

    <label>
      Equipo
    </label>

    <select id="transferTeam">

      <option value="">
        Seleccionar equipo
      </option>

      <option value="Verde">
        Verde
      </option>

      <option value="Rojo">
        Rojo
      </option>

      <option value="Azul">
        Azul
      </option>

      <option value="1142">
        1142
      </option>

      <option value="Cuoteros">
        Cuoteros
      </option>

    </select>


    <label>
      Gestor
    </label>

    <select id="transferAgent">

      <option value="">
        Seleccionar gestor
      </option>

    </select>


    <div
      id="transferWarning"
      class="warning hidden"
    ></div>


    <div class="modal-actions">

      <button
        class="small-btn"
        id="cancelTransfer"
      >
        Cancelar
      </button>

      <button
        class="small-btn blue"
        id="confirmTransfer"
      >
        Transferir
      </button>

    </div>

  </div>

</div>

========================================================= */

let usuarioActual = null;

let nombreUsuarioActual = "";

let conversacionesArray = [];

let conversacionSeleccionada = null;

let vistaConversacionesModo =
  "principal";

let gestorConsultado = "";

let conversacionTransferencia = null;


/* =========================================================
   ROLES
========================================================= */

function obtenerRolUsuario() {

  return (
    perfiles[nombreUsuarioActual] ||
    "asesor"
  );

}


function esSupervisor() {

  return (
    obtenerRolUsuario() ===
    "supervisor"
  );

}


function esSenior() {

  return (
    obtenerRolUsuario() ===
    "senior"
  );

}


/* =========================================================
   EQUIPOS DEL USUARIO
========================================================= */

function obtenerEquiposDelUsuario(
  nombre
) {

  const resultado = [];

  Object.entries(equipos)
    .forEach(
      ([equipo, datos]) => {

        if (
          datos.seniors.includes(nombre) ||
          datos.gestores.includes(nombre)
        ) {

          resultado.push(equipo);

        }

      }
    );

  return resultado;

}


function usuarioTieneEquipo(
  equipo
) {

  return obtenerEquiposDelUsuario(
    nombreUsuarioActual
  ).includes(equipo);

}


/* =========================================================
   EQUIPO CONVERSACIÓN
========================================================= */

function obtenerEquipoConversacion(c) {

  if (!c) return "";

  if (c.equipo)
    return c.equipo;

  if (c.team)
    return c.team;

  if (c.equipoAsignado)
    return c.equipoAsignado;

  if (c.asesorAsignado) {

    for (
      const [equipo, datos]
      of Object.entries(equipos)
    ) {

      if (
        datos.gestores.includes(
          c.asesorAsignado
        )
      ) {

        return equipo;

      }

    }

  }

  return "";

}


/* =========================================================
   CUENTA ASIGNADA
========================================================= */

function esCuentaAsignadaAlUsuario(c) {

  if (!c) return false;

  return (

    c.asesorAsignado ===
    nombreUsuarioActual

    ||

    (
      c.asesorEmail &&
      usuarioActual?.email &&
      c.asesorEmail.toLowerCase() ===
      usuarioActual.email.toLowerCase()
    )

  );

}


/* =========================================================
   PERMISOS
========================================================= */

function puedeVerEnPrincipal(c) {

  if (!c) return false;

  if (
    c.estado === "finalizada"
  ) {
    return false;
  }

  if (esSupervisor()) {
    return false;
  }

  return esCuentaAsignadaAlUsuario(c);

}


function puedeVerPorEquipo(c) {

  if (!c) return false;

  if (
    c.estado === "finalizada"
  ) {
    return false;
  }

  if (esSupervisor()) {
    return true;
  }

  const equipo =
    obtenerEquipoConversacion(c);

  if (!equipo) {
    return false;
  }

  return usuarioTieneEquipo(equipo);

}


function puedeGestionarConversacion(
  c,
  modo = "principal"
) {

  if (!c) return false;

  if (
    c.estado === "finalizada"
  ) {
    return false;
  }

  if (esSupervisor()) {
    return true;
  }

  if (
    modo === "equipo" ||
    modo === "agente"
  ) {

    return puedeVerPorEquipo(c);

  }

  return puedeVerEnPrincipal(c);

}


/* =========================================================
   TOMAR
========================================================= */

function puedeTomarConversacion(c) {

  if (!c) return false;

  if (
    c.estado === "finalizada"
  ) {
    return false;
  }

  if (
    c.asesorAsignado ||
    c.asesorEmail
  ) {

    return false;

  }

  return (
    esSupervisor() ||
    esSenior()
  );

}


/* =========================================================
   TRANSFERIR
========================================================= */

/*
   IMPORTANTE:

   Los seniors y el supervisor
   pueden transferir.

   Los asesores normales NO.
*/

function puedeTransferirConversacion(c) {

  if (!c) return false;

  if (
    c.estado === "finalizada"
  ) {
    return false;
  }

  return (
    esSupervisor() ||
    esSenior()
  );

}


/* =========================================================
   DNI
========================================================= */

function normalizarDni(valor) {

  return String(valor ?? "")
    .replace(/\D/g, "");

}


function obtenerDniConversacion(c) {

  if (!c) return "";

  const candidatos = [

    c.dni,
    c.DNI,
    c.documento,
    c.document,
    c.documentNumber,
    c.numeroDocumento,
    c.nroDocumento,
    c.nroDni,
    c.dniCliente,
    c.clienteDni,
    c.clienteDNI,
    c.clienteDocumento,
    c.documentoCliente,
    c.clientDni,
    c.clientDNI,
    c.customerDni,
    c.customerDNI,

    c.cliente?.dni,
    c.cliente?.DNI,
    c.cliente?.documento,
    c.cliente?.documentNumber,
    c.cliente?.numeroDocumento,

    c.datosCliente?.dni,
    c.datosCliente?.DNI,
    c.datosCliente?.documento,
    c.datosCliente?.documentNumber,
    c.datosCliente?.numeroDocumento,

    c.usuario?.dni,
    c.usuario?.DNI,
    c.usuario?.documento,

    c.customer?.dni,
    c.customer?.DNI,
    c.customer?.documento,

    c.client?.dni,
    c.client?.DNI,
    c.client?.documento

  ];

  for (
    const valor
    of candidatos
  ) {

    const dni =
      normalizarDni(valor);

    if (dni) {
      return dni;
    }

  }

  return "";

}


/* =========================================================
   NOMBRE CLIENTE
========================================================= */

function obtenerNombreCliente(c) {

  if (!c) return "";

  const candidatos = [

    c.clienteNombre,
    c.nombreCliente,
    c.nombreCompletoCliente,
    c.clienteNombreCompleto,
    c.nombreCompleto,
    c.nombre,

    c.cliente?.nombreCompleto,
    c.cliente?.nombre,

    c.datosCliente?.nombreCompleto,
    c.datosCliente?.nombre,

    c.customer?.name,
    c.customer?.nombre,

    c.client?.name,
    c.client?.nombre

  ];

  for (
    const valor
    of candidatos
  ) {

    if (
      typeof valor === "string" &&
      valor.trim()
    ) {

      return valor.trim();

    }

  }

  if (
    typeof c.cliente === "string" &&
    c.cliente.trim()
  ) {

    return c.cliente.trim();

  }

  return "";

}


function obtenerCliente(c) {

  const nombre =
    obtenerNombreCliente(c);

  if (nombre) {
    return nombre;
  }

  const dni =
    obtenerDniConversacion(c);

  if (dni) {
    return "DNI " + dni;
  }

  return "Sin identificar";

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(texto) {

  return String(texto ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================================================
   FECHA
========================================================= */

function formatearFecha(valor) {

  if (!valor) return "";

  const fecha =
    new Date(valor);

  if (
    Number.isNaN(
      fecha.getTime()
    )
  ) {

    return "";

  }

  return fecha.toLocaleString(
    "es-AR",
    {
      day: "2-digit",
      month: "2-digit",
      hour: "2-digit",
      minute: "2-digit"
    }
  );

}


/* =========================================================
   ÚLTIMO MENSAJE
========================================================= */

function obtenerUltimoMensaje(c) {

  if (!c) return "";

  if (
    Array.isArray(c.mensajes) &&
    c.mensajes.length
  ) {

    const ultimo =
      c.mensajes[
        c.mensajes.length - 1
      ];

    return (
      ultimo.texto ||
      ultimo.mensaje ||
      ultimo.contenido ||
      ""
    );

  }

  if (
    c.mensajes &&
    typeof c.mensajes === "object"
  ) {

    const lista =
      Object.values(c.mensajes);

    if (lista.length) {

      const ultimo =
        lista[lista.length - 1];

      return (
        ultimo.texto ||
        ultimo.mensaje ||
        ultimo.contenido ||
        ""
      );

    }

  }

  return (
    c.ultimoMensaje ||
    c.mensaje ||
    ""
  );

}


/* =========================================================
   LOGIN
========================================================= */

document
  .getElementById("loginButton")
  .addEventListener(
    "click",
    iniciarSesion
  );


document
  .getElementById("password")
  .addEventListener(
    "keydown",
    e => {

      if (e.key === "Enter") {
        iniciarSesion();
      }

    }
  );


async function iniciarSesion() {

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;

  const error =
    document
      .getElementById("loginError");

  error.textContent = "";

  if (
    !email ||
    !password
  ) {

    error.textContent =
      "Ingresá correo y contraseña.";

    return;

  }

  try {

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  } catch (e) {

    console.error(e);

    error.textContent =
      traducirErrorFirebase(e);

  }

}


/* =========================================================
   ERRORES FIREBASE
========================================================= */

function traducirErrorFirebase(error) {

  const code =
    error?.code || "";

  if (
    code.includes(
      "invalid-credential"
    ) ||
    code.includes(
      "wrong-password"
    )
  ) {

    return "El correo o la contraseña son incorrectos.";

  }

  if (
    code.includes(
      "user-not-found"
    )
  ) {

    return "No existe un usuario con ese correo.";

  }

  if (
    code.includes(
      "invalid-email"
    )
  ) {

    return "El correo electrónico no es válido.";

  }

  if (
    code.includes(
      "too-many-requests"
    )
  ) {

    return "Demasiados intentos. Esperá unos minutos.";

  }

  if (
    code.includes(
      "api-key-not-valid"
    )
  ) {

    return "La API Key de Firebase no es válida.";

  }

  return (
    error?.message ||
    "No se pudo iniciar sesión."
  );

}


/* =========================================================
   AUTH
========================================================= */

onAuthStateChanged(
  auth,
  usuario => {

    if (usuario) {

      usuarioActual =
        usuario;

      const email =
        (
          usuario.email ||
          ""
        ).toLowerCase();

      nombreUsuarioActual =
        emailsPorNombre[email] ||
        "";

      /*
        Si no encuentra el correo,
        intenta usar el nombre antes
        del @ como respaldo.
      */

      if (!nombreUsuarioActual) {

        nombreUsuarioActual =
          email.split("@")[0];

      }

      document
        .getElementById(
          "loginScreen"
        )
        .classList.add(
          "hidden"
        );

      document
        .getElementById(
          "app"
        )
        .classList.remove(
          "hidden"
        );

      actualizarUsuarioUI();

      iniciarAplicacion();

      iniciarPresencia();

    } else {

      usuarioActual = null;

      nombreUsuarioActual = "";

      document
        .getElementById(
          "loginScreen"
        )
        .classList.remove(
          "hidden"
        );

      document
        .getElementById(
          "app"
        )
        .classList.add(
          "hidden"
        );

    }

  }
);

/* =========================================================
   CARGAR CONVERSACIONES
========================================================= */

function iniciarAplicacion() {

  const conversacionesRef =
    ref(
      db,
      "conversaciones"
    );

  onValue(
    conversacionesRef,
    snapshot => {

      const datos =
        snapshot.val() || {};

      conversacionesArray =
        Object.entries(datos)
          .map(
            ([id, valor]) => ({
              id,
              ...valor
            })
          );

      renderizarVistaConversaciones();

      renderizarAgentes();

      renderizarHistorial();

    },

    error => {

      console.error(
        "Error leyendo conversaciones:",
        error
      );

      mostrarErrorFirebase(
        "No se pudieron cargar las conversaciones: " +
        error.message
      );

    }
  );

}

) {

    `;

}


/* =========================================================
   VISTA CONVERSACIONES
========================================================= */

function renderizarVistaConversaciones() {

  if (
    esSupervisor() &&
    vistaConversacionesModo ===
      "principal"
  ) {

    renderizarGestoresPrincipal();

    return;

  }

  if (
    vistaConversacionesModo ===
      "agente" &&
    gestorConsultado
  ) {

    renderizarConversacionesDeAgente(
      gestorConsultado
    );

    return;

  }

  renderizarConversaciones();

}


/* =========================================================
   CONVERSACIONES PRINCIPALES
========================================================= */

function renderizarConversaciones() {

  const contenedor =
    document.getElementById(
      "conversationItems"
    );

  const texto =
    document
      .getElementById(
        "conversationSearch"
      )
      .value
      .toLowerCase()
      .trim();

  const visibles =
    conversacionesArray
      .filter(
        c =>
          c.estado !==
          "finalizada"
      )
      .filter(
        c =>
          puedeVerEnPrincipal(c)
      )
      .filter(c => {

        if (!texto) {
          return true;
        }

        const cliente =
          obtenerCliente(c)
            .toLowerCase();

        const dni =
          obtenerDniConversacion(c);

        return (
          cliente.includes(texto) ||
          (
            normalizarDni(texto) &&
            dni.includes(
              normalizarDni(texto)
            )
          )
        );

      });


  document
    .getElementById(
      "conversationListTitle"
    )
    .textContent =
      "Mis conversaciones";


  if (!visibles.length) {

    contenedor.innerHTML =
      `
        <div
          style="
            padding:20px;
            color:#9ca3af;
          "
        >
          No hay conversaciones activas.
        </div>
      `;

    return;

  }


  contenedor.innerHTML =
    visibles
      .map(c => {

        const activo =
          conversacionSeleccionada?.id ===
          c.id;

        return `

          <div
            class="conversation-item ${
              activo ? "active" : ""
            }"
            data-id="${escapeHtml(c.id)}"
          >

            <div class="conversation-client">
              ${escapeHtml(
                obtenerCliente(c)
              )}
            </div>

            <div class="conversation-preview">
              ${escapeHtml(
                obtenerUltimoMensaje(c) ||
                "Sin mensajes"
              )}
            </div>

            <div class="conversation-meta">
              ${escapeHtml(
                c.asesorAsignado ||
                "Sin gestor"
              )}
            </div>

          </div>

        `;

      })
      .join("");


  contenedor
    .querySelectorAll(
      ".conversation-item"
    )
    .forEach(item => {

      item.addEventListener(
        "click",
        () => {

          mostrarConversacion(
            item.dataset.id,
            "principal"
          );

        }
      );

    });

}


/* =========================================================
   SUPERVISOR PRINCIPAL
========================================================= */

function renderizarGestoresPrincipal() {

  const contenedor =
    document.getElementById(
      "conversationItems"
    );

  const texto =
    document
      .getElementById(
        "conversationSearch"
      )
      .value
      .toLowerCase()
      .trim();

  document
    .getElementById(
      "conversationListTitle"
    )
    .textContent =
      "Gestores";


  const gestores = [];


  Object.entries(equipos)
    .forEach(
      ([equipo, datos]) => {

        datos.gestores
          .forEach(
            gestor => {

              if (
                !gestores.some(
                  x =>
                    x.nombre ===
                    gestor
                )
              ) {

                gestores.push({
                  nombre: gestor,
                  equipo: equipo
                });

              }

            }
          );

      }
    );


  const filtrados =
    gestores.filter(
      g => {

        if (!texto) {
          return true;
        }

        return (
          g.nombre
            .toLowerCase()
            .includes(texto) ||
          g.equipo
            .toLowerCase()
            .includes(texto)
        );

      }
    );


  contenedor.innerHTML =
    filtrados
      .map(g => {

        const cantidad =
          conversacionesArray
            .filter(
              c =>
                c.estado !==
                  "finalizada" &&
                c.asesorAsignado ===
                  g.nombre
            )
            .length;

        return `

          <div
            class="conversation-item"
            data-gestor="${escapeHtml(
              g.nombre
            )}"
          >

            <div class="conversation-client">
              ${escapeHtml(g.nombre)}
            </div>

            <div class="conversation-preview">
              Equipo ${escapeHtml(
                g.equipo
              )}
            </div>

            <div class="conversation-meta">
              ${cantidad}
              conversación(es) activa(s)
            </div>

          </div>

        `;

      })
      .join("");


  contenedor
    .querySelectorAll(
      ".conversation-item"
    )
    .forEach(item => {

      item.addEventListener(
        "click",
        () => {

          verCuentasDelAgente(
            item.dataset.gestor
          );

        }
      );

    });

}


/* =========================================================
   CUENTAS DEL AGENTE
========================================================= */

function verCuentasDelAgente(

) {

  gestorConsultado =
    nombre;

  vistaConversacionesModo =

  conversacionSeleccionada =
    null;

  renderizarVistaConversaciones();

  document
    .getElementById(
      "chatPanel"
    )

      "chat-panel empty-chat";

  document
    .getElementById(
      "chatPanel"
    )
    .textContent =

}


/* =========================================================
   CONVERSACIONES AGENTE
========================================================= */

function renderizarConversacionesDeAgente(
  nombre
) {

  const contenedor =
    document.getElementById(
      "conversationItems"
    );

  const texto =
    document
      .getElementById(
        "conversationSearch"
      )
      .value
      .toLowerCase()
      .trim();


  const visibles =
    conversacionesArray
      .filter(
        c =>
          c.estado !==
          "finalizada"
      )
      .filter(
        c =>
          c.asesorAsignado ===
          nombre
      )
      .filter(c => {

        if (!texto) {
          return true;
        }

        return (
          obtenerCliente(c)
            .toLowerCase()
            .includes(texto) ||

          (
            normalizarDni(texto) &&
            obtenerDniConversacion(c)
              .includes(
                normalizarDni(texto)
              )
          )
        );

      });


  document
    .getElementById(
      "conversationListTitle"
    )
    .textContent =
      "Cuentas de " + nombre;


  contenedor.innerHTML =
    visibles.length

      ? visibles
          .map(c => {

            return `

              <div
                class="conversation-item"
                data-id="${escapeHtml(c.id)}"
              >

                <div class="conversation-client">
                  ${escapeHtml(
                    obtenerCliente(c)
                  )}
                </div>

                <div class="conversation-preview">
                  ${escapeHtml(
                    obtenerUltimoMensaje(c) ||
                    "Sin mensajes"
                  )}
                </div>

                <div class="conversation-meta">
                  ${escapeHtml(
                    c.asesorAsignado ||
                    ""
                  )}
                </div>

              </div>

            `;

          })
          .join("")

      :

        `
          <div
            style="
              padding:20px;
              color:#9ca3af;
            "
          >
            Este gestor no tiene cuentas activas.
          </div>
        `;


  contenedor
    .querySelectorAll(
      ".conversation-item"
    )
    .forEach(item => {

      item.addEventListener(
        "click",
        () => {

          mostrarConversacion(
            item.dataset.id,
            "agente"
          );

        }
      );

    });

}


/* =========================================================
   MOSTRAR CONVERSACIÓN
========================================================= */

function mostrarConversacion(
  id,
  modo = "principal"
) {

  const conversacion =
    conversacionesArray.find(
      c => c.id === id
    );

  if (!conversacion) {
    return;
  }


  if (
    modo !== "historial" &&
    !puedeGestionarConversacion(
      conversacion,
      modo
    )
  ) {

    alert(
      "No tenés permiso para gestionar esta conversación."
    );

    return;

  }


  conversacionSeleccionada =
    conversacion;


  const chatPanel =
    document.getElementById(
      "chatPanel"
    );

  chatPanel.className =
    "chat-panel";


  const cliente =
    obtenerCliente(
      conversacion
    );

  const dni =
    obtenerDniConversacion(
      conversacion
    );

  const finalizada =
    conversacion.estado ===
    "finalizada";


  const puedeGestionar =
    modo !== "historial" &&
    puedeGestionarConversacion(
      conversacion,
      modo
    );


  chatPanel.innerHTML = `

    <div class="chat-header">

      <div>

        <div class="chat-client">
          ${escapeHtml(cliente)}
        </div>

        <div class="chat-info">

          ${
            dni
              ? "DNI: " +
                escapeHtml(dni)
              : "DNI no informado"
          }

          · Gestor:

          ${escapeHtml(
            conversacion.asesorAsignado ||
            "Sin gestor"
          )}

          · Equipo:

          ${escapeHtml(
            obtenerEquipoConversacion(
              conversacion
            ) ||
            "Sin equipo"
          )}

          ${
            finalizada
              ? `
                ·
                <span class="status-badge">
                  Finalizada
                </span>
              `
              : ""
          }

        </div>

      </div>


      <div class="chat-actions">

        ${
          modo === "agente"
            ? `
              <button
                class="small-btn"
                id="backToAgentsButton"
              >
                ← Volver
              </button>
            `
            : ""
        }


        ${
          puedeGestionar &&
          puedeTomarConversacion(
            conversacion
          )
            ? `
              <button
                class="small-btn blue"
                id="takeConversationButton"
              >
                Tomar
              </button>
            `
            : ""
        }


        ${
          puedeGestionar &&
          puedeTransferirConversacion(
            conversacion
          )
            ? `
              <button
                class="small-btn blue"
                id="transferConversationButton"
              >
                Transferir
              </button>
            `
            : ""
        }


        ${
          puedeGestionar &&
          !finalizada
            ? `
              <button
                class="small-btn green"
                id="finishConversationButton"
              >
                Finalizar
              </button>
            `
            : ""
        }

      </div>

    </div>


    <div
      id="messages"
      class="messages"
    ></div>


    <div
      id="messageArea"
      class="message-area"
    ></div>

  `;


  /* VOLVER */

  const backButton =
    document.getElementById(
      "backToAgentsButton"
    );

  if (backButton) {

    backButton.addEventListener(
      "click",
      () => {

        vistaConversacionesModo =
          "principal";

        gestorConsultado = "";

        conversacionSeleccionada =
          null;

        renderizarVistaConversaciones();

        const panel =
          document.getElementById(
            "chatPanel"
          );

        panel.className =
          "chat-panel empty-chat";

        panel.textContent =
          "Seleccioná una conversación";

      }
    );

  }


  /* TOMAR */

  const takeButton =
    document.getElementById(
      "takeConversationButton"
    );

  if (takeButton) {

    takeButton.addEventListener(
      "click",
      () =>
        tomarConversacion(
          conversacion
        )
    );

  }


  /* TRANSFERIR */

  const transferButton =
    document.getElementById(
      "transferConversationButton"
    );

  if (transferButton) {

    transferButton.addEventListener(
      "click",
      () =>
        abrirModalTransferencia(
          conversacion
        )
    );

  }


  /* FINALIZAR */

  const finishButton =
    document.getElementById(
      "finishConversationButton"
    );

  if (finishButton) {

    finishButton.addEventListener(
      "click",
      () =>
        finalizarConversacion(
          conversacion
        )
    );

  }


  renderizarMensajes(
    conversacion
  );


  actualizarFormularioMensaje(
    conversacion,
    puedeGestionar &&
    !finalizada
  );

}


/* =========================================================
   MENSAJES
========================================================= */

function obtenerMensajes(c) {

  if (!c?.mensajes) {
    return [];
  }

  if (
    Array.isArray(
      c.mensajes
    )
  ) {

    return c.mensajes;

  }

  return Object.entries(
    c.mensajes
  )
    .map(
      ([id, mensaje]) => ({
        id,
        ...mensaje
      })
    );

}


function renderizarMensajes(c) {

  const contenedor =
    document.getElementById(
      "messages"
    );

  if (!contenedor) {
    return;
  }


  const mensajes =
    obtenerMensajes(c);


  if (!mensajes.length) {

    contenedor.innerHTML =
      `
        <div
          style="
            color:#9ca3af;
            margin:auto;
          "
        >
          No hay mensajes.
        </div>
      `;

    return;

  }


  contenedor.innerHTML =
    mensajes
      .map(
        mensaje => {

          const autor =
            mensaje.autor ||
            mensaje.usuario ||
            mensaje.remitente ||
            "";


          const esCliente =
            mensaje.tipo ===
              "cliente" ||

            mensaje.remitente ===
              "cliente" ||

            mensaje.autorTipo ===
              "cliente";


          return `

            <div
              class="message ${
                esCliente
                  ? "client"
                  : "agent"
              }"
            >

              <div class="message-author">

                ${escapeHtml(
                  autor ||
                  (
                    esCliente
                      ? "Cliente"
                      : "Gestor"
                  )
                )}

              </div>


              <div>

                ${escapeHtml(
                  mensaje.texto ||
                  mensaje.mensaje ||
                  mensaje.contenido ||
                  ""
                )}

              </div>


              <div class="message-time">

                ${escapeHtml(
                  formatearFecha(
                    mensaje.fecha ||
                    mensaje.timestamp ||
                    mensaje.createdAt
                  )
                )}

              </div>

            </div>

          `;

        }
      )
      .join("");


  contenedor.scrollTop =
    contenedor.scrollHeight;

}


/* =========================================================
   FORMULARIO MENSAJE
========================================================= */

function actualizarFormularioMensaje(
  c,
  habilitado
) {

  const area =
    document.getElementById(
      "messageArea"
    );

  if (!area) {
    return;
  }


  if (!habilitado) {

    area.innerHTML =
      `
        <div
          style="
            color:#9ca3af;
            font-size:13px;
          "
        >
          Esta gestión es de solo lectura.
        </div>
      `;

    return;

  }


  area.innerHTML = `

    <textarea
      id="messageInput"
      placeholder="Escribí un mensaje..."
    ></textarea>

    <div class="send-row">

      <button
        class="send-btn"
        id="sendMessageButton"
      >
        Enviar
      </button>

    </div>

  `;


  document
    .getElementById(
      "sendMessageButton"
    )
    .addEventListener(
      "click",
      () =>
        enviarMensaje(c)
    );


  document
    .getElementById(
      "messageInput"
    )
    .addEventListener(
      "keydown",
      e => {

        if (
          e.key === "Enter" &&
          !e.shiftKey
        ) {

          e.preventDefault();

          enviarMensaje(c);

        }

      }
    );

}


/* =========================================================
   ENVIAR
========================================================= */

async function enviarMensaje(c) {

  const modo =
    vistaConversacionesModo ===
    "agente"
      ? "agente"
      : "principal";


  if (
    !puedeGestionarConversacion(
      c,
      modo
    )
  ) {

    return;

  }


  const input =
    document.getElementById(
      "messageInput"
    );

  if (!input) {
    return;
  }


  const texto =
    input.value.trim();


  if (!texto) {
    return;
  }


  const mensajesRef =
    ref(
      db,
      `conversaciones/${c.id}/mensajes`
    );


  await push(
    mensajesRef,
    {

      texto: texto,

      autor:
        nombreUsuarioActual,

      autorEmail:
        usuarioActual?.email ||
        "",

      tipo:
        "gestor",

      fecha:
        Date.now()

    }
  );


  await update(
    ref(
      db,
      `conversaciones/${c.id}`
    ),
    {

      ultimoMensaje:
        texto,

      actualizadoEn:
        Date.now()

    }
  );


  input.value = "";

}


/* =========================================================
   TOMAR CONVERSACIÓN
========================================================= */

async function tomarConversacion(c) {

  if (
    !puedeTomarConversacion(c)
  ) {

    return;

  }


  await update(
    ref(
      db,
      `conversaciones/${c.id}`
    ),
    {

      asesorAsignado:
        nombreUsuarioActual,

      asesorEmail:
        usuarioActual?.email ||
        "",

      equipo:
        obtenerEquipoParaGestor(
          nombreUsuarioActual
        ),

      actualizadoEn:
        Date.now()

    }
  );

}


/* =========================================================
   BUSCAR EQUIPO DEL GESTOR
========================================================= */

function obtenerEquipoParaGestor(
  gestor
) {

  for (
    const [equipo, datos]
    of Object.entries(equipos)
  ) {

    if (
      datos.gestores.includes(
        gestor
      )
    ) {

      return equipo;

    }

  }

  return "";

}


/* =========================================================
   FINALIZAR
========================================================= */

async function finalizarConversacion(c) {

  const modo =
    vistaConversacionesModo ===
    "agente"
      ? "agente"
      : "principal";


  if (
    !puedeGestionarConversacion(
      c,
      modo
    )
  ) {

    return;

  }


  const confirmar =
    confirm(
      "¿Querés finalizar esta conversación?"
    );


  if (!confirmar) {
    return;
  }


  await update(
    ref(
      db,
      `conversaciones/${c.id}`
    ),
    {

      estado:
        "finalizada",

      finalizadaEn:
        Date.now(),

      finalizadaPor:
        nombreUsuarioActual,

      finalizadaPorEmail:
        usuarioActual?.email ||
        "",

      actualizadoEn:
        Date.now()

    }
  );


  conversacionSeleccionada =
    null;


  document
    .getElementById(
      "chatPanel"
    )
    .className =
      "chat-panel empty-chat";


  document
    .getElementById(
      "chatPanel"
    )
    .textContent =
      "Seleccioná una conversación";

}


/* =========================================================
   AGENTES
========================================================= */

function renderizarAgentes() {

  const grid =
    document.getElementById(
      "agentsGrid"
    );

  if (!grid) {
    return;
  }


  const search =
    document
      .getElementById(
        "agentsSearch"
      )
      .value
      .toLowerCase()
      .trim();


  const filtroEquipo =
    document
      .getElementById(
        "agentsTeamFilter"
      )
      .value;


  const agentes = [];


  Object.entries(equipos)
    .forEach(
      ([equipo, datos]) => {

        if (
          !esSupervisor() &&
          !usuarioTieneEquipo(
            equipo
          )
        ) {

          return;

        }


        datos.gestores
          .forEach(
            gestor => {

              if (
                !agentes.some(
                  x =>
                    x.nombre ===
                    gestor
                )
              ) {

                agentes.push({
                  nombre: gestor,
                  equipo: equipo
                });

              }

            }
          );

      }
    );


  const filtrados =
    agentes.filter(
      agente => {

        if (
          filtroEquipo &&
          agente.equipo !==
            filtroEquipo
        ) {

          return false;

        }


        if (
          search &&
          !agente.nombre
            .toLowerCase()
            .includes(search)
        ) {

          return false;

        }


        return true;

      }
    );


  grid.innerHTML =
    filtrados
      .map(
        agente => {

          const cantidad =
            conversacionesArray
              .filter(
                c =>
                  c.estado !==
                    "finalizada" &&
                  c.asesorAsignado ===
                    agente.nombre
              )
              .length;


          return `

            <div
              class="agent-card"
              data-agent="${escapeHtml(
                agente.nombre
              )}"
            >

              <div class="agent-name">
                ${escapeHtml(
                  agente.nombre
                )}
              </div>

              <div class="agent-team">
                Equipo ${escapeHtml(
                  agente.equipo
                )}
              </div>

              <div class="agent-count">
                ${cantidad}
                conversación(es) activa(s)
              </div>

            </div>

          `;

        }
      )
      .join("");


  grid
    .querySelectorAll(
      ".agent-card"
    )
    .forEach(card => {

      card.addEventListener(
        "click",
        () => {

          mostrarVista(
            "conversations"
          );

          verCuentasDelAgente(
            card.dataset.agent
          );

        }
      );

    });

}


/* =========================================================
   HISTORIAL
========================================================= */

function obtenerConversacionesFinalizadas() {

  return conversacionesArray
    .filter(
      c =>
        c.estado ===
        "finalizada"
    )
    .sort(
      (a, b) =>
        (
          b.finalizadaEn ||
          b.actualizadoEn ||
          b.fecha ||
          0
        )
        -
        (
          a.finalizadaEn ||
          a.actualizadoEn ||
          a.fecha ||
          0
        )
    );

}


function renderizarHistorial() {

  const tabla =
    document.getElementById(
      "historyTable"
    );

  if (!tabla) {
    return;
  }


  const texto =
    document
      .getElementById(
        "historySearch"
      )
      .value
      .toLowerCase()
      .trim();


  const textoDni =
    normalizarDni(texto);


  const finalizadas =
    obtenerConversacionesFinalizadas()
      .filter(
        c => {

          if (!texto) {
            return true;
          }


          const cliente =
            obtenerCliente(c)
              .toLowerCase();


          const nombre =
            obtenerNombreCliente(c)
              .toLowerCase();


          const dni =
            obtenerDniConversacion(c);


          const gestor =
            String(
              c.asesorAsignado ||
              ""
            ).toLowerCase();


          const equipo =
            obtenerEquipoConversacion(c)
              .toLowerCase();


          return (

            cliente.includes(texto) ||

            nombre.includes(texto) ||

            (
              textoDni &&
              dni.includes(
                textoDni
              )
            ) ||

            gestor.includes(texto) ||

            equipo.includes(texto)

          );

        }
      );


  document
    .getElementById(
      "historyCounter"
    )
    .textContent =
      `${finalizadas.length} gestión(es)`;


  tabla.innerHTML =
    finalizadas
      .map(
        c => {

          const dni =
            obtenerDniConversacion(c);


          return `

            <tr>

              <td>
                ${escapeHtml(
                  obtenerCliente(c)
                )}
              </td>

              <td>
                ${escapeHtml(
                  dni || "-"
                )}
              </td>

              <td>
                ${escapeHtml(
                  c.asesorAsignado ||
                  "-"
                )}
              </td>

              <td>
                ${escapeHtml(
                  obtenerEquipoConversacion(c) ||
                  "-"
                )}
              </td>

              <td>
                ${escapeHtml(
                  formatearFecha(
                    c.finalizadaEn
                  )
                )}
              </td>

              <td>

                <button
                  data-history-id="${escapeHtml(
                    c.id
                  )}"
                >
                  Ver gestión
                </button>

              </td>

            </tr>

          `;

        }
      )
      .join("");


  tabla
    .querySelectorAll(
      "button[data-history-id]"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () =>
            verGestionHistorial(
              button.dataset.historyId
            )
        );

      }
    );

}

========================================================= */

function cargarGestoresTransferencia() {

  const equipo =
    document
      .getElementById(
        "transferTeam"
      )
      .value;


  const select =
    document.getElementById(
      "transferAgent"
    );


  select.innerHTML =
    `
      <option value="">
        Seleccionar gestor
      </option>
    `;


  if (!equipo) {
    return;
  }


  const datos =
    equipos[equipo];


  if (!datos) {
    return;
  }


  /*
    IMPORTANTE:

    Antes solamente mostraba gestores
    que tenían email.

    Ahora muestra TODOS los gestores
    del equipo.
  */

  datos.gestores
    .forEach(
      gestor => {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          gestor;


        option.textContent =
          gestor;


        select.appendChild(
          option
        );

      }
    );

}


/* =========================================================
   CONFIRMAR TRANSFERENCIA
========================================================= */

document
  .getElementById(
    "confirmTransfer"
  )
  .addEventListener(
    "click",
    confirmarTransferencia
  );


async function confirmarTransferencia() {

  const c =
    conversacionTransferencia;


  if (!c) {
    return;
  }


  if (
    !puedeTransferirConversacion(c)
  ) {

    alert(
      "No tenés permiso para transferir."
    );

    return;

  }


  const equipo =
    document
      .getElementById(
        "transferTeam"
      )
      .value;


  const gestor =
    document
      .getElementById(
        "transferAgent"
      )
      .value;


  if (
    !equipo ||
    !gestor
  ) {

    alert(
      "Seleccioná equipo y gestor."
    );

    return;

  }


  /*
    Verificamos que el gestor realmente
    pertenezca al equipo elegido.
  */

  if (
    !equipos[equipo]?.gestores
      .includes(gestor)
  ) {

    alert(
      "El gestor seleccionado no pertenece a ese equipo."
    );

    return;

  }


  /*
    Buscamos el email solamente si
    ya lo conocemos.

    NO es obligatorio para transferir.
  */

  const emailGestor =
    Object.entries(
      emailsPorNombre
    )
    .find(
      ([email, nombre]) =>
        nombre === gestor
    )?.[0] || "";


  try {

    await update(
      ref(
        db,
        `conversaciones/${c.id}`
      ),
      {

        asesorAsignado:
          gestor,

        asesorEmail:
          emailGestor,

        equipo:
          equipo,

        transferidoPor:
          nombreUsuarioActual,

        transferidoPorEmail:
          usuarioActual?.email ||
          "",

        transferidoEn:
          Date.now(),

        actualizadoEn:
          Date.now()

      }
    );


    cerrarModalTransferencia();


    /*
      Actualizamos inmediatamente
      la conversación que estamos viendo.
    */

    const actualizada =
      conversacionesArray.find(
        x =>
          x.id === c.id
      );


    if (actualizada) {

      actualizada.asesorAsignado =
        gestor;

      actualizada.asesorEmail =
        emailGestor;

      actualizada.equipo =
        equipo;

    }


    alert(
      "Conversación transferida correctamente."
    );


    renderizarVistaConversaciones();

    renderizarAgentes();

  } catch (error) {

    console.error(
      "Error transfiriendo:",
      error
    );

    alert(
      "No se pudo transferir la conversación: " +
      error.message
    );

  }

}

/* =========================================================
   CHATS SIN GESTOR
========================================================= */

document
  .getElementById(
    "menuUnassigned"
  )
  .addEventListener(
    "click",
    () => {

      if (
        !esSupervisor() &&
        !esSenior()
      ) {

        alert(
          "No tenés permiso para ver chats sin gestor."
        );

        return;

      }


      const conversaciones =
        conversacionesArray
          .filter(
            c =>
              c.estado !==
                "finalizada" &&
              !c.asesorAsignado &&
              !c.asesorEmail
          );


      mostrarVista(
        "conversations"
      );


      document
        .getElementById(
          "conversationListTitle"
        )
        .textContent =
          "Chats sin gestor";


      const contenedor =
        document.getElementById(
          "conversationItems"
        );


      contenedor.innerHTML =
        conversaciones.length

          ? conversaciones
              .map(
                c => `

                  <div
                    class="conversation-item"
                    data-id="${escapeHtml(c.id)}"
                  >

                    <div class="conversation-client">
                      ${escapeHtml(
                        obtenerCliente(c)
                      )}
                    </div>

                    <div class="conversation-preview">
                      ${escapeHtml(
                        obtenerUltimoMensaje(c) ||
                        "Sin mensajes"
                      )}
                    </div>

                  </div>

                `
              )
              .join("")

          :

            `
              <div
                style="
                  padding:20px;
                  color:#9ca3af;
                "
              >
                No hay chats sin gestor.
              </div>
            `;


      contenedor
        .querySelectorAll(
          ".conversation-item"
        )
        .forEach(
          item => {

            item.addEventListener(
              "click",
              () => {

                mostrarConversacion(
                  item.dataset.id,
                  "equipo"
                );

              }
            );

          }
        );

    }
  );


/* =========================================================
   PRESENCIA
========================================================= */

function iniciarPresencia() {

  if (!usuarioActual) {
    return;
  }


  const uid =
    usuarioActual.uid;


  const presenciaRef =
    ref(
      db,
      `presencia/${uid}`
    );


  set(
    presenciaRef,
    {

      nombre:
        nombreUsuarioActual,

      email:
        usuarioActual.email ||
        "",

      online:
        true,

      ultimaConexion:
        Date.now()

    }
  );


  onDisconnect(
    presenciaRef
  )
  .update({

    online:
      false,

    ultimaConexion:
      Date.now()

  });

}

</script>
