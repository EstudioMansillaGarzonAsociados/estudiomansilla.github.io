<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Centro de Atención - Estudio Mansilla</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --verde: #24483b;
      --verde-2: #315d4d;
      --verde-claro: #e9f2ee;
      --fondo: #f4f6f5;
      --blanco: #ffffff;
      --texto: #26332e;
      --gris: #718078;
      --borde: #dce3df;
      --rojo: #c94b4b;
      --amarillo: #d6a329;
      --azul: #4776a8;
      --sombra: 0 5px 20px rgba(32, 55, 46, .08);
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--fondo);
      color: var(--texto);
      height: 100vh;
      overflow: hidden;
    }

    button,
    input,
    textarea,
    select {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================
       LOGIN
    ========================= */

    #loginScreen {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at top right, #dfeee7 0, transparent 35%),
        linear-gradient(135deg, #edf4f0, #f8faf9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .login-box {
      width: 390px;
      max-width: calc(100vw - 30px);
      background: white;
      border-radius: 22px;
      padding: 35px;
      box-shadow: 0 20px 60px rgba(28, 56, 44, .15);
    }

    .login-logo {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: var(--verde);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin: 0 auto 18px;
    }

    .login-box h1 {
      margin: 0;
      text-align: center;
      color: var(--verde);
      font-size: 23px;
    }

    .login-subtitle {
      text-align: center;
      color: var(--gris);
      margin: 7px 0 28px;
    }

    .login-label {
      font-size: 12px;
      font-weight: 700;
      color: #52615a;
      display: block;
      margin-bottom: 6px;
    }

    .login-input {
      width: 100%;
      border: 1px solid var(--borde);
      border-radius: 11px;
      padding: 13px;
      outline: none;
      margin-bottom: 14px;
    }

    .login-input:focus {
      border-color: var(--verde-2);
    }

    .login-button {
      width: 100%;
      border: 0;
      border-radius: 11px;
      padding: 13px;
      background: var(--verde);
      color: white;
      font-weight: 800;
      font-size: 14px;
    }

    .login-button:hover {
      background: var(--verde-2);
    }

    .login-error {
      display: none;
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #fff0f0;
      color: #a63737;
      font-size: 12px;
    }

    /* =========================
       APP
    ========================= */

    #app {
      display: none;
      height: 100vh;
      width: 100%;
    }

    .layout {
      display: grid;
      grid-template-columns: 260px 340px minmax(0, 1fr);
      height: 100vh;
    }

    /* =========================
       SIDEBAR
    ========================= */

    .sidebar {
      background: var(--verde);
      color: white;
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .brand {
      padding: 4px 8px 22px;
    }

    .brand-title {
      font-weight: 900;
      font-size: 17px;
      line-height: 1.25;
    }

    .brand-subtitle {
      font-size: 12px;
      opacity: .75;
      margin-top: 5px;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .nav-btn {
      width: 100%;
      border: 0;
      background: transparent;
      color: rgba(255,255,255,.78);
      padding: 12px 13px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 700;
      text-align: left;
    }

    .nav-btn:hover,
    .nav-btn.active {
      background: rgba(255,255,255,.13);
      color: white;
    }

    .nav-icon {
      width: 22px;
      text-align: center;
    }

    .badge {
      margin-left: auto;
      min-width: 23px;
      height: 23px;
      padding: 0 6px;
      border-radius: 99px;
      background: rgba(255,255,255,.13);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
    }

    .sidebar-bottom {
      margin-top: auto;
    }

    .presence-box {
      background: rgba(255,255,255,.09);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .presence-name {
      font-size: 12px;
      font-weight: 800;
    }

    .presence-status {
      margin-top: 4px;
      font-size: 11px;
      opacity: .75;
    }

    .presence-select {
      margin-top: 9px;
      width: 100%;
      border: 0;
      border-radius: 9px;
      padding: 8px;
      background: rgba(255,255,255,.13);
      color: white;
      outline: none;
    }

    .presence-select option {
      color: #222;
    }

    .logout-btn {
      width: 100%;
      border: 1px solid rgba(255,255,255,.15);
      background: transparent;
      color: white;
      border-radius: 10px;
      padding: 10px;
      font-weight: 700;
    }

    /* =========================
       LISTA
    ========================= */

    .list-panel {
      background: #fff;
      border-right: 1px solid var(--borde);
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .list-header {
      padding: 18px 18px 12px;
      border-bottom: 1px solid var(--borde);
    }

    .list-title {
      font-size: 17px;
      font-weight: 900;
      color: var(--verde);
      margin-bottom: 12px;
    }

    .search {
      width: 100%;
      border: 1px solid var(--borde);
      border-radius: 11px;
      padding: 11px 12px;
      outline: none;
      font-size: 12px;
      background: #fafcfb;
    }

    .search:focus {
      border-color: var(--verde-2);
      background: white;
    }

    .items {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .client-card,
    .agent-card {
      width: 100%;
      border: 1px solid var(--borde);
      background: white;
      border-radius: 13px;
      padding: 12px;
      margin-bottom: 8px;
      text-align: left;
      transition: .15s;
    }

    .client-card:hover,
    .agent-card:hover {
      border-color: #b7c8bf;
      background: #fbfdfc;
      transform: translateY(-1px);
    }

    .client-main {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .client-avatar,
    .agent-avatar {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: var(--verde-claro);
      color: var(--verde);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      flex-shrink: 0;
    }

    .client-title {
      font-size: 13px;
      font-weight: 900;
      color: var(--texto);
    }

    .client-sub {
      color: var(--gris);
      font-size: 10px;
      margin-top: 4px;
    }

    .client-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 9px;
    }

    .mini-pill {
      border-radius: 99px;
      background: #f0f3f1;
      color: #52615a;
      padding: 4px 7px;
      font-size: 9px;
      font-weight: 700;
    }

    .mini-pill.green {
      background: #e5f2eb;
      color: #276348;
    }

    .mini-pill.yellow {
      background: #fff4d5;
      color: #886515;
    }

    .mini-pill.red {
      background: #ffeded;
      color: #9c4141;
    }

    .agent-card {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .agent-info {
      min-width: 0;
      flex: 1;
    }

    .agent-name {
      font-size: 13px;
      font-weight: 900;
    }

    .agent-team {
      font-size: 10px;
      color: var(--gris);
      margin-top: 4px;
    }

    .empty {
      text-align: center;
      color: var(--gris);
      font-size: 12px;
      padding: 35px 15px;
    }

    /* =========================
       CHAT
    ========================= */

    .chat-panel {
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: #f7f9f8;
    }

    .topbar {
      height: 86px;
      min-height: 86px;
      background: white;
      border-bottom: 1px solid var(--borde);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }

    .greeting {
      font-size: 17px;
      font-weight: 900;
      color: var(--verde);
    }

    .motivation {
      font-size: 11px;
      color: var(--gris);
      margin-top: 4px;
    }

    .clock {
      text-align: right;
      font-size: 12px;
      color: var(--gris);
    }

    .chat-empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gris);
      text-align: center;
    }

    .chat-empty-inner {
      max-width: 330px;
    }

    .chat-empty-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .chat-empty-title {
      color: var(--verde);
      font-size: 18px;
      font-weight: 900;
    }

    .chat-empty-text {
      margin-top: 7px;
      font-size: 12px;
    }

    .chat-header {
      display: none;
      background: white;
      border-bottom: 1px solid var(--borde);
      padding: 13px 18px;
    }

    .chat-header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .chat-client-title {
      font-size: 15px;
      font-weight: 900;
      color: var(--verde);
    }

    .chat-client-sub {
      font-size: 10px;
      color: var(--gris);
      margin-top: 4px;
    }

    .header-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .action-btn {
      border: 0;
      border-radius: 9px;
      padding: 8px 10px;
      font-size: 10px;
      font-weight: 800;
      background: #eef2f0;
      color: var(--verde);
    }

    .action-btn:hover {
      background: #e0e8e4;
    }

    .action-btn.finalize {
      background: #fce9e9;
      color: #a13f3f;
    }

    .chat-body {
      display: none;
      flex: 1;
      min-height: 0;
      flex-direction: column;
    }

    /* =========================
       FICHA CLIENTE
    ========================= */

    .client-sheet {
      background: white;
      margin: 12px 16px 8px;
      border: 1px solid var(--borde);
      border-radius: 14px;
      padding: 13px;
      box-shadow: var(--sombra);
    }

    .sheet-title {
      color: var(--verde);
      font-size: 12px;
      font-weight: 900;
      margin-bottom: 10px;
    }

    .sheet-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .sheet-item {
      background: #f7f9f8;
      border-radius: 9px;
      padding: 8px;
    }

    .sheet-label {
      font-size: 8px;
      color: var(--gris);
      text-transform: uppercase;
      font-weight: 800;
      margin-bottom: 3px;
    }

    .sheet-value {
      font-size: 11px;
      color: var(--texto);
      font-weight: 700;
      word-break: break-word;
    }

    /* =========================
       MENSAJES
    ========================= */

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px 18px;
    }

    .message-row {
      display: flex;
      margin-bottom: 8px;
    }

    .message-row.mine {
      justify-content: flex-end;
    }

    .message-bubble {
      max-width: 70%;
      border-radius: 14px;
      padding: 9px 11px;
      background: white;
      border: 1px solid var(--borde);
      font-size: 12px;
      line-height: 1.45;
    }

    .message-row.mine .message-bubble {
      background: var(--verde-claro);
      border-color: #d4e7dc;
    }

    .message-author {
      font-size: 8px;
      font-weight: 900;
      color: var(--verde);
      margin-bottom: 3px;
    }

    .message-date {
      margin-top: 5px;
      font-size: 8px;
      color: var(--gris);
      text-align: right;
    }

    .message-image {
      max-width: 280px;
      max-height: 300px;
      border-radius: 9px;
      display: block;
    }

    .composer {
      background: white;
      border-top: 1px solid var(--borde);
      padding: 10px 14px;
    }

    .composer-row {
      display: flex;
      gap: 7px;
      align-items: flex-end;
    }

    .message-input {
      flex: 1;
      resize: none;
      min-height: 42px;
      max-height: 120px;
      border: 1px solid var(--borde);
      border-radius: 11px;
      padding: 11px;
      outline: none;
      font-size: 12px;
    }

    .message-input:focus {
      border-color: var(--verde-2);
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 11px;
      background: #edf2ef;
      color: var(--verde);
      font-size: 17px;
    }

    .send-btn {
      width: 46px;
      height: 42px;
      border: 0;
      border-radius: 11px;
      background: var(--verde);
      color: white;
      font-size: 16px;
    }

    .readonly-notice {
      padding: 10px;
      background: #fff5dc;
      color: #795e17;
      text-align: center;
      font-size: 10px;
      font-weight: 800;
    }

    /* =========================
       MODALES
    ========================= */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(22, 35, 29, .42);
      align-items: center;
      justify-content: center;
      z-index: 8000;
      padding: 15px;
    }

    .modal-box {
      width: 450px;
      max-width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
    }

    .modal-title {
      font-size: 17px;
      color: var(--verde);
      font-weight: 900;
      margin-bottom: 15px;
    }

    .form-group {
      margin-bottom: 11px;
    }

    .form-label {
      display: block;
      font-size: 10px;
      color: var(--gris);
      font-weight: 800;
      margin-bottom: 5px;
    }

    .form-control {
      width: 100%;
      border: 1px solid var(--borde);
      border-radius: 9px;
      padding: 10px;
      outline: none;
      font-size: 12px;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 16px;
    }

    .modal-btn {
      border: 0;
      border-radius: 9px;
      padding: 9px 13px;
      font-size: 11px;
      font-weight: 800;
    }

    .modal-btn.cancel {
      background: #edf0ee;
      color: #52615a;
    }

    .modal-btn.ok {
      background: var(--verde);
      color: white;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 1050px) {
      .layout {
        grid-template-columns: 220px 300px minmax(0, 1fr);
      }

      .sheet-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 800px) {
      .layout {
        grid-template-columns: 70px minmax(230px, 34%) minmax(0, 1fr);
      }

      .brand-title,
      .brand-subtitle,
      .nav-btn span:not(.nav-icon),
      .presence-box,
      .logout-btn {
        display: none;
      }

      .sidebar {
        padding: 15px 8px;
      }

      .nav-btn {
        justify-content: center;
      }

      .badge {
        display: none;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       LOGIN
  ========================== -->

  <div id="loginScreen">

    <div class="login-box">

      <div class="login-logo">💬</div>

      <h1>Estudio Mansilla Garzon y Asociados</h1>

      <div class="login-subtitle">
        Centro de Atención
      </div>

      <label class="login-label">
        Email
      </label>

      <input
        id="loginEmail"
        class="login-input"
        type="email"
        placeholder="tu@email.com"
        autocomplete="username"
      >

      <label class="login-label">
        Contraseña
      </label>

      <input
        id="loginPassword"
        class="login-input"
        type="password"
        placeholder="••••••••"
        autocomplete="current-password"
      >

      <button
        id="loginButton"
        class="login-button"
        type="button"
      >
        Ingresar
      </button>

      <div
        id="loginError"
        class="login-error"
      ></div>

    </div>

  </div>


  <!-- =========================
       APP
  ========================== -->

  <div id="app">

    <div class="layout">

      <!-- =========================
           SIDEBAR
      ========================== -->

      <aside class="sidebar">

        <div class="brand">

          <div class="brand-title">
            Estudio Mansilla Garzon y Asociados
          </div>

          <div class="brand-subtitle">
            Centro de Atención
          </div>

        </div>


        <nav class="nav">

          <button
            id="btnPrincipal"
            class="nav-btn active"
            type="button"
          >
            <span class="nav-icon">🏠</span>
            <span>Principal</span>
            <span
              id="badgePrincipal"
              class="badge"
            >0</span>
          </button>


          <button
            id="btnAgentes"
            class="nav-btn"
            type="button"
          >
            <span class="nav-icon">👥</span>
            <span>Agentes</span>
            <span
              id="badgeAgentes"
              class="badge"
            >0</span>
          </button>


          <button
            id="btnSinAsignar"
            class="nav-btn"
            type="button"
          >
            <span class="nav-icon">📥</span>
            <span>Sin asignar</span>
            <span
              id="badgeSinAsignar"
              class="badge"
            >0</span>
          </button>


          <button
            id="btnHistorial"
            class="nav-btn"
            type="button"
          >
            <span class="nav-icon">📚</span>
            <span>Historial</span>
            <span
              id="badgeHistorial"
              class="badge"
            >0</span>
          </button>

        </nav>


        <div class="sidebar-bottom">

          <div class="presence-box">

            <div
              id="presenceName"
              class="presence-name"
            >
              Usuario
            </div>

            <div
              id="presenceStatus"
              class="presence-status"
            >
              Sin jornada
            </div>

            <select
              id="presenceSelect"
              class="presence-select"
            >

              <option value="sin_jornada">
                Sin jornada
              </option>

              <option value="activo">
                🟢 Activo
              </option>

              <option value="break">
                🟡 Break
              </option>

              <option value="descanso">
                🔵 Descanso
              </option>

              <option value="finalizada">
                🔴 Jornada finalizada
              </option>

            </select>

          </div>


          <button
            id="logoutButton"
            class="logout-btn"
            type="button"
          >
            Cerrar sesión
          </button>

        </div>

      </aside>


      <!-- =========================
           LISTA
      ========================== -->

      <section class="list-panel">

        <div class="list-header">

          <div
            id="listTitle"
            class="list-title"
          >
            💬 Mis gestiones
          </div>

          <input
            id="searchInput"
            class="search"
            type="text"
            placeholder="Buscar por DNI, nombre o teléfono..."
          >

        </div>


        <div
          id="items"
          class="items"
        ></div>

      </section>


      <!-- =========================
           CHAT
      ========================== -->

      <main class="chat-panel">

        <header class="topbar">

          <div>

            <div
              id="greeting"
              class="greeting"
            >
              ¡Bienvenido! 👋
            </div>

            <div
              id="motivation"
              class="motivation"
            ></div>

          </div>


          <div
            id="clock"
            class="clock"
          ></div>

        </header>


        <div
          id="chatEmpty"
          class="chat-empty"
        >

          <div class="chat-empty-inner">

            <div class="chat-empty-icon">
              💬
            </div>

            <div class="chat-empty-title">
              Centro de Atención
            </div>

            <div class="chat-empty-text">
              Seleccioná una gestión para ver la ficha del cliente y la conversación.
            </div>

          </div>

        </div>


        <div
          id="chatHeader"
          class="chat-header"
        >

          <div class="chat-header-top">

            <div>

              <div
                id="chatClientTitle"
                class="chat-client-title"
              >
                Cliente
              </div>

              <div
                id="chatClientSub"
                class="chat-client-sub"
              ></div>

            </div>


            <div
              id="headerActions"
              class="header-actions"
            ></div>

          </div>

        </div>


        <div
          id="chatBody"
          class="chat-body"
        >

          <div
            id="clientSheet"
            class="client-sheet"
          ></div>


          <div
            id="messages"
            class="messages"
          ></div>


          <div
            id="composer"
            class="composer"
          >

            <div class="composer-row">

              <input
                id="imageInput"
                type="file"
                accept="image/*"

    /* =====================================================

    ===================================================== */

    function normalizarTexto(valor) {

      return String(valor || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim();

    }


    function escaparHTML(valor) {

      return String(valor || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function fechaHora(timestamp) {

      if (!timestamp) {
        return "";
      }

      const d =
        new Date(timestamp);

      return d.toLocaleString(
        "es-AR",
        {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        }
      );

    }


    function soloFecha(timestamp) {

      if (!timestamp) {
        return "";
      }

      const d =
        new Date(timestamp);

      return d.toLocaleDateString(
        "es-AR"
      );

    }


    /* =====================================================

    function esSupervisor() {

      return perfilActual === "supervisor";

    }


    function esSenior() {

      return perfilActual === "senior";

    }


    function esAsesor() {

      return perfilActual === "asesor";

    }


    function obtenerEquipoDePersona(nombre) {

      const resultado = [];

      for (const equipo in equipos) {

        if (
          equipos[equipo].gestores.includes(nombre) ||
          equipos[equipo].seniors.includes(nombre)
        ) {

          resultado.push(equipo);

        }

      }

      return resultado;

    }


    function obtenerEquipoDeGestor(nombre) {

      for (const equipo in equipos) {

        if (
          equipos[equipo].gestores.includes(nombre)
        ) {

          return equipo;

        }

      }

      return "";

    }


    function obtenerTodosLosGestores() {

      const todos = [];

      for (const equipo in equipos) {

        equipos[equipo].gestores.forEach(
          gestor => {

            if (!todos.includes(gestor)) {
              todos.push(gestor);
            }

          }
        );

      }

      return todos;

    }


    /* =====================================================
       DATOS DE CONVERSACION
    ===================================================== */

    function obtenerEquipoDeConversacion(c) {

      return (

        c.equipo ||
        c.nombreEquipo ||
        c.team ||
        c.equipoAsignado ||
        ""

      );

    }


    function obtenerGestorDeConversacion(c) {

      return (

        c.gestor ||
        c.gestorAsignado ||
        c.asignadoA ||
        c.asesor ||
        c.usuarioAsignado ||
        c.nombreGestor ||
        ""

      );

    }


    function obtenerEmailGestor(c) {

      return (

        c.gestorEmail ||
        c.asignadoEmail ||
        c.emailGestor ||
        c.asesorEmail ||
        ""

      );

    }


    function obtenerDatosCliente(c) {

      const d =
        c?.datosCliente ||
        c?.cliente ||
        c?.datos ||
        {};

      return {

        nombre:
          d.nombre ||
          c.nombre ||
          c.nombreCliente ||
          c.clienteNombre ||
          "",

        dni:
          d.dni ||
          c.dni ||
          c.documento ||
          c.document ||
          "",

        telefono:
          d.telefono ||
          c.telefono ||
          c.celular ||
          c.phone ||
          "",

        fecha:
          d.fecha ||
          c.fecha ||
          "",

        motivo:
          d.motivo ||
          c.motivo ||
          c.asunto ||
          c.motivoConsulta ||
          ""

      };

    }


    function estaSinAsignar(c) {

      const gestor =
        obtenerGestorDeConversacion(c);

      const email =
        obtenerEmailGestor(c);

      return (
        !normalizarTexto(gestor) &&
        !normalizarTexto(email)
      );

    }


    function conversacionEsMia(c) {

      const gestor =
        obtenerGestorDeConversacion(c);

      const email =
        normalizarTexto(
          obtenerEmailGestor(c)
        );

      if (
        normalizarTexto(gestor) ===
        normalizarTexto(nombreActual)
      ) {

        return true;

      }


      if (
        email &&
        usuarioActual?.email &&
        email ===
        normalizarTexto(
          usuarioActual.email
        )
      ) {

        return true;

      }

      return false;

    }


    /* =====================================================
       PERMISOS
    ===================================================== */

    function puedeVerPorEquipo(c) {

      if (esSupervisor()) {
        return true;
      }


      let equipo =
        obtenerEquipoDeConversacion(c);


      if (!equipo) {

        const gestor =
          obtenerGestorDeConversacion(c);

        if (gestor) {

          equipo =
            obtenerEquipoDeGestor(gestor);

        }

      }


      if (!equipo) {

        const email =
          normalizarTexto(
            obtenerEmailGestor(c)
          );

        if (email) {

          const nombrePorEmail =
            emailsPorNombre[email];

          if (nombrePorEmail) {

            equipo =
              obtenerEquipoDeGestor(
                nombrePorEmail
              );

          }

        }

      }


      if (!equipo) {

        return false;

      }


      const misEquipos =
        obtenerEquipoDePersona(
          nombreActual
        );


      return misEquipos.some(
        e =>
          normalizarTexto(e) ===
          normalizarTexto(equipo)
      );

    }


    function puedeGestionarConversacion(c) {

      if (esSupervisor()) {
        return true;
      }

      if (esSenior()) {
        return puedeVerPorEquipo(c);
      }

      if (esAsesor()) {
        return puedeVerPorEquipo(c);
      }

      return false;

    }


    function puedeAsignar() {

      return (
        esSupervisor() ||
        esSenior()
      );

    }


    /* =====================================================
       CONVERSACIONES
    ===================================================== */

    function todasLasConversaciones() {

      return Object.entries(
        conversaciones || {}
      ).map(([id, data]) => ({

        id,

        ...(data || {})

      }));

    }


    function conversacionesActivas() {

      return todasLasConversaciones()
        .filter(c =>
          normalizarTexto(c.estado) !==
          "finalizada"
        );

    }


    function conversacionesFinalizadas() {

      return todasLasConversaciones()
        .filter(c =>
          normalizarTexto(c.estado) ===
          "finalizada"
        );

    }


    function aplicarFiltroLista(lista) {

      const texto =
        normalizarTexto(
          $("searchInput").value
        );

      if (!texto) {
        return lista;
      }


      return lista.filter(c => {

        const d =
          obtenerDatosCliente(c);

        return (

          normalizarTexto(d.nombre)
            .includes(texto) ||

          normalizarTexto(d.dni)
            .includes(texto) ||

          normalizarTexto(d.telefono)
            .includes(texto)

        );

      });

    }


    /* =====================================================
       TARJETA CLIENTE

    function crearCardCliente(

    ) {

      const boton =

      boton.type = "button";

      const d =

          : d.nombre

      let subtitulo =

        d.dni
          ? d.nombre
          : "";


      const gestor =

      const equipo =
        obtenerEquipoDeConversacion(c);


      const inicial =
        (
          d.nombre ||
          d.dni ||
          "C"
        )

      boton.innerHTML = `

        <div class="client-main">

            ${escaparHTML(inicial)}

          <div style="min-width:0;flex:1;">

            <div class="client-title">

            </div>

            ${
              subtitulo
                ? `
                  <div class="client-sub">

                  </div>
                `
                : ""
            }

          </div>

        </div>


        <div class="client-meta">

          ${
            gestor

                <span class="mini-pill green">
                  👤 ${escaparHTML(gestor)}
                </span>
              `
              : `
                <span class="mini-pill yellow">
                  📥 Sin asignar
                </span>
              `
          }


          ${
            equipo
              ? `
                <span class="mini-pill">

                </span>
              `
              : ""
          }


          ${
            historial

                <span class="mini-pill red">

                </span>
              `
              : `
                <span class="mini-pill green">
                  Activa
                </span>
              `
          }

        </div>

      boton.onclick = () => {

    /* =====================================================
       PRINCIPAL
    ===================================================== */

    function renderizarPrincipal() {

      const items =
        $("items");

      items.innerHTML = "";


      $("listTitle").textContent =
        esSupervisor()
          ? "👥 Gestores"
          : "💬 Mis gestiones";


      if (esSupervisor()) {

        renderizarAgentesEnPrincipal();

        return;

      }


      let lista =
        conversacionesActivas();


      if (esSenior()) {

        lista =
          lista.filter(c =>
            conversacionEsMia(c)
          );

      }


      if (esAsesor()) {

        lista =
          lista.filter(c =>
            conversacionEsMia(c)
          );

      }


      lista =
        aplicarFiltroLista(lista);


      lista.sort(
        (a,b) =>
          (b.fechaCreacion || 0) -
          (a.fechaCreacion || 0)
      );


      if (!lista.length) {

        items.innerHTML = `
          <div class="empty">
            ✨ No tenés gestiones activas.
          </div>
        `;

        return;

      }


      lista.forEach(c => {

        items.appendChild(
          crearCardCliente(c)

      });

      const equipo =
        obtenerEquipoDeGestor(nombre);

      boton.onclick = () => {

        abrirChatsDeGestor(nombre);

      const items =
        $("items");

      items.innerHTML = "";


      let gestores = [];


      if (esSupervisor()) {

        gestores =
          obtenerTodosLosGestores();

      }
      else {

        const misEquipos =
          obtenerEquipoDePersona(
            nombreActual
          );


        misEquipos.forEach(
          equipo => {

            const gestoresEquipo =
              equipos[equipo]?.gestores ||
              [];


            gestoresEquipo.forEach(
              gestor => {

                if (
                  !gestores.includes(
                    gestor

                ) {

                  gestores.push(
                    gestor
                  );

                }

              }
            );

          }

      }


      gestores.sort(
        (a,b) =>
          a.localeCompare(
            b,
            "es"

      );


      if (!gestores.length) {

        items.innerHTML = `
          <div class="empty">
            No hay gestores para mostrar.
          </div>

        return;

      gestores.forEach(
        nombre => {

          items.appendChild(
            crearCardGestor(nombre)

        }

        conversacionesActivas()

          );


      if (!esSupervisor()) {

        lista =

            📥 No hay gestiones sin asignar.
          </div>
        `;

        return;

      }


      lista.forEach(c => {

        items.appendChild(
          crearCardCliente(c)
        );

      });

    }


    /* =====================================================
       HISTORIAL
    ===================================================== */

    function renderizarHistorial() {

      const items =
        $("items");


      items.innerHTML = "";


      let lista =
        conversacionesFinalizadas();


      lista =
        aplicarFiltroLista(lista);


      lista.sort(
        (a,b) =>
          (b.fechaFinalizacion ||
            b.fechaCreacion ||
            0) -
          (a.fechaFinalizacion ||
            a.fechaCreacion ||
            0)
      );


      if (!lista.length) {

        items.innerHTML = `
          <div class="empty">

            📚 No hay gestiones finalizadas.

            <div
              style="
                margin-top:8px;
                font-size:11px;
              "
            >
              Probá buscar por DNI,
              nombre o teléfono.
            </div>

          </div>
        `;

        return;

      }


      lista.forEach(c => {

        items.appendChild(
          crearCardCliente(
            c,
            true
          )
        );

      });

    }


    /* =====================================================
       ABRIR CONVERSACION
    ===================================================== */

    function abrirConversacion(id) {

      const c =
        conversaciones[id];


      if (!c) {
        return;
      }


      conversacionSeleccionada =
        id;


      $("chatEmpty").style.display =
        "none";


      $("chatHeader").style.display =
        "block";


      $("chatBody").style.display =
        "flex";


      renderizarCabeceraChat(c);

      renderizarFichaCliente(c);

      renderizarMensajes(c);

    }


    /* =====================================================
       CABECERA CHAT
    ===================================================== */

    function renderizarCabeceraChat(c) {

      const d =
        obtenerDatosCliente(c);


      const titulo =
        d.nombre ||
        (
          d.dni
            ? `DNI ${d.dni}`
            : "Cliente"
        );


      $("chatClientTitle").textContent =
        titulo;


      const partes = [];


      if (d.dni) {
        partes.push(
          `DNI ${d.dni}`
        );
      }


      if (d.telefono) {
        partes.push(
          `📞 ${d.telefono}`
        );
      }


      $("chatClientSub").textContent =
        partes.join(" · ");


      const actions =
        $("headerActions");


      actions.innerHTML = "";


      const puedeGestionar =
        puedeGestionarConversacion(c);


      const finalizada =
        normalizarTexto(c.estado) ===
        "finalizada";


      if (
        puedeAsignar() &&
        !finalizada
      ) {

        const asignar =
          document.createElement("button");


        asignar.className =
          "action-btn";


        asignar.textContent =
          "👤 Asignar";


        asignar.onclick =
          abrirModalAsignacion;


        actions.appendChild(
          asignar
        );

      }


      if (
        puedeGestionar &&
        !finalizada
      ) {

        const finalizar =
          document.createElement("button");


        finalizar.className =
          "action-btn finalize";


        finalizar.textContent =
          "✓ Finalizar";


        finalizar.onclick =
          finalizarConversacion;


        actions.appendChild(
          finalizar
        );

      }

    }


    /* =====================================================
       FICHA COMPLETA
    ===================================================== */

    function renderizarFichaCliente(c) {

      const d =
        obtenerDatosCliente(c);


      const gestor =
        obtenerGestorDeConversacion(c);


      const equipo =
        obtenerEquipoDeConversacion(c);


      const finalizada =
        normalizarTexto(c.estado) ===
        "finalizada";


      const campos = [];


      if (d.nombre) {

        campos.push({
          label: "Nombre",
          value: d.nombre
        });

      }


      if (d.dni) {

        campos.push({
          label: "DNI",
          value: d.dni
        });

      }


      if (d.telefono) {

        campos.push({
          label: "Teléfono",
          value: d.telefono
        });

      }


      if (d.fecha) {

        campos.push({
          label: "Fecha",
          value: d.fecha
        });

      }


      if (d.motivo) {

        campos.push({
          label: "Motivo",
          value: d.motivo
        });

      }


      if (equipo) {

        campos.push({
          label: "Equipo",
          value: equipo
        });

      }


      if (gestor) {

        campos.push({
          label: "Gestor",
          value: gestor
        });

      }


      campos.push({

        label: "Estado",

        value:
          finalizada
            ? "Finalizada"
            : "Activa"

      });


      if (c.fechaCreacion) {

        campos.push({

          label: "Creada",

          value:
            fechaHora(
              c.fechaCreacion
            )

        });

      }


      if (c.fechaFinalizacion) {

        campos.push({

          label: "Finalizada",

          value:
            fechaHora(
              c.fechaFinalizacion
            )

        });

      }


      $("clientSheet").innerHTML = `

        <div class="sheet-title">
          📋 Ficha del cliente
        </div>

        <div class="sheet-grid">

          ${

            campos.map(
              campo => `

                <div class="sheet-item">

                  <div class="sheet-label">
                    ${escaparHTML(
                      campo.label
                    )}
                  </div>

                  <div class="sheet-value">
                    ${escaparHTML(
                      campo.value
                    )}
                  </div>

                </div>

              `
            ).join("")

          }

        </div>

      `;

    }


    /* =====================================================
       MENSAJES
    ===================================================== */

    function obtenerMensajes(c) {

      const mensajes =
        c.mensajes || {};


      return Object.entries(
        mensajes
      )
        .map(
          ([id, data]) => ({
            id,
            ...(data || {})
          })
        )
        .sort(
          (a,b) =>
            (a.fecha || 0) -
            (b.fecha || 0)
        );

    }


    function renderizarMensajes(c) {

      const messages =
        $("messages");


      messages.innerHTML = "";


      const mensajes =
        obtenerMensajes(c);


      if (!mensajes.length) {

        messages.innerHTML = `

          <div class="empty">
            No hay mensajes todavía.
          </div>

        `;

      }
      else {

        mensajes.forEach(
          mensaje => {

            const row =
              document.createElement(
                "div"
              );


            const esMio =
              normalizarTexto(
                mensaje.remitente
              ) ===
              normalizarTexto(
                nombreActual
              );


            row.className =
              "message-row" +
              (
                esMio
                  ? " mine"
                  : ""
              );


            const bubble =
              document.createElement(
                "div"
              );


            bubble.className =
              "message-bubble";


            if (
              mensaje.tipo ===
              "imagen" &&
              mensaje.url
            ) {

              bubble.innerHTML = `

                <div class="message-author">
                  ${escaparHTML(
                    mensaje.remitente ||
                    "Usuario"
                  )}
                </div>

                <img
                  class="message-image"
                  src="${escaparHTML(
                    mensaje.url
                  )}"
                  alt="Imagen enviada"
                >

                <div class="message-date">
                  ${fechaHora(
                    mensaje.fecha
                  )}
                </div>

              `;

            }
            else {

              bubble.innerHTML = `

                <div class="message-author">
                  ${escaparHTML(
                    mensaje.remitente ||
                    "Usuario"
                  )}
                </div>

                <div>
                  ${escaparHTML(
                    mensaje.texto ||
                    ""
                  ).replace(
                    /\n/g,
                    "<br>"
                  )}
                </div>

                <div class="message-date">
                  ${fechaHora(
                    mensaje.fecha
                  )}
                </div>

              `;

            }


            row.appendChild(
              bubble
            );


            messages.appendChild(
              row
            );

          }
        );

      }


      messages.scrollTop =
        messages.scrollHeight;


      const finalizada =
        normalizarTexto(c.estado) ===
        "finalizada";


      const puedeGestionar =
        puedeGestionarConversacion(c);


      if (
        finalizada ||
        !puedeGestionar
      ) {

        $("composer").style.display =
          "none";


        if (
          finalizada
        ) {

          agregarAvisoSoloLectura();

        }

      }
      else {

        $("composer").style.display =
          "block";

      }

    }


    function agregarAvisoSoloLectura() {

      const existe =
        document.getElementById(
          "readonlyNotice"
        );


      if (existe) {
        return;
      }


      const aviso =
        document.createElement(
          "div"
        );


      aviso.id =
        "readonlyNotice";


      aviso.className =
        "readonly-notice";


      aviso.textContent =
        "📚 Esta gestión está finalizada y se encuentra en modo solo lectura.";


      $("chatBody")
        .insertBefore(
          aviso,
          $("messages")
        );

    }


    function quitarAvisoSoloLectura() {

      const aviso =
        document.getElementById(
          "readonlyNotice"
        );


      if (aviso) {

        aviso.remove();

      }

    }


    /* =====================================================
       ENVIAR MENSAJE
    ===================================================== */

    async function enviarMensaje() {

      if (
        !conversacionSeleccionada
      ) {

        return;

      }


      const texto =
        $("messageInput")
          .value
          .trim();


      if (!texto) {

        return;

      }


      const c =
        conversaciones[
          conversacionSeleccionada
        ];


      if (!c) {
        return;
      }


      if (
        normalizarTexto(c.estado) ===
        "finalizada"
      ) {

        return;

      }


      if (
        !puedeGestionarConversacion(c)
      ) {

        alert(
          "No tenés permiso para gestionar esta conversación."
        );

        return;

      }


      const mensajesRef =
        ref(
          db,
          `conversaciones/${conversacionSeleccionada}/mensajes`
        );


      const nuevoMensaje =
        push(mensajesRef);


      await set(
        nuevoMensaje,
        {

          fecha: Date.now(),

          remitente:
            nombreActual,

          remitenteEmail:
            usuarioActual?.email ||
            "",

          texto

        }
      );


      $("messageInput").value =
        "";

    }


    /* =====================================================
       ENVIAR IMAGEN
    ===================================================== */

    async function enviarImagen(file) {

      if (
        !file ||
        !conversacionSeleccionada
      ) {

        return;

      }


      const c =
        conversaciones[
          conversacionSeleccionada
        ];


      if (!c) {
        return;
      }


      if (
        normalizarTexto(c.estado) ===
        "finalizada"
      ) {

        return;

      }


      if (
        !puedeGestionarConversacion(c)
      ) {

        alert(
          "No tenés permiso para gestionar esta conversación."
        );

        return;

      }


      try {

        $("imageButton").disabled =
          true;


        const ruta =
          `conversaciones/${conversacionSeleccionada}/${Date.now()}_${file.name}`;


        const archivoRef =
          storageRef(
            storage,
            ruta
          );


        await uploadBytes(
          archivoRef,
          file
        );


        const url =
          await getDownloadURL(
            archivoRef
          );


        const mensajesRef =
          ref(
            db,
            `conversaciones/${conversacionSeleccionada}/mensajes`
          );


        const nuevoMensaje =
          push(mensajesRef);


        await set(
          nuevoMensaje,
          {

            fecha: Date.now(),

            remitente:
              nombreActual,

            remitenteEmail:
              usuarioActual?.email ||
              "",

            tipo: "imagen",

            url

          }
        );

      }
      catch (error) {

        console.error(error);

        alert(
          "No se pudo enviar la imagen."
        );

      }
      finally {

        $("imageButton").disabled =
          false;

        $("imageInput").value =
          "";

      }

    }


    /* =====================================================
       FINALIZAR
    ===================================================== */

    async function finalizarConversacion() {

      if (
        !conversacionSeleccionada
      ) {

        return;

      }


      const c =
        conversaciones[
          conversacionSeleccionada
        ];


      if (!c) {
        return;
      }


      if (
        !puedeGestionarConversacion(c)
      ) {

          "No tenés permiso para finalizar esta gestión."
        );

        return;

      }


      if (
        !confirm(
          "¿Querés finalizar esta gestión?"
        )
      ) {

        return;

      }


      try {

        await update(
          ref(
            db,
            `conversaciones/${conversacionSeleccionada}`
          ),
          {

            estado:
              "finalizada",

            fechaFinalizacion:
              Date.now(),

            finalizadoPor:
              nombreActual,

            finalizadoPorEmail:
              usuarioActual?.email ||
              "",

            motivoFinalizacion:
              "Finalizada desde Centro de Atención"

          }
        );


        abrirConversacion(
          conversacionSeleccionada
        );

      }
      catch (error) {

        console.error(error);

        alert(
          "No se pudo finalizar la gestión."
        );

      }

    }


    /* =====================================================
       ASIGNAR
    ===================================================== */

    function abrirModalAsignacion() {

      if (
        !conversacionSeleccionada
      ) {

        return;

      }


      if (!puedeAsignar()) {

        return;

      }


      const modal =
        $("assignModal");


      const team =
        $("assignTeam");


      team.innerHTML =
        "";


      Object.keys(equipos)
        .forEach(
          nombreEquipo => {

            const option =
              document.createElement(
                "option"
              );


            option.value =
              nombreEquipo;


            option.textContent =
              nombreEquipo;


            team.appendChild(
              option
            );

          }
        );


      const c =
        conversaciones[
          conversacionSeleccionada
        ];


      const equipoActual =
        obtenerEquipoDeConversacion(c);


      if (
        equipoActual &&
        equipos[equipoActual]
      ) {

        team.value =
          equipoActual;

      }


      cargarGestoresAsignacion();


      modal.style.display =
        "flex";

    }


    function cargarGestoresAsignacion() {

      const team =
        $("assignTeam").value;


      const agent =
        $("assignAgent");


      agent.innerHTML =
        "";


      const gestores =
        equipos[
          team
        ]?.gestores || [];


      gestores.forEach(
        gestor => {

          const option =
            document.createElement(
              "option"
            );


          option.value =
            gestor;


          option.textContent =
            gestor;


          agent.appendChild(
            option
          );

        }
      );


      const c =
        conversaciones[
          conversacionSeleccionada
        ];


      const actual =
        obtenerGestorDeConversacion(c);


      if (
        actual &&
        gestores.includes(actual)
      ) {

        agent.value =
          actual;

      }

    }


    async function confirmarAsignacion() {

      if (
        !conversacionSeleccionada
      ) {

        return;

      }


      const equipo =
        $("assignTeam").value;


      const gestor =
        $("assignAgent").value;


      if (
        !equipo ||
        !gestor
      ) {

        alert(
          "Seleccioná equipo y gestor."
        );

        return;

      }


      try {

        await update(
          ref(
            db,
            `conversaciones/${conversacionSeleccionada}`
          ),
          {

            equipo,

            nombreEquipo:
              equipo,

            gestor,

            gestorAsignado:
              gestor,

            asignadoA:
              gestor,

            asesor:
              gestor

          }
        );


        $("assignModal").style.display =
          "none";


        abrirConversacion(
          conversacionSeleccionada
        );


        renderizarActual();

      }
      catch (error) {

        console.error(error);

        alert(
          "No se pudo asignar la gestión."
        );

      }

    }


    /* =====================================================
       RENDER GENERAL
    ===================================================== */

    function renderizarActual() {

      actualizarContadores();


      if (
        modoActual ===
        "principal"
      ) {

        renderizarPrincipal();

      }
      else if (
        modoActual ===
        "agentes"
      ) {

        renderizarAgentes();

      }
      else if (
        modoActual ===
        "sinAsignar"
      ) {

        renderizarSinAsignar();

      }
      else if (
        modoActual ===
        "historial"
      ) {

        renderizarHistorial();

      }

    }


    /* =====================================================
       CONTADORES
    ===================================================== */

    function actualizarContadores() {

      const activas =
        conversacionesActivas();


      const finalizadas =
        conversacionesFinalizadas();


      let principal = 0;

      let agentes = 0;

      let sinAsignar = 0;


      const historial =
        finalizadas.length;


      if (esSupervisor()) {

        principal =
          obtenerTodosLosGestores().length;

        agentes =
          activas.length;

        sinAsignar =
          activas.filter(c =>
            estaSinAsignar(c)
          ).length;

      }

      else if (esSenior()) {

        principal =
          activas.filter(c =>
            conversacionEsMia(c)
          ).length;

        agentes =
          activas.filter(c =>
            !estaSinAsignar(c) &&
            puedeVerPorEquipo(c)
          ).length;

        sinAsignar =
          activas.filter(c =>
            estaSinAsignar(c)
          ).length;

      }

      else {

        principal =
          activas.filter(c =>
            conversacionEsMia(c)
          ).length;

        agentes =
          activas.filter(c =>
            puedeVerPorEquipo(c)
          ).length;

      }


      $("badgePrincipal").textContent =
        principal;


      $("badgeAgentes").textContent =
        agentes;


      $("badgeSinAsignar").textContent =
        sinAsignar;


      $("badgeHistorial").textContent =
        historial;

    }

    /* =====================================================
       USUARIOS FIREBASE
    ===================================================== */

    function buscarUsuarioFirebase(
      email
    ) {

      const objetivo =
        normalizarTexto(email);


      for (
        const key in usuariosFirebase
      ) {

        const usuario =
          usuariosFirebase[key];


        if (
          normalizarTexto(
            usuario?.email
          ) === objetivo
        ) {

          return usuario;

        }

      }


      return null;

    }


    function determinarNombreUsuario(
      user
    ) {

      const email =
        normalizarTexto(
          user.email
        );


      if (
        emailsPorNombre[email]
      ) {

        return emailsPorNombre[email];

      }


      const usuario =
        buscarUsuarioFirebase(
          user.email
        );


      if (
        usuario?.nombre
      ) {

        return usuario.nombre;

      }


      if (
        user.displayName
      ) {

        return user.displayName;

      }


      return (
        user.email ||
        "Usuario"
      )
        .split("@")[0];

    }


    function determinarPerfil(
      nombre,
      user
    ) {

      if (
        perfiles[nombre]
      ) {

        return perfiles[nombre];

      }


      const usuario =
        buscarUsuarioFirebase(
          user.email
        );


      if (
        usuario?.perfil
      ) {

        return normalizarTexto(
          usuario.perfil
        );

      }


      return "asesor";

    }


    /* =====================================================
       FIREBASE: CONVERSACIONES
    ===================================================== */

    function escucharConversaciones() {

      if (
        unsubscribeConversaciones
      ) {

        unsubscribeConversaciones();

      }


      const conversacionesRef =
        ref(
          db,
          "conversaciones"
        );


      unsubscribeConversaciones =
        onValue(
          conversacionesRef,
          snapshot => {

            conversaciones =
              snapshot.val() || {};


            renderizarActual();


            if (
              conversacionSeleccionada &&
              conversaciones[
                conversacionSeleccionada
              ]
            ) {

              const c =
                conversaciones[
                  conversacionSeleccionada
                ];


              renderizarCabeceraChat(c);

              renderizarFichaCliente(c);

              renderizarMensajes(c);

            }

          },
          error => {

            console.error(
              "Error leyendo conversaciones:",
              error
            );

          }
        );

    }


    /* =====================================================
       FIREBASE: USUARIOS
    ===================================================== */

    function escucharUsuarios() {

      if (
        unsubscribeUsuarios
      ) {

        unsubscribeUsuarios();

      }


      unsubscribeUsuarios =
        onValue(
          ref(
            db,
            "usuarios"
          ),
          snapshot => {

            usuariosFirebase =
              snapshot.val() || {};


            if (
              usuarioActual
            ) {

              nombreActual =
                determinarNombreUsuario(
                  usuarioActual
                );


              perfilActual =
                determinarPerfil(
                  nombreActual,
                  usuarioActual
                );


              actualizarInterfazUsuario();

              renderizarActual();

            }

          }
        );

    }


    /* =====================================================
       INTERFAZ USUARIO
    ===================================================== */

    function actualizarInterfazUsuario() {

      $("presenceName").textContent =
        nombreActual;


      actualizarSaludo();


      /* Sin asignar solo para senior/supervisor */

      $("btnSinAsignar").style.display =
        (
          esSupervisor() ||
          esSenior()
        )
          ? "flex"
          : "none";

    }


    /* =====================================================
       LOGIN
    ===================================================== */

    async function iniciarSesion() {

      const email =
        $("loginEmail")
          .value
          .trim();


      const password =
        $("loginPassword")
          .value;


      $("loginError").style.display =
        "none";


      if (
        !email ||
        !password
      ) {

        mostrarErrorLogin(
          "Completá email y contraseña."
        );

        return;

      }


      $("loginButton").disabled =
        true;


      $("loginButton").textContent =
        "Ingresando...";


      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

      }
      catch (error) {

        console.error(error);

        mostrarErrorLogin(
          "No se pudo iniciar sesión. Revisá el email y la contraseña."
        );

      }
      finally {

        $("loginButton").disabled =
          false;


        $("loginButton").textContent =
          "Ingresar";

      }

    }


    function mostrarErrorLogin(
      mensaje
    ) {

      $("loginError").textContent =
        mensaje;


      $("loginError").style.display =
        "block";

    }


    /* =====================================================
       AUTH STATE
    ===================================================== */

    onAuthStateChanged(
      auth,
      async user => {

        usuarioActual =
          user;


        if (!user) {

          $("loginScreen").style.display =
            "flex";


          $("app").style.display =
            "none";


          return;

        }


        nombreActual =
          determinarNombreUsuario(
            user
          );


        perfilActual =
          determinarPerfil(
            nombreActual,
            user
          );


        $("loginScreen").style.display =
          "none";


        $("app").style.display =
          "block";


        actualizarInterfazUsuario();


        actualizarReloj();


        escucharConversaciones();


        escucharUsuarios();


        await actualizarPresencia(
          "activo"
        );


        renderizarActual();

      }
    );


    /* =====================================================
       EVENTOS
    ===================================================== */

    $("loginButton")
      .addEventListener(
        "click",
        iniciarSesion
      );


    $("loginPassword")
      .addEventListener(
        "keydown",
        event => {

          if (
            event.key ===
            "Enter"
          ) {

            iniciarSesion();

          }

        }
      );


    $("logoutButton")
      .addEventListener(
        "click",
        async () => {

          try {

            await actualizarPresencia(
              "finalizada"
            );

          }
          catch (e) {

            console.error(e);

          }


          await signOut(auth);

        }
      );


    $("presenceSelect")
      .addEventListener(
        "change",
        event => {

          actualizarPresencia(
            event.target.value
          );

        }
      );


    $("btnPrincipal")
      .addEventListener(
        "click",
        irPrincipal
      );


    $("btnAgentes")
      .addEventListener(
        "click",
        irAgentes
      );


    $("btnSinAsignar")
      .addEventListener(
        "click",
        irSinAsignar
      );


    $("btnHistorial")
      .addEventListener(
        "click",
        irHistorial
      );


    $("searchInput")
      .addEventListener(
        "input",
        () => {

          renderizarActual();

        }
      );


    $("sendButton")
      .addEventListener(
        "click",
        enviarMensaje
      );


    $("messageInput")
      .addEventListener(
        "keydown",
        event => {

          if (
            event.key ===
            "Enter" &&
            !event.shiftKey
          ) {

            event.preventDefault();

            enviarMensaje();

          }

        }
      );


    $("imageButton")
      .addEventListener(
        "click",
        () => {

          $("imageInput").click();

        }
      );


    $("imageInput")
      .addEventListener(
        "change",
        event => {

          const file =
            event.target.files?.[0];


          if (file) {

            enviarImagen(file);

          }

        }
      );


    $("assignTeam")
      .addEventListener(
        "change",
        cargarGestoresAsignacion
      );


    $("cancelAssign")
      .addEventListener(
        "click",
        () => {

          $("assignModal").style.display =
            "none";

        }
      );


    $("confirmAssign")
      .addEventListener(
        "click",
        confirmarAsignacion
      );


    $("assignModal")
      .addEventListener(
        "click",
        event => {

          if (
            event.target ===
            $("assignModal")
          ) {

            $("assignModal").style.display =
              "none";

          }

        }
      );


    /* =====================================================
       INICIO
    ===================================================== */

    actualizarReloj();

  </script>

</body>
</html>
