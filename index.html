<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centro de Atención - Estudio Mansilla</title>

  <style>
    * {
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: white;
      width: 90%;
      max-width: 450px;
      padding: 40px 30px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
      text-align: center;
    }

    .icon {
      font-size: 50px;
      margin-bottom: 15px;
    }

    h1 {
      margin: 0 0 15px;
      color: #222;
    }

    p {
      color: #666;
      line-height: 1.5;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    .status {
      margin-top: 20px;
      font-size: 14px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="icon">💬</div>

    <h1>Centro de Atención</h1>

    <p>
      Hola 👋<br>
      Estamos para ayudarte.
    </p>

    <button onclick="iniciarChat()">
      Hablar con un asesor
    </button>

    <div class="status">
      Atención online
    </div>
  </div>

  <script>
    function iniciarChat() {
      alert("Próximamente podrás hablar con un asesor.");
    }
  </script>

</body>
</html>
