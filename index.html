<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Centro de Atención - Estudio Mansilla</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 95%;
      max-width: 500px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
      overflow: hidden;
    }

    .header {
      background: #222;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 22px;
    }

    .header p {
      margin: 6px 0 0;
      font-size: 13px;
      opacity: 0.8;
    }

    .inicio {
      padding: 30px 25px;
    }

    .inicio h2 {
      text-align: center;
      margin-top: 0;
    }

    .inicio p {
      color: #666;
      line-height: 1.5;
      text-align: center;
    }

    .campo {
      margin-top: 15px;
    }

    .campo label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: bold;
    }

    .campo input,
    .campo select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
    }

    .boton {
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      border: none;
      border-radius: 10px;
      background: #222;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    .boton:hover {
      opacity: 0.85;
    }

    .error {
      display: none;
      margin-top: 12px;
      padding: 10px;
      background: #ffe5e5;
      color: #b00000;
      border-radius: 8px;
      font-size: 13px;
    }

    .chat {
      display: none;
      height: 600px;
      flex-direction: column;
    }

    .chat-header {
      background: #222;
      color: white;
      padding: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .volver {
      background: transparent;
      border: none;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    .estado {
      font-size: 12px;
      color: #8cff8c;
    }

    .mensajes {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      background: #f7f7f7;
    }

    .mensaje {
      max-width: 80%;
      padding: 10px 13px;
      margin-bottom: 10px;
      border-radius: 12px;
      line-height: 1.4;
      font-size: 14px;
      word-wrap: break-word;
    }

    .cliente {
      background: #222;
      color: white;
      margin-left: auto;
      border-bottom-right-radius: 3px;
    }

    .asesor {
      background: white;
      color: #333;
      margin-right: auto;
      border: 1px solid #ddd;
      border-bottom-left-radius: 3px;
    }

    .entrada {
      display: flex;
      padding: 10px;
      background: white;
      border-top: 1px solid #ddd;
      gap: 8px;
    }

    .entrada input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      outline: none;
    }

    .enviar {
      width: 50px;
      border: none;
      border-radius: 10px;
      background: #222;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    .nombre-cliente {
      font-size: 14px;
    }

    @media (max-width: 500px) {
      .container {
        width: 100%;
        min-height: 100vh;
        border-radius: 0;
      }

      .chat {
        height: 100vh;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- FORMULARIO -->

    <div class="inicio" id="inicio">

      <div style="font-size:50px; text-align:center;">
        💬
      </div>

      <h2>Centro de Atención</h2>

      <p>
        Hola 👋<br>
        Para comenzar, completá tus datos.
      </p>


      <div class="campo">

        <label>
          Nombre y apellido
        </label>

        <input
          type="text"
          id="nombre"
          placeholder="Ej.: Juan Pérez"
        >

      </div>


      <div class="campo">

        <label>
          Teléfono
        </label>

        <input
          type="tel"
          id="telefono"
          placeholder="Ej.: 351 1234567"
        >

      </div>


      <div class="campo">

        <label>
          Motivo de consulta
        </label>

        <select id="motivo">

          <option value="">
            Seleccioná una opción
          </option>

          <option value="Consulta por deuda">
            Consulta por deuda
          </option>

          <option value="Pago">
            Pago
          </option>

          <option value="Acuerdo de pago">
            Acuerdo de pago
          </option>

          <option value="Consulta general">
            Consulta general
          </option>

          <option value="Otro">
            Otro
          </option>

        </select>

      </div>


      <div
        class="error"
        id="error"
      >
        Completá todos los campos para continuar.
      </div>


      <button
        class="boton"
        onclick="comenzarChat()"
      >
        👤 Comenzar chat
      </button>

    </div>


    <!-- CHAT -->

    <div
      class="chat"
      id="chat"
    >

      <div class="chat-header">

        <button
          class="volver"
          onclick="volverInicio()"
        >
          ←
        </button>

        <div>

          <div class="nombre-cliente">
            Asesor de Estudio Mansilla
          </div>

          <div class="estado">
            ● En línea
          </div>

        </div>

      </div>


      <div
        class="mensajes"
        id="mensajes"
      >
      </div>


      <div class="entrada">

        <input
          type="text"
          id="mensajeInput"
          placeholder="Escribí tu mensaje..."
          onkeydown="presionarEnter(event)"
        >

        <button
          class="enviar"
          onclick="enviarMensaje()"
        >
          ➤
        </button>

      </div>

    </div>

  </div>


  <!-- FIREBASE -->

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getDatabase,
      ref,
      push,
      onChildAdded
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


    const firebaseConfig = {

      apiKey: "AIzaSyC1sOc1OaBwkzz5DXT3GD_OEcFFrkOua8",

      authDomain: "estudiomansilla.firebaseapp.com",

      databaseURL: "https://estudiomansilla-default-rtdb.firebaseio.com",

      projectId: "estudiomansilla",

      storageBucket: "estudiomansilla.firebasestorage.app",

      messagingSenderId: "482010073100",

      appId: "1:482010073100:web:d5cb61259de293b1420629",

      measurementId: "G-8710S26Z8L"

    };


    const app =
      initializeApp(firebaseConfig);

    const db =
      getDatabase(app);


    const conversacionId =
      "conversacion_prueba";


    const mensajesRef =
      ref(
        db,
        "conversaciones/" +
        conversacionId +
        "/mensajes"
      );


    onChildAdded(
      mensajesRef,
      (snapshot) => {

        const mensaje =
          snapshot.val();

        mostrarMensaje(
          mensaje.texto,
          mensaje.remitente
        );

      }
    );


    window.comenzarChat =
      function() {

        const nombre =
          document.getElementById(
            "nombre"
          ).value.trim();

        const telefono =
          document.getElementById(
            "telefono"
          ).value.trim();

        const motivo =
          document.getElementById(
            "motivo"
          ).value;

        const error =
          document.getElementById(
            "error"
          );


        if (
          nombre === "" ||
          telefono === "" ||
          motivo === ""
        ) {

          error.style.display =
            "block";

          return;

        }


        error.style.display =
          "none";


        push(
          ref(
            db,
            "conversaciones/" +
            conversacionId +
            "/datosCliente"
          ),
          {
            nombre: nombre,
            telefono: telefono,
            motivo: motivo,
            fecha: Date.now()
          }
        );


        document.getElementById(
          "inicio"
        ).style.display = "none";


        document.getElementById(
          "chat"
        ).style.display = "flex";


        document.getElementById(
          "mensajeInput"
        ).focus();

      };


    window.volverInicio =
      function() {

        document.getElementById(
          "chat"
        ).style.display = "none";

        document.getElementById(
          "inicio"
        ).style.display = "block";

      };


    window.enviarMensaje =
      function() {

        const input =
          document.getElementById(
            "mensajeInput"
          );

        const texto =
          input.value.trim();


        if (texto === "") {
          return;
        }


        push(
          mensajesRef,
          {

            texto: texto,

            remitente: "cliente",

            fecha: Date.now()

          }
        );


        input.value = "";

        input.focus();

      };


    window.presionarEnter =
      function(event) {

        if (
          event.key === "Enter"
        ) {

          enviarMensaje();

        }

      };


    function mostrarMensaje(
      texto,
      remitente
    ) {

      const contenedor =
        document.getElementById(
          "mensajes"
        );


      const div =
        document.createElement(
          "div"
        );


      div.classList.add(
        "mensaje"
      );


      if (
        remitente === "cliente"
      ) {

        div.classList.add(
          "cliente"
        );

      } else {

        div.classList.add(
          "asesor"
        );

      }


      div.textContent =
        texto;


      contenedor.appendChild(
        div
      );


      contenedor.scrollTop =
        contenedor.scrollHeight;

    }

  </script>

</body>
</html>
