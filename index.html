<!DOCTYPE html>

<head>

  <title>Centro de Atención - Estudio Mansilla</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 95%;
      max-width: 500px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
      overflow: hidden;
    }

    .inicio {
      padding: 30px 25px;
    }

    .inicio h2 {
      text-align: center;
      margin-top: 0;
    }

    .inicio p {
      color: #666;
      line-height: 1.5;
      text-align: center;
    }

    .campo {
      margin-top: 15px;
    }

    .campo label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: bold;
    }

    .campo input,
    .campo select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
    }

    .boton {
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      border: none;
      border-radius: 10px;
      background: #222;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    .boton:hover {
      opacity: 0.85;
    }

    .error {
      display: none;
      margin-top: 12px;
      padding: 10px;
      background: #ffe5e5;
      color: #b00000;
      border-radius: 8px;
      font-size: 13px;
    }

    .chat {
      display: none;
      height: 600px;
      flex-direction: column;
    }

    .chat-header {
      background: #222;
      color: white;
      padding: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .volver {
      background: transparent;
      border: none;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    .estado {
      font-size: 12px;
      color: #8cff8c;
    }

    .mensajes {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      background: #f7f7f7;
    }

    .mensaje {
      max-width: 80%;
      padding: 10px 13px;
      margin-bottom: 10px;
      border-radius: 12px;
      line-height: 1.4;
      font-size: 14px;
      word-wrap: break-word;
    }

    .cliente {
      background: #222;
      color: white;
      margin-left: auto;
      border-bottom-right-radius: 3px;
    }

    .asesor {
      background: white;
      color: #333;
      margin-right: auto;
      border: 1px solid #ddd;
      border-bottom-left-radius: 3px;
    }

    .entrada {
      display: flex;
      padding: 10px;
      background: white;
      border-top: 1px solid #ddd;
      gap: 8px;
    }

    .entrada input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      outline: none;
    }

    .enviar {
      width: 50px;
      border: none;
      border-radius: 10px;
      background: #222;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    .nombre-cliente {
      font-size: 14px;
    }

    .info-chat {
      font-size: 11px;
      color: #ccc;
      margin-top: 3px;
    }

    .error-firebase {
      display: none;
      margin: 15px;
      padding: 12px;
      background: #fff0f0;
      border: 1px solid #ffbcbc;
      color: #a00000;
      border-radius: 10px;
      font-size: 13px;
    }

    @media (max-width: 500px) {
      .container {
        width: 100%;
        min-height: 100vh;
        border-radius: 0;
      }

      .chat {
        height: 100vh;
      }
    }
  </style>

</head>

<body>

  </div>

  <!-- FIREBASE -->

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getDatabase,
      ref,
      push,
      set,
      onChildAdded
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


    /* =========================
       CONFIGURACIÓN FIREBASE
    ========================= */

    const firebaseConfig = {
      apiKey: "AIzaSyC1sOc1O1aBwkzz5DXT3GD_OEcFFrkOua8",
      authDomain: "estudiomansilla.firebaseapp.com",
      databaseURL: "https://estudiomansilla-default-rtdb.firebaseio.com",
      projectId: "estudiomansilla",
      storageBucket: "estudiomansilla.firebasestorage.app",
      messagingSenderId: "482010073100",
      appId: "1:482010073100:web:d5cb61259de293b1420629",
      measurementId: "G-8710S26Z8L"
    };


    /* =========================
       INICIALIZAR FIREBASE
    ========================= */

    let app;
    let db;

    try {

      app = initializeApp(firebaseConfig);

      db = getDatabase(app);

      console.log("Firebase conectado correctamente.");

    } catch (error) {

      console.error(
        "Error al iniciar Firebase:",
        error
      );

      document.getElementById(
        "errorFirebase"
      ).style.display = "block";

    }


    /* =========================
       CONVERSACIÓN DEL CLIENTE
    ========================= */

    let conversacionId =
      sessionStorage.getItem(
        "conversacionId"
      );


    if (!conversacionId && db) {

      const nuevaConversacionRef =
        push(
          ref(
            db,
            "conversaciones"
          )
        );

      conversacionId =
        nuevaConversacionRef.key;

      sessionStorage.setItem(
        "conversacionId",
        conversacionId
      );

    }


    console.log(
      "Conversación:",
      conversacionId
    );


    /* =========================
       REFERENCIA DE MENSAJES
    ========================= */

    let mensajesRef = null;

    if (db && conversacionId) {

      mensajesRef =
        ref(
          db,
          "conversaciones/" +
          conversacionId +
          "/mensajes"
        );

    }


    /* =========================
       MOSTRAR MENSAJES
    ========================= */

    if (mensajesRef) {

      onChildAdded(
        mensajesRef,
        (snapshot) => {

          const mensaje =
            snapshot.val();

          if (!mensaje) {
            return;
          }

          mostrarMensaje(
            mensaje.texto,
            mensaje.remitente
          );

        }
      );

    }


    /* =========================
       COMENZAR CHAT
    ========================= */

    window.comenzarChat =
      async function() {

        const nombre =
          document.getElementById(
            "nombre"
          ).value.trim();

        const dni =
          document.getElementById(
            "dni"
          ).value.trim();

        const telefono =
          document.getElementById(
            "telefono"
          ).value.trim();

        const motivo =
          document.getElementById(
            "motivo"
          ).value;

        const error =
          document.getElementById(
            "error"
          );

        const errorFirebase =
          document.getElementById(
            "errorFirebase"
          );


        /* VALIDACIÓN */

        if (
          nombre === "" ||
          dni === "" ||
          telefono === "" ||
          motivo === ""
        ) {

          error.style.display =
            "block";

          return;

        }


        error.style.display =
          "none";


        /* VERIFICAR FIREBASE */

        if (!db || !mensajesRef) {

          errorFirebase.style.display =
            "block";

          return;

        }


        try {

          /* DATOS DEL CLIENTE */

          await set(
            ref(
              db,
              "conversaciones/" +
              conversacionId +
              "/datosCliente"
            ),
            {

              nombre: nombre,
              dni: dni,
              telefono: telefono,
              motivo: motivo,
              fecha: Date.now()

            }
          );


          /* ESTADO INICIAL */

          await set(
            ref(
              db,
              "conversaciones/" +
              conversacionId +
              "/estado"
            ),
            "pendiente"
          );


          /* FECHA DE CREACIÓN */

          await set(
            ref(
              db,
              "conversaciones/" +
              conversacionId +
              "/fechaCreacion"
            ),
            Date.now()
          );


          /* MOSTRAR NOMBRE */

          document.getElementById(
            "infoChat"
          ).textContent =
            nombre;


          /* OCULTAR FORMULARIO */

          document.getElementById(
            "inicio"
          ).style.display =
            "none";


          /* MOSTRAR CHAT */

          document.getElementById(
            "chat"
          ).style.display =
            "flex";


          /* LIMPIAR MENSAJES */

          document.getElementById(
            "mensajes"
          ).innerHTML = "";


          /* FOCUS */

          document.getElementById(
            "mensajeInput"
          ).focus();


        } catch (error) {

          console.error(
            "Error al guardar la conversación:",
            error
          );

          errorFirebase.textContent =
            "No se pudo guardar la conversación: " +
            error.message;

          errorFirebase.style.display =
            "block";

        }

      };


    /* =========================
       VOLVER
    ========================= */

    window.volverInicio =
      function() {

        document.getElementById(
          "chat"
        ).style.display =
          "none";

        document.getElementById(
          "inicio"
        ).style.display =
          "block";

      };


    /* =========================
       ENVIAR MENSAJE
    ========================= */

    window.enviarMensaje =
      async function() {

        const input =
          document.getElementById(
            "mensajeInput"
          );

        const texto =
          input.value.trim();

        if (
          texto === "" ||
          !mensajesRef
        ) {

          return;

        }

        try {

          await push(
            mensajesRef,
            {

              texto: texto,
              remitente: "cliente",
              fecha: Date.now()

            }
          );

          input.value = "";

          input.focus();

        } catch (error) {

          console.error(
            "Error al enviar mensaje:",
            error
          );

          alert(
            "No se pudo enviar el mensaje."
          );

        }

      };


    /* =========================
       ENTER
    ========================= */

    window.presionarEnter =
      function(event) {

        if (
          event.key === "Enter"
        ) {

          enviarMensaje();

        }

      };


    /* =========================
       MOSTRAR MENSAJE
    ========================= */

    function mostrarMensaje(
      texto,
      remitente
    ) {

      const contenedor =
        document.getElementById(
          "mensajes"
        );

      const div =
        document.createElement(
          "div"
        );

      div.classList.add(
        "mensaje"
      );

      if (
        remitente === "cliente"
      ) {

        div.classList.add(
          "cliente"
        );

      } else {

        div.classList.add(
          "asesor"
        );

      }

      div.textContent =
        texto;

      contenedor.appendChild(
        div
      );

      contenedor.scrollTop =
        contenedor.scrollHeight;

    }

  </script>
