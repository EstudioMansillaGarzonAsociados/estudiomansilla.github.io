    .campo label {
      display: block;

    .campo input,

      padding: 15px;

      color: white;
      font-size: 15px;
      cursor: pointer;

      opacity: 0.85;
    }

    .error {
      display: none;
      margin-top: 12px;
      padding: 10px;
      background: #ffe5e5;
      color: #b00000;
      border-radius: 8px;
      font-size: 13px;
    }

    .chat {
      display: none;
      height: 600px;
      flex-direction: column;
    }

    .chat-header {
      background: #222;
      color: white;
      padding: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .volver {
      background: transparent;
      border: none;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    .estado {
      font-size: 12px;
      color: #8cff8c;
    }

    .mensajes {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      background: #f7f7f7;
    }

    .mensaje {
      max-width: 80%;
      padding: 10px 13px;
      margin-bottom: 10px;
      border-radius: 12px;
      line-height: 1.4;
      font-size: 14px;
      word-wrap: break-word;
    }

    .cliente {
      background: #222;
      color: white;
      margin-left: auto;
      border-bottom-right-radius: 3px;
    }

    .asesor {
      background: white;
      color: #333;
      margin-right: auto;
      border: 1px solid #ddd;
      border-bottom-left-radius: 3px;
    }

    .entrada {
      display: flex;
      padding: 10px;
      background: white;
      border-top: 1px solid #ddd;
      gap: 8px;
    }

    .entrada input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      outline: none;
    }

    .enviar {
      width: 50px;
      border: none;
      border-radius: 10px;
      background: #222;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    .opciones-ia {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 8px 0 14px 0;
      max-width: 82%;
    }

    .opcion-ia {
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      border: 1px solid #222;
      border-radius: 10px;
      background: white;
      color: #222;
      font-size: 14px;
      cursor: pointer;
      transition: .15s ease;
    }

    .opcion-ia:hover {
      background: #222;
      color: white;
    }

    .opcion-ia:disabled {
      opacity: .55;
      cursor: default;
    }

    .nombre-cliente {
      font-size: 14px;
    }

    .info-chat {
      font-size: 11px;
      color: #ccc;
      margin-top: 3px;
    }

    .error-firebase {
      display: none;
      margin: 15px;
      padding: 12px;
      background: #fff0f0;
      border: 1px solid #ffbcbc;
      color: #a00000;
      border-radius: 10px;
      font-size: 13px;
    }

    @media (max-width: 500px) {
      .container {
        width: 100%;
        min-height: 100vh;
        border-radius: 0;
      }

      .chat {
        height: 100vh;
      }
    }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    /* =========================================================
       FIREBASE
    ========================================================= */
    const firebaseConfig = {
      apiKey: "AIzaSyC1sOc1Oa1Bwkzz5DXT3GD_OEcFFrkOua8",
      authDomain: "estudiomansilla.firebaseapp.com",

    let app = null;

    try {
      app = initializeApp(firebaseConfig);

      console.log("Firebase conectado correctamente.");
    } catch (error) {
      console.error("Error al iniciar Firebase:", error);

      if (box) {
        box.textContent = "No se pudo conectar con el sistema. Revisá la configuración de Firebase.";
        box.style.display = "block";

    /* =========================================================
       CONFIGURACIÓN GENERAL
    ========================================================= */

    // Cuando tengas el número oficial de WhatsApp, reemplazá SOLO este valor.
    // Ejemplo: https://wa.me/549351XXXXXXXX
    const WHATSAPP_URL = "";

    const IA_HABILITADA = true;
    const IA_NOMBRE = "Asistente virtual de Estudio Mansilla Garzón y Asociados";

    let conversacionId = sessionStorage.getItem("conversacionId") || "";
    let mensajesRef = null;

    let datosClienteActual = {
      nombre: "",
      dni: "",
      telefono: "",
      motivo: ""
    };

    let iaProcesando = false;
    let iaUltimoMensajeProcesado = "";
    let iaDerivada = false;

    /* =========================================================
       UTILIDADES
    ========================================================= */

    function normalizarTexto(texto) {
      return String(texto || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[¿?¡!.,;:()[\]{}"']/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function escaparHtmlBasico(texto) {
      return String(texto || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function nombreCorto(nombre) {
      const limpio = String(nombre || "").trim();
      return limpio ? limpio.split(/\s+/)[0] : "";
    }

    function mostrarErrorFirebase(mensaje) {
      const box = document.getElementById("errorFirebase");
      if (!box) return;
      box.textContent = mensaje;
      box.style.display = "block";
    }

    function ocultarErrorFirebase() {
      const box = document.getElementById("errorFirebase");
      if (box) box.style.display = "none";
    }

    /* =========================================================
       CONVERSACIÓN
    ========================================================= */

    async function asegurarConversacion() {
      if (!db) throw new Error("Firebase no está conectado.");

      if (!conversacionId) {
        const nuevaConversacionRef = push(ref(db, "conversaciones"));
        conversacionId = nuevaConversacionRef.key;

        sessionStorage.setItem("conversacionId", conversacionId);

        await set(ref(db, `conversaciones/${conversacionId}`), {
          estado: "pendiente",
          iaActiva: true,
          iaEstado: "activa",
          iaDerivada: false,
          iaPaso: "menu",
          fechaCreacion: Date.now()
        });
      }

      mensajesRef = ref(db, `conversaciones/${conversacionId}/mensajes`);
      return conversacionId;
    }

    async function cargarDatosConversacionExistente() {
      if (!db || !conversacionId) return;

      try {
        const snap = await get(ref(db, `conversaciones/${conversacionId}/datosCliente`));
        if (snap.exists()) {
          const datos = snap.val() || {};
          datosClienteActual = {
            nombre: datos.nombre || "",
            dni: datos.dni || "",
            telefono: datos.telefono || "",
            motivo: datos.motivo || ""
          };

          if (datosClienteActual.nombre) {
            document.getElementById("infoChat").textContent = datosClienteActual.nombre;
          }
        }
      } catch (error) {
        console.warn("No se pudieron recuperar los datos del cliente:", error);
      }
    }

    /* =========================================================
       ESCUCHAR MENSAJES
    ========================================================= */

    function escucharMensajes() {
      if (!mensajesRef) return;

      onChildAdded(mensajesRef, async (snapshot) => {
        const mensaje = snapshot.val();
        if (!mensaje) return;

        mostrarMensaje(
          mensaje.texto || "",
          mensaje.remitente || "asesor"
        );

        // La IA del cliente solamente procesa mensajes nuevos del cliente.
        if (
          IA_HABILITADA &&
          mensaje.remitente === "cliente" &&
          !mensaje.iaProcesado
        ) {
          await procesarRespuestaIA(snapshot.key, mensaje);
        }
      });
    }

    /* =========================================================
       COMENZAR CHAT
    ========================================================= */

    window.comenzarChat = async function () {
      const nombre = document.getElementById("nombre").value.trim();
      const dni = document.getElementById("dni").value.trim();
      const telefono = document.getElementById("telefono").value.trim();
      const motivo = document.getElementById("motivo").value;

      const error = document.getElementById("error");

      if (!nombre || !dni || !telefono || !motivo) {
        error.style.display = "block";
        return;
      }

      error.style.display = "none";
      ocultarErrorFirebase();

      try {
        if (!db) {
          mostrarErrorFirebase("No se pudo conectar con el sistema. Revisá la configuración de Firebase.");
          return;
        }

        /*
          Si no hay conversación, la crea.
          Si ya existe una conversación en esta sesión, la reutiliza.
        */
        await asegurarConversacion();

        datosClienteActual = { nombre, dni, telefono, motivo };

        await update(ref(db, `conversaciones/${conversacionId}`), {
          estado: "pendiente",

          // Campos compatibles con el panel de asesores.
          nombreCliente: nombre,
          clienteNombre: nombre,
          dniCliente: dni,
          telefonoCliente: telefono,
          motivo: motivo,

          // Datos completos.
          datosCliente: {
            nombre,
            dni,
            telefono,
            motivo,
            fecha: Date.now()
          },

          // IA.
          iaActiva: true,
          iaEstado: "activa",
          iaDerivada: false,

          // Sin asignar al comenzar.
          equipo: null,
          nombreEquipo: null,
          team: null,
          equipoAsignado: null,
          gestor: null,
          gestorAsignado: null,
          asignadoA: null,
          asesor: null,
          usuarioAsignado: null,
          nombreGestor: null,
          gestorEmail: null,
          asignadoEmail: null,
          emailGestor: null,
          asesorEmail: null,

          fechaCreacion: Date.now(),
          ultimaActividad: Date.now()
        });

        document.getElementById("infoChat").textContent = nombre;

        document.getElementById("inicio").style.display = "none";
        document.getElementById("chat").style.display = "flex";

        document.getElementById("mensajes").innerHTML = "";

        // Saludo inicial de la IA.
        const saludoInicial = "Buen día. Soy el asistente virtual del Centro de Atención. ¿En qué podemos ayudarte?";
        await push(ref(db, `conversaciones/${conversacionId}/mensajes`), {
          texto: saludoInicial,
          remitente: "ia",
          nombreRemitente: IA_NOMBRE,
          fecha: Date.now(),
          tipo: "saludo_automatico"
        });
        mostrarMensaje(saludoInicial, "ia");

        if (!mensajesRef) {
          mensajesRef = ref(db, `conversaciones/${conversacionId}/mensajes`);
        }

        // Evita registrar el listener dos veces.
        if (!window.__mensajesEscuchados) {
          window.__mensajesEscuchados = true;
          escucharMensajes();
        }

        document.getElementById("mensajeInput").focus();

      } catch (error) {
        console.error("Error al guardar la conversación:", error);
        mostrarErrorFirebase("No se pudo guardar la conversación: " + error.message);
      }
    };

    /* =========================================================
       VOLVER
    ========================================================= */

    window.volverInicio = function () {
      document.getElementById("chat").style.display = "none";
      document.getElementById("inicio").style.display = "block";
    };

    /* =========================================================
       ENVIAR MENSAJE
    ========================================================= */

    window.enviarMensaje = async function (textoForzado = "") {
      const input = document.getElementById("mensajeInput");
      const texto = String(textoForzado || input.value || "").trim();

      if (!texto || !mensajesRef) return;

      try {
        // Si el cliente vuelve a escribir después de una derivación,
        // no reactivamos la IA: queda para el equipo humano.
        const mensajeRef = await push(mensajesRef, {
          texto,
          remitente: "cliente",
          nombreRemitente: datosClienteActual.nombre || "Cliente",
          fecha: Date.now(),
          iaProcesado: false
        });

        await update(ref(db, `conversaciones/${conversacionId}`), {
          ultimaActividad: Date.now(),
          ultimoMensaje: texto,
          ultimoRemitente: "cliente",
          estado: iaDerivada ? "pendiente" : "pendiente"
        });

        input.value = "";
        input.focus();

        console.log("Mensaje enviado:", mensajeRef.key);

      } catch (error) {
        console.error("Error al enviar mensaje:", error);
        alert("No se pudo enviar el mensaje.");
      }
    };

    /* =========================================================
       ENTER
    ========================================================= */

    window.presionarEnter = function (event) {
      if (event.key === "Enter") {
        event.preventDefault();
        enviarMensaje();
      }
    };

    /* =========================================================
       RESPUESTA AUTOMÁTICA DE IA
       ========================================================= */

    function detectarIntencionIA(texto) {
      const n = normalizarTexto(texto);

      if (!n) return "silencio";

      // Opciones del menú inicial.
      if (n.includes("enviar comprobante") || n === "comprobante" || n.includes("mandar comprobante") || n.includes("adjunto comprobante") || n.includes("adjuntar comprobante")) return "comprobante";
      if (n.includes("tengo un acuerdo") || n === "acuerdo" || n.includes("tengo acuerdo")) return "acuerdo";
      if (n.includes("quiero un acuerdo") || n.includes("quiero acuerdo")) return "acuerdo";
      if (n.includes("libre de deuda") || n.includes("libre deuda") || n.includes("certificado de libre")) return "libre_deuda";

      // Comprobante enviado como texto: se recibe y se deriva.
      if (n.includes("comprobante") || n.includes("recibo de pago") || n.includes("comprobante de pago")) return "comprobante";

      // Casos que SIEMPRE requieren una persona.
      const derivar = [
        "amenaza",
        "denuncia",
        "denunciar",
        "abogado",
        "abogada",
        "carta documento",
        "defensa del consumidor",
        "reclamo",
        "reclamar",
        "pague y figura",
        "pague y aparece",
        "pago no imputado",
        "pago no figura",
        "transferencia no figura",
        "convenio",
        "refinanciacion",
        "plan de pago",
        "cuotas",
        "cuota",
        "descuento",
        "quita",
        "embargo",
        "judicial",
        "demanda",
        "intimacion",
        "libre deuda",
        "cancelar deuda",
        "desconozco",
        "no soy",
        "fraude",
        "estafa",
        "suplantacion",
        "datos personales",
        "error en mi deuda",
        "monto incorrecto"
      ];

      if (derivar.some(x => n.includes(x))) return "derivar";

      // Saludos.
      if (
        /\b(hola|buen dia|buenas|buenas tardes|buenas noches|buen diaa)\b/.test(n) &&
        n.length < 120
      ) return "saludo";

      // Horarios.
      if (
        n.includes("horario") ||
        n.includes("atienden") ||
        n.includes("atencion") ||
        n.includes("hasta que hora") ||
        n.includes("abren") ||
        n.includes("cierran") ||
        n.includes("sabado") ||
        n.includes("sábado")
      ) return "horarios";

      // WhatsApp / contacto.
      if (
        n.includes("whatsapp") ||
        n.includes("wsp") ||
        n.includes("contacto") ||
        n.includes("como contacto") ||
        n.includes("telefono") ||
        n.includes("comunicarme")
      ) return "contacto";

      // Transferencias / medios de pago.
      if (
        n.includes("transferencia") ||
        n.includes("transferir") ||
        n.includes("como pago") ||
        n.includes("donde pago") ||
        n.includes("medio de pago") ||
        n.includes("medios de pago") ||
        n.includes("pagar")
      ) return "pago";

      // Documentación.
      if (
        n.includes("documentacion") ||
        n.includes("documento") ||
        n.includes("documentos") ||
        n.includes("archivo") ||
        n.includes("adjuntar") ||
        n.includes("enviar document") ||
        n.includes("mandar document")
      ) return "documentacion";

      // Consulta de deuda.
      if (
        n.includes("cuanto debo") ||
        n.includes("cuánto debo") ||
        n.includes("deuda") ||
        n.includes("saldo") ||
        n.includes("situacion") ||
        n.includes("situación") ||
        n.includes("estado de mi deuda") ||
        n.includes("estado de cuenta")
      ) return "deuda";

      // Libre deuda.
      if (
        n.includes("libre de deuda") ||
        n.includes("libre deuda") ||
        n.includes("certificado de deuda") ||
        n.includes("certificado de libre")
      ) return "libre_deuda";

      // Cuotas / planes, si no cayó en derivación anterior.
      if (
        n.includes("cuotas") ||
        n.includes("cuota") ||
        n.includes("plan") ||
        n.includes("financiar") ||
        n.includes("financiacion")
      ) return "cuotas";

      // FAQ generales.
      if (
        n.includes("que necesitan") ||
        n.includes("como funciona") ||
        n.includes("ayuda") ||
        n.includes("informacion") ||
        n.includes("información") ||
        n.includes("pregunta")
      ) return "faq";

      return "derivar";
    }

    function respuestaIA(intencion, textoOriginal) {
      switch (intencion) {
        case "saludo":
          return "Buen día. Soy el asistente virtual del Centro de Atención. ¿En qué podemos ayudarte?";

        case "menu":
          return "Por favor, elegí una de estas opciones:\n\n• Enviar comprobante\n• Tengo un acuerdo\n• Quiero un acuerdo\n• Libre de deuda";

        case "comprobante":
          return "Perfecto. Recibimos tu comprobante. Lo vamos a derivar a un asesor para que pueda revisarlo.";

        case "acuerdo":
          return "Entendido. Vamos a derivar tu consulta a un asesor para que pueda revisar tu acuerdo.";

        case "libre_deuda":
          return "Entendido. Vamos a derivar tu solicitud a un asesor para que pueda verificar tu situación y gestionar el libre de deuda.";

        case "derivar":
        default:
          return "Gracias por tu mensaje. Vamos a derivar tu consulta a un asesor para que pueda ayudarte.";
      }
    }

    async function procesarRespuestaIA(messageKey, mensaje) {
      if (!IA_HABILITADA || iaDerivada || iaProcesando || !db) return;

      const texto = String(mensaje?.texto || "").trim();
      if (!texto) return;

      const identificador = `${messageKey}:${texto}`;
      if (identificador === iaUltimoMensajeProcesado) return;

      // Reclamo ATÓMICO del mensaje: si hay dos pestañas abiertas o el listener
      // se registra dos veces, solamente una podrá marcarlo como procesándose.
      let reclamo = false;
      try {
        const mensajeRef = ref(db, `conversaciones/${conversacionId}/mensajes/${messageKey}`);
        const resultado = await runTransaction(mensajeRef, actual => {
          if (!actual || actual.remitente !== "cliente") return actual;
          if (actual.iaProcesado === true || actual.iaProcesando === true) return;
          return { ...actual, iaProcesando: true };
        });
        reclamo = resultado.committed === true;
      } catch (error) {
        console.warn("No se pudo reclamar el mensaje para la IA:", error);
        return;
      }

      if (!reclamo) return;

      iaUltimoMensajeProcesado = identificador;
      iaProcesando = true;

      try {
        let intencion = detectarIntencionIA(texto);

        // Después del primer mensaje del cliente, la IA muestra el menú de opciones.
        const convSnap = await get(ref(db, `conversaciones/${conversacionId}`));
        const convActual = convSnap.exists() ? (convSnap.val() || {}) : {};
        if (convActual.iaPaso === "menu") {
          const nTexto = normalizarTexto(texto);
          const esOpcion = [
            "enviar comprobante", "comprobante", "mandar comprobante",
            "adjunto comprobante", "adjuntar comprobante",
            "tengo un acuerdo", "tengo acuerdo", "acuerdo",
            "quiero un acuerdo", "quiero acuerdo",
            "libre de deuda", "libre deuda", "certificado de libre"
          ].some(x => nTexto.includes(x));
          if (!esOpcion) intencion = "menu";
        }

        // Si requiere humano, dejamos la conversación sin asignar.
        if (intencion === "derivar") {
          iaDerivada = true;

          await update(ref(db, `conversaciones/${conversacionId}`), {
            iaActiva: false,
            iaEstado: "derivada",
            iaDerivada: true,
            estado: "pendiente",
            equipo: null,
            nombreEquipo: null,
            team: null,
            equipoAsignado: null,
            gestor: null,
            gestorAsignado: null,
            asignadoA: null,
            asesor: null,
            usuarioAsignado: null,
            nombreGestor: null,
            gestorEmail: null,
            asignadoEmail: null,
            emailGestor: null,
            asesorEmail: null,
            ultimaActividad: Date.now(),
            ultimoMensaje: texto,
            ultimoRemitente: "cliente"
          });

          await update(
            ref(db, `conversaciones/${conversacionId}/mensajes/${messageKey}`),
            { iaProcesado: true, iaProcesando: false }
          );

          // No responde automáticamente en este caso.
          console.log("IA derivó la conversación:", conversacionId);
          return;
        }

        if (intencion === "silencio") return;

        const respuesta = respuestaIA(intencion, texto);
        if (!respuesta) return;

        // Pequeña pausa para que se sienta como una respuesta natural.
        await new Promise(resolve => setTimeout(resolve, 500));

        // Antes de escribir, verificamos que este mensaje siga siendo el que
        // reclamamos. Así evitamos una segunda respuesta automática.
        const actualSnap = await get(ref(db, `conversaciones/${conversacionId}/mensajes/${messageKey}`));
        const actualMensaje = actualSnap.exists() ? actualSnap.val() : null;
        if (!actualMensaje || actualMensaje.iaProcesado === true) return;

        await push(mensajesRef, {
          texto: respuesta,
          remitente: "ia",
          nombreRemitente: IA_NOMBRE,
          fecha: Date.now(),
          respondeA: messageKey,
          tipo: "respuesta_automatica"
        });

        if (["comprobante", "acuerdo", "libre_deuda"].includes(intencion)) {
          iaDerivada = true;
          await update(ref(db, `conversaciones/${conversacionId}`), {
            iaActiva: false,
            iaEstado: "derivada",
            iaDerivada: true,
            iaPaso: "derivar",
            estado: "pendiente",
            ultimaActividad: Date.now(),
            ultimoMensaje: respuesta,
            ultimoRemitente: "ia"
          });
        }

        await update(
          ref(db, `conversaciones/${conversacionId}/mensajes/${messageKey}`),
          { iaProcesado: true, iaProcesando: false }
        );

        await update(ref(db, `conversaciones/${conversacionId}`), {
          iaActiva: true,
          iaEstado: "activa",
          iaDerivada: false,
          iaPaso: intencion === "menu" ? "opcion" : (intencion === "comprobante" || intencion === "acuerdo" || intencion === "libre_deuda" ? "derivar" : "opcion"),
          iaUltimoMensajeProcesado: messageKey,
          ultimaActividad: Date.now(),
          ultimoMensaje: respuesta,
          ultimoRemitente: "ia"
        });

      } catch (error) {
        console.error("Error de IA automática:", error);
      } finally {
        iaProcesando = false;
        // Si la función salió antes de responder, liberamos el bloqueo para
        // que el mensaje pueda volver a procesarse correctamente.
        try {
          await update(
            ref(db, `conversaciones/${conversacionId}/mensajes/${messageKey}`),
            { iaProcesando: false }
          );
        } catch (_) {}
      }
    }

    /* =========================================================
       MOSTRAR MENSAJE
    ========================================================= */

    function mostrarMensaje(texto, remitente) {
      const contenedor = document.getElementById("mensajes");
      if (!contenedor) return;

      const div = document.createElement("div");
      div.classList.add("mensaje");

      if (remitente === "cliente") {
        div.classList.add("cliente");
      } else {
        div.classList.add("asesor");
      }

      div.textContent = texto;
      contenedor.appendChild(div);

      // Cuando la IA muestra el menú, lo convertimos en botones reales.
      const textoMenu = String(texto || "");
      const esMenuIA = remitente === "ia" &&
        textoMenu.includes("Enviar comprobante") &&
        textoMenu.includes("Tengo un acuerdo") &&
        textoMenu.includes("Quiero un acuerdo") &&
        textoMenu.includes("Libre de deuda");

      if (esMenuIA) {
        const opciones = [
          "Enviar comprobante",
          "Tengo un acuerdo",
          "Quiero un acuerdo",
          "Libre de deuda"
        ];

        const caja = document.createElement("div");
        caja.className = "opciones-ia";

        opciones.forEach(opcion => {
          const boton = document.createElement("button");
          boton.type = "button";
          boton.className = "opcion-ia";
          boton.textContent = opcion;
          boton.onclick = () => {
            Array.from(caja.querySelectorAll("button")).forEach(b => b.disabled = true);
            enviarMensaje(opcion);
            caja.remove();
          };
          caja.appendChild(boton);
        });

        contenedor.appendChild(caja);
      }

      contenedor.scrollTop = contenedor.scrollHeight;
    }

    /* =========================================================
       RECUPERAR SESIÓN
    ========================================================= */

    async function iniciarSesionExistente() {
      if (!db || !conversacionId) return;

      try {
        mensajesRef = ref(db, `conversaciones/${conversacionId}/mensajes`);
        await cargarDatosConversacionExistente();

        const snap = await get(ref(db, `conversaciones/${conversacionId}`));
        if (snap.exists()) {
          const c = snap.val() || {};
          iaDerivada = c.iaDerivada === true || c.iaActiva === false;

          if (c.datosCliente) {
            datosClienteActual = {
              nombre: c.datosCliente.nombre || c.nombreCliente || "",
              dni: c.datosCliente.dni || c.dniCliente || "",
              telefono: c.datosCliente.telefono || c.telefonoCliente || "",
              motivo: c.datosCliente.motivo || c.motivo || ""
            };
          }

          if (c.nombreCliente) {
            document.getElementById("infoChat").textContent = c.nombreCliente;
          }

          // Si la sesión ya estaba dentro del chat, lo mostramos.
          if (c.datosCliente || c.nombreCliente) {
            document.getElementById("inicio").style.display = "none";
            document.getElementById("chat").style.display = "flex";
          }
        }

        if (!window.__mensajesEscuchados) {
          window.__mensajesEscuchados = true;
          escucharMensajes();
        }

      } catch (error) {
        console.warn("No se pudo recuperar la conversación:", error);
      }
    }

    iniciarSesionExistente();

    /* =========================================================
       WHATSAPP
    ========================================================= */

    window.abrirWhatsApp = function () {
      if (!WHATSAPP_URL) {
        alert("El enlace de WhatsApp todavía no fue configurado.");
        return;
      }
      window.open(WHATSAPP_URL, "_blank", "noopener,noreferrer");
    };

  </script>
